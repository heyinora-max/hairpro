/* --- üst: başlık + Norwood ön ayarı -------------------------------------- */
.hr-ust {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: var(--b-5) var(--b-7); flex-wrap: wrap;
  padding-bottom: var(--b-5);
  border-bottom: 1px solid var(--gece-cizgi);
}
.hr-ust__yazi { display: flex; flex-direction: column; gap: 10px; max-width: 46ch; }
.hr-etiket { color: var(--mavi-400); }
.hr-alt { color: var(--gece-metin-2); max-width: 44ch; }

.hr-nw { display: flex; flex-direction: column; gap: 9px; flex: 0 0 auto; }
.hr-nw__et { color: var(--gece-metin-3); }
.hr-nw__sira { display: flex; gap: 7px; flex-wrap: wrap; }
.hr-nw__d {
  --norwood-bos: var(--gece-950);
  --nw-dolgu: .34;
  width: 66px; min-height: 76px; padding: 8px 4px 7px;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  border: 1px solid var(--gece-cizgi-2); border-radius: var(--r-2);
  color: var(--gece-metin-3); background: rgba(147,190,236,.03);
  transition: border-color .16s ease, color .16s ease, background .16s ease;
}
.hr-nw__d:hover { border-color: var(--mavi-400); color: var(--gece-metin-2); }
.hr-nw__d.is-secili {
  border-color: var(--mavi-500); background: rgba(44,127,208,.16); color: var(--mavi-300);
  --nw-dolgu: .62;
}
.hr-nw__d svg { width: 30px; height: auto; }
.hr-nw__n { font-size: var(--t-11); font-weight: 500; letter-spacing: .1em; }

/* --- gövde ızgarası: kasıtlı asimetri (harita geniş, ölçüm dar) ---------- */
.hr-govde {
  display: grid; grid-template-columns: 6fr 5fr;
  gap: clamp(24px, 3.4vw, 56px);
  align-items: center;
  padding-top: var(--b-6);
}

/* --- sahne: üstten kafa haritası ----------------------------------------- */
.hr-sahne { display: flex; flex-direction: column; gap: var(--b-4); min-width: 0; }
.hr-svg {
  width: 100%; max-width: 424px; height: auto; margin-inline: auto; display: block;
  touch-action: manipulation; overflow: visible;
}
.hr-kafa {
  fill: rgba(147,190,236,.035);
  stroke: rgba(147,190,236,.34); stroke-width: 2;
}
.hr-kafa--cizgi { fill: none; pointer-events: none; }
.hr-kubbe { fill: url(#hr-kubbe); pointer-events: none; }
.hr-yon { fill: var(--gece-metin-3); font-size: 11px; letter-spacing: .2em; text-anchor: middle; font-family: var(--f-veri); }
[lang="ar"] .hr-yon { letter-spacing: 0; font-family: var(--f-ar); }
.hr-yon-cizgi { stroke: rgba(147,190,236,.18); stroke-width: 1; stroke-dasharray: 2 5; }

.hr-z {
  fill: rgba(147,190,236,.05);
  stroke: rgba(147,190,236,.22); stroke-width: 1.2;
  cursor: pointer;
  transition: fill .24s ease, stroke .24s ease, stroke-width .24s ease;
}
.hr-z:hover { fill: rgba(147,190,236,.13); stroke: var(--mavi-400); }
.hr-z:focus-visible { outline: 2px solid var(--mavi-400); outline-offset: 2px; }
.hr-z.is-secili { fill: rgba(44,127,208,.24); stroke: var(--mavi-400); stroke-width: 1.7; }

.hr-et {
  font-family: var(--f-veri); font-size: 12px; letter-spacing: .12em;
  fill: var(--gece-metin-3); text-anchor: middle; pointer-events: none;
  paint-order: stroke fill; stroke: var(--gece-950); stroke-width: 3.5px;
  stroke-linejoin: round;
  transition: fill .24s ease;
}
.hr-et.is-secili { fill: var(--mavi-300); }
.hr-sayi {
  font-family: var(--f-display); font-weight: 600; font-size: 18px; letter-spacing: -.02em;
  fill: #fff; text-anchor: middle; pointer-events: none;
  paint-order: stroke fill; stroke: var(--gece-950); stroke-width: 4px;
  stroke-linejoin: round;
  opacity: 0; transition: opacity .3s ease .12s;
}
.hr-sayi.is-secili { opacity: 1; }

/* greft noktaları: kademeli beliren ekim deseni */
.hr-n {
  fill: var(--mavi-300); opacity: 0;
  transform-box: fill-box; transform-origin: center;
  animation: hrNokta .46s cubic-bezier(.2,.85,.3,1) forwards;
}
@keyframes hrNokta {
  from { opacity: 0; transform: scale(.25); }
  to   { opacity: .82; transform: scale(1); }
}
.hr-n--d0  { animation-delay: 0s; }
.hr-n--d1  { animation-delay: .045s; }
.hr-n--d2  { animation-delay: .09s; }
.hr-n--d3  { animation-delay: .135s; }
.hr-n--d4  { animation-delay: .18s; }
.hr-n--d5  { animation-delay: .225s; }
.hr-n--d6  { animation-delay: .27s; }
.hr-n--d7  { animation-delay: .315s; }
.hr-n--d8  { animation-delay: .36s; }
.hr-n--d9  { animation-delay: .405s; }
.hr-n--d10 { animation-delay: .45s; }
.hr-n--d11 { animation-delay: .495s; }
@media (prefers-reduced-motion: reduce) {
  .hr-n { animation: none; opacity: .82; }
}

/* --- sahne altı kontrol şeridi ------------------------------------------- */
.hr-kontrol {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--b-4); flex-wrap: wrap;
  padding-top: var(--b-4); border-top: 1px solid var(--gece-cizgi);
}
.hr-ipucu { display: flex; align-items: center; gap: 8px; color: var(--gece-metin-3); }
.hr-ipucu .ico { color: var(--mavi-400); }

.hr-yog { display: flex; align-items: center; gap: 10px; }
.hr-yog__et { color: var(--gece-metin-3); }
.hr-yog__grup { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r-tam); background: rgba(147,190,236,.07); }
.hr-yog__d {
  min-width: 46px; height: 38px; padding-inline: 12px; border-radius: var(--r-tam);
  font-family: var(--f-veri); font-size: var(--t-13); color: var(--gece-metin-2);
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .16s ease, color .16s ease;
}
.hr-yog__d:hover:not(.is-secili) { color: var(--gece-metin); }
.hr-yog__d.is-secili { background: var(--mavi-500); color: #fff; }
.hr-yog__birim { font-size: var(--t-12); color: var(--gece-metin-3); }

/* --- ölçüm paneli --------------------------------------------------------- */
.hr-ozet {
  position: relative;
  border: 1px solid var(--gece-cizgi-2); border-radius: var(--r-2);
  background: rgba(147,190,236,.05);
  padding: clamp(18px, 2.2vw, 28px);
  display: flex; flex-direction: column; gap: var(--b-4);
}
.hr-ozet__et { color: var(--gece-metin-3); }
.hr-buyuk {
  font-family: var(--f-display); font-weight: 600;
  font-size: clamp(38px, 4.6vw, 58px); line-height: 1;
  letter-spacing: -.035em; font-variant-numeric: tabular-nums;
  display: flex; align-items: baseline; gap: 2px; flex-wrap: wrap;
  direction: ltr;   /* aralık her dilde küçükten büyüğe okunur */
}
[dir="rtl"] .hr-buyuk { justify-content: flex-end; }
[dir="rtl"] .hr-olcer__i { background: linear-gradient(270deg, var(--mavi-600), var(--mavi-400)); }
[dir="rtl"] .hr-olcer__i.is-asim { background: linear-gradient(270deg, var(--mavi-600), var(--uyari)); }
.hr-buyuk__tire { color: var(--gece-metin-3); padding-inline: 2px; }
.hr-birim { color: var(--gece-metin-2); }

.hr-olcer__ust { display: flex; align-items: baseline; justify-content: space-between; gap: var(--b-3); margin-bottom: 8px; }
.hr-olcer { height: 6px; border-radius: var(--r-tam); background: rgba(147,190,236,.14); overflow: hidden; }
.hr-olcer__i {
  height: 100%; border-radius: var(--r-tam);
  background: linear-gradient(90deg, var(--mavi-600), var(--mavi-400));
  transition: width .5s cubic-bezier(.22,.8,.3,1);
}
.hr-olcer__i.is-asim { background: linear-gradient(90deg, var(--mavi-600), var(--uyari)); }
.hr-asim { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--uyari); }
.hr-asim .ico { color: var(--uyari); }
.hr-asim[hidden] { display: none; }

.hr-satirlar { display: flex; flex-direction: column; }
.hr-satir {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--b-4);
  padding-block: 11px; border-top: 1px solid var(--gece-cizgi);
}
.hr-satir__et { color: var(--gece-metin-2); }
.hr-satir__v { font-weight: 500; text-align: end; }

.hr-rozetler { display: flex; flex-wrap: wrap; gap: 6px; min-height: 26px; }
.hr-rz {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: var(--t-12); line-height: 1;
  border: 1px solid var(--gece-cizgi-2); border-radius: var(--r-tam);
  padding: 6px 11px; color: var(--gece-metin-2);
}
.hr-rz__n { font-family: var(--f-veri); color: var(--mavi-300); }
.hr-rz--bos { border-style: dashed; color: var(--gece-metin-3); }

.hr-not { display: flex; align-items: flex-start; gap: 8px; color: var(--gece-metin-3); }
.hr-not .ico { color: var(--gece-metin-3); margin-top: 2px; }

/* --- mobil: harita üstte, ölçüm altta ------------------------------------ */
@media (max-width: 900px) {
  .hr-govde { grid-template-columns: minmax(0, 1fr); }
  .hr-ust { align-items: flex-start; }
  .hr-nw { width: 100%; }
  .hr-nw__sira { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .hr-nw__d { width: auto; }
}
@media (max-width: 560px) {
  .hr-harita { padding: 18px 14px 20px; border-radius: var(--r-2); }
  .hr-kontrol { gap: var(--b-3); }
  .hr-yog { width: 100%; justify-content: space-between; }
  .hr-yog__d { min-width: 44px; height: 44px; }
  .hr-nw__d { min-height: 72px; padding-inline: 2px; }
  .hr-nw__d svg { width: 26px; }
  .hr-satir { padding-block: 13px; }
  /* SVG yazıları viewBox ile küçülür: dar ekranda okunaklı kalsınlar */
  .hr-et  { font-size: 15px; stroke-width: 4px; }
  .hr-sayi { font-size: 23px; stroke-width: 5px; }
  .hr-yon { font-size: 14px; }
}

/* --- greft ↔ saç teli, tanım ve seans kararı (2026-08-21) ------------------
   "greft" ziyaretçinin bilmediği bir kelime olabilir; tanım rakamın hemen
   altında duruyor ve saç teli karşılığı sayıyı somutlaştırıyor. */
.hr-tel { display: block; margin-block-start: 3px; font-family: var(--f-veri);
  font-size: var(--t-12); font-weight: 400; color: var(--mavi-300); letter-spacing: -.01em; }
.hr-tanim {
  display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; align-items: center;
  padding: 11px 13px; border-radius: var(--r-2);
  border: 1px solid var(--gece-cizgi-2); background: rgba(147,190,236,.05);
  color: var(--gece-metin-2); line-height: 1.5;
}
.hr-tanim__mk { color: var(--mavi-300); }
.hr-seans { display: inline-flex; align-items: center; gap: 7px; margin-block-start: 8px; color: var(--ok); }
.hr-seans .ico { flex: 0 0 auto; }
.hr-seans.is-uyari { color: var(--uyari); }

/* --- okunur harita (2026-08-21) -------------------------------------------
   Eskiden seçili/seçili-değil ayrımı 1,22:1 kontrasttaydı (WCAG sınırı 3:1) ve
   seçili olmayan bölgenin sayısı `opacity:0` ile tamamen gizliydi — boş harita
   okunamıyordu. Artık her bölge kendi adını ve greft sayısını taşıyor. */
.hr-sayi { opacity: 1; }
.hr-sayi:not(.is-secili) { fill: var(--gece-metin-3); font-size: 13px; }
.hr-et { font-size: 12px; }
.hr-et:not(.is-secili) { fill: var(--gece-metin-3); }
.hr-z { stroke: rgba(147,190,236,.34); stroke-width: 1.2; }
.hr-z:not(.is-secili) { fill: rgba(147,190,236,.045); }
.hr-z:hover:not(.is-secili) { fill: rgba(147,190,236,.13); stroke: rgba(147,190,236,.6); }
.hr-z.is-secili { stroke: var(--mavi-400); stroke-width: 1.6; }

/* yoğunluk düğmesi: sayı + anlamı */
.hr-yog__d { display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.15; }
.hr-yog__ad { font-size: 10px; letter-spacing: .04em; opacity: .8; }
/* "Özel seçim": ön ayara uymayan seçimde beş kutu birden sönüyordu ve neden
   söndüğünü söyleyen hiçbir iz yoktu. */
.hr-nw__ozel {
  margin-inline-start: 9px; padding: 2px 8px; border-radius: var(--r-tam);
  font-size: 10px; font-weight: 500; letter-spacing: .06em;
  background: rgba(93,165,230,.16); color: var(--mavi-300);
}
.hr-nw__ozel[hidden] { display: none; }
/* alan/yoğunluk açıklama satırları */
.hr-ipucu.g-xs, .hr-yog__not { color: var(--gece-metin-3); }
.hr-satirlar .hr-ipucu { display: block; margin: -6px 0 10px; text-align: end; }
.hr-yog__not { flex-basis: 100%; margin-block-start: 8px; line-height: 1.45; max-width: 46ch; }
/* Rakam değişince kısa sönme-belirme. Ara değer YOK — sayı hep doğru. */
.hr-degisti { animation: hrDegis .34s cubic-bezier(.22,.8,.3,1); }
@keyframes hrDegis { 0% { opacity: .25; transform: translateY(-3px); } 100% { opacity: 1; transform: none; } }

/* --- DONÖR TAHSİS ÇUBUĞU ---------------------------------------------------
   Sabit toplam = tek seans kapasitesi. Parçalar seçili bölgeler, kalan görünür
   boşluk. "%68" soyuttu; bu, neyin neye harcandığını gösteriyor.
   Renkler tek mavinin tonları, DOM sırasından (nth-child) gelir. */
.hr-butce { display: flex; flex-direction: column; gap: 9px; }
.hr-tahsis {
  display: flex; height: 12px; border-radius: var(--r-tam); overflow: hidden;
  background: var(--gece-800); box-shadow: inset 0 0 0 1px var(--gece-cizgi);
}
.hr-tahsis__d, .hr-tahsis__kalan, .hr-tahsis__b {
  display: block; height: 100%; transition: width .42s cubic-bezier(.22,.8,.3,1);
}
.hr-tahsis__d + .hr-tahsis__d { box-shadow: inset 1px 0 0 rgba(5,10,18,.55); }
.hr-tahsis__d:nth-child(1) { background: var(--mavi-300); }
.hr-tahsis__d:nth-child(2) { background: var(--mavi-400); }
.hr-tahsis__d:nth-child(3) { background: var(--mavi-500); }
.hr-tahsis__d:nth-child(4) { background: var(--mavi-600); }
.hr-tahsis__d:nth-child(5) { background: var(--mavi-700); }
.hr-tahsis__d:nth-child(6) { background: rgba(147,190,236,.42); }
.hr-tahsis__kalan { background: transparent; }
.hr-tahsis.is-asim .hr-tahsis__d:last-of-type { background: var(--uyari); }
.hr-tahsis--bos { box-shadow: inset 0 0 0 1px var(--gece-cizgi); }
/* Rozet = tahsis çubuğunun lejandı: nokta rengi çubuktaki dilimle aynı. */
.hr-rz__i { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: currentColor; }
.hr-rz--t1 .hr-rz__i { background: var(--mavi-300); }
.hr-rz--t2 .hr-rz__i { background: var(--mavi-400); }
.hr-rz--t3 .hr-rz__i { background: var(--mavi-500); }
.hr-rz--t4 .hr-rz__i { background: var(--mavi-600); }
.hr-rz--t5 .hr-rz__i { background: var(--mavi-700); }
.hr-rz--t6 .hr-rz__i { background: rgba(147,190,236,.42); }

/* --- panel grupları --------------------------------------------------------
   Beş ölçü satırı etiketsiz düz bir tabloydu. Üç grup (sonuç → bütçe → plan)
   ince bir çizgiyle ayrılıyor; okuma sırası kendiliğinden çıkıyor. */
.hr-grup { display: flex; flex-direction: column; gap: 10px; padding-block-start: var(--b-4); border-block-start: 1px solid var(--gece-cizgi); }
.hr-grup__et { color: var(--gece-metin-3); }

/* ===== src/05-hareket.css ===== */
/* ============================================================================
   HairPro — 05-hareket.css · hareket katmanı
   Önek: .hv-*  (61-hareket.js ile eşleşir)

   İLKE: hareket, içeriğin ÖNKOŞULU değildir. Gizleyen her sınıfı JS koyar;
   JS çalışmazsa sayfa tam ve okunur durur. Hiçbir kural ilk boyamayı
   geciktirmez (content-visibility, blur/filter, ağır gölge yoktur).
   ========================================================================== */

/* --- 1. kaydırmayla beliriş ---------------------------------------------- */
/* Bu sınıfı YALNIZ JS ekler. Kaynak HTML'de yoktur → JS yoksa gizlilik yok. */
.hv-belir {
  opacity: 0;
  transform: translate3d(0, 12px, 0);
  transition:
    opacity .62s cubic-bezier(.22, .72, .3, 1),
    transform .62s cubic-bezier(.22, .72, .3, 1);
}
.hv-gorunur { opacity: 1; transform: none; }

/* kardeşler arası kademe — satır içi style yerine sınıf */
.hv-k1 { transition-delay: .06s; }
.hv-k2 { transition-delay: .12s; }
.hv-k3 { transition-delay: .18s; }
.hv-k4 { transition-delay: .24s; }
.hv-k5 { transition-delay: .30s; }

/* --- 2. kart derinliği ---------------------------------------------------- */
/* Yükselme 3px, gölge neredeyse yok: pahalı duruş sıçramadan gelir. */
.hv-yuz {
  transition:
    transform .28s cubic-bezier(.22, .72, .3, 1),
    border-color .28s ease,
    box-shadow .28s ease;
}
@media (hover: hover) and (pointer: fine) {
  .hv-yuz:hover {
    transform: translate3d(0, -3px, 0);
    border-color: rgba(93, 165, 230, .48);
    box-shadow: 0 6px 20px rgba(11, 23, 37, .07);
  }
  .gece-alan .hv-yuz:hover,
  .bolum--gece .hv-yuz:hover,
  .bolum--gece2 .hv-yuz:hover {
    border-color: rgba(93, 165, 230, .40);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .26);
  }
  /* kenarlığı taşıyan iç yüzey de birlikte parlasın */
  .hv-yuz:hover .vaka__gorsel { border-color: rgba(93, 165, 230, .42); }
}
/* klavyeyle gezerken de aynı geri bildirim (odak halkası korunur) */
.hv-yuz:focus-within { border-color: rgba(93, 165, 230, .48); }

/* --- 3. bölüm üstü ilerleme çizgisi -------------------------------------- */
.hv-ilerleme {
  position: fixed;
  inset-block-start: calc(var(--serit-h) + var(--nav-h));
  inset-inline: 0;
  height: 2px;
  z-index: 53;                 /* nav 55, mobil menü 54'ün altında kalır */
  pointer-events: none;
  background: rgba(147, 190, 236, .10);
}
.hv-ilerleme__i {
  height: 100%;
  width: 100%;
  transform: scaleX(0);
  transform-origin: 0 50%;
  background: linear-gradient(90deg, var(--mavi-600), var(--mavi-400));
}
[dir="rtl"] .hv-ilerleme__i { transform-origin: 100% 50%; }
[data-bolum="panel"] .hv-ilerleme { display: none; }

/* --- 4. grafik çizilişi --------------------------------------------------- */
/* 11-charts.js kendi keyframe'ini üretir; biz yalnız GÖRÜNENE kadar bekletiriz. */
.hv-bekle { animation-play-state: paused !important; }
/* elle çizilen yollar (data-hv-ciz) */
.hv-ciz { transition: stroke-dashoffset 1.15s cubic-bezier(.22, .72, .3, 1); }

/* --- 5. yumuşak çapa hedefi ---------------------------------------------- */
.hv-capa { scroll-margin-block-start: calc(var(--serit-h) + var(--nav-h) + 16px); }
.hv-capa:focus { outline: none; }
.hv-capa:focus-visible { outline: 2px solid var(--mavi-400); outline-offset: 6px; }

/* --- 5b. odak halkası katman içinde de görünsün --------------------------
   Katman açılınca odak İÇERİ taşınıyor (40-app.js §8b). Odak programatik
   taşındığı için :focus-visible tetiklenmez; kap kendisi odak alırsa halka
   hiç çıkmaz ve klavye kullanıcısı nerede olduğunu göremez. Kaba odak
   verildiğinde görünür bir çerçeve çizilir — düğmelerde olağan halka kalır. */
.modal[tabindex="-1"]:focus,
.cekmece[tabindex="-1"]:focus,
.mobil-menu[tabindex="-1"]:focus {
  outline: 2px solid var(--mavi-400);
  outline-offset: -4px;
}
/* Ana başlığa taşınan odak (rota değişimi) SESSİZ olmalı: sayfanın her
   açılışında başlığın çevresine kutu çizilmesi hatalı bir "seçili" sinyali. */
#app h1[tabindex="-1"]:focus { outline: none; }
#app h1[tabindex="-1"]:focus-visible { outline: 2px solid var(--mavi-400); outline-offset: 4px; }

/* --- 6. hareket tercihi: hepsi kapanır ----------------------------------- */
@media (prefers-reduced-motion: reduce) {
  .hv-belir {
    opacity: 1 !important;
    transform: none !important;
    transition: none !important;
  }
  .hv-k1, .hv-k2, .hv-k3, .hv-k4, .hv-k5 { transition-delay: 0s !important; }
  .hv-yuz { transition: none !important; }
  .hv-yuz:hover { transform: none !important; box-shadow: none !important; }
  .hv-ilerleme { display: none !important; }
  .hv-bekle { animation-play-state: running !important; }
  .hv-ciz { transition: none !important; stroke-dashoffset: 0 !important; }
}

/* ===== src/06-sonuc.css ===== */
/* ============================================================================
   HairPro — 06-sonuc.css · sonuç derinliği
   Vaka ayrıntı çekmecesi + greft yoğunluğu ölçeği.
   Bütün sınıflar "sn-" ön ekiyle başlar; ortak CSS'e dokunulmaz.
   Fotoğraf iddiası yoktur: derinlik çizim, veri ve tipografiyle kurulur.
   ========================================================================== */

/* --- vaka kartındaki "Ayrıntı" düğmesi ---------------------------------- */
.sn-dgm {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 44px; padding-inline: 16px;
  border: 1px solid var(--kagit-cizgi-2); border-radius: var(--r-tam);
  font-size: var(--t-14); font-weight: 500; color: var(--kagit-metin);
  transition: border-color .16s ease, color .16s ease, background-color .16s ease;
}
.sn-dgm .ico { transition: transform .18s cubic-bezier(.22,.8,.3,1); }
.sn-dgm:hover { border-color: var(--mavi-500); color: var(--mavi-600); }
.sn-dgm:hover .ico { transform: translateX(3px); }
[dir="rtl"] .sn-dgm:hover .ico { transform: translateX(-3px); }
.gece-alan .sn-dgm, .bolum--gece .sn-dgm, .bolum--gece2 .sn-dgm {
  border-color: var(--gece-cizgi-2); color: var(--gece-metin);
}
.gece-alan .sn-dgm:hover, .bolum--gece .sn-dgm:hover, .bolum--gece2 .sn-dgm:hover {
  border-color: var(--mavi-400); color: var(--mavi-300); background-color: rgba(93,165,230,.10);
}

/* --- çekmece içi blok başlığı -------------------------------------------- */
.sn-blok + .sn-blok { margin-block-start: var(--b-6); }
.sn-bas {
  display: flex; align-items: center; gap: var(--b-3);
  font-size: var(--t-12); font-weight: 500; letter-spacing: .16em;
  text-transform: uppercase; color: var(--gece-metin-3);
  margin-block-end: var(--b-4);
}
[lang="ar"] .sn-bas { letter-spacing: 0; }
.sn-bas::after {
  content: ''; flex: 1 1 auto; height: 1px; background: var(--gece-cizgi);
}

/* --- öncesi / sonrası şema çifti ----------------------------------------- */
.sn-krs {
  display: grid; grid-template-columns: minmax(0,1fr) 40px minmax(0,1fr);
  align-items: center; gap: var(--b-3);
}
.sn-krs__k {
  --norwood-bos: var(--gece-900);
  --nw-dolgu: .30;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: var(--b-4) var(--b-3);
  border: 1px solid var(--gece-cizgi); border-radius: var(--r-2);
  background: var(--gece-850); color: var(--mavi-300);
}
.sn-krs__k svg { width: 74px; height: auto; }
.sn-krs__et {
  font-size: var(--t-12); letter-spacing: .1em; text-transform: uppercase;
  color: var(--gece-metin-3);
}
[lang="ar"] .sn-krs__et { letter-spacing: 0; }
.sn-krs__n { font-size: var(--t-13); color: var(--gece-metin-2); }
.sn-krs__ok { display: grid; place-items: center; color: var(--mavi-400); }
[dir="rtl"] .sn-krs__ok .ico { transform: scaleX(-1); }

/* --- greft dağılımı: yatay çubuklar --------------------------------------- */
.sn-bar { display: flex; flex-direction: column; gap: 12px; }
.sn-bar__d {
  display: grid; grid-template-columns: minmax(0,1fr) auto;
  align-items: baseline; row-gap: 6px; column-gap: var(--b-3);
}
.sn-bar__et { font-size: var(--t-14); color: var(--gece-metin); }
.sn-bar__v  { font-size: var(--t-13); color: var(--gece-metin-2); }
.sn-bar__yol {
  grid-column: 1 / -1; height: 8px; border-radius: var(--r-tam);
  background: rgba(147,190,236,.12); overflow: hidden;
}
.sn-bar__dol {
  display: block; height: 100%; border-radius: var(--r-tam); background: var(--mavi-500);
  transform-origin: left center;
  animation: snBar .62s cubic-bezier(.22,.8,.3,1) both;
}
[dir="rtl"] .sn-bar__dol { transform-origin: right center; }
.sn-bar__d:nth-child(2) .sn-bar__dol { background: var(--mavi-400); animation-delay: .06s; }
.sn-bar__d:nth-child(3) .sn-bar__dol { background: var(--mavi-300); animation-delay: .12s; }
@keyframes snBar { from { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { .sn-bar__dol { animation: none; } }

/* --- künye: etiket / değer satırları -------------------------------------- */
.sn-kunye {
  display: grid; grid-template-columns: minmax(0,auto) minmax(0,1fr); column-gap: 0;
}
.sn-kunye dt, .sn-kunye dd {
  padding-block: 9px; border-block-end: 1px solid var(--gece-cizgi); margin: 0;
}
.sn-kunye dt { font-size: var(--t-13); color: var(--gece-metin-3); padding-inline-end: var(--b-4); }
.sn-kunye dd { font-size: var(--t-14); color: var(--gece-metin); text-align: end; }
.sn-kunye dt:nth-last-of-type(1), .sn-kunye dd:nth-last-of-type(1) { border-block-end: 0; }

/* --- zaman çizelgesi ------------------------------------------------------ */
.sn-zaman {
  display: grid; grid-template-columns: minmax(44px, auto) 14px minmax(0,1fr);
  column-gap: var(--b-3); row-gap: 16px; align-items: stretch;
}
.sn-zaman__d { display: contents; }
.sn-zaman__g {
  font-size: var(--t-13); color: var(--gece-metin-2); text-align: end;
  font-family: var(--f-veri); letter-spacing: -.01em;
}
.sn-zaman__i { position: relative; display: block; min-height: 22px; }
.sn-zaman__i::before {
  content: ''; position: absolute; inset-inline-start: 6px;
  inset-block-start: 16px; inset-block-end: -16px;
  width: 1px; background: var(--gece-cizgi-2);
}
.sn-zaman__d.is-gecti .sn-zaman__i::before {
  background: rgba(93,165,230,.45);
}
.sn-zaman__i::after {
  content: ''; position: absolute; inset-inline-start: 2px; inset-block-start: 6px;
  width: 9px; height: 9px; border-radius: 50%;
  border: 1px solid var(--gece-metin-3); background: var(--gece-900);
}
.sn-zaman__d:last-child .sn-zaman__i::before { display: none; }
.sn-zaman__d.is-gecti .sn-zaman__i::after { background: var(--mavi-400); border-color: var(--mavi-400); }
.sn-zaman__m { font-size: var(--t-14); color: var(--gece-metin-2); }
.sn-zaman__d.is-gecti .sn-zaman__m { color: var(--gece-metin); }
.sn-zaman__simdi {
  align-self: center;
  display: inline-flex; align-items: center; gap: 7px;
  font-size: var(--t-12); font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
  color: var(--mavi-300);
}
[lang="ar"] .sn-zaman__simdi { letter-spacing: 0; }

/* Arapçada veri yazı tipi bağlantıları kopardığı için gövde tipine dönülür. */
[lang="ar"] .sn-zaman__g,
[lang="ar"] .sn-krs__n,
[lang="ar"] .sn-kunye dd,
[lang="ar"] .sn-onam__l b { font-family: var(--f-ar); letter-spacing: 0; }
.sn-zaman__simdi::before {
  content: ''; width: 18px; height: 1px; background: var(--mavi-400);
}

/* --- onam kaydı ----------------------------------------------------------- */
.sn-onam {
  display: grid; grid-template-columns: 22px minmax(0,1fr);
  column-gap: var(--b-3); align-items: start;
  padding: var(--b-4); border: 1px solid rgba(47,155,106,.34); border-radius: var(--r-2);
  background: rgba(47,155,106,.08);
}
.sn-onam__ico { color: #6BD3A2; }
.sn-onam__b { font-size: var(--t-14); font-weight: 500; color: var(--gece-metin); }
.sn-onam__l { display: flex; flex-wrap: wrap; gap: 4px var(--b-4); margin-block-start: 6px; }
.sn-onam__l span { font-size: var(--t-13); color: var(--gece-metin-2); }
.sn-onam__l b { font-weight: 500; color: var(--gece-metin); }

/* --- çekmece alt uyarısı --------------------------------------------------- */
.sn-uyari {
  display: grid; grid-template-columns: 16px minmax(0,1fr); column-gap: 10px;
  align-items: start; font-size: var(--t-12); line-height: 1.5; color: var(--gece-metin-3);
}

/* ==========================================================================
   GREFT YOĞUNLUĞU ÖLÇEĞİ — "kaç greft ne demek" sorusunu göstererek yanıtlar
   ========================================================================== */
.sn-yog {
  display: grid; grid-template-columns: 4fr 7fr;
  gap: var(--b-7); align-items: stretch;
}
.sn-yog__yazi { display: flex; flex-direction: column; gap: var(--b-3); }
/* Not, sütunun altına yaslanır. 1920'de giriş metniyle arasında 243px boşluk
   kalıyor (ölçüldü: #/sonuclar, giriş y≈1795'te bitiyor, not y≈2038'de
   başlıyor) — ince çizgi olmadan bu boşluk kasıt değil, delik okunuyordu. */
.sn-yog__not {
  margin-block-start: auto; padding-block-start: var(--b-5);
  border-block-start: 1px solid var(--kagit-cizgi);
}
.gece-alan .sn-yog__not, .bolum--gece .sn-yog__not, .bolum--gece2 .sn-yog__not {
  border-block-start-color: var(--gece-cizgi);
}
.sn-yog__liste {
  display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: var(--b-4);
}
.sn-yog__k { display: flex; flex-direction: column; gap: 10px; }
.sn-yog__kare {
  position: relative; color: var(--mavi-600);
  border: 1px solid var(--kagit-cizgi-2); border-radius: var(--r-2);
  background: #fff; padding: 6px;
}
.gece-alan .sn-yog__kare, .bolum--gece .sn-yog__kare, .bolum--gece2 .sn-yog__kare {
  color: var(--mavi-300); border-color: var(--gece-cizgi-2); background: var(--gece-850);
}
.sn-yog__k--vurgu .sn-yog__kare { border-color: var(--mavi-500); }
.sn-yog__olcu {
  position: absolute; inset-block-end: 7px; inset-inline-end: 8px;
  font-family: var(--f-veri); font-size: 10px; letter-spacing: -.02em;
  color: var(--kagit-metin-3);
}
.gece-alan .sn-yog__olcu, .bolum--gece .sn-yog__olcu, .bolum--gece2 .sn-yog__olcu { color: var(--gece-metin-3); }
.sn-yog__ust { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
.sn-yog__n { font-size: var(--t-26); font-weight: 500; line-height: 1; }
.sn-yog__birim { font-size: var(--t-12); color: var(--kagit-metin-3); }
.gece-alan .sn-yog__birim, .bolum--gece .sn-yog__birim, .bolum--gece2 .sn-yog__birim { color: var(--gece-metin-3); }
.sn-yog__et {
  font-size: var(--t-12); font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
  color: var(--mavi-600);
}
[lang="ar"] .sn-yog__et { letter-spacing: 0; }
.gece-alan .sn-yog__et, .bolum--gece .sn-yog__et, .bolum--gece2 .sn-yog__et { color: var(--mavi-300); }
.sn-yog__mt { font-size: var(--t-13); line-height: 1.5; color: var(--kagit-metin-2); }
.gece-alan .sn-yog__mt, .bolum--gece .sn-yog__mt, .bolum--gece2 .sn-yog__mt { color: var(--gece-metin-2); }

/* noktaların sırayla belirmesi; hareket kısıtlıysa kapanır */
.sn-nokta {
  transform-box: fill-box; transform-origin: center;
  animation: snNokta .5s ease-out both;
}
@keyframes snNokta { from { opacity: 0; transform: scale(.4); } }
@media (prefers-reduced-motion: reduce) { .sn-nokta { animation: none; } }

/* --- dar ekran ------------------------------------------------------------ */
@media (max-width: 1024px) {
  .sn-yog { grid-template-columns: minmax(0,1fr); gap: var(--b-5); }
  /* tek sütuna düşünce not zaten metnin hemen altında: çizgi gereksiz */
  .sn-yog__not { margin-block-start: 0; padding-block-start: 0; border-block-start: 0; }
}
@media (max-width: 560px) {
  .sn-yog__liste { gap: 10px; }
  .sn-yog__n { font-size: var(--t-21); }
  .sn-yog__kare { padding: 4px; }
  .sn-krs { grid-template-columns: minmax(0,1fr) 28px minmax(0,1fr); gap: 6px; }
  .sn-krs__k { padding: var(--b-3) 8px; }
  .sn-krs__k svg { width: 58px; }
  .sn-zaman { column-gap: 10px; }
  .sn-kunye dt { padding-inline-end: var(--b-3); }
}

/* ===== src/07-vitrin.css ===== */
/* ============================================================================
   HairPro — 07-vitrin.css · anasayfa vitrin parçaları
   Kapsam: vt-guven (güven şeridi) · vt-kars (karşılaştırma) ·
           vt-soru (tek soruluk seçici) · vt-adim (süreç ritmi)
   Tüm sınıflar "vt-" önekli. Renk yalnız jetonlardan gelir; bölüm zemini
   gece ya da kağıt olabildiği için her kök kendi bağlam değişkenlerini taşır.
   ========================================================================== */

/* --- bağlam jetonları ----------------------------------------------------- */
:is(.vt-guven, .vt-kars, .vt-soru, .vt-adim) {
  --vt-cizgi:   var(--kagit-cizgi);
  --vt-cizgi-2: var(--kagit-cizgi-2);
  --vt-metin:   var(--kagit-metin);
  --vt-ikincil: var(--kagit-metin-2);
  --vt-soluk:   var(--kagit-metin-3);
  --vt-vurgu:   var(--mavi-600);
  --vt-alan:    var(--mavi-500);
  --vt-hayalet: var(--kagit-300);
  --vt-yuzey:   #fff;
}
:is(.gece-alan, .bolum--gece, .bolum--gece2) :is(.vt-guven, .vt-kars, .vt-soru, .vt-adim) {
  --vt-cizgi:   var(--gece-cizgi);
  --vt-cizgi-2: var(--gece-cizgi-2);
  --vt-metin:   var(--gece-metin);
  --vt-ikincil: var(--gece-metin-2);
  --vt-soluk:   var(--gece-metin-3);
  --vt-vurgu:   var(--mavi-300);
  --vt-alan:    var(--mavi-400);
  --vt-hayalet: var(--gece-800);
  --vt-yuzey:   var(--gece-850);
}

/* ==========================================================================
   1 — GÜVEN ŞERİDİ
   Tek satır, gümüş nokta ayraçlı. Mobilde alt alta düşmez; kaydırılır.
   ========================================================================== */
.vt-guven {
  border-block: 1px solid var(--vt-cizgi);
  padding-block: var(--b-4);
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
}
.vt-guven::-webkit-scrollbar { display: none; }

.vt-guven__s {
  display: flex;
  align-items: center;
  gap: clamp(16px, 2.6vw, 34px);
  justify-content: space-between;
  white-space: nowrap;
  width: max-content;
  min-width: 100%;
}
.vt-guven__b {
  display: inline-flex;
  align-items: baseline;
  gap: 10px;
  flex: 0 0 auto;
}
.vt-guven__e {
  font-family: var(--f-veri);
  font-size: var(--t-11);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--vt-soluk);
}
[lang="ar"] .vt-guven__e { font-family: var(--f-ar); letter-spacing: 0; }
.vt-guven__m {
  font-size: var(--t-15);
  font-weight: 500;
  color: var(--vt-metin);
  letter-spacing: -.005em;
}
.vt-guven__n {
  width: 7px; height: 7px; border-radius: 50%;
  flex: 0 0 auto;
  background: var(--gumus);
  opacity: .8;
}

/* dar ekran: şerit kenara taşar, sağ uçta solma kaydırılabilirliği söyler */
@media (max-width: 760px) {
  .vt-guven {
    margin-inline: calc(var(--yan) * -1);
    padding-inline: var(--yan);
    -webkit-mask-image: linear-gradient(to right, #000 84%, transparent 100%);
            mask-image: linear-gradient(to right, #000 84%, transparent 100%);
  }
  [dir="rtl"] .vt-guven {
    -webkit-mask-image: linear-gradient(to left, #000 84%, transparent 100%);
            mask-image: linear-gradient(to left, #000 84%, transparent 100%);
  }
  .vt-guven__s { justify-content: flex-start; gap: 20px; padding-inline-end: var(--b-6); }
}

/* ==========================================================================
   2 — KARŞILAŞTIRMA
   İki sütunlu tipografik liste. Sol soluk (yaygın), sağ parlak (biz).
   Ortada gümüş dikey hat; satır ayracı ince çizgi.
   ========================================================================== */
.vt-kars__baslik { display: flex; flex-direction: column; gap: var(--b-3); margin-bottom: var(--b-6); }
.vt-kars__et { color: var(--vt-vurgu); }

.vt-kars__ust,
.vt-kars__r {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  column-gap: clamp(20px, 5vw, 76px);
}
.vt-kars__ust { padding-bottom: 10px; }
.vt-kars__bs, .vt-kars__bg {
  font-size: var(--t-11);
  font-weight: 500;
  letter-spacing: .18em;
  text-transform: uppercase;
}
[lang="ar"] .vt-kars__bs, [lang="ar"] .vt-kars__bg { letter-spacing: 0; }
.vt-kars__bs { color: var(--vt-soluk); }
.vt-kars__bg { color: var(--vt-vurgu); }

.vt-kars__l { position: relative; }
.vt-kars__l::before {
  content: '';
  position: absolute;
  inset-block: 0;
  inset-inline-start: 50%;
  width: 1px;
  background: var(--gumus);
  opacity: .34;
  pointer-events: none;
}
.vt-kars__r {
  border-top: 1px solid var(--vt-cizgi);
  padding-block: clamp(16px, 2vw, 26px);
  align-items: baseline;
}
.vt-kars__r:last-child { border-bottom: 1px solid var(--vt-cizgi); }
.vt-kars__s, .vt-kars__g { display: block; }
.vt-kars__s {
  font-size: var(--t-16);
  line-height: 1.42;
  color: var(--vt-soluk);
}
.vt-kars__g {
  font-size: clamp(17px, 1.5vw, 21px);
  line-height: 1.34;
  font-weight: 500;
  letter-spacing: -.012em;
  color: var(--vt-metin);
  position: relative;
  padding-inline-start: 18px;
}
.vt-kars__g::before {
  content: '';
  position: absolute;
  inset-inline-start: 0;
  inset-block-start: .52em;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--vt-alan);
}
.vt-kars__et2 { display: none; }

@media (max-width: 720px) {
  .vt-kars__ust { display: none; }
  .vt-kars__l::before { display: none; }
  .vt-kars__r { grid-template-columns: minmax(0, 1fr); row-gap: 10px; }
  .vt-kars__et2 {
    display: block;
    font-size: var(--t-11);
    letter-spacing: .16em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  [lang="ar"] .vt-kars__et2 { letter-spacing: 0; }
  /* iki sütunun ortak taban kuralı (modifiye edenler aşağıda) */
  .vt-kars__c { min-width: 0; }
  .vt-kars__c--s .vt-kars__et2 { color: var(--vt-soluk); }
  .vt-kars__c--g .vt-kars__et2 { color: var(--vt-vurgu); }
  .vt-kars__g { padding-inline-start: 0; }
  .vt-kars__g::before { display: none; }
  .vt-kars__c--g { border-inline-start: 2px solid var(--vt-alan); padding-inline-start: 14px; }
}

/* ==========================================================================
   3 — TEK SORULUK SEÇİCİ
   ========================================================================== */
.vt-soru {
  display: grid;
  grid-template-columns: 7fr 5fr;
  gap: clamp(24px, 4vw, 64px);
  align-items: start;
}
@media (max-width: 900px) { .vt-soru { grid-template-columns: minmax(0, 1fr); } }

.vt-soru__b { display: flex; flex-direction: column; gap: var(--b-3); margin-bottom: var(--b-5); }
.vt-soru__et { color: var(--vt-vurgu); }

.vt-soru__d3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--b-3); }
.vt-soru__d {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: var(--b-5) 10px 16px;
  min-height: 44px;
  border: 1px solid var(--vt-cizgi-2);
  border-radius: var(--r-2);
  background: var(--vt-yuzey);
  color: var(--vt-ikincil);
  transition: border-color .16s ease, color .16s ease, background .16s ease;
}
.vt-soru__d:hover { border-color: var(--vt-alan); }
.vt-soru__d.is-secili { border-color: var(--vt-alan); color: var(--vt-metin); }
.vt-soru__im { width: 100%; max-width: 92px; color: currentColor; }
.vt-soru__im svg { width: 100%; height: auto; }
.vt-soru__al { fill: currentColor; fill-opacity: .34; transition: fill-opacity .16s ease; }
.vt-soru__d.is-secili .vt-soru__al { fill: var(--vt-alan); fill-opacity: 1; }
.vt-soru__ad {
  font-size: var(--t-13);
  font-weight: 500;
  line-height: 1.3;
  text-align: center;
}

.vt-soru__k {
  border: 1px solid var(--vt-cizgi-2);
  border-radius: var(--r-2);
  background: var(--vt-yuzey);
  padding: var(--b-5);
  display: flex; flex-direction: column; gap: var(--b-4);
}
.vt-soru__ku {
  font-family: var(--f-veri);
  font-size: var(--t-11);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--vt-soluk);
}
[lang="ar"] .vt-soru__ku { font-family: var(--f-ar); letter-spacing: 0; }
.vt-soru__mt {
  font-size: var(--t-18);
  line-height: 1.46;
  color: var(--vt-metin);
  letter-spacing: -.008em;
}
.vt-soru__tk { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

@media (max-width: 420px) {
  .vt-soru__d { padding: var(--b-3) 6px 12px; }
  .vt-soru__ad { font-size: var(--t-12); }
}

/* ==========================================================================
   4 — SÜREÇ RİTMİ (dev rakamlar + ince omurga)
   ========================================================================== */
.vt-adim__b { display: flex; flex-direction: column; gap: var(--b-3); margin-bottom: var(--b-6); }
.vt-adim__et { color: var(--vt-vurgu); }

.vt-adim__s {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  column-gap: clamp(16px, 2.4vw, 34px);
  padding-block-start: var(--b-5);
}
.vt-adim__s::before {
  content: '';
  position: absolute;
  inset-block-start: 0;
  inset-inline: 0;
  height: 1px;
  background: var(--vt-cizgi-2);
}
.vt-adim__d { position: relative; padding-block-start: 6px; }
.vt-adim__nk {
  position: absolute;
  inset-block-start: -4px;
  inset-inline-start: 0;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--vt-alan);
}
.vt-adim__d:not(:first-child) .vt-adim__nk { background: var(--vt-cizgi-2); }
.vt-adim__n {
  position: absolute;
  inset-block-start: 14px;
  inset-inline-start: -6px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: clamp(58px, 6.6vw, 104px);
  line-height: .78;
  letter-spacing: -.05em;
  color: var(--vt-hayalet);
  z-index: 0;
  pointer-events: none;
  user-select: none;
}
.vt-adim__ad {
  position: relative;
  z-index: 1;
  margin-block-start: clamp(34px, 3.6vw, 56px);
  color: var(--vt-metin);
}
.vt-adim__mt {
  position: relative;
  z-index: 1;
  margin-block-start: 8px;
  color: var(--vt-ikincil);
  /* 26ch (~250px) kap 1520'ye çıkınca 338px'lik sütunun ancak %74'ünü
     dolduruyordu — dört sütun da sağ kenarından 88px boş kalıyordu
     (ölçüldü: anasayfa "Dört adım, belli süreler", 1920). 30ch → %85. */
  max-width: 30ch;
}

@media (max-width: 860px) {
  .vt-adim__s {
    grid-template-columns: minmax(0, 1fr);
    row-gap: var(--b-6);
    padding-block-start: 0;
    padding-inline-start: 26px;
  }
  .vt-adim__s::before {
    inset-block: 6px 0;
    inset-inline: 3px auto;
    width: 1px; height: auto;
  }
  .vt-adim__d { padding-block-start: 0; }
  .vt-adim__nk { inset-block-start: 8px; inset-inline-start: -26px; }
  .vt-adim__n {
    inset-block-start: -14px;
    inset-inline-start: auto;
    inset-inline-end: 0;
    font-size: 62px;
  }
  .vt-adim__ad { margin-block-start: 0; padding-inline-end: 52px; }
  .vt-adim__mt { max-width: none; padding-inline-end: 8px; }
}

/* --- hareket kısıtı ------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  .vt-soru__d, .vt-soru__al { transition: none; }
}


/* --- telefon: güven şeridi kesik görünmesin, kaydırılabilirliği belli olsun -- */
@media (max-width: 860px) {
  .vt-guven {
    overflow-x: auto; overscroll-behavior-x: contain;
    scroll-snap-type: x proximity; padding-inline-end: 28px;
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 26px), transparent);
            mask-image: linear-gradient(to right, #000 calc(100% - 26px), transparent);
  }
  .vt-guven > * { scroll-snap-align: start; flex: 0 0 auto; }
}

/* ===== src/08-sahne.css ===== */
/* ============================================================================
   HairPro — 08-sahne.css · SİNEMATİK AÇILIŞ SAHNESİ
   Neden var: eski `.hero` iki sütunluydu — telefonda fotoğraf katlamanın
   ALTINA düşüyor, ilk ekran düz koyu bir metin bloğu oluyordu. Referans
   aldığımız kliniklerin hepsinde ilk ekran TAM-KANAMA bir görsel.
   Bu bileşen görseli zemine alır, metni perdenin üstüne yazar; mobilde de
   masaüstünde de fotoğraf ilk saniyede görünür.
   Sanat yönetmenliği kuralı: masaüstünde özne SAĞDA, metin solda koyu alanda.
   Mobilde ayrı kadraj (`heroM`) kullanılır — kırpma değil, sanat yönetmenliği.
   ========================================================================== */

.sahne {
  --sahne-y: clamp(540px, calc(100svh - var(--serit-h) - var(--nav-h)), 880px);
  --sahne-odak: 72% 42%;
  position: relative; isolation: isolate; overflow: clip;
  background: var(--gece-950); color: var(--gece-metin);
  display: grid; grid-template-rows: 1fr auto; min-height: var(--sahne-y);
}
/* iç sayfalarda daha alçak: ana sayfa dışındaki sahneler sayfayı yutmasın */
.sahne--ic { --sahne-y: clamp(360px, calc(66svh - var(--nav-h)), 520px); }

/* --- zemin katmanı -------------------------------------------------------- */
.sahne__g { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
.sahne__g img {
  width: 100%; height: 100%; object-fit: cover; object-position: var(--sahne-odak);
  animation: sahneGir 1.5s cubic-bezier(.2,.72,.24,1) both;
}
.sahne__g .sahne__g--m { display: none; }
@keyframes sahneGir { from { transform: scale(1.055); opacity: .35; } to { transform: none; opacity: 1; } }

/* --- perde: metnin okunurluğunu garanti eden katmanlı scrim --------------- */
.sahne__perde {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background:
    linear-gradient(97deg, var(--gece-950) 2%, rgba(5,10,18,.92) 26%, rgba(5,10,18,.54) 52%, rgba(5,10,18,.22) 78%, rgba(5,10,18,.42) 100%),
    radial-gradient(112% 86% at 74% 26%, rgba(44,127,208,.17), transparent 64%),
    linear-gradient(0deg, var(--gece-950) 0%, rgba(5,10,18,.34) 22%, transparent 46%);
}
.sahne__perde::after {
  content: ''; position: absolute; inset: 0;
  background-image: var(--grain); opacity: .05; mix-blend-mode: overlay;
}

/* --- içerik --------------------------------------------------------------- */
.sahne__ic {
  grid-row: 1; grid-column: 1;
  position: relative; z-index: 2; display: flex; align-items: center;
  padding-block: clamp(44px, 5.4vw, 84px);
}
.sahne__mt { display: flex; flex-direction: column; gap: var(--b-4); max-width: clamp(560px, 44vw, 780px); }
.sahne__mt > * { animation: sahneMt .72s cubic-bezier(.22,.8,.3,1) both; }
.sahne__mt > *:nth-child(1) { animation-delay: .06s; }
.sahne__mt > *:nth-child(2) { animation-delay: .13s; }
.sahne__mt > *:nth-child(3) { animation-delay: .20s; }
.sahne__mt > *:nth-child(4) { animation-delay: .27s; }
.sahne__mt > *:nth-child(5) { animation-delay: .34s; }
@keyframes sahneMt { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: none; } }

.sahne__ust {
  display: inline-flex; align-items: center; gap: 11px;
  color: var(--mavi-300); align-self: flex-start;
}
/* 28x1px "eyebrow dash" 2018'den beri her SaaS hero'sunda var ve dokuz rotanın
   hepsinde görünüyordu — şablon hissinin en yüksek sesli işaretlerinden biri.
   Yerine markanın kendi folikül motifi (64-sahne.js `ust` yuvasına basar). */
.sahne__ust .mk { flex: 0 0 auto; opacity: .9; }

.sahne__h1 {
  font-family: var(--f-display); font-weight: 600;
  font-size: clamp(40px, 5.9vw, 92px); line-height: .98; letter-spacing: -.035em;
  text-wrap: balance; color: #fff;
  text-shadow: 0 2px 40px rgba(0,0,0,.42);
}
[lang="ar"] .sahne__h1 { font-family: var(--f-ar-d); letter-spacing: 0; line-height: 1.18; }

.sahne__alt {
  font-size: clamp(16px, 1.15vw, 19px); line-height: 1.6;
  color: var(--gece-metin-2); max-width: 44ch;
  text-shadow: 0 1px 16px rgba(0,0,0,.5);
}

.sahne__d { display: flex; gap: var(--b-3); flex-wrap: wrap; align-items: center; }
.sahne__ln {
  display: inline-flex; align-items: center; gap: 9px; min-height: 52px;
  padding-inline: 4px; font-size: var(--t-15); font-weight: 500;
  color: var(--gece-metin); position: relative;
}
.sahne__ln::after {
  content: ''; position: absolute; inset-block-end: 14px; inset-inline: 4px 34px;
  height: 1px; background: currentColor; opacity: .28;
  transition: opacity .18s ease;
}
.sahne__ln:hover::after { opacity: .75; }
.sahne__ln .ico { width: 17px; height: 17px; transition: translate .2s cubic-bezier(.22,.8,.3,1); }
.sahne__ln:hover .ico { translate: 4px 0; }
[dir="rtl"] .sahne__ln:hover .ico { translate: -4px 0; }

/* --- alt ray: sahnenin içinde, saç teli inceliğinde ayrılmış üç gerçek ----- */
.sahne__ray {
  grid-row: 2; grid-column: 1;
  position: relative; z-index: 2;
  border-block-start: 1px solid var(--gece-cizgi);
  background: linear-gradient(0deg, rgba(5,10,18,.86), rgba(5,10,18,.34));
  backdrop-filter: blur(3px);
}
.sahne__ray-ic { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); }
.sahne__ray-d {
  display: flex; flex-direction: column; gap: 5px;
  padding-block: 17px; padding-inline-end: var(--b-5); min-width: 0;
}
.sahne__ray-d + .sahne__ray-d {
  border-inline-start: 1px solid var(--gece-cizgi); padding-inline-start: var(--b-5);
}
.sahne__ray-e {
  font-family: var(--f-veri); font-size: var(--t-11); letter-spacing: .17em;
  text-transform: uppercase; color: var(--gece-metin-3);
}
[lang="ar"] .sahne__ray-e { font-family: var(--f-ar); letter-spacing: 0; }
.sahne__ray-v { font-size: var(--t-15); font-weight: 500; color: var(--gece-metin); line-height: 1.35; }

/* --- tablet --------------------------------------------------------------- */
@media (max-width: 1024px) {
  .sahne { --sahne-odak: 66% 38%; }
  .sahne__perde {
    background:
      linear-gradient(97deg, var(--gece-950) 0%, rgba(5,10,18,.90) 34%, rgba(5,10,18,.58) 64%, rgba(5,10,18,.34) 100%),
      radial-gradient(110% 80% at 76% 24%, rgba(44,127,208,.16), transparent 62%),
      linear-gradient(0deg, var(--gece-950) 0%, rgba(5,10,18,.40) 24%, transparent 50%);
  }
}

/* --- telefon: fotoğraf ilk ekranda, metin alta yaslı ----------------------- */
@media (max-width: 780px) {
  .sahne {
    /* ⚠ UYGULAMA İÇİ TARAYICI (Instagram/Facebook): görünür alan telefon
       ekranından ~%40 kısa olabiliyor — ölçüldü: 440x515. Sahne ASLA görünür
       alandan uzun olmamalı; uzun olduğunda alt ray dilimleniyor ve yapışkan
       çubuk hero metninin üstüne biniyordu. Taban 500px'ti, o yüzden 515px'lik
       alanda çakışıyordu. Çubuk sahne görünürken gizlendiği için artık onun
       payını düşmüyoruz; yalnız alt rayın kendi yüksekliğini (52px) düşüyoruz. */
    /* Sahne TAM olarak görünür alanı doldurur. Rayın payını ayrıca düşmüyoruz:
       ızgara `1fr auto` olduğu için ray ne kadar yer kaplarsa kalanı içerik alır.
       Eskiden ray yüksekliği (56 ya da 72px) tahmin ediliyordu; tahmin tutmayınca
       altta ince beyaz şerit kalıyor ya da ray dilimleniyordu. */
    --sahne-y: calc(100svh - var(--serit-h) - var(--nav-h));
    --sahne-odak: 50% 22%;
  }
  .sahne--ic { --sahne-y: clamp(300px, 44svh, 400px); }
  .sahne__g .sahne__g--d { display: none; }
  .sahne__g .sahne__g--m { display: block; }
  .sahne__perde {
    background:
      linear-gradient(0deg, var(--gece-950) 10%, rgba(5,10,18,.93) 33%, rgba(5,10,18,.52) 58%, rgba(5,10,18,.12) 88%),
      radial-gradient(120% 54% at 50% 4%, rgba(44,127,208,.15), transparent 58%);
  }
  /* Üst dolgu SABİT 132px'ti; 515px'lik uygulama içi tarayıcıda sahneyi
     görünür alandan 56px taşırıyordu (ölçüldü). Görünüm alanına bağlandı. */
  .sahne__ic { align-items: flex-end; padding-block: clamp(48px, 13svh, 132px) 44px; }
  .sahne__ipucu { grid-template-rows: 26px auto; margin-block-end: 10px; gap: 3px; }
  @keyframes sahneDus { 0%{transform:translateY(0);opacity:0} 18%{opacity:1} 72%{opacity:1} 100%{transform:translateY(23px);opacity:0} }
  .sahne__mt { gap: var(--b-3); max-width: none; }
  .sahne__h1 { font-size: clamp(34px, 9.2vw, 44px); line-height: 1.02; letter-spacing: -.028em; }
  .sahne__alt { font-size: var(--t-15); line-height: 1.52; }
  .sahne__d { gap: var(--b-2); }
  .sahne__d .btn { flex: 1 1 100%; }
  .sahne__ln { justify-content: center; width: 100%; }
  .sahne__ln::after { inset-inline: 50% 50%; }

  .sahne__ray-d { padding-block: 11px; padding-inline: 7px; gap: 3px; }
  .sahne__ray-d:first-child { padding-inline-start: 0; }
  .sahne__ray-d + .sahne__ray-d { padding-inline-start: 7px; }
  .sahne__ray-e { font-size: 9px; letter-spacing: .1em; }
  .sahne__ray-v { font-size: var(--t-12); line-height: 1.3; }
}

/* iç sayfa sahnesinde metin ortalanır (alt ray yok, fotoğraf daha az yer alır) */
@media (max-width: 780px) {
  .sahne--ic .sahne__ic { align-items: flex-end; padding-block: 96px 22px; }
}

/* ============================================================================
   RTL (Arapça): metin sağa geçer ama fotoğraf ve perde geçmez.
   Kaynak karede özne SAĞDA, mürekkep solda; RTL'de metin sağda duruyor ve
   öznenin üstüne biniyordu (ölçüldü). Çözüm: sahne zeminini aynala — özne
   sola, mürekkep sağa gider — ve perdeyi de aynı açıyla çevir.
   ========================================================================== */
[dir="rtl"] .sahne__g img { transform: scaleX(-1); }
[dir="rtl"] .sahne__g img { animation-name: sahneGirRtl; }
@keyframes sahneGirRtl {
  from { transform: scaleX(-1) scale(1.055); opacity: .35; }
  to   { transform: scaleX(-1); opacity: 1; }
}
[dir="rtl"] .sahne__perde {
  background:
    linear-gradient(263deg, var(--gece-950) 2%, rgba(5,10,18,.92) 26%, rgba(5,10,18,.54) 52%, rgba(5,10,18,.22) 78%, rgba(5,10,18,.42) 100%),
    radial-gradient(112% 86% at 26% 26%, rgba(44,127,208,.17), transparent 64%),
    linear-gradient(0deg, var(--gece-950) 0%, rgba(5,10,18,.34) 22%, transparent 46%);
}
@media (max-width: 1024px) {
  [dir="rtl"] .sahne__perde {
    background:
      linear-gradient(263deg, var(--gece-950) 0%, rgba(5,10,18,.90) 34%, rgba(5,10,18,.58) 64%, rgba(5,10,18,.34) 100%),
      radial-gradient(110% 80% at 24% 24%, rgba(44,127,208,.16), transparent 62%),
      linear-gradient(0deg, var(--gece-950) 0%, rgba(5,10,18,.40) 24%, transparent 50%);
  }
}
@media (max-width: 780px) {
  /* telefonda perde zaten alttan yukarı; yalnız aynalama kalsın */
  [dir="rtl"] .sahne__perde {
    background:
      linear-gradient(0deg, var(--gece-950) 10%, rgba(5,10,18,.93) 33%, rgba(5,10,18,.52) 58%, rgba(5,10,18,.12) 88%),
      radial-gradient(120% 54% at 50% 4%, rgba(44,127,208,.15), transparent 58%);
  }
}

/* ============================================================================
   Sahne görünürken yapışkan alt çubuk çekilir.
   Neden: hero'nun kendi birincil düğmesi ("Ücretsiz saç analizi") ile çubuktaki
   düğme ("Ücretsiz ön görüşme") aynı anda, üst üste, aynı mavi hapta duruyordu —
   telefonda iki kopya düğme gibi, hatalı görünüyordu. Çubuk kalıcı dönüşüm
   yolu; hero zaten kendi çağrısını taşıyor. Sahne ekrandan çıkınca çubuk gelir.
   Sınıfı 64-sahne.js'teki IntersectionObserver koyar; gözlemci kurulamazsa
   çubuk her zaman görünür kalır (güvenli varsayılan).
   ========================================================================== */
@media (max-width: 860px) {
  .alt-cubuk { transition: transform .26s cubic-bezier(.22,.8,.3,1), opacity .2s ease; }
  .alt-cubuk.is-cekili {
    transform: translateY(calc(100% + env(safe-area-inset-bottom, 0px)));
    opacity: 0; pointer-events: none;
  }
}

/* ============================================================================
   KAYDIRMA İPUCU — düşen folikül
   Jenerik chevron yerine markanın kendi motifi: bir kök soğanı ipin üzerinde
   aşağı doğru süzülüp sönüyor. "Sayfa devam ediyor" bilgisini veriyor ve
   aynı zamanda konuyu (greft yerleşiyor) anlatıyor.
   Hareket kapalıyken (prefers-reduced-motion) nokta ipin başında DURUR —
   görünmez kalmaz; genel sıfırlama animasyonu .01ms'e indirip son kareye
   sabitlediği için başlangıç durumu görünür seçildi.
   ========================================================================== */
.sahne__ipucu {
  grid-row: 1; grid-column: 1; align-self: end; justify-self: center;
  position: relative; z-index: 3; pointer-events: none;
  display: grid; grid-template-rows: 40px auto; justify-items: center; gap: 5px;
  margin-block-end: 14px;
  transition: opacity .4s ease, transform .4s ease;
}
/* Görevini yaptı: ilk kaydırmada söner. */
.sahne__ipucu.is-sondu { opacity: 0; transform: translateY(6px); }
.sahne__ipucu-iz, .sahne__ipucu-kok { grid-row: 1; }
.sahne__ipucu-mt {
  grid-row: 2; display: inline-flex; align-items: center; gap: 4px;
  font-size: var(--t-11); letter-spacing: .14em; text-transform: uppercase;
  color: var(--gece-metin-3); white-space: nowrap;
}
[lang="ar"] .sahne__ipucu-mt { letter-spacing: 0; }
.sahne__ipucu-mt .ico { animation: sahneOk 2.1s ease-in-out infinite; }
@keyframes sahneOk { 0%,100% { transform: translateY(0); opacity: .7; } 50% { transform: translateY(3px); opacity: 1; } }
/* Alçak görünüm alanında (uygulama içi tarayıcı) yer yok — ipucu gürültü olur. */
@media (max-height: 620px) { .sahne__ipucu { display: none; } }
.sahne__ipucu-iz {
  grid-column: 1; width: 1px; height: 100%;
  background: linear-gradient(180deg, rgba(147,190,236,.42), rgba(147,190,236,0));
}
.sahne__ipucu-kok {
  grid-column: 1; justify-self: center; width: 6px; height: 6px; border-radius: 50%;
  background: var(--mavi-300); box-shadow: 0 0 10px rgba(147,190,236,.7);
  animation: sahneDus 2.1s cubic-bezier(.55,0,.35,1) infinite;
}
@keyframes sahneDus {
  0%   { transform: translateY(0);    opacity: 0; }
  18%  { opacity: 1; }
  72%  { opacity: 1; }
  100% { transform: translateY(34px); opacity: 0; }
}

/* ===== src/09-kesit.css ===== */
/* ============================================================================
   HairPro — 09-kesit.css · DERİ KESİTİ (ks-)
   Neden var: "DHI / safir FUE / traşsız" farkı her klinik sitesinde METİNLE
   anlatılıyor; ziyaretçi hiçbirini gözünde canlandıramıyor. Bu bileşen farkı
   deri kesiti üzerinde GÖSTERİR: donörden greft alınışı, kanal açılıp
   açılmaması, açının nasıl verildiği. Sayfanın iddiası bu.
   Tüm çizim satır içi SVG'dir; dış kaynak yoktur, renkleri jetonlardan alır.
   ========================================================================== */

.ks { display: flex; flex-direction: column; gap: var(--b-6); }

/* --- teknik anahtarı ------------------------------------------------------- */
.ks__tek {
  display: inline-flex; gap: 3px; padding: 4px; align-self: flex-start;
  border: 1px solid var(--gece-cizgi-2); border-radius: var(--r-tam);
  background: rgba(5,10,18,.55); max-width: 100%; overflow-x: auto;
  scrollbar-width: none;
}
.ks__tek::-webkit-scrollbar { display: none; }
.ks__t {
  min-height: 40px; padding-inline: 17px; border-radius: var(--r-tam);
  font-size: var(--t-14); font-weight: 500; color: var(--gece-metin-2);
  white-space: nowrap; transition: background .16s ease, color .16s ease;
}
.ks__t:hover { color: var(--gece-metin); }
.ks__t.is-secili { background: var(--mavi-500); color: #fff; }

/* --- gövde ---------------------------------------------------------------- */
.ks__govde { display: grid; grid-template-columns: minmax(0, 1.42fr) minmax(280px, .9fr); gap: var(--b-6); align-items: start; }

.ks__sahne {
  position: relative; border: 1px solid var(--gece-cizgi); border-radius: var(--r-3);
  background:
    radial-gradient(120% 90% at 24% 8%, rgba(44,127,208,.13), transparent 62%),
    linear-gradient(180deg, var(--gece-900), var(--gece-950));
  overflow: hidden;
}
.ks__svg { width: 100%; height: auto; display: block; }
.ks__lejant {
  display: flex; flex-wrap: wrap; gap: var(--b-2) var(--b-4);
  padding: 12px 16px 14px; border-block-start: 1px solid var(--gece-cizgi);
}
.ks__l { display: inline-flex; align-items: center; gap: 7px; font-size: var(--t-12); color: var(--gece-metin-3); }
.ks__l::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
.ks__l--donor { color: var(--mavi-300); }
.ks__l--alici { color: #7E92A8; }
.ks__l--yeni  { color: var(--mavi-400); }

/* --- adım listesi --------------------------------------------------------- */
.ks__adimlar { display: flex; flex-direction: column; gap: 2px; }
.ks__a {
  display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 2px 12px;
  align-items: start; width: 100%; text-align: start;
  padding: 13px 14px; border-radius: var(--r-2);
  border: 1px solid transparent; min-height: 44px;
  transition: background .16s ease, border-color .16s ease;
}
.ks__a:hover { background: rgba(147,190,236,.05); }
.ks__a.is-secili { background: rgba(44,127,208,.10); border-color: var(--gece-cizgi-2); }
.ks__a-n {
  grid-row: 1 / span 2; font-family: var(--f-veri); font-size: var(--t-13);
  color: var(--gece-metin-3); padding-top: 2px;
}
.ks__a.is-secili .ks__a-n { color: var(--mavi-300); }
.ks__a-t { font-size: var(--t-15); font-weight: 500; color: var(--gece-metin); }
.ks__a-m { font-size: var(--t-13); line-height: 1.55; color: var(--gece-metin-2); }
.ks__a:not(.is-secili) .ks__a-m { color: var(--gece-metin-3); }

/* --- SVG katmanları ------------------------------------------------------- */
.ks-yuzey  { fill: none; stroke: rgba(147,190,236,.55); stroke-width: 1.6; }
.ks-kat1   { fill: rgba(157,198,240,.21); }
.ks-kat2   { fill: rgba(147,190,236,.115); }
.ks-kat3   { fill: rgba(120,170,225,.07); }
.ks-cizgi  { stroke: rgba(147,190,236,.16); stroke-width: 1; fill: none; }
.ks-taban  { stroke: rgba(147,190,236,.24); stroke-width: 1.2; fill: none; }

.ks-kok     { stroke-width: 2.1; stroke-linecap: round; fill: none; }
.ks-kok--donor { stroke: #93C7F2; }
.ks-kok--alici { stroke: #56697E; }
.ks-kok--yeni  { stroke: #6FB4F0; }
.ks-sogan   { fill: #93C7F2; }
.ks-sogan--alici { fill: #56697E; }
.ks-sogan--yeni  { fill: #6FB4F0; }

.ks-etiket { fill: var(--gece-metin-3); font-size: 13px; letter-spacing: .12em; font-family: var(--f-veri); }
.ks-olcu-c { stroke: rgba(93,165,230,.55); stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
.ks-olcu-b { fill: rgba(44,127,208,.10); stroke: rgba(93,165,230,.4); stroke-width: 1; }

.ks-alet   { fill: #DCE8F5; }
.ks-alet-g { fill: rgba(220,232,245,.22); }
.ks-kanal  { stroke: #5DA5E6; stroke-width: 3.4; stroke-linecap: round; fill: none; }

/* --- durum: hangi katman hangi adımda görünür ----------------------------- */
.ks-k { opacity: 0; transition: opacity .34s ease, transform .44s cubic-bezier(.22,.8,.3,1); }
.ks .ks-k--hep { opacity: 1; }

.ks.is-adim-1 .ks-k--olcu   { opacity: 1; }
.ks.is-adim-2 .ks-k--punch  { opacity: 1; }
.ks.is-adim-3 .ks-k--punch  { opacity: .3; }
.ks.is-adim-3 .ks-k--kanal  { opacity: 1; }
.ks.is-adim-3 .ks-k--kalem  { opacity: 1; }
.ks.is-adim-4 .ks-k--yeni   { opacity: 1; }
.ks.is-adim-4 .ks-k--kanal  { opacity: .34; }
/* 4. adımın bedeli görünsün: incelmiş kökler geri çekilir, yerleşen greft öne çıkar */
.ks.is-adim-4 .ks-k--alici  { opacity: .34; }
.ks.is-adim-4 .ks-kok--yeni  { stroke-width: 2.4; }
.ks.is-adim-4 .ks-sogan--yeni { filter: drop-shadow(0 0 5px rgba(93,165,230,.7)); }

/* teknik ayrımı: 3. adımda safir kanal açar, DHI kalemle doğrudan girer */
.ks.is-tek-dhi     .ks-k--kanal { opacity: 0 !important; }
.ks.is-tek-safir   .ks-k--kalem { opacity: 0 !important; }
.ks.is-tek-trassiz .ks-k--kanal { opacity: 0 !important; }
.ks:not(.is-tek-trassiz) .ks-k--uzun { opacity: 0 !important; }
.ks.is-tek-trassiz .ks-k--uzun { opacity: 1; }

/* girişte alet yukarıdan iner */
.ks-k--punch, .ks-k--kalem { transform: translateY(-26px); }
.ks.is-adim-2 .ks-k--punch,
.ks.is-adim-3 .ks-k--punch,
.ks.is-adim-3 .ks-k--kalem { transform: none; }
/* yerleşen greftler sırayla belirir */
.ks-k--yeni > * { transition: opacity .3s ease; }

/* --- tablet / telefon ------------------------------------------------------ */
@media (max-width: 900px) {
  .ks__govde { grid-template-columns: minmax(0,1fr); gap: var(--b-5); }
}
@media (max-width: 680px) {
  .ks__a { padding: 12px 11px; grid-template-columns: 32px minmax(0,1fr); gap: 2px 9px; }
  .ks__a-t { font-size: var(--t-14); }
  .ks__a-m { font-size: var(--t-12); }
  .ks__lejant { padding: 10px 12px 12px; gap: 6px 14px; }
  .ks-etiket { font-size: 15px; }
}

/* ============================================================================
   Saç ekimi karşılaştırma tablosu — greft sütununun görsel kodlaması.
   (Sınıflar bu sayfaya ait olduğu için burada duruyor; 02-site.css genel kabuk.)
   Rakam yığını tek başına okunmuyordu: üst sınıra göre çubuk eklenince üç
   tekniğin kapasite farkı bakışta görülüyor. Genişlik data-oran'dan gelir.
   ========================================================================== */
.krs-g { display: block; }
.krs-c { margin-block-start: 6px; width: min(100%, 118px); margin-inline-start: auto; }
@media (max-width: 720px) { .krs-c { width: 84px; } }

/* ===== src/10-marka.css ===== */
/* ============================================================================
   HairPro — 10-marka.css · MARKA KATMANI
   Kliniğin kendi logosundan damıtılan folikül motifi ve kelime markası kilidi.
   Motif her ölçekte net olsun diye vektör; ornate logo yalnız yer bulduğu
   yerde ve olduğu gibi kullanılır (bkz. 66-marka.js başlığı).
   ========================================================================== */

/* --- folikül motifi -------------------------------------------------------- */
.mk { display: block; overflow: visible; }
.mk__kilif { fill: none; stroke: #B8C6D6; stroke-width: 2.1; stroke-linecap: round; }
.mk__tel, .mk__kok { stroke: none; }
/* tek renk varyantı: kılıf da currentColor'a döner (madde imi, etiket süsü) */
.mk--duz .mk__kilif { stroke: currentColor; opacity: .5; stroke-width: 2.6; }
/* Küçük ölçekte kılıf halkası tıkanmasın: çizgi inceltilir, boşluk büyütülür. */
.etiket-mk .mk__kilif { stroke-width: 2.8; }
.gece-alan .mk__kilif, .bolum--gece .mk__kilif, .bolum--gece2 .mk__kilif { stroke: #93C7F2; }

/* --- üst çubuk kilidi ------------------------------------------------------ */
.marka { display: flex; align-items: center; gap: 11px; flex: 0 0 auto; }
.marka__im {
  display: grid; place-items: center; width: 38px; height: 38px; flex: 0 0 auto;
  border-radius: 10px; border: 1px solid var(--gece-cizgi-2);
  background: linear-gradient(160deg, rgba(147,190,236,.14), rgba(147,190,236,.03));
  transition: border-color .18s ease, background .18s ease;
}
.marka:hover .marka__im {
  border-color: rgba(147,190,236,.42);
  background: linear-gradient(160deg, rgba(147,190,236,.22), rgba(147,190,236,.05));
}
/* Kliniğin kendi kelime markası. `screen` gerekmez — alfa kanallı. */
.marka__kelime { width: 118px; height: auto; flex: 0 0 auto; }
@media (max-width: 680px) { .marka__kelime { width: 100px; } }
.marka__ad { display: flex; flex-direction: column; line-height: 1.06; }
.marka__ad b {
  font-family: var(--f-display); font-size: var(--t-16); font-weight: 600;
  letter-spacing: .1em; display: inline-flex;
}
/* Renk ayrımı logodan: HAIR gümüş, PRO mavi. */
.marka__hair {
  background: var(--gumus); -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
}
.marka__pro { color: var(--mavi-400); }
/* text-transform YOK: lang="tr" altında tarayıcı 'i' → 'İ' çeviriyor ("CLİNİC"). */
.marka__ad span { font-size: 9px; letter-spacing: .26em; color: var(--gece-metin-3); text-transform: none; }

/* --- kliniğin kendi logosu ------------------------------------------------- */
/* `screen`: kaynağın zemini #050A12; koyu her yüzeyde dikişsiz oturur. */
.marka-kilit, .marka-mono { mix-blend-mode: screen; height: auto; }
.marka-kilit { width: min(300px, 72vw); }
.marka-mono  { width: min(132px, 34vw); }
.marka-kilit--sm { width: min(212px, 60vw); }

/* --- etiket süsü: bölüm etiketlerinin başındaki çizgi yerine folikül ------- */
.etiket-mk { display: inline-flex; align-items: center; gap: 9px; }
.etiket-mk .mk { flex: 0 0 auto; opacity: .95; }

@media (max-width: 680px) {
  .marka__im { width: 34px; height: 34px; border-radius: 9px; }
  .marka__im .mk { width: 18px; height: 26px; }
}

/* ===== src/11-sozluk.css ===== */
/* ============================================================================
   HairPro — 11-sozluk.css · TERİM SÖZLÜĞÜ

   Sorun: "greft" sayfada seksen küsur kez geçiyor, bir kez tanımlanmıyordu.
   Terim kümesinin (greft · donör alanı · Norwood · DHI · safir FUE · traşsız ·
   PRP · mezoterapi · şok dökülme · folikül · greft/cm²) tamamı aynı dertte.

   Üç katman:
     1) .sz          metnin İÇİNDE, okuma akışını bozmayan işaret
     2) .sz-balon    dokununca açılan kısa tanım (telefonda alt sayfa)
     3) .sz-liste    #/blog altındaki tam sözlük (mevcut .sss kalıbını kullanır)

   ⚠ TASARIM KARARI — işaret neden link gibi görünmüyor:
   Terimler gövde metninin içinde. Mavi link rengi verilseydi bir paragrafta
   dört ayrı mavi kelime olurdu; göz cümleyi değil işaretleri okur. Bu yüzden
   işaret RENK DEĞİŞTİRMEZ: yalnız altına 1px kesikli mavi çizgi düşer.
   Çizgi `text-decoration` ile çizilir, `border-bottom` ile değil — satır
   sonunda kelime bölününce kenarlık kutuyu ikiye ayırıp çirkin uç bırakıyor,
   alt çizgi ise harflerin altını doğru takip ediyor (ölçüldü, 390px'te).
   ========================================================================== */

/* --- 1. metin içi işaret --------------------------------------------------- */
.sz {
  display: inline;                 /* button varsayılanı inline-block: sarmalanmaz */
  font: inherit; color: inherit; background: none;
  padding: 0; border: 0; margin: 0; text-align: inherit;
  cursor: help;
  -webkit-appearance: none; appearance: none;
  text-decoration: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 1px;
  text-decoration-color: rgba(44, 127, 208, .55);
  text-underline-offset: .22em;
  border-radius: 2px;
  transition: text-decoration-color .15s ease, background-color .15s ease;
}
.sz:hover,
.sz[aria-expanded="true"] {
  text-decoration-style: solid;
  text-decoration-color: var(--mavi-500);
  background: rgba(44, 127, 208, .10);
}

/* Gece zeminlerde aynı mavi yeterince parlamıyor; bir kademe açılır. */
.gece-alan .sz, .bolum--gece .sz, .bolum--gece2 .sz,
.sahne .sz, .altbilgi .sz {
  text-decoration-color: rgba(93, 165, 230, .58);
}
.gece-alan .sz:hover, .gece-alan .sz[aria-expanded="true"],
.bolum--gece .sz:hover, .bolum--gece .sz[aria-expanded="true"],
.bolum--gece2 .sz:hover, .bolum--gece2 .sz[aria-expanded="true"] {
  text-decoration-color: var(--mavi-400);
  background: rgba(93, 165, 230, .14);
}

/* Okuma-akışı korunsun: başlık ölçeğinde kesik çizgi kalın görünüyor. */
.d1 .sz, .d2 .sz, .d3 .sz, .b1 .sz, .b2 .sz, .b3 .sz {
  text-decoration-thickness: 1px; text-underline-offset: .16em;
}

/* --- 2. balon / alt sayfa --------------------------------------------------- */
.sz-kat { position: fixed; inset: 0; z-index: 90; display: none; }
.sz-kat.is-acik { display: block; }

/* Perde YALNIZ telefonda görünür: masaüstünde balon sayfayı karartmaz,
   çünkü kullanıcı balonu okurken çevresindeki cümleyi de görmeli. */
.sz-perde { position: absolute; inset: 0; background: rgba(4, 9, 16, .58); opacity: 0; pointer-events: none; }

.sz-balon {
  position: absolute;
  left: var(--sz-x, 0px); top: var(--sz-y, 0px);
  width: min(330px, calc(100vw - 28px));
  display: flex; flex-direction: column; gap: 8px;
  padding: 14px 16px 15px;
  background: var(--gece-900); color: var(--gece-metin);
  border: 1px solid var(--gece-cizgi-2); border-radius: var(--r-3);
  box-shadow: 0 28px 64px -26px rgba(4, 9, 16, .9);
  pointer-events: auto;
  animation: szGir .16s ease-out;
}
@keyframes szGir { from { opacity: 0; transform: translateY(-4px); } }

/* Ok: 45° döndürülmüş kare — iki kenarı balonun kenarlığıyla aynı. */
.sz-balon::before {
  content: ''; position: absolute; width: 10px; height: 10px;
  left: var(--sz-ok, 24px); top: -6px;
  background: var(--gece-900);
  border-inline-start: 1px solid var(--gece-cizgi-2);
  border-block-start: 1px solid var(--gece-cizgi-2);
  transform: rotate(45deg);
}
.sz-balon--ust::before { top: auto; bottom: -6px; transform: rotate(225deg); }

.sz-balon__tut { display: none; width: 42px; height: 4px; border-radius: var(--r-tam); background: var(--gece-cizgi-2); margin: 2px auto 6px; }

.sz-balon__bas { display: flex; align-items: center; gap: 9px; }
.sz-balon__im { flex: 0 0 auto; color: var(--mavi-400); }
.sz-balon__ad { flex: 1 1 auto; font-size: var(--t-16); font-weight: 600; line-height: 1.3; }
.sz-balon__kapat { flex: 0 0 auto; color: var(--gece-metin-3); }
.sz-balon__kapat:hover { background: rgba(147, 190, 236, .12); color: var(--gece-metin); }

.sz-balon__tanim { font-size: var(--t-14); line-height: 1.58; color: var(--gece-metin-2); }

.sz-balon__olcu {
  display: flex; flex-direction: column; gap: 3px;
  padding-top: 8px; border-top: 1px solid var(--gece-cizgi);
}
.sz-balon__et { font-size: var(--t-11); letter-spacing: .12em; text-transform: uppercase; color: var(--gece-metin-3); }
.sz-balon__deger { font-family: var(--f-veri); font-size: var(--t-12); line-height: 1.5; color: var(--mavi-300); }
/* JetBrains Mono'da Arapça yok: RTL'de arayüz yazı tipine düşer. */
[dir="rtl"] .sz-balon__deger { font-family: var(--f-ar); font-size: var(--t-13); }

.sz-balon__daha {
  display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
  font-size: var(--t-12); color: var(--mavi-300);
  text-decoration: underline; text-decoration-color: rgba(147, 199, 242, .4); text-underline-offset: .2em;
}
.sz-balon__daha:hover { color: var(--mavi-400); text-decoration-color: currentColor; }

/* --- 3. telefonda balon değil ALT SAYFA -------------------------------------
   390px'te 330px'lik bir balon ekranın neredeyse tamamını kaplıyor ve
   parmağın altında kalıyor; ayrıca dokunmatikte "yanına konumlanma"nın
   anlamı yok. Aynı içerik alttan gelen bir sayfa olarak açılır. */
@media (max-width: 640px) {
  .sz-kat.is-acik .sz-perde { opacity: 1; pointer-events: auto; }
  .sz-balon {
    left: 0; right: 0; top: auto; bottom: 0;
    width: auto; max-height: 72vh; overflow-y: auto;
    gap: 10px;
    padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    border-radius: var(--r-3) var(--r-3) 0 0;
    border-inline: 0; border-block-end: 0;
    box-shadow: 0 -20px 60px -18px rgba(4, 9, 16, .9);
    animation: szKalk .22s cubic-bezier(.22, .8, .3, 1);
  }
  .sz-balon::before { display: none; }
  .sz-balon--ust::before { display: none; }
  .sz-balon__tut { display: block; }
  .sz-balon__ad { font-size: var(--t-18); }
  .sz-balon__tanim { font-size: var(--t-15); }
}
@keyframes szKalk { from { transform: translateY(100%); } }

/* --- 4. tam sözlük listesi (#/blog) ----------------------------------------
   Kendi akordiyonunu KURMAZ: sayfadaki .sss kalıbını ve onun açma eylemini
   aynen kullanır — iki farklı ac-kapa davranışı öğrenilecek şey olurdu. */
.sz-liste .sss__s { font-size: var(--t-16); padding-block: 16px; }
/* ⚠ [hidden] KAZANMALI: `display:flex` yazıp geçilirse akordiyonun kapalı
   gövdesi görünür kalır (ölçüldü — on iki terim birden açıktı). */
.sz-liste .sss__c:not([hidden]) { display: flex; flex-direction: column; gap: 10px; }
.sz-liste .sss__s { font-weight: 500; }
.sz-olcu {
  display: flex; flex-direction: column; gap: 2px;
  padding: 9px 12px; border-radius: var(--r-2);
  background: var(--kagit-100); border: 1px solid var(--kagit-cizgi);
}
.sz-olcu__et { font-size: var(--t-11); letter-spacing: .12em; text-transform: uppercase; color: var(--kagit-metin-3); }
.sz-olcu__deger { font-family: var(--f-veri); font-size: var(--t-12); line-height: 1.5; color: var(--mavi-600); }
[dir="rtl"] .sz-olcu__deger { font-family: var(--f-ar); font-size: var(--t-13); }

</style>

window.HP = window.HP || {};

window.HP = window.HP || {};

    if (typeof HP.esc === 'function') { try { return HP.esc(String(s == null ? '' : s)); } catch (e) { /* devam */ } }

    return '<svg viewBox="0 0 ' + w + ' ' + h + '"' + (fixedW ? ' width="' + w + '" height="' + h + '"' : ' width="100%"') +
      ' preserveAspectRatio="xMidYMid meet" class="' + st + ' ' + (cls || '') + '"' +

      '@keyframes hpDash{from{stroke-dashoffset:var(--hpFrom,600)}to{stroke-dashoffset:var(--hpTo,0)}}' +
      '@keyframes hpRise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}' +
      '.hp-anim-dash{animation:hpDash .95s cubic-bezier(.22,.75,.28,1) both}' +
      '.hp-anim-rise{animation:hpRise .55s ease-out both}' +

  function smooth(pts, tension, top, bot) {

      var c2x = p2[0] - (p3[0] - p1[0]) * t, c2y = p2[1] - (p3[1] - p1[1]) * t;

      if (top !== undefined) { c1y = clamp(c1y, top, bot); c2y = clamp(c2y, top, bot); }
      d += 'C' + r2(c1x) + ',' + r2(c1y) + ' ' + r2(c2x) + ',' + r2(c2y) + ' ' + r2(p2[0]) + ',' + r2(p2[1]);
    }
    return d;
  }

  /* Üst köşeleri yuvarlatılmış bar path'i (dikey/yatay) */
  function barPath(x, y, w, h, rad, horizontal) {

      if (i % every !== 0 && i !== labels.length - 1) continue;
      out += '<text x="' + r2(x0 + step * i) + '" y="' + r2(y) + '" text-anchor="middle" font-size="10"' +
        ' font-family="var(--f-sans)" fill="currentColor" fill-opacity=".55">' + esc(labels[i]) + '</text>';
    }
    return out;
  }

  /* ========================================================================
     1) ÇİZGİ GRAFİK — yumuşatılmış eğri + alan dolgusu + ızgara + son nokta
     ======================================================================== */
  C.line = function (o) {
    o = o || {};
    var series = o.series || [], labels = o.labels || [];
    var W = o.width || 720, H = o.height || 220;
    var pad = { t: 16, r: 16, b: 26, l: o.padLeft || 58 };
    var x0 = pad.l, x1 = W - pad.r, top = pad.t, bot = H - pad.b;
    var fmt = o.yFormat || fmtShort;
    var n = 0, i, j, s;
    for (i = 0; i < series.length; i++) n = Math.max(n, (series[i].points || []).length);
    if (!series.length || !n) return C.empty(W, H, o.emptyText);

    var maxV = -Infinity, minV = Infinity;
    for (i = 0; i < series.length; i++) {
      for (j = 0; j < (series[i].points || []).length; j++) {
        var v = Number(series[i].points[j]) || 0;
        if (v > maxV) maxV = v; if (v < minV) minV = v;
      }
    }
    var lo = (o.min !== undefined) ? o.min : (minV >= 0 ? 0 : minV - (maxV - minV) * .12);

    var ticks = o.ticks || 4;
    var step = n > 1 ? (x1 - x0) / (n - 1) : 0;
    var Y = function (v) { return bot - (bot - top) * ((v - lo) / (hi - lo)); };

    var out = svgOpen(W, H, 'hp-chart hp-chart-line', o.aria || 'çizgi grafik') + animCSS();
    out += gridBlock(x0, x1, top, bot, lo, hi, ticks, fmt);
    out += xLabels(labels, x0, step, H - 7);

    var dots = '', tips = '';

      return Number(d.value) || 0;

      band = (bot - top) / data.length; bw = Math.min(o.barSize || 18, band * .62);
      out = svgOpen(W, H, 'hp-chart hp-chart-bar', o.aria || 'yatay bar grafik') + animCSS();
      for (i = 0; i < data.length; i++) {
        var yy = top + band * i + (band - bw) / 2, wpx = (x1 - x0) * (totals[i] / maxV);
        out += '<text x="' + (labW - 10) + '" y="' + r2(yy + bw / 2 + 3.5) + '" text-anchor="end" font-size="11.5"' +
          ' font-family="var(--f-sans)" fill="currentColor" fill-opacity=".78">' + esc(data[i].label) + '</text>';
        out += '<rect x="' + x0 + '" y="' + r2(yy) + '" width="' + r2(x1 - x0) + '" height="' + r2(bw) +

    }

  };

  /* ========================================================================

  C.donut = function (o) {
    o = o || {};

    var out = svgOpen(size, size, 'hp-chart hp-chart-donut', o.aria || 'halka grafik') + animCSS();

/* ============================================================================
   HairPro — 13-data.js · site içeriği
   Kural: klinik adına DOĞRULANMAMIŞ iddia üretilmez. Sayılar nötr ve
   kliniğin kendi paylaşımlarıyla uyumludur; sertifika duvarı yoktur.

   ÜÇ DİL: bu dosyadaki metin taşıyan diziler (BLOG, VAKA.teknik, FIYAT.greft,
   ULKE_FIYAT.deger) görünüm dosyalarında ÇEVİRİDEN GEÇMEDEN basılıyor
   (20-site-d.js `esc(b.bas)`, 20-site-a.js:141 `esc(v.teknik)`,
   20-site-c.js:773 `esc(f.greft)`, 20-site-a.js:165 `esc(u.deger)`).
   Bu yüzden EN/AR ekranlarında Türkçe metin ve Türkçe binlik ayracı görünüyordu
   (ölçüldü: EN fiyat sayfasında aynı sayı bir kutuda "€2,150", tablonun bir
   satır altında "€2.150"). Çözüm: diziler artık HP.lang'e göre ÜRETİLİYOR;
   çağıran hiçbir dosya değişmedi.

   Kimlik kuralı: üretilen dizi dile göre ÖNBELLEKLENİR. 20-site-d.js
   `HP.BLOG.indexOf(b)` yapıyor; her erişimde yeni dizi dönseydi -1 gelirdi.
   ========================================================================== */
window.HP = window.HP || {};
(function (HP) {
  'use strict';

  var DILLER = ['tr', 'en', 'ar'];
  function dil() {
    return DILLER.indexOf(HP.lang) >= 0 ? HP.lang : 'tr';
  }
  /* HP.num 40-app.js'te tanımlı ve bu dosyadan SONRA yükleniyor; erişim
     çizim anında olduğu için sorun yok, yine de savunmalı dal duruyor. */
  function n(v) { return HP.num ? HP.num(v) : String(v); }

  /* Dile göre üretilen, dile göre önbelleklenen salt-okunur özellik. */
  function dilli(ad, uret) {
    var kova = {};
    Object.defineProperty(HP, ad, {
      configurable: true, enumerable: true,
      get: function () {
        var d = dil();
        if (!kova[d]) kova[d] = uret(d);
        return kova[d];
      }
    });
  }

  /* --- Norwood evreleri ve greft aralıkları -----------------------------
     ⚠ Bu aralıklar 60-harita.js'in ÖN AYARLARIYLA aynı sayıyı vermek
     ZORUNDA: ziyaretçi haritada "2.620–3.080" görüp formu doldurduğunda
     panelde 2.000 greftlik bir kayıt açılıyordu (ölçüldü). Değerler
     haritanın kendi modelinden türetildi:
       GREFT = seçili bölgelerin alanı (cm²) × varsayılan yoğunluk (30/cm²),
       ±%8 ölçüm bandı, ON_AYAR evre eşleşmesiyle:
         evre 2 → z1                       34,0 cm² →   940–1.100
         evre 3 → z1+z4+z5                 95,0 cm² → 2.620–3.080
         evre 4 → +z3                     138,4 cm² → 3.820–4.490
         evre 5 → +z2                     204,8 cm² → 5.650–6.640
         evre 6 → +z6                     246,0 cm² → 6.790–7.970
     50 katına yuvarlandı (HP.hesapla zaten 50'ye yuvarlıyor).
