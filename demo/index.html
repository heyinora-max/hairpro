nted is the same root, and how it takes does not depend on the name of the method. What no-shave offers is the chance to have the same work done without paying a visibility cost. In exchange you accept fewer grafts per session and a longer day in the chair. That trade does not make sense for everyone.","The decision is made together at the examination. What we look at is fixed: donor density, current hair length, the size of the area to be covered, and how much visibility matters to you. If those four point the same way, no-shave suits. If they do not, we would rather explain why a method does not fit you than recommend it anyway; in the end what gets judged is not the name of the method but the picture a year later.","The practicalities of the day enter the decision too. Seven to nine hours pass with short breaks and one meal. In no-shave work the donor area is opened in small sections, so position changes come a little more often. For a patient travelling in, this means planning a same-day flight is difficult; the first wash appointment is set for the morning after the operation and the return is usually planned from that day on.","Let us also be clear about what no-shave does not change. The lifetime capacity of the donor area is the same; the planning floor of six thousand grafts applies to this method as well. Shock loss still happens between weeks two and four. The final assessment is still made between months twelve and eighteen. The method changes only how the root is harvested from the donor area; it changes neither the root\u2019s behaviour, nor the healing calendar, nor the limits of the plan.","A note on pricing: at the same graft count the no-shave method takes longer and asks for more team time. Prices are not published in the Turkish edition, as the regulation requires, but knowing that the time and labour differ helps you set the right expectation. The quote you receive in consultation rests on the planned graft count and the time that plan needs, not on the name of the method."]},{slug:"ilk-30-gun",kat:"Aftercare",tarih:"2026-06-12",bas:"The first 30 days after surgery",ozet:"Crusting, shock loss and waiting. The first month shows you healing, not the result.",govde:["Framing the first month correctly is the easiest way to get through the following year calmly: this month shows you healing, not the result. What you see in the mirror on day thirty tells you very little about what you will see in month twelve. The month matters all the same, because this is when the roots settle and when the risk of infection is highest. The rules are simple and few.","Swelling and tenderness are expected in the first three days. The oedema usually starts at the forehead and travels down around the eyes with gravity; it peaks on the second and third day, then recedes on its own. Keeping the head raised helps in this period: sleeping on your back with the head supported by a pillow makes the swelling disperse faster. Nothing should touch the recipient area; a travel pillow is usually enough to keep it clear of the bedding.","The first wash is done at the clinic, the day after the operation. Having staff do it is not a formality: the pressure of the wash, how long the foam is left on and how to rinse are all demonstrated and taught. Daily washing begins the same day with the products sent home with you. Washing is nothing to fear; on the contrary, regular washing is what lets the crusts come away on time and without trauma.","Crusts form from the fourth day and come away by about the tenth. They are thin layers formed as blood and tissue fluid dry. They must not be picked off; a crust pulled away can dislodge the graft next to it. With regular washing the crusts soften and fall on their own. By the end of the tenth day the recipient area is visibly clear in most people.","The donor area usually heals faster than the recipient area. A mild tightness and tingling in the first days is normal; redness recedes within one to two weeks. In shaved operations the dots at the nape disappear as the hair grows back. Itching is common in this area and is a normal part of healing; the right response is moisturising and the products your doctor recommends, not scratching.","Between weeks two and four most of the transplanted hairs shed. This is called shock loss and it is normal. What sheds is the hair shaft, not the root; the root stays where it is and goes into a resting phase before starting a new cycle. This period is the psychologically hardest part of the process: an area that looked good in the first week returns to its starting state by the end of week three. It is not a sign of failure but an expected stage.","What to avoid through the first month is a short list. Direct sun, entirely for the first two weeks; after that prefer shade over a hat. Sweaty sport, sauna, hammam and swimming pools are out for the whole month, and so is the sea. Tight hats and helmets press on the recipient area and are not worn for the first ten days. Smoking and alcohol are known to affect circulation; cutting down in the first week, and stopping if you can, is advised.","Going back to work depends on the work. A desk job is possible for most people from the third day; while the crusting lasts, visibility is the only obstacle. People doing physical work do better to wait out the first ten days, because of sweat and dust. Light walking can start on day one. Weight training and running are resumed gradually after the fourth week.","After day thirty the calendar slows down. The first new growth appears in month three; those hairs start out fine and colourless and thicken over time. By month six a visible density has formed and people around you begin to notice. By month nine the hair matches its surroundings in length and texture. The final assessment is made between months twelve and eighteen; the crown is usually the last area to give its result.","The follow-up programme is built on that calendar. Clinically, checks are made at week one, month one, month three, month six and month twelve. Each check is recorded with photographs taken from the same angles; a comparison only means something under the same light and the same angle. If you have a question in between, you do not need to wait for a check-up day. When you write, a reply comes back the same day, and if it is needed the doctor will want to see you again.","Sleep, food and medication in the first days are part of the result too. The painkiller and anti-oedema medicine your doctor prescribes are used exactly as described; adding blood-thinning medicines on your own is not right. Drinking plenty of water helps the swelling clear. The first night\u2019s sleep is broken for most people, and that is expected. A clean pillowcase, changed daily, is a simple measure that works.","Know when to call the clinic, too. Pain that increases after the third day, redness and heat gathering at one point, discharge, a fever above thirty-eight degrees or unexpected bleeding at the donor area should be reported without delay. These are not common, but they are easy to resolve when reported early. Do not wait for the check-up day; write, and the reply comes the same day.","Keeping your own record of this month is useful. Take photographs right after the operation, on day seven, on day thirty and then monthly, from the same five angles: front, top, both profiles and the nape. Keep the light the same each time, daylight if possible. Those frames earn their keep during the shock loss weeks; when you look back in month three, you ask the record what changed rather than your memory."]},{slug:"dhi-safir",kat:"Technique",tarih:"2026-05-26",bas:"DHI versus sapphire FUE",ozet:"Both belong to the FUE family. The difference is in how the root is placed.",govde:["Both methods belong to the FUE family and their first halves are identical. The difference lies in how the root is placed into the scalp. Knowing that distinction is useful, because marketing language describes the two as if they were entirely different operations. They are not. The same graft is taken from the same donor area with the same micromotor; the divergence starts at the last step, and that step has its own advantages and costs.","The shared half runs like this. The donor area is numbed with local anaesthesia. Roots are extracted one by one with cylindrical punches under a millimetre across. The extracted grafts are sorted under magnification, grouped by how many hairs they carry, and held in a cold storage solution. That grouping matters: single-hair grafts go to the front hairline, multi-hair grafts to the regions where volume is built behind it. Much of what reads as natural comes from that sorting.","In sapphire FUE there is a channel-opening step before placement. Fine incisions are made in the recipient area with sapphire-tipped blades. The angle, direction and depth of those incisions decide how the hair will emerge; at the front line the angle is kept very close to the surface, while at the crown a placement that follows the natural whorl is sought. Once the channels are open, grafts are placed into them with forceps.","The sapphire tip is a material difference, not a brand. Compared with steel it is sharper and leaves a smoother cut. In practice that means somewhat less tissue trauma and, with it, somewhat less crusting. It is not on its own what determines the quality of the result; the angle and spacing of the channels matter far more. Accounts that present the tip material as the whole story are worth treating with caution.","In DHI the channel and the placement happen in one step. A graft is loaded into the tip of an implanter pen, known as a Choi pen; the pen enters the skin and releases the root in the same movement. Because there is no separate channel-opening stage, the time roots spend outside the body is shorter. The tip is chosen to match the diameter of the graft, so each graft settles into a socket of its own size. That reduces bleeding and oedema somewhat.","Where DHI stands out is in cases that call for planting between existing hair. Opening channels with a blade in a thinned but not fully open region carries a risk of damaging the healthy roots in between. The pen works with a more controlled movement and lowers that risk. For the same reason DHI may be preferred in small areas where high density is the target, and in the first rows of the front hairline.","Where sapphire FUE stands out is over wide areas. Opening the channels all at once speeds up the team\u2019s work and makes it easier to finish a large area in a single day. In numbers: a sapphire plan of three thousand grafts takes about six hours, and one of five thousand about nine. On the DHI side, a plan of two thousand grafts takes about six hours and one of three thousand five hundred about eight.","Those numbers do not show a race between the two methods; they show that the graft bands they cover are different. In the technique comparison on this site, the typical band for DHI is two thousand to three thousand five hundred grafts and for sapphire FUE three thousand to five thousand. In other words the choice of method is usually decided by the size of the area to be covered: the patient does not pick a method, the plan brings one forward.","On healing the two are close. Crusting comes away between days four and ten with both. Because DHI makes smaller wounds the crusts can be a little thinner. Shock loss happens between weeks two and four with both methods, and with both the final assessment is made between months twelve and eighteen. The method does not change the calendar.","The decision rests on three things: the size of the area to be covered, whether there is existing hair in it, and donor capacity. Once those three have been weighed, which method fits usually emerges by itself. Sometimes both are used together: the front line with the pen, the region behind it with channels. If you are told one method is superior to another, it is fair to ask by which measure.","What really decides the outcome sits under a heading most marketing leaves out: graft survival. What governs it is not the name of the method but the time the root spends outside the body, the temperature of the storage solution, how hard the graft is squeezed with forceps, the blood supply of the recipient area and the experience of the team. Applied properly, both methods give comparable results; applied badly, both fail equally. The difference shows up in who is doing the work.","Compound names circulate in the market as well: descriptions of pen placement into channels opened with a sapphire tip, or method names with an adjective attached. Some of these describe a real difference in practice; others are only naming. The practical way to tell is to ask which step the thing described actually changes. If the answer does not describe the opening of the channel, the waiting time of the graft or the angle of placement, there is no technical difference in front of you.","There are also three details that decide how natural the result looks, independent of method. First, drawing the front hairline slightly irregular rather than straight; in nature a hairline never looks ruled. Second, putting only single-hair grafts in the first rows. Third, matching the angle to the hair\u2019s own direction of growth. Get those three right and the name of the method becomes invisible; get them wrong and no method rescues it."]},{slug:"donor",kat:"Planning",tarih:"2026-05-08",bas:"Why is the donor area limited?",ozet:"Roots at the nape and temples resist shedding. Their number, however, is fixed.",govde:["The roots used in a hair transplant are taken from the nape and from both temples. That region is called the donor area and corresponds to a horseshoe-shaped band. The choice is not arbitrary: the roots there resist hormonal shedding. They are insensitive to the hormonal effect that causes hair loss in male pattern baldness, and they keep that property wherever they are planted. That is the basic reason a hair transplant works at all.","The resistance comes from the root itself, not from where it sits. A root taken from the nape and planted at the crown does not shed once it is in the crown\u2019s hormonal environment; it carries its property with it. This long-established principle is what the whole logic of hair transplantation rests on. The reverse is equally true: a root taken from a region prone to shedding will carry on shedding wherever it is planted. That is why the boundaries of the donor area are drawn carefully.","Capacity is fixed. A person has a certain number of roots in the donor area and that number cannot be increased. The total grafts that can be taken is the number of roots there multiplied by how much thinning that area can tolerate. Planning takes six thousand grafts as the floor for what can safely be taken over a lifetime. Published ranges quote higher upper limits; the floor is used because the cost of over-promising cannot be undone.","What does over-harvesting look like? The donor region looks normal while the remaining hair is long, but the skin beneath shows once the hair is cut short. There is no way back from that picture; a harvested root is not replaced. More importantly, over-harvesting removes the possibility of a future operation. If someone spends most of his donor at thirty, he has no resource left for advancing loss at forty-five.","Capacity is measured at the examination. The number of roots per square centimetre in the donor area is counted, and that value varies noticeably between people. From someone with a dense donor, more grafts can be taken from the same area. Alongside the count, hair calibre is assessed: on someone with thick hair fewer grafts give more coverage, so the same result is reached with less resource. Those two measurements give the real upper limit of the plan.","There is a per-operation limit as well. Planning takes four thousand five hundred grafts as the safe ceiling for a single session. That limit is about donor recovery: extracting a large number of roots in a short time strains the blood supply and healing of the region. Larger plans are split into two sessions, usually with at least twelve months in between. The waiting period is not a formality; it is the donor area\u2019s healing calendar.","A good plan covers today\u2019s opening while leaving something for tomorrow. A transplant does not stop the native hair from shedding; the planted roots are permanent, but the natural hair between them follows its own course. That is why age is taken into account when the hairline is designed, and why the crown is often left deliberately for later. Spending the whole donor at once on someone in his twenties is a decision that looks good in the short term and leaves no options in the long one.","The order of priority grows out of the same constraint. The front hairline usually comes first, because it frames the face and it is the first place you look in a mirror. The crown is a wide area and costs a lot of grafts to cover; in daily life it is noticed less. Investing a limited resource in the region that shows most is the right call for most people. It is not a rule but a preference decided together.","Beard and body hair are considered as auxiliary sources in some cases. The texture of those roots differs from scalp hair; they are usually thicker and more curled. For that reason they are not used at the front hairline but in regions where volume is needed behind it. An auxiliary source does not replace an exhausted donor; it only adds a margin to some plans. Whether it is suitable is judged at the examination, by looking at the texture and density of the hair.","What you can do to protect the donor is simple. Continuing the medical treatment your doctor recommends against shedding helps preserve the native hair and postpones the need for donor. Annual checks keep both the transplanted region and the donor area on record. The decision about a next operation is made by looking at those records. Knowing that your resource is limited is the first step to using it well.","A word on scarring. Because the roots are extracted one by one with sub-millimetre punches, no blade line is left in the donor area; what remains is a large number of dot-shaped marks. Those dots become invisible as the hair grows. With very short hair, a number one clip for instance, someone looking closely can see the difference. The more evenly the harvest is distributed, the less the dots show; this is the visible part of the surgical plan.","Allowing from the outset for the possibility of more than one operation is the most effective way to protect the donor. A second operation is most often for advancing loss; a third is rarely needed. After each operation the density of the donor area drops somewhat and the margin left for the next one shrinks. That is why how many grafts are used in the first plan directly sets the options available ten years later. The decision is made looking at a whole calendar, not at today\u2019s mirror."]}],ar:[{slug:"kac-greft",kat:"\u0627\u0644\u062A\u062E\u0637\u064A\u0637",tarih:"2026-07-28",bas:"\u0643\u0645 \u0628\u0635\u064A\u0644\u0629 \u0623\u062D\u062A\u0627\u062C\u061F",ozet:"\u062B\u0644\u0627\u062B\u0629 \u0639\u0648\u0627\u0645\u0644 \u062A\u062D\u062F\u0651\u062F \u0639\u062F\u062F \u0627\u0644\u0628\u0635\u064A\u0644\u0627\u062A: \u0645\u0631\u062D\u0644\u0629 \u0627\u0644\u062A\u0633\u0627\u0642\u0637\u060C \u0648\u0627\u0644\u0645\u0633\u0627\u062D\u0629 \u0627\u0644\u0645\u0631\u0627\u062F \u062A\u063A\u0637\u064A\u062A\u0647\u0627\u060C \u0648\u0643\u062B\u0627\u0641\u0629 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0627\u0646\u062D\u0629.",govde:["\u0639\u062F\u062F \u0627\u0644\u0628\u0635\u064A\u0644\u0627\u062A \u0644\u064A\u0633 \u062E\u064A\u0627\u0631\u064B\u0627 \u0634\u062E\u0635\u064A\u064B\u0627 \u0628\u0644 \u0646\u062A\u064A\u062C\u0629 \u0642\u064A\u0627\u0633. \u062A\u062D\u062F\u0651\u062F\u0647 \u062B\u0644\u0627\u062B\u0629 \u0639\u0648\u0627\u0645\u0644: \u0627\u0644\u0645\u0631\u062D\u0644\u0629 \u0627\u0644\u062A\u064A \u0628\u0644\u063A\u0647\u0627 \u0627\u0644\u062A\u0633\u0627\u0642\u0637\u060C \u0648\u0645\u0633\u0627\u062D\u0629 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0631\u0627\u062F \u062A\u063A\u0637\u064A\u062A\u0647\u0627 \u0628\u0627\u0644\u0633\u0646\u062A\u064A\u0645\u062A\u0631 \u0627\u0644\u0645\u0631\u0628\u0651\u0639\u060C \u0648\u0643\u062B\u0627\u0641\u0629 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0627\u0646\u062D\u0629 \u0641\u064A \u0645\u0624\u062E\u0631\u0629 \u0627\u0644\u0631\u0623\u0633. \u0648\u0623\u064A \u0631\u0642\u0645 \u064A\u064F\u0630\u0643\u0631 \u0642\u0628\u0644 \u0642\u064A\u0627\u0633 \u0647\u0630\u0647 \u0627\u0644\u062B\u0644\u0627\u062B\u0629 \u0625\u0646\u0645\u0627 \u0647\u0648 \u062A\u062E\u0645\u064A\u0646. \u0648\u0644\u0647\u0630\u0627 \u064A\u0633\u062A\u062D\u0642 \u0627\u0644\u0631\u0642\u0645 \u0627\u0644\u0642\u0627\u0637\u0639 \u0627\u0644\u0630\u064A \u064A\u064F\u0639\u0637\u0649 \u0639\u0628\u0631 \u0627\u0644\u0647\u0627\u062A\u0641 \u0645\u0646 \u0635\u0648\u0631\u0629 \u0648\u0627\u062D\u062F\u0629 \u0634\u064A\u0626\u064B\u0627 \u0645\u0646 \u0627\u0644\u062D\u0630\u0631: \u0641\u0627\u0644\u0635\u0648\u0631\u0629 \u062A\u064F\u0638\u0647\u0631 \u0627\u0644\u0645\u0633\u0627\u062D\u0629 \u0627\u0644\u0645\u0643\u0634\u0648\u0641\u0629 \u0648\u0644\u0627 \u062A\u064F\u0638\u0647\u0631 \u0633\u0639\u0629 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0627\u0646\u062D\u0629.","\u0644\u0646\u0636\u0628\u0637 \u0627\u0644\u0645\u0635\u0637\u0644\u062D \u0623\u0648\u0644\u064B\u0627. \u0627\u0644\u0628\u0635\u064A\u0644\u0629 \u062D\u0632\u0645\u0629 \u0635\u063A\u064A\u0631\u0629 \u0645\u0646 \u0627\u0644\u062C\u0630\u0648\u0631 \u062A\u064F\u0624\u062E\u0630 \u0643\u0627\u0645\u0644\u0629 \u0645\u0646 \u0641\u0631\u0648\u0629 \u0627\u0644\u0631\u0623\u0633\u060C \u0648\u062A\u062D\u0645\u0644 \u0634\u0639\u0631\u062A\u064A\u0646 \u0641\u064A \u0627\u0644\u0645\u062A\u0648\u0633\u0637. \u0641\u062B\u0644\u0627\u062B\u0629 \u0622\u0644\u0627\u0641 \u0628\u0635\u064A\u0644\u0629 \u062A\u0639\u0646\u064A \u0646\u062D\u0648 \u0633\u062A\u0629 \u0622\u0644\u0627\u0641 \u0634\u0639\u0631\u0629. \u0648\u062A\u062A\u062D\u062F\u0651\u062B \u0627\u0644\u0639\u064A\u0627\u062F\u0627\u062A \u0628\u0644\u063A\u0629 \u0627\u0644\u0628\u0635\u064A\u0644\u0627\u062A \u0644\u0623\u0646 \u0627\u0644\u0648\u062D\u062F\u0629 \u0627\u0644\u0645\u0632\u0631\u0648\u0639\u0629 \u0647\u064A \u0627\u0644\u062C\u0630\u0631 \u0644\u0627 \u0627\u0644\u0634\u0639\u0631\u0629. \u0648\u064A\u062A\u0631\u0627\u0648\u062D \u0639\u062F\u062F \u0627\u0644\u0634\u0639\u0631\u0627\u062A \u0641\u064A \u0627\u0644\u0628\u0635\u064A\u0644\u0629 \u0627\u0644\u0648\u0627\u062D\u062F\u0629 \u0628\u064A\u0646 \u0648\u0627\u062D\u062F\u0629 \u0648\u0623\u0631\u0628\u0639 \u0645\u0646 \u0634\u062E\u0635 \u0625\u0644\u0649 \u0622\u062E\u0631\u060C \u0648\u0647\u0630\u0627 \u0623\u062D\u062F \u0623\u0633\u0628\u0627\u0628 \u0638\u0647\u0648\u0631 \u0627\u0644\u0639\u062F\u062F \u0646\u0641\u0633\u0647 \u0623\u0643\u062B\u0631 \u0627\u0645\u062A\u0644\u0627\u0621\u064B \u0639\u0646\u062F \u0634\u062E\u0635 \u0645\u0646\u0647 \u0639\u0646\u062F \u0622\u062E\u0631.","\u0627\u0644\u0642\u064A\u0627\u0633 \u0627\u0644\u062B\u0627\u0646\u064A \u0647\u0648 \u0627\u0644\u0645\u0633\u0627\u062D\u0629. \u062A\u064F\u0642\u0627\u0633 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0643\u0634\u0648\u0641\u0629 \u0628\u0627\u0644\u0633\u0646\u062A\u064A\u0645\u062A\u0631 \u0627\u0644\u0645\u0631\u0628\u0651\u0639\u060C \u0648\u0647\u0630\u0627 \u0628\u0627\u0644\u0636\u0628\u0637 \u0645\u0627 \u062A\u0641\u0639\u0644\u0647 \u062E\u0631\u064A\u0637\u0629 \u0627\u0644\u0628\u0635\u064A\u0644\u0627\u062A \u0641\u064A \u0647\u0630\u0627 \u0627\u0644\u0645\u0648\u0642\u0639: \u062A\u062D\u0633\u0628 \u0645\u0633\u0627\u062D\u0629 \u0627\u0644\u0645\u0646\u0627\u0637\u0642 \u0627\u0644\u062A\u064A \u062A\u062E\u062A\u0627\u0631\u0647\u0627. \u0648\u0644\u0646\u0643\u0646 \u0645\u062D\u062F\u0651\u062F\u064A\u0646: \u0634\u0631\u064A\u0637 \u062E\u0637 \u0627\u0644\u0634\u0639\u0631 \u0627\u0644\u0623\u0645\u0627\u0645\u064A \u0648\u062D\u062F\u0647 \u064A\u0628\u0644\u063A 34 \u0633\u0646\u062A\u064A\u0645\u062A\u0631\u064B\u0627 \u0645\u0631\u0628\u0651\u0639\u064B\u0627. \u0648\u0628\u0625\u0636\u0627\u0641\u0629 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0648\u0633\u0637\u0649 \u0648\u0632\u0648\u0627\u064A\u0627 \u0627\u0644\u0635\u062F\u063A\u064A\u0646 \u062A\u0631\u062A\u0641\u0639 \u0627\u0644\u0645\u0633\u0627\u062D\u0629 \u0625\u0644\u0649 95. \u0648\u0628\u0636\u0645\u0651 \u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u062A\u0627\u062C \u062A\u0635\u0644 \u0625\u0644\u0649 138. \u0648\u0643\u0644\u0645\u0627 \u0627\u062A\u0651\u0633\u0639\u062A \u0627\u0644\u0645\u0633\u0627\u062D\u0629 \u0627\u0632\u062F\u0627\u062F \u0639\u062F\u062F \u0627\u0644\u0628\u0635\u064A\u0644\u0627\u062A \u0628\u0627\u0644\u062A\u0646\u0627\u0633\u0628 \u0627\u0644\u0645\u0628\u0627\u0634\u0631.","\u0627\u0644\u0642\u064A\u0627\u0633 \u0627\u0644\u062B\u0627\u0644\u062B \u0647\u0648 \u0627\u0644\u0643\u062B\u0627\u0641\u0629 \u0627\u0644\u0645\u0633\u062A\u0647\u062F\u0641\u0629: \u0643\u0645 \u0628\u0635\u064A\u0644\u0629 \u062A\u064F\u0632\u0631\u0639 \u0641\u064A \u0643\u0644 \u0633\u0646\u062A\u064A\u0645\u062A\u0631 \u0645\u0631\u0628\u0651\u0639. \u0648\u064A\u0639\u062A\u0645\u062F \u0627\u0644\u062D\u0633\u0627\u0628 \u0641\u064A \u0647\u0630\u0627 \u0627\u0644\u0645\u0648\u0642\u0639 30 \u0628\u0635\u064A\u0644\u0629 \u0644\u0643\u0644 \u0633\u0646\u062A\u064A\u0645\u062A\u0631 \u0645\u0631\u0628\u0651\u0639 \u0627\u064 A\u0627\u0633\u064B\u0627 \u0643\u0627\u0641\u064A\u064B\u0627. \u0641\u0625\u0630\u0627 \u0627\u062E\u062A\u0644\u0641\u062A \u0643\u062B\u0627\u0641\u0629 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0627\u0646\u062D\u0629 \u0628\u064A\u0646 \u0634\u062E\u0635\u064A\u0646 \u0641\u064A \u0627\u0644\u0645\u0631\u062D\u0644\u0629 \u0646\u0641\u0633\u0647\u0627 \u0627\u062E\u062A\u0644\u0641\u062A \u062E\u0637\u062A\u0627\u0647\u0645\u0627. \u0648\u0633\u064F\u0645\u0643 \u0627\u0644\u0634\u0639\u0631\u0629\u060C \u0648\u0627\u0644\u062A\u0628\u0627\u064A\u0646 \u0627\u0644\u0644\u0648\u0646\u064A \u0628\u064A\u0646 \u0627\u0644\u0634\u0639\u0631 \u0648\u0627\u0644\u0628\u0634\u0631\u0629\u060C \u0648\u0645\u0631\u0648\u0646\u0629 \u0627\u0644\u0641\u0631\u0648\u0629\u060C \u0648\u0643\u0648\u0646 \u0627\u0644\u0634\u0639\u0631 \u0645\u0645\u0648\u0651\u062C\u064B\u0627 \u0623\u0648 \u0644\u0627\u060C \u0643\u0644\u0647\u0627 \u062A\u063A\u064A\u0651\u0631 \u0645\u062F\u0649 \u0627\u0645\u062A\u0644\u0627\u0621 \u0627\u0644\u0645\u0638\u0647\u0631 \u0639\u0646\u062F \u0627\u0644\u0639\u062F\u062F \u0646\u0641\u0633\u0647. \u0641\u0627\u0644\u0634\u0639\u0631 \u0627\u0644\u0645\u0645\u0648\u0651\u062C \u064A\u0639\u0637\u064A \u062D\u062C\u0645\u064B\u0627 \u0623\u0643\u0628\u0631 \u0628\u0627\u0644\u0639\u062F\u062F \u0646\u0641\u0633\u0647\u060C \u0648\u0627\u0644\u0634\u0639\u0631 \u0627\u0644\u0631\u0641\u064A\u0639 \u0627\u0644\u0623\u0645\u0644\u0633 \u064A\u0639\u0637\u064A \u0623\u0642\u0644\u0651.","\u0648\u064A\u062F\u062E\u0644 \u0627\u0644\u0639\u0645\u0631 \u0648\u062A\u0627\u0631\u064A\u062E \u0627\u0644\u0639\u0627\u0626\u0644\u0629 \u0641\u064A \u0627\u0644\u0642\u0631\u0627\u0631 \u0643\u0630\u0644\u0643. \u0641\u062D\u064A\u0646 \u064A\u062A\u0642\u062F\u0651\u0645 \u0627\u0644\u062A\u0633\u0627\u0642\u0637 \u0633\u0631\u064A\u0639\u064B\u0627 \u0639\u0646\u062F \u0634\u0627\u0628 \u0641\u064A \u0623\u0648\u0627\u0626\u0644 \u0627\u0644\u0639\u0634\u0631\u064A\u0646\u064A\u0627\u062A\u060C \u064A\u0635\u064A\u0631 \u062D\u0633\u0627\u0628 \u0627\u0644\u0633\u0646\u0648\u0627\u062A \u0627\u0644\u0639\u0634\u0631 \u0627\u0644\u0642\u0627\u062F\u0645\u0629 \u0628\u0623\u0647\u0645\u064A\u0629 \u062A\u063A\u0637\u064A\u0629 \u0641\u062C\u0648\u0629 \u0627\u0644\u064A\u0648\u0645. \u0641\u0627\u0644\u062C\u0630\u0648\u0631 \u0627\u0644\u0645\u0632\u0631\u0648\u0639\u0629 \u0645\u0642\u0627\u0648\u0645\u0629\u060C \u0644\u0643\u0646 \u0627\u0644\u0634\u0639\u0631 \u0627\u0644\u0623\u0635\u0644\u064A \u0628\u064A\u0646\u0647\u0627 \u0642\u062F \u064A\u0648\u0627\u0635\u0644 \u0627\u0644\u062A\u0633\u0627\u0642\u0637. \u0648\u0644\u0647\u0630\u0627 \u064A\u064F\u0635\u0645\u064E\u0651\u0645 \u062E\u0637 \u0627\u0644\u0634\u0639\u0631 \u0628\u062D\u0633\u0628 \u0627\u0644\u0639\u0645\u0631: \u0641\u062A\u062B\u0628\u064A\u062A \u062E\u0637 \u0634\u0627\u0628 \u0641\u064A \u0627\u0644\u0639\u0634\u0631\u064A\u0646 \u062A\u062B\u0628\u064A\u062A\u064B\u0627 \u062F\u0627\u0626\u0645\u064B\u0627 \u0642\u062F \u064A\u062A\u0631\u0643 \u0646\u062A\u064A\u062C\u0629 \u0644\u0627 \u062A\u0628\u062F\u0648 \u0637\u0628\u064A\u0639\u064A\u0629 \u0641\u064A \u0627\u0644\u0623\u0631\u0628\u0639\u064A\u0646.","\u0643\u064A\u0641 \u062A\u064F\u062D\u062F\u064E\u0651\u062F \u0627\u0644\u0645\u0631\u062D\u0644\u0629\u061F \u0641\u064A \u0627\u0644\u0641\u062D\u0635 \u0623\u0648 \u0645\u0646 \u0627\u0644\u0635\u0648\u0631 \u0627\u0644\u062A\u064A \u062A\u0631\u0633\u0644\u0647\u0627. \u0648\u062A\u0643\u0641\u064A \u062E\u0645\u0633 \u0635\u0648\u0631 \u0641\u064A \u0636\u0648\u0621 \u0627\u0644\u0646\u0647\u0627\u0631 \u0648\u0627\u0644\u0634\u0639\u0631 \u062C\u0627\u0641: \u0645\u0646 \u0627\u0644\u0623\u0645\u0627\u0645 \u0648\u0645\u0646 \u0627\u0644\u0623\u0639\u0644\u0649 \u0648\u0645\u0646 \u0643\u0644 \u062C\u0627\u0646\u0628 \u0648\u0645\u0646 \u0627\u0644\u0642\u0641\u0627. \u0648\u0627\u0644\u0625\u0636\u0627 0645\u0645\u0643\u0646\u0629 \u0641\u064A \u0623\u063A\u0644\u0628 \u0627\u0644\u062D\u0627\u0644\u0627\u062A.","\u0648\u0627\u0644\u062D\u062F\u0651 \u064A\u0643\u0645\u0646 \u0641\u064A \u0639\u062F\u062F \u0627\u0644\u0628\u0635\u064A\u0644\u0627\u062A. \u0641\u0627\u0644\u0639\u0645\u0644 \u0645\u0646 \u0628\u064A\u0646 \u0634\u0639\u0631 \u0637\u0648\u064A\u0644 \u064A\u0639\u0646\u064A \u062D\u0635\u0627\u062F \u062C\u0630\u0648\u0631 \u0623\u0642\u0644\u0651 \u0641\u064A \u0627\u0644\u0645\u062F\u0629 \u0646\u0641\u0633\u0647\u0627\u061B \u0625\u0630 \u064A\u0644\u0632\u0645 \u0644\u0643\u0644 \u0628\u0635\u064A\u0644\u0629 \u0641\u0631\u0642 \u0627\u0644\u0634\u0639\u0631 \u0648\u0627\u0644\u0639\u062B\u0648\u0631 \u0639\u0644\u0649 \u0627\u0644\u062C\u0630\u0631 \u0648\u0639\u062F\u0645 \u0627\u0644\u0625\u0636\u0631\u0627\u0631 \u0628\u0627\u0644\u0634\u0639\u0631\u0627\u062A \u0627\u0644\u0645\u062D\u064A\u0637\u0629. \u0648\u0644\u0630\u0644\u0643 \u064A\u0643\u0648\u0646 \u0639\u062F\u062F \u0627\u0644\u0628\u0635\u064A\u0644\u0627\u062A \u0627\u0644\u0630\u064A \u064A\u0645\u0643\u0646 \u0623\u062E\u0630\u0647 \u0628\u0623\u0645\u0627\u0646 \u0641\u064A \u062C\u0644\u0633\u0629 \u0648\u0627\u062D\u062F\u0629 \u062F\u0648\u0646 \u062D\u0644\u0627\u0642\u0629 \u0623\u0642\u0644\u0651 \u0645\u0646\u0647 \u0641\u064A \u0627\u0644\u0637\u0631\u064A\u0642\u0629 \u0627\u0644\u062A\u0642\u0644\u064A\u062F\u064A\u0629. \u0648\u0641\u064A \u0627\u0644\u0645\u0642\u0627\u0631\u0646\u0629 \u0627\u0644\u0645\u0646\u0634\u0648\u0631\u0629 \u0641\u064A \u0647\u0630\u0627 \u0627\u0644\u0645\u0648\u0642\u0639 \u064A\u064F\u0639\u0637\u0649 \u0627\u0644\u0646\u0637\u0627\u0642 \u0627\u0644\u0645\u0639\u062A\u0627\u062F \u0644\u0647\u0630\u0647 \u0627\u0644\u0637\u0631\u064A\u0642\u0629 \u0628\u064A\u0646 1,500 \u06482,500 \u0628\u0635\u064A\u0644\u0629.","\u0648\u0627\u0644\u0645\u062F\u0651\u0629 \u0645\u062E\u062A\u0644\u0641\u0629 \u0623\u064A\u0636\u064B\u0627. \u0641\u0644\u0623\u0646 \u0627\u0644\u0648\u0642\u062A \u0627\u0644\u0645\u0628\u0630\u0648\u0644 \u0644\u0643\u0644 \u0628\u0635\u064A\u0644\u0629 \u0623\u0637\u0648\u0644\u060C \u064A\u062E\u0631\u062C \u0645\u062C\u0645\u0648\u0639 \u0632\u0645\u0646 \u0627\u0644\u0639\u0645\u0644\u064A\u0629 \u0623\u0637\u0648\u0644 \u0645\u0646 \u0627\u0644\u0637\u0631\u0642 \u0627\u0644\u0623\u062E\u0631\u0649 \u0639\u0646\u062F \u0627\u0644\u0639\u062F\u062F \u0646\u0641\u0633\u0647. \u0641\u062E\u0637\u0629 \u062F\u0648\u0646 \u062D\u0644\u0627\u0642\u0629 \u0628\u06401,500 \u0628\u0635\u064A\u0644\u0629 \u062A\u0633\u062A\u063A\u0631\u0642 \u0646\u062D\u0648 \u0633\u0628\u0639 \u0633\u0627\u0639\u0627\u062A\u060C \u0648\u062E\u0637\u0629 \u0628\u06402,500 \u0628\u0635\u064A\u0644\u0629 \u0646\u062D\u0648 \u062A\u0633\u0639 \u0633\u0627\u0639\u0627\u062A. \u0648\u062A\u0634\u0645\u0644 \u0647\u0630\u0647 \u0627\u0644\u0645\u062F\u0651\u0629 \u0627\u0644\u062A\u062D\u0636\u064A\u0631 \u0648\u0627\u0644\u062A\u062E\u062F\u064A\u0631 \u0627\u0644\u0645\u0648\u0636\u0639\u064A \u0648\u0631\u0633\u0645 \u0627\u0644\u062A\u0635\u0645\u064A\u0645 \u0648\u0627\u0644\u0627\u0633\u062A\u0631\u0627\u062D\u0627\u062A \u0627\u0644\u0645\u062A\u062E\u0644\u0651\u0644\u0629\u061B \u0623\u064A \u0627\u0644\u0641\u0627\u0631\u0642 \u0628\u064A\u0646 \u0633\u0627\u0639\u0629 \u0648\u0635\u0648\u0644\u0643 \u0625\u0644\u0649 \u0627\u0644\u0639\u064A\u0627\u062F\u0629 \u0648\u0633\u0627\u0639\u0629 \u062E\u0631\u0648\u062C\u0643 \u0645\u0646\u0647\u0627.","\u0644\u0645\u0646 \u062A\u0646\u0627\u0633\u0628\u061F \u0623\u0635\u062D\u0627\u0628 \u0627\u0644\u062A\u0631\u0627\u062C\u0639 \u0627\u0644\u0648\u0627\u0636\u062D \u0641\u064A \u062E\u0637 \u0627\u0644\u0634\u0639\u0631 \u0627\u0644\u0623\u0645\u0627\u0645\u064A \u0639\u0644\u0649 \u0645\u0633\u0627\u062D\u0629 \u0635\u063A\u064A\u0631\u0629 \u0646\u0633\u0628\u064A\u064B\u0627 \u0647\u0645 \u0627\u0644\u0645\u0631\u0634\u0651\u062D\u0648\u0646 \u0627\u0644\u0623\u0646\u0633\u0628. \u0641\u0627\u0644\u0641\u062C\u0648\u0629 \u0641\u064A \u0627\u0644\u0645\u0631\u062D\u0644\u0629 \u0627\u0644\u062B\u0627\u0646\u064A\u0629 \u0623\u0648 \u0627\u0644\u062B\u0627\u0644\u062B\u0629 \u062A\u062F\u062E\u0644 \u0628\u064A\u0633\u0631 \u0636\u0645\u0646 \u0646\u0637\u0627\u0642 \u0647\u0630\u0647 \u0627\u0644\u0637\u0631\u064A\u0642\u0629. \u0648\u0647\u064A \u0643\u0630\u0644\u0643 \u062E\u064A\u0627\u0631 \u0645\u0639\u0642\u0648\u0644 \u0644\u0645\u0646 \u064A\u064F\u0628\u0642\u064A \u0634\u0639\u0631\u0647 \u0637\u0648\u064A\u0644\u064B\u0627\u060C \u0623\u0648 \u0644\u0627 \u064A\u0646\u0627\u0633\u0628 \u0639\u0645\u0644\u064E\u0647 \u0627\u0644\u0638\u0647\u0648\u0631 \u0628\u0634\u0639\u0631 \u0642\u0635\u064A\u0631\u060C \u0623\u0648 \u0644\u0627 \u064A\u0633\u062A\u0637\u064A\u0639 \u0623\u062E\u0630 \u0625\u062C\u0627\u0632\u0629 \u0641\u064A\u0644\u0632\u0645\u0647 \u0627\u0644\u0639\u0648\u062F\u0629 \u0625\u0644\u0649 \u0639\u0645\u0644\u0647 \u0641\u0648\u0631\u064B\u0627.","\u0648\u0644\u0645\u0646 \u0644\u0627 \u062A\u0646\u0627\u0633\u0628\u061F \u0625\u0630\u0627 \u0644\u0632\u0645 \u062A\u063A\u0637\u064A\u0629 \u0645\u0633\u0627\u062D\u0629 \u0648\u0627\u0633\u0639\u0629\u060C \u0623\u064A \u0645\u0646 \u0627\u0644\u0645\u0631\u062D\u0644\u0629 \u0627\u0644\u0631\u0627\u0628\u0639\u0629 \u0641\u0635\u0627\u0639\u062F\u064B\u0627\u060C \u062A\u062C\u0627\u0648\u0632 \u0639\u062F\u062F \u0627\u0644\u0628\u0635\u064A\u0644\u0627\u062A \u0627\u0644\u0645\u0637\u0644\u0648\u0628 \u0641\u064A \u062C\u0644\u0633\u0629 \u0648\u0627\u062D\u062F\u0629 \u0646\u0637\u0627\u0642 \u0647\u0630\u0647 \u0627\u0644\u0637\u0631\u064A\u0642\u0629. \u0648\u0641\u064A \u0645\u062B\u0644 \u0647\u0630\u0647 \u0627\u0644\u062D\u0627\u0644\u0627\u062A \u062A\u064F\u062E\u0637\u064E\u0651\u0637 \u062C\u0644\u0633\u062A\u0627\u0646 \u0623\u0648 \u062A\u064F\u0642\u062A\u0631\u062D \u062D\u0644\u0627\u0642\u0629 \u062C\u0632\u0626\u064A\u0629. \u0648\u0645\u0646 \u0643\u0627\u0646 \u0634\u0639\u0631\u0647 \u0642\u0635\u064A\u0631\u064B\u0627 \u062C\u062F\u064B\u0651\u0627 \u0623\u0635\u0644\u064B\u0627 \u0641\u0644\u0627 \u062A\u0628\u0642\u0649 \u0644\u0647 \u0645\u064A\u0632\u0629 \u0641\u064A \u0627\u0644\u0639\u0645\u0644 \u062F\u0648\u0646 \u062D\u0644\u0627\u0642\u0629\u061B \u0625\u0630 \u064A\u0646\u0628\u063A\u064A \u0623\u0644\u0627 \u064A\u0642\u0644\u0651 \u0637\u0648\u0644 \u0627\u0644\u0634\u0639\u0631 \u0641\u064A \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0627\u0646\u062D\u0629 \u0639\u0646 \u0633\u0646\u062A\u064A\u0645\u062A\u0631\u064A\u0646 \u0623\u0648 \u062B\u0644\u0627\u062B\u0629 \u062D\u062A\u0649 \u062A\u062E\u062A\u0641\u064A \u0645\u0648\u0627\u0636\u0639 \u0627\u0644\u0627\u0633\u062A\u062E\u0631\u0627\u062C \u062A\u062D\u062A\u0647.","\u0648\u0627\u0644\u062D\u0644\u0627\u0642\u0629 \u0627\u0644\u062C\u0632\u0626\u064A\u0629 \u0637\u0631\u064A\u0642 \u0648\u0633\u0637 \u062C\u064A\u0651\u062F \u0641\u064A \u0627\u0644\u063A\u0627\u0644\u0628. \u0641\u0641\u064A \u0647\u0630\u0627 \u0627\u0644\u0646\u0647\u062C \u064A\u064F\u062D\u0644\u0642 \u0634\u0631\u064A\u0637 \u0648\u0627\u062D\u062F \u0641\u0642\u0637 \u0645\u0646 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0627\u0646\u062D\u0629\u060C \u0648\u064A\u063A\u0637\u0651\u064A\u0647 \u0627\u0644\u0634\u0639\u0631 \u0627\u0644\u0637\u0648\u064A\u0644 \u0641\u0648\u0642\u0647 \u062A\u063A\u0637\u064A\u0629 \u0643\u0627\u0645\u0644\u0629 \u062D\u064A\u0646 \u064A\u064F\u0633\u062F\u0644. \u0648\u0628\u0630\u0644\u0643 \u064A\u0642\u062A\u0631\u0628 \u0645\u0631\u062F\u0648\u062F \u0627\u0644\u0628\u0635\u064A\u0644\u0627\u062A \u0645\u0646 \u0627\u0644\u0637\u0631\u064A\u0642\u0629 \u0627\u0644\u062A\u0642\u0644\u064A\u062F\u064A\u0629 \u0648\u062A\u064F\u062D\u0644\u0651 \u0645\u0634\u0643\u0644\u0629 \u0627\u0644\u0638\u0647\u0648\u0631 \u0625\u0644\u0649 \u062 \u064F\u0631\u0633\u064E\u0644 \u0645\u0639\u0643 \u0625\u0644\u0649 \u0627\u0644\u0628\u064A\u062A. \u0648\u0627\u0644\u063A\u0633\u064A\u0644 \u0644\u064A\u0633 \u0645\u0645\u0627 \u064A\u064F\u062E\u0627\u0641 \u0645\u0646\u0647\u061B \u0628\u0644 \u0625\u0646 \u0627\u0644\u063A\u0633\u064A\u0644 \u0627\u0644\u0645\u0646\u062A\u0638\u0645 \u0647\u0648 \u0645\u0627 \u064A\u062C\u0639\u0644 \u0627\u0644\u0642\u0634\u0648\u0631 \u062A\u062A\u0633\u0627\u0642\u0637 \u0641\u064A \u0648\u0642\u062A\u0647\u0627 \u0648\u062F\u0648\u0646 \u0623\u0630\u0649.","\u0648\u062A\u062A\u0643\u0648\u0651\u0646 \u0627\u0644\u0642\u0634\u0648\u0631 \u0645\u0646 \u0627\u0644\u064A\u0648\u0645 \u0627\u0644\u0631\u0627\u0628\u0639 \u0648\u062A\u062A\u0633\u0627\u0642\u0637 \u062D\u062A\u0649 \u0627\u0644\u064A\u0648\u0645 \u0627\u0644\u0639\u0627\u0634\u0631 \u062A\u0642\u0631\u064A\u0628\u064B\u0627. \u0648\u0647\u064A \u0637\u0628\u0642\u0627\u062A \u0631\u0642\u064A\u0642\u0629 \u062A\u062A\u0643\u0648\u0651\u0646 \u0628\u062C\u0641\u0627\u0641 \u0627\u0644\u062F\u0645 \u0648\u0633\u0627\u0626\u0644 \u0627\u0644\u0623\u0646\u0633\u062C\u0629. \u0648\u0644\u0627 \u064A\u062C\u0648\u0632 \u0646\u0632\u0639\u0647\u0627 \u0628\u0627\u0644\u064A\u062F\u061B \u0641\u0627\u0644\u0642\u0634\u0631\u0629 \u0627\u0644\u0645\u0646\u0632\u0648\u0639\u0629 \u0642\u062F \u062A\u064F\u0632\u062D\u0632\u062D \u0627\u0644\u0628\u0635\u064A\u0644\u0629 \u0627\u0644\u0645\u062C\u0627\u0648\u0631\u0629 \u0644\u0647\u0627. \u0648\u0645\u0639 \u0627\u0644\u063A\u0633\u064A\u0644 \u0627\u0644\u0645\u0646\u062A\u0638\u0645 \u062A\u0644\u064A\u0646 \u0627\u0644\u0642\u0634\u0648\u0631 \u0648\u062A\u0633\u0642\u0637 \u0648\u062D\u062F\u0647\u0627. \u0648\u0641\u064A \u0646\u0647\u0627\u064A\u0629 \u0627\u0644\u064A\u0648\u0645 \u0627\u0644\u0639\u0627\u0634\u0631 \u062A\u0643\u0648\u0646 \u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0632\u0631\u0639 \u0642\u062F \u0635\u0641\u062A \u0628\u0648\u0636\u0648\u062D \u0639\u0646\u062F \u0645\u0639\u0638\u0645 \u0627\u0644\u0646\u0627\u0633.","\u0648\u062A\u062A\u0639\u0627\u0641\u0649 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0627\u0646\u062D\u0629 \u0623\u0633\u0631\u0639 \u0645\u0646 \u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0632\u0631\u0639 \u0639\u0627\u062F\u0629\u064B. \u0648\u064A\u0643\u0648\u0646 \u0627\u0644\u0634\u062F\u0651 \u0627\u0644\u062E\u0641\u064A\u0641 \u0648\u0627\u0644\u062A\u0646\u0645\u064A\u0644 \u0641\u064A \u0627\u0644\u0623\u064A\u0627\u0645 \u0627\u0644\u0623\u0648\u0644\u0649 \u0623\u0645\u0631\u064B\u0627 \u0637\u0628\u064A\u0639\u064A\u064B\u0627\u061B \u0648\u064A\u0646\u062D\u0633\u0631 \u0627\u0644\u0627\u062D\u0645\u0631\u0627\u0631 \u062E\u0644\u0627\u0644 \u0623\u0633\u0628\u0648\u0639 \u0625\u0644\u0649 \u0623\u0633\u0628\u0648\u0639\u064A\u0646. \u0648\u0641\u064A \u0627\u0644\u0639\u0645\u0644\u064A\u0627\u062A \u0627\u0644\u062A\u064A \u062A\u064F\u062C\u0631\u0649 \u0628\u062D\u0644\u0627\u0642\u0629 \u062A\u062E\u062A\u0641\u064A \u0627\u0644\u0646\u0642\u0627\u0637 \u0641\u064A \u0627\u0644\u0642\u0641\u0627 \u0645\u0639 \u0646\u0645\u0648\u0651 \u0627\u0644\u0634\u0639\u0631. \u0648\u0627\u0644\u062D\u0643\u0651\u0629 \u0634\u0627\u0626\u0639\u0629 \u0641\u064A \u0647\u0630\u0647 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0648\u0647\u064A \u062C\u0632\u0621 \u0637\u0628\u064A\u0639\u064A \u0645\u0646 \u0627\u0644\u062A\u0639\u0627\u0641\u064A\u061B \u0648\u0627\u0644\u0635\u0648\u0627\u0628 \u0647\u0648 \u0627\u0644\u062A\u0631\u0637\u064A\u0628 \u0648\u0627\u0633\u062A\u0639\u0645\u0627\u0644 \u0645\u0627 \u064A\u0648\u0635\u064A \u0628\u0647 \u0627\u0644\u0637\u0628\u064A\u0628 \u0644\u0627 \u0627\u0644\u062D\u0643\u0651.","\u0648\u0628\u064A\u0646 \u0627\u0644\u0623\u0633\u0628\u0648\u0639\u064A\u0646 \u0627\u0644\u062B\u0627\u0646\u064A \u0648\u0627\u0644\u0631\u0627\u0628\u0639 \u064A\u062A\u0633\u0627\u0642\u0637 \u0645\u0639\u0638\u0645 \u0627\u0644\u0634\u0639\u0631 \u0627\u0644\u0645\u0632\u0631\u0648\u0639. \u0648\u064A\u064F\u0633\u0645\u0651\u0649 \u0647\u0630\u0627 \u0627\u0644\u062A\u0633\u0627\u0642\u0637 \u0627\u0644\u0635\u062F\u0645\u064A \u0648\u0647\u0648 \u0637\u0628\u064A\u0639\u064A. \u0648\u0627\u0644\u0630\u064A \u064A\u062A\u0633\u0627\u0642\u0637 \u0647\u0648 \u0633\u0627\u0642 \u0627\u0644\u0634\u0639\u0631\u0629 \u0644\u0627 \u0627\u0644\u062C\u0630\u0631\u061B \u0641\u0627\u0644\u062C\u0630\u0631 \u064A\u0628\u0642\u0649 \u0645\u0643\u0627\u0646\u0647 \u0648\u064A\u062F\u062E\u0644 \u0637\u0648\u0631 \u0631\u0627\u062D\u0629 \u0642\u0628\u0644 \u0623\u0646 \u064A\u0628\u062F\u0623 \u062F\u0648\u0631\u0629 \u062C\u062F\u064A\u062F\u0629. \u0648\u0647\u0630\u0647 \u0627\u0644\u0641\u062A\u0631\u0629 \u0623\u0635\u0639\u0628 \u0623\u062C\u0632\u0627\u0621 \u0627\u0644\u0645\u0633\u0627\u0631 \u0646\u0641\u0633\u064A\u064B\u0627: \u0641\u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u062A\u064A \u0628\u062F\u062A \u062C\u064A\u0651\u062F\u0629 \u0641\u064A \u0627\u0644\u0623\u0633\u0628\u0648\u0639 \u0627\u0644\u0623\u0648\u0644 \u062A\u0639\u0648\u062F \u0625\u0644\u0649 \u062D\u0627\u0644\u0647\u0627 \u0627\u0644\u0623\u0648\u0644\u0649 \u0641\u064A \u0646\u0647\u0627\u064A\u0629 \u0627\u0644\u0623\u0633\u0628\u0648\u0639 \u0627\u0644\u062B\u0627\u0644\u062B. \u0648\u0644\u064A\u0633\u062A \u0647\u0630\u0647 \u0639\u0644\u0627\u0645\u0629 \u0641\u0634\u0644 \u0628\u0644 \u0645\u0631\u062D\u0644\u0629 \u0645\u062A\u0648\u0642\u0651\u0639\u0629.","\u0648\u0645\u0627 \u064A\u0646\u0628\u063A\u064A \u062A\u062C\u0646\u0651\u0628\u0647 \u062E\u0644\u0627\u0644 \u0627\u0644\u0634\u0647\u0631 \u0627\u0644\u0623\u0648\u0644 \u0642\u0627\u0626\u0645\u0629 \u0642\u0635\u064A\u0631\u0629. \u0627\u0644\u0634\u0645\u0633 \u0627\u0644\u0645\u0628\u0627\u0634\u0631\u0629 \u0645\u0645\u0646\u0648\u0639\u0629 \u062A\u0645\u0627\u0645\u064B\u0627 \u0641\u064A \u0627\u0644\u0623\u0633\u0628\u0648\u0639\u064A\u0646 \u0627\u0644\u0623\u0648\u0644\u064A\u0646\u061B \u0648\u0628\u0639\u062F\u0647\u0645\u0627 \u064A\u064F\u0641\u0636\u064E\u0651\u0644 \u0627\u0644\u0638\u0644\u0651 \u0639\u0644\u0649 \u0627\u0644\u0642\u0628\u0639\u0629. \u0648\u0627\u0644\u0631\u064A\u0627\u0636\u0629 \u0627\u0644\u0645\u0639\u0631\u0650\u0642\u0629 \u0648\u0627\u0644\u0633\u0627\u0648\u0646\u0627 \u0648\u0627\u0644\u062D\u0645\u0651\u0627\u0645 \u0648\u0627\u0644\u0645\u0633\u0627\u0628\u062D \u0645\u0645\u0646\u0648\u0639\u0629 \u0637\u0648\u0627\u0644 \u0627\u0644\u0634\u0647\u0631\u060C \u0648\u0627\u0644\u0628\u062D\u0631 \u0643\u0630\u0644\u0643. \u0648\u0644\u0627 \u062A\u064F\u0644\u0628\u0633 \u0627\u0644\u0642\u0628\u0639\u0627\u062A \u0627\u0644\u0636\u064A\u0651\u0642\u0629 \u0648\u0627\u0644\u062E\u0648\u0630\u0627\u062A \u0641\u064A \u0627\u0644\u0623\u064A\u0627\u0645 \u0627\u0644\u0639\u0634\u0631\u0629 \u0627\u0644\u0623\u0648\u0644\u0649 \u0644\u0623\u0646\u0647\u0627 \u062A\u0636\u063A\u0637 \u0639\u0644\u0649 \u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0632\u0631\u0639. \u0648\u0645\u0646 \u0627\u0644\u0645\u0639\u0631\u0648\u0641 \u0623\u0646 \u0627\u0644\u062A\u062F\u062E\u064A\u0646 \u0648\u0627\u0644\u0643\u062D\u0648\u0644 \u064A\u0624\u062B\u0651\u0631\u0627\u0646 \u0641\u064A \u0627\u0644\u062F\u0648\u0631\u0629 \u0627\u0644\u062F\u0645\u0648\u064A\u0629\u061B \u0648\u064A\u064F\u0646\u0635\u062D \u0628\u062A\u0642\u0644\u064A\u0644\u0647\u0645\u0627 \u0641\u064A \u0627\u0644\u0623\u0633\u0628\u0648\u0639 \u0627\u0644\u0623\u0648\u0644 \u0648\u062A\u0631\u0643\u0647\u0645\u0627 \u0625\u0646 \u0623\u0645\u0643\u0646.","\u0648\u0627\u0644\u0639\u0648\u062F\u0629 \u0625\u0644\u0649 \u0627\u0644\u0639\u0645\u0644 \u062A\u062A\u0628\u0639 \u0637\u0628\u064A\u0639\u0629 \u0627\u0644\u0639\u0645\u0644. \u0641\u0627\u0644\u0639\u0645\u0644 \u0627\u0644\u0645\u0643\u062A\u0628\u064A \u0645\u0645\u0643\u0646 \u0644\u0645\u0639\u0638\u0645 \u0627\u0644\u0646\u0627\u0633 \u0645\u0646 \u0627\u0644\u064A\u0648\u0645 \u0627\u0644\u062B\u0627\u0644\u062B\u061B \u0648\u0627\u0644\u0638\u0647\u0648\u0631 \u0647\u0648 \u0627\u0644\u0639\u0627\u0626\u0642 \u0627\u0644\u0648\u062D\u064A\u062F \u0645\u0627 \u062F\u0627\u0645 \u0627\u0644\u062A\u0642\u0634\u0651\u0631 \u0645\u0633\u062A\u0645\u0631\u064B\u0651\u0627. \u0648\u0645\u0646 \u064A\u0639\u0645\u0644 \u0639\u0645\u0644\u064B\u0627 \u0628\u062F\u0646\u064A\u064B\u0627 \u064A\u064F\u062D\u0633\u0646 \u0627\u0646\u062A\u0638\u0627\u0631 \u0627\u0644\u0623\u064A\u0627\u0645 \u0627\u0644\u0639\u0634\u0631\u0629 \u0627\u0644\u0623\u0648\u0644\u0649 \u0628\u0633\u0628\u0628 \u0627\u0644\u0639\u0631\u0642 \u0648\u0627\u0644\u063A\u0628\u0627\u0631. \u0648\u064A\u0645\u0643\u0646 \u0627\u0644\u0628\u062F\u0621 \u0628\u0627\u0644\u0645\u0634\u064A \u0627\u0644\u062E\u0641\u064A\u0641 \u0645\u0646 \u0627\u0644\u064A\u0648\u0645 \u0627\u0644\u0623\u0648\u0644. \u0623\u0645\u0651\u0627 \u062A\u0645\u0627\u0631\u064A\u0646 \u0627\u0644\u0623\u062B\u0642\u0627\u0644 \u0648\u0627\u0644\u062C\u0631\u064A \u0641\u064A\u064F\u0639\u0627\u062F \u0625\u0644\u064A\u0647\u0627 \u062A\u062F\u0631\u064A\u062C\u064A\u064B\u0627 \u0628\u0639\u062F \u0627\u0644\u0623\u0633\u0628\u0648\u0639 \u0627\u0644\u0631\u0627\u0628\u0639.","\u0648\u0628\u0639\u062F \u0627\u0644\u064A\u0648\u0645 \u0627\u0644\u062B\u0644\u0627\u062B\u064A\u0646 \u064A\u062A\u0628\u0627\u0637\u0623 \u0627\u0644\u062A\u0642\u0648\u064A\u0645. \u0641\u064A\u0638\u0647\u0631 \u0627\u0644\u0646\u0645\u0648 \u0627\u0644\u062C\u062F\u064A\u062F \u0627\u0644\u0623\u0648\u0644 \u0641\u064A \u0627\u0644\u0634\u0647\u0631 \u0627\u0644\u062B\u0627\u0644\u062B\u061B \u0648\u062A\u0643\u0648\u0646 \u062A\u0644\u0643 \u0627\u0644\u0634\u0639\u0631\u0627\u062A \u0631\u0641\u064A\u0639\u0629 \u0639\u062F\u064A\u0645\u0629 \u0627\u0644\u0644\u0648\u0646 \u0641\u064A \u0627\u0644\u0628\u062F\u0627\u064A\u0629 \u062B\u0645 \u062A\u063A\u0644\u0638 \u0645\u0639 \u0627\u0644\u0648\u0642\u062A. \u0648\u0641\u064A \u0627\u0644\u0634\u0647\u0631 \u0627\u0644\u0633\u0627\u062F\u0633 \u062A\u062A\u0643\u0648\u0651\u0646 \u0643\u062B\u0627\u0641\u0629 \u0645\u0631\u0626\u064A\u0629 \u0648\u064A\u0628\u062F\u0623 \u0645\u0646 \u062D\u0648\u0644\u0643 \u0628\u0645\u0644\u0627\u062D\u0638\u0629 \u0627\u0644\u0641\u0631\u0642. \u0648\u0641\u064A \u0627\u0644\u0634\u0647\u0631 \u0627\u0644\u062A\u0627\u0633\u0639 \u064A\u0634\u0628\u0647 \u0627\u0644\u0634\u0639\u0631 \u0645\u062D\u064A\u0637\u0647 \u0637\u0648\u0644\u064B\u0627 \u0648\u0645\u0644\u0645\u0633\u064B\u0627. \u0648\u064A\u062C\u0631\u064A \u0627\u0644\u062A\u0642\u064A\u064A\u0645 \u0627\u0644\u0646\u0647\u0627\u0626\u064A \u0628\u064A\u0646 \u0627\u0644\u0634\u0647\u0631\u064A\u0646 \u0627\u0644\u062B\u0627\u0646\u064A \u0639\u0634\u0631 \u0648\u0627\u0644\u062B\u0627\u0645\u0646 \u0639\u0634\u0631\u061B \u0648\u0627\u0644\u062A\u0627\u062C \u0639\u0627\u062F\u0629\u064B \u0622\u062E\u0631 \u0645\u0646\u0637\u0642\u0629 \u062A\u0639\u0637\u064A \u0646\u062A\u064A\u062C\u062A\u0647\u0627.","\u0648\u064A\u064F\u0628\u0646\u0649 \u0628\u0631\u0646\u0627\u0645\u062C \u0627\u0644\u0645\u062A\u0627\u0628\u0639\u0629 \u0639\u0644\u0649 \u0647\u0630\u0627 \u0627\u0644\u062A\u0642\u0648\u064A\u0645. \u0641\u062A\u064F\u062C\u0631\u0649 \u0627\u0644\u0641\u062D\u0648\u0635 \u0641\u064A \u0627\u0644\u0623\u0633\u0628\u0648\u0639 \u0627\u0644\u0623\u0648\u0644 \u0648\u0627\u0644\u0634\u0647\u0631 \u0627\u0644\u0623\u0648\u0644 \u0648\u0627\u0644\u062B\u0627\u0644\u062B \u0648\u0627\u0644\u0633\u0627\u062F\u0633 \u0648\u0627\u0644\u062B\u0627\u0646\u064A \u0639\u0634\u0631. \u0648\u064A\u064F\u0648\u062B\u064E\u0651\u0642 \u0643\u0644 \u0641\u062D\u0635 \u0628\u0635\u0648\u0631 \u062A\u064F\u0644\u062A\u0642\u0637 \u0645\u0646 \u0627\u0644\u0632\u0648\u0627\u064A\u0627 \u0646\u0641\u0633\u0647\u0627\u061B \u0641\u0627\u0644\u0645\u0642\u0627\u0631\u0646\u0629 \u0644\u0627 \ 4\u0649 \u0627\u0644\u0645\u0646\u0627\u0637\u0642 \u0627\u0644\u062A\u064A \u064A\u064F\u0628\u0646\u0649 \u0641\u064A\u0647\u0627 \u0627\u0644\u062D\u062C\u0645 \u062E\u0644\u0641\u0647. \u0648\u0645\u0639\u0638\u0645 \u0645\u0627 \u064A\u064F\u0642\u0631\u0623 \u0637\u0628\u064A\u0639\u064A\u064B\u0627 \u064A\u0623\u062A\u064A \u0645\u0646 \u0647\u0630\u0627 \u0627\u0644\u0641\u0631\u0632.","\u0648\u0641\u064A \u0633\u0641\u064A\u0631 FUE \u062E\u0637\u0648\u0629 \u0644\u0641\u062A\u062D \u0627\u0644\u0642\u0646\u0648\u0627\u062A \u0642\u0628\u0644 \u0627\u0644\u0632\u0631\u0639. \u0641\u062A\u064F\u062D\u062F\u062B \u0634\u0642\u0648\u0642 \u062F\u0642\u064A\u0642\u0629 \u0641\u064A \u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0632\u0631\u0639 \u0628\u0634\u0641\u0631\u0627\u062A \u0630\u0627\u062A \u0631\u0624\u0648\u0633 \u064A\u0627\u0642\u0648\u062A\u064A\u0629. \u0648\u0632\u0627\u0648\u064A\u0629 \u0647\u0630\u0647 \u0627\u0644\u0634\u0642\u0648\u0642 \u0648\u0627\u062A\u062C\u0627\u0647\u0647\u0627 \u0648\u0639\u0645\u0642\u0647\u0627 \u0647\u064A \u0627\u0644\u062A\u064A \u062A\u062D\u062F\u0651\u062F \u0643\u064A\u0641 \u0633\u062A\u062E\u0631\u062C \u0627\u0644\u0634\u0639\u0631\u0629\u061B \u0641\u062A\u064F\u0628\u0642\u0649 \u0627\u0644\u0632\u0627\u0648\u064A\u0629 \u0642\u0631\u064A\u0628\u0629 \u062C\u062F\u064B\u0651\u0627 \u0645\u0646 \u0627\u0644\u0633\u0637\u062D \u0641\u064A \u0627\u0644\u062E\u0637 \u0627\u0644\u0623\u0645\u0627\u0645\u064A\u060C \u0648\u064A\u064F\u0637\u0644\u0628 \u0641\u064A \u0627\u0644\u062A\u0627\u062C \u062A\u0648\u0636\u0651\u0639 \u064A\u062A\u0628\u0639 \u062F\u0648\u0651\u0627\u0645\u0629 \u0627\u0644\u0634\u0639\u0631 \u0627\u0644\u0637\u0628\u064A\u0639\u064A\u0629. \u0648\u0628\u0639\u062F \u0641\u062A\u062D \u0627\u0644\u0642\u0646\u0648\u0627\u062A \u062A\u064F\u0648\u0636\u0639 \u0627\u0644\u0628\u0635\u064A\u0644\u0627\u062A \u0641\u064A\u0647\u0627 \u0628\u0627\u0644\u0645\u0644\u0642\u0637.","\u0648\u0627\u0644\u0631\u0623\u0633 \u0627\u0644\u064A\u0627\u0642\u0648\u062A\u064A \u0641\u0631\u0642 \u0641\u064A \u0627\u0644\u062E\u0627\u0645\u0629 \u0644\u0627 \u0639\u0644\u0627\u0645\u0629 \u062A\u062C\u0627\u0631\u064A\u0629. \u0641\u0647\u0648 \u0623\u062D\u062F\u0651 \u0645\u0646 \u0627\u0644\u0641\u0648\u0644\u0627\u0630 \u0648\u064A\u062A\u0631\u0643 \u0642\u0637\u0639\u064B\u0627 \u0623\u0646\u0639\u0645. \u0648\u064A\u0639\u0646\u064A \u0630\u0644\u0643 \u0639\u0645\u0644\u064A\u064B\u0627 \u0623\u0630\u064B\u0649 \u0623\u0642\u0644\u0651 \u0641\u064A \u0627\u0644\u0623\u0646\u0633\u062C\u0629 \u0648\u062A\u0642\u0634\u0651\u0631\u064B\u0627 \u0623\u0642\u0644\u0651 \u0628\u0639\u0636 \u0627\u0644\u0634\u064A\u0621. \u0648\u0647\u0648 \u0648\u062D\u062F\u0647 \u0644\u0627 \u064A\u062D\u062F\u0651\u062F \u062C\u0648\u062F\u0629 \u0627\u0644\u0646\u062A\u064A\u062C\u0629\u061B \u0641\u0632\u0627\u0648\u064A\u0629 \u0627\u0644\u0642\u0646\u0648\u0627\u062A \u0648\u062A\u0628\u0627\u0639\u062F\u0647\u0627 \u0623\u0634\u062F\u0651 \u062A\u0623\u062B\u064A\u0631\u064B\u0627 \u0628\u0643\u062B\u064A\u0631. \u0648\u064A\u062C\u062F\u0631 \u0627\u0644\u062A\u0639\u0627\u0645\u0644 \u0628\u062D\u0630\u0631 \u0645\u0639 \u0627\u0644\u0631\u0648\u0627\u064A\u0627\u062A \u0627\u0644\u062A\u064A \u062A\u0642\u062F\u0651\u0645 \u062E\u0627\u0645\u0629 \u0627\u0644\u0631\u0623\u0633 \u0639\u0644\u0649 \u0623\u0646\u0647\u0627 \u0627\u0644\u062D\u0643\u0627\u064A\u0629 \u0643\u0644\u0647\u0627.","\u0648\u0641\u064A DHI \u062A\u062A\u0645\u0651 \u0627\u0644\u0642\u0646\u0627\u0629 \u0648\u0627\u0644\u0632\u0631\u0639 \u0641\u064A \u062E\u0637\u0648\u0629 \u0648\u0627\u062D\u062F\u0629. \u062A\u064F\u062D\u0645\u064E\u0651\u0644 \u0627\u0644\u0628\u0635\u064A\u0644\u0629 \u0641\u064A \u0637\u0631\u0641 \u0642\u0644\u0645 \u0627\u0644\u0632\u0631\u0639 \u0627\u0644\u0645\u0639\u0631\u0648\u0641 \u0628\u0642\u0644\u0645 \u062A\u0634\u0648\u064A\u061B \u0641\u064A\u062F\u062E\u0644 \u0627\u0644\u0642\u0644\u0645 \u0627\u0644\u062C\u0644\u062F \u0648\u064A\u0637\u0644\u0642 \u0627\u0644\u062C\u0630\u0631 \u0628\u0627\u0644\u062D\u0631\u0643\u0629 \u0646\u0641\u0633\u0647\u0627. \u0648\u0644\u0623\u0646\u0647 \u0644\u0627 \u062A\u0648\u062C\u062F \u0645\u0631\u062D\u0644\u0629 \u0645\u0646\u0641\u0635\u0644\u0629 \u0644\u0641\u062A\u062D \u0627\u0644\u0642\u0646\u0648\u0627\u062A\u060C \u062A\u0642\u0635\u0631 \u0627\u0644\u0645\u062F\u0629 \u0627\u0644\u062A\u064A \u062A\u0642\u0636\u064A\u0647\u0627 \u0627\u0644\u062C\u0630\u0648\u0631 \u062E\u0627\u0631\u062C \u0627\u0644\u062C\u0633\u0645. \u0648\u064A\u064F\u062E\u062A\u0627\u0631 \u0637\u0631\u0641 \u0627\u0644\u0642\u0644\u0645 \u0628\u0645\u0627 \u064A\u0637\u0627\u0628\u0642 \u0642\u0637\u0631 \u0627\u0644\u0628\u0635\u064A\u0644\u0629\u060C \u0641\u062A\u0633\u062A\u0642\u0631\u0651 \u0643\u0644 \u0628\u0635\u064A\u0644\u0629 \u0641\u064A \u062C\u064A\u0628 \u0639\u0644\u0649 \u0645\u0642\u0627\u0633\u0647\u0627. \u0648\u0647\u0630\u0627 \u064A\u0642\u0644\u0651\u0644 \u0627\u0644\u0646\u0632\u0641 \u0648\u0627\u0644\u062A\u0648\u0631\u0651\u0645 \u0628\u0639\u0636 \u0627\u0644\u0634\u064A\u0621.","\u0648\u0627\u0644\u0645\u0648\u0636\u0639 \u0627\u0644\u0630\u064A \u064A\u0628\u0631\u0632 \u0641\u064A\u0647 DHI \u0647\u0648 \u0627\u0644\u062D\u0627\u0644\u0627\u062A \u0627\u0644\u062A\u064A \u062A\u0633\u062A\u062F\u0639\u064A \u0627\u0644\u0632\u0631\u0639 \u0628\u064A\u0646 \u0627\u0644\u0634\u0639\u0631 \u0627\u0644\u0642\u0627\u0626\u0645. \u0641\u0641\u062A\u062D \u0627\u0644\u0642\u0646\u0648\u0627\u062A \u0628\u0627\u0644\u0634\u0641\u0631\u0629 \u0641\u064A \u0645\u0646\u0637\u0642\u0629 \u062E\u0641\u0651\u062A \u0648\u0644\u0645 \u062A\u0646\u0641\u062A\u062D \u062A\u0645\u0627\u0645\u064B\u0627 \u064A\u062D\u0645\u0644 \u062E\u0637\u0631 \u0627\u0644\u0625\u0636\u0631\u0627\u0631 \u0628\u0627\u0644\u062C\u0630\u0648\u0631 \u0627\u0644\u0633\u0644\u064A\u0645\u0629 \u0628\u064A\u0646\u0647\u0627. \u0648\u0627\u0644\u0642\u0644\u0645 \u064A\u0639\u0645\u0644 \u0628\u062D\u0631\u0643\u0629 \u0623\u0643\u062B\u0631 \u062A\u062D\u0643\u0651\u0645\u064B\u0627 \u0641\u064A\u0642\u0644\u0651\u0644 \u0630\u0644\u0643 \u0627\u0644\u062E\u0637\u0631. \u0648\u0644\u0644\u0633\u0628\u0628 \u0646\u0641\u0633\u0647 \u0642\u062F \u064A\u064F\u0641\u0636\u064E\u0651\u0644 DHI \u0641\u064A \u0627\u0644\u0645\u0633\u0627\u062D\u0627\u062A \u0627\u0644\u0635\u063A\u064A\u0631\u0629 \u0627\u0644\u062A\u064A \u062A\u064F\u0633\u062A\u0647\u062F\u0641 \u0641\u064A\u0647\u0627 \u0643\u062B\u0627\u0641\u0629 \u0639\u0627\u0644\u064A\u0629\u060C \u0648\u0641\u064A \u0627\u0644\u0635\u0641\u0648\u0641 \u0627\u0644\u0623\u0648\u0644\u0649 \u0645\u0646 \u062E\u0637 \u0627\u0644\u0634\u0639\u0631 \u0627\u0644\u0623\u0645\u0627\u0645\u064A.","\u0648\u0627\u0644\u0645\u0648\u0636\u0639 \u0627\u0644\u0630\u064A \u064A\u0628\u0631\u0632 \u0641\u064A\u0647 \u0633\u0641\u064A\u0631 FUE \u0647\u0648 \u0627\u0644\u0645\u0633\u0627\u062D\u0627\u062A \u0627\u0644\u0648\u0627\u0633\u0639\u0629. \u0641\u0641\u062A\u062D \u0627\u0644\u0642\u0646\u0648\u0627\u062A \u062F\u0641\u0639\u0629 \u0648\u0627\u062D\u062F\u0629 \u064A\u0633\u0631\u0651\u0639 \u0639\u0645\u0644 \u0627\u0644\u0641\u0631\u064A\u0642 \u0648\u064A\u0633\u0647\u0651\u0644 \u0625\u0646\u0647\u0627\u0621 \u0645\u0633\u0627\u062D\u0629 \u0643\u0628\u064A\u0631\u0629 \u0641\u064A \u064A\u0648\u0645 \u0648\u0627\u062D\u062F. \u0648\u0628\u0627\u0644\u0623\u0631\u0642\u0627\u0645: \u062E\u0637\u0629 \u0633\u0641\u064A\u0631 \u0628\u06403,000 \u0628\u0635\u064A\u0644\u0629 \u062A\u0633\u062A\u063A\u0631\u0642 \u0646\u062D\u0648 \u0633\u062A \u0633\u0627\u0639\u0627\u062A\u060C \u0648\u0628\u06405,000 \u0628\u0635\u064A\u0644\u0629 \u0646\u062D\u0648 \u062A\u0633\u0639 \u0633\u0627\u0639\u0627\u062A. \u0648\u0641\u064A \u062C\u0627\u0646\u0628 DHI \u062A\u0633\u062A\u063A\u0631\u0642 \u062E\u0637\u0629 \u0628\u06402,000 \u0628\u0635\u064A\u0644\u0629 \u0646\u062D\u0648 \u0633\u062A \u0633\u0627\u0639\u0627\u062A\u060C \u0648\u0628\u06403,500 \u0628\u0635\u064A\u0644\u0629 \u0646\u062D\u0648 \u062B\u0645\u0627\u0646\u064A \u0633\u0627\u0639\u0627\u062A.","\u0648\u0644\u0627 \u062A\u064F\u0638\u0647\u0631 \u0647\u0630\u0647 \u0627\u0644\u0623\u0631\u0642\u0627\u0645 \u0633\u0628\u0627\u0642\u064B\u0627 \u0628\u064A\u0646 \u0627\u0644\u0637\u0631\u064A\u0642\u062A\u064A\u0646\u061B \u0628\u0644 \u062A\u064F\u0638\u0647\u0631 \u0627\u062E\u062A\u0644\u0627\u0641 \u0646\u0637\u0627\u0642\u0627\u062A \u0627\u0644\u0628\u0635\u064A\u0644\u0627\u062A \u0627\u0644\u062A\u064A \u062A\u063A\u0637\u0651\u064A\u0647\u0627 \u0643\u0644\u064C\u0651 \u0645\u0646\u0647\u0645\u0627. \u0641\u0641\u064A \u0627\u0644\u0645\u0642\u0627\u0631\u0646\u0629 \u0627\u0644\u062A\u0642\u0646\u064A\u0629 \u0627\u0644\u0645\u0646\u0634\u0648\u0631\u0629 \u0641\u064A \u0647\u0630\u0627 \u0627\u0644\u0645\u0648\u0642\u0639 \u064A\u064F\u0639\u0637\u0649 \u0627\u0644\u0646\u0637\u0627\u0642 \u0627\u0644\u0645\u0639\u062A\u0627\u062F \u0644\u0640DHI \u0628\u064A\u0646 2,000 \u06483,500 \u0628\u0635\u064A\u0644\u0629\u060C \u0648\u0644\u0633\u0641\u064A\u0631 FUE \u0628\u064A\u0646 3,000 \u06485,000. \u0623\u064A \u0623\u0646 \u0627\u062E\u062A\u064A\u0627\u0631 \u0627\u0644\u0637\u0631\u064A\u0642\u0629 \u062A\u062D\u062F\u0651\u062F\u0647 \u0639\u0627\u062F\u0629\u064B \u0645\u0633\u0627\u062D\u0629 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0631\u0627\u062F \u062A\u063A\u0637\u064A\u062A\u0647\u0627: \u0641\u0627\u0644\u0645\u0631\u064A\u0636 \u0644\u0627 \u064A\u062E\u062A\u0627\u0631 \u0637\u0631\u064A\u0642\u0629\u060C \u0628\u0644 \u0627\u0644\u062E\u0637\u0629 \u062A\u064F\u0642\u062F\u0651\u0645 \u0637\u0631\u064A\u0642\u0629.","\u0648\u0641\u064A \u062C\u0627\u0646\u0628 \u0627\u0644\u062A\u0639\u0627\u0641\u064A \u062A\u062A\u0642\u0627\u0631\u0628 \u0627\u0644\u0637\u0631\u064A\u0 46\u064B\u0627 \u0644\u0644\u062C\u0644\u0633\u0629 \u0627\u0644\u0648\u0627\u062D\u062F\u0629. \u0648\u0647\u0630\u0627 \u0627\u0644\u062D\u062F\u0651 \u0645\u062A\u0639\u0644\u0651\u0642 \u0628\u062A\u0639\u0627\u0641\u064A \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0627\u0646\u062D\u0629: \u0641\u0627\u0633\u062A\u062E\u0631\u0627\u062C \u0639\u062F\u062F \u0643\u0628\u064A\u0631 \u0645\u0646 \u0627\u0644\u062C\u0630\u0648\u0631 \u0641\u064A \u0648\u0642\u062A \u0642\u0635\u064A\u0631 \u064A\u064F\u062C\u0647\u062F \u062A\u0631\u0648\u064A\u0629 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0648\u062A\u0639\u0627\u0641\u064A\u0647\u0627. \u0648\u062A\u064F\u0642\u0633\u064E\u0651\u0645 \u0627\u0644\u062E\u0637\u0637 \u0627\u0644\u0623\u0643\u0628\u0631 \u0639\u0644\u0649 \u062C\u0644\u0633\u062A\u064A\u0646 \u0628\u064A\u0646\u0647\u0645\u0627 \u0627\u062B\u0646\u0627 \u0639\u0634\u0631 \u0634\u0647\u0631\u064B\u0627 \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644 \u0639\u0627\u062F\u0629\u064B. \u0648\u0641\u062A\u0631\u0629 \u0627\u0644\u0627\u0646\u062A\u0638\u0627\u0631 \u0644\u064A\u0633\u062A \u0625\u062C\u0631\u0627\u0621\u064B \u0634\u0643\u0644\u064A\u064B\u0627\u061B \u0625\u0646\u0647\u0627 \u062A\u0642\u0648\u064A\u0645 \u062A\u0639\u0627\u0641\u064A \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0627\u0646\u062D\u0629.","\u0648\u0627\u0644\u062E\u0637\u0629 \u0627\u0644\u062C\u064A\u062F\u0629 \u062A\u063A\u0637\u0651\u064A \u0641\u062C\u0648\u0629 \u0627\u0644\u064A\u0648\u0645 \u0648\u062A\u062A\u0631\u0643 \u0634\u064A\u0626\u064B\u0627 \u0644\u0644\u063A\u062F. \u0641\u0627\u0644\u0632\u0631\u0627\u0639\u0629 \u0644\u0627 \u062A\u0648\u0642\u0641 \u062A\u0633\u0627\u0642\u0637 \u0627\u0644\u0634\u0639\u0631 \u0627\u0644\u0623\u0635\u0644\u064A\u061B \u0648\u0627\u0644\u062C\u0630\u0648\u0631 \u0627\u0644\u0645\u0632\u0631\u0648\u0639\u0629 \u062F\u0627\u0626\u0645\u0629\u060C \u0644\u0643\u0646 \u0627\u0644\u0 FClmeye yol a\xE7an hormona duyars\u0131zd\u0131r, ba\u015Fka yere ta\u015F\u0131nd\u0131klar\u0131nda da d\xF6k\xFClmezler. \xD6m\xFCr boyu tek kaynakt\u0131r: al\u0131nabilecek toplam greft say\u0131s\u0131n\u0131n s\u0131n\u0131r\u0131n\u0131 bu alan koyar.",olcu:"S\u0131n\u0131r\u0131 muayenede say\u0131larak bulunur, tahminle de\u011Fil"},yogunluk:{ad:"Greft/cm\xB2 (yo\u011Funluk)",kisa:"Bir santimetrekareye ekilen greft say\u0131s\u0131; sa\xE7\u0131n s\u0131kl\u0131\u011F\u0131n\u0131 belirler.",uzun:"S\u0131k ekim her zaman iyi sonu\xE7 de\u011Fildir; a\u015F\u0131r\u0131 yo\u011Funlukta k\xF6kler yeterince beslenemez. Do\u011Fal g\xF6r\xFCn\xFCm i\xE7in \xF6n sa\xE7 \xE7izgisi, orta b\xF6lge ve tepe farkl\u0131 yo\u011Funluklarda planlan\u0131r.",olcu:"Kendi sa\xE7l\u0131 derinizde ~80\u2013100 folik\xFCl/cm\xB2 \xB7 ekimde tipik hedef 35\u201350 greft/cm\xB2"},norwood:{ad:"Norwood evresi",kisa:"Erkek tipi sa\xE7 d\xF6k\xFClmesinin yayg\u0131nl\u0131\u011F\u0131n\u0131 birden yediye anlatan \xF6l\xE7ek.",uzun:"Hekimle hastan\u0131n ayn\u0131 \u015Feyi konu\u015Fabilmesi i\xE7in kullan\u0131l\u0131r. Evre y\xFCkseldik\xE7e a\xE7\u0131lan alan ve gereken greft say\u0131s\u0131 artar. Kad\u0131n tipi d\xF6k\xFClme bu \xF6l\xE7ekle de\u011Fil, ayr\u0131 bir \xF6l\xE7ekle anlat\u0131l\u0131r.",olcu:"1 = \u015Fakaklarda hafif a\xE7\u0131lma \xB7 7 = yaln\u0131z ense ve yanlar sa\xE7l\u0131"},fue:{ad:"FUE",kisa:"K\xF6kleri tek tek al\u0131p a\xE7\u0131lan kanallara yerle\u015Ftiren, diki\u015Fsiz y\xF6ntem.",uzun:"Don\xF6rden \u015Ferit halinde deri kesilmez; k\xF6kler mikro u\xE7larla teker teker \xE7\u0131kar\u0131l\u0131r. Bu y\xFCzden ensede \xE7izgi bi\xE7iminde diki\u015F izi kalmaz ve iyile\u015Fme daha k\u0131sa s\xFCrer.",olcu:"A\xE7\u0131l\u0131m\u0131: Follicular Unit Extraction \u2014 k\xF6k \xFCnitesi \xE7\u0131karma"},safir:{ad:"Safir FUE",kisa:"Kanallar\u0131n \xE7elik yerine safir u\xE7lu b\u0131\xE7akla a\xE7\u0131ld\u0131\u011F\u0131 FUE.",uzun:"Safir u\xE7 daha ince ve d\xFCzg\xFCn bir kanal a\xE7ar; ama\xE7 dokuda daha az tahri\u015F ve daha s\u0131k yerle\u015Fimdir. Y\xF6ntemin geri kalan\u0131 FUE ile birebir ayn\u0131d\u0131r, de\u011Fi\u015Fen yaln\u0131z kanal ucudur."},dhi:{ad:"DHI",kisa:"Kanal a\xE7madan, kalem u\xE7lu aletle k\xF6k\xFC do\u011Frudan yerle\u015Ftiren y\xF6ntem.",uzun:"Choi kalemi kanal\u0131 a\xE7ar ve k\xF6k\xFC ayn\u0131 hareketle b\u0131rak\u0131r. K\xF6k d\u0131\u015Far\u0131da daha k\u0131sa bekler, ayr\u0131ca mevcut sa\xE7lar\u0131n aras\u0131na seyrelmi\u015F b\xF6lgeye ekim yapmak kolayla\u015F\u0131r.",olcu:"A\xE7\u0131l\u0131m\u0131: Direct Hair Implantation \u2014 do\u011Frudan sa\xE7 yerle\u015Ftirme"},trassiz:{ad:"Tra\u015Fs\u0131z ekim",kisa:"Sa\xE7\u0131n\u0131z kesilmeden yap\u0131lan ekim; ertesi g\xFCn g\xFCnl\xFCk hayata d\xF6n\xFCl\xFCr.",uzun:"Yaln\u0131z k\xF6klerin al\u0131naca\u011F\u0131 k\xFC\xE7\xFCk alan, \xFCstteki uzun sa\xE7\u0131n alt\u0131nda kalacak \u015Fekilde k\u0131salt\u0131l\u0131r; d\u0131\u015Far\u0131dan g\xF6r\xFCnmez. Buna kar\u015F\u0131l\u0131k tek seansta al\u0131nabilen greft say\u0131s\u0131 s\u0131n\u0131rl\u0131 kal\u0131r."},sok:{ad:"\u015Eok d\xF6k\xFClme",kisa:"Ekimden sonraki haftalarda ekilen tellerin d\xF6k\xFClmesi; k\xF6k yerinde kal\u0131r.",uzun:"Beklenen bir a\u015Famad\u0131r, ba\u015Far\u0131s\u0131zl\u0131k de\u011Fildir. Tel d\xFC\u015Fer ama k\xF6k deride kal\u0131r ve yeni sa\xE7 \xE7\u0131kar\u0131r. Panik yaratan k\u0131s\u0131m budur; oysa takvimin normal par\xE7as\u0131d\u0131r.",olcu:"Genelde 2.\u20138. haftalar \xB7 yeni \xE7\u0131k\u0131\u015F 3.\u20134. aydan itibaren"},prp:{ad:"PRP",kisa:"Kendi kan\u0131n\u0131zdan ayr\u0131\u015Ft\u0131r\u0131lan yo\u011Fun plazman\u0131n sa\xE7l\u0131 deriye verilmesi.",uzun:"Kan al\u0131n\u0131r, santrif\xFCjde trombositten zengin k\u0131sm\u0131 ayr\u0131l\u0131r ve sa\xE7l\u0131 deriye enjekte edilir. Var olan sa\xE7\u0131 desteklemek i\xE7in kullan\u0131lan bir bak\u0131md\u0131r; sa\xE7 ekiminin yerine ge\xE7mez.",olcu:"A\xE7\u0131l\u0131m\u0131: Platelet-Rich Plasma \u2014 trombositten zengin plazma"},mezo:{ad:"Mezoterapi",kisa:"Sa\xE7l\u0131 deriye k\xFC\xE7\xFCk i\u011Fnelerle vitamin ve mineral kar\u0131\u015F\u0131m\u0131 verilmesi.",uzun:"Kar\u0131\u015F\u0131m do\u011Frudan k\xF6klerin bulundu\u011Fu derinli\u011Fe b\u0131rak\u0131l\u0131r. Destekleyici bir bak\u0131md\u0131r: tamamen a\xE7\u0131lm\u0131\u015F bir alan\u0131 yeniden sa\xE7land\u0131rmaz, ekimin alternatifi de\u011Fildir."}},en:{greft:{ad:"Graft",kisa:"A tiny package of roots taken from the skin; it holds about two hairs.",uzun:"Planning is done in grafts, not in hairs. One graft can carry one to four hairs, two on average. So 3,000 grafts means roughly 6,000 hairs.",olcu:"1 graft \u2248 2 hairs (varies between 1 and 4)"},folikul:{ad:"Follicle",kisa:"The root of a hair under the skin, together with the sheath around it.",uzun:"The hair you see is the part that grows out of the follicle. Surgery moves the follicle itself, not the hair, which is why transplanted hair keeps the habits of its original root."},donor:{ad:"Donor area",kisa:"The band at the back and sides where hair resists thinning.",uzun:"Roots there are insensitive to the hormone that causes loss, so they keep growing wherever they are moved. It is a one-off supply for life, and it sets the ceiling on total grafts.",olcu:"Its limit is counted during examination, never estimated"},yogunluk:{ad:"Grafts/cm\xB2 (density)",kisa:"How many grafts go into one square centimetre; it sets the thickness.",uzun:"Packing more is not automatically better: above a point the roots cannot be fed. For a natural look the hairline, mid-scalp and crown are planned at different densities.",olcu:"Your own scalp holds ~80\u2013100 follicles/cm\xB2 \xB7 a typical transplant target is 35\u201350 grafts/cm\xB2"},norwood:{ad:"Norwood stage",kisa:"A one-to-seven scale describing how far male pattern loss has gone.",uzun:"It exists so surgeon and patient describe the same thing. The higher the stage, the larger the bare area and the more grafts it takes. Female pattern loss uses a separate scale.",olcu:"1 = slight temple recession \xB7 7 = only the back and sides still have hair"},fue:{ad:"FUE",kisa:"Roots are taken out one by one and set into opened channels; no stitches.",uzun:"No strip of skin is cut from the donor; roots are removed individually with micro punches. That is why no line-shaped scar is left at the back and healing takes less time.",olcu:"Stands for Follicular Unit Extraction"},safir:{ad:"Sapphire FUE",kisa:"FUE in which the channels are opened with a sapphire blade, not steel.",uzun:"A sapphire tip opens a thinner, smoother channel; the aim is less irritation in the tissue and closer placement. Everything else is ordinary FUE \u2014 only the blade changes."},dhi:{ad:"DHI",kisa:"A pen-tipped tool places the root directly, without opening a channel first.",uzun:"The Choi pen opens the channel and releases the root in one movement. The root spends less time outside the body, and it becomes easier to plant between existing hairs.",olcu:"Stands for Direct Hair Implantation"},trassiz:{ad:"No-shave transplant",kisa:"Surgery without cutting your hair; you can go out the next day.",uzun:"Only the small patch the roots come from is trimmed, hidden under the longer hair above it, so nothing shows. In exchange, the number of grafts one session can take stays limited."},sok:{ad:"Shock loss",kisa:"The transplanted hairs fall out in the weeks after surgery; the roots stay.",uzun:"It is an expected stage, not a failure. The hair drops but the root remains in the skin and grows a new one. This is the part that frightens people, though it belongs to the normal timeline.",olcu:"Usually weeks 2\u20138 \xB7 regrowth from month 3\u20134 onwards"},prp:{ad:"PRP",kisa:"Concentrated plasma separated from your own blood, injected into the scalp.",uzun:"Blood is drawn, the platelet-rich fraction is separated in a centrifuge and injected into the scalp. It is a treatment that supports existing hair; it does not replace a transplant.",olcu:"Stands for Platelet-Rich Plasma"},mezo:{ad:"Mesotherapy",kisa:"A vitamin and mineral mix delivered into the scalp with fine needles.",uzun:"The mix is left at the depth where the roots sit. It is supportive care: it will not bring hair back to a fully bare area and it is not an alternative to surgery."}},ar:{greft:{ad:"\u0627\u0644\u0637\u064F\u0639\u0645",kisa:"\u062D\u0632\u0645\u0629 \u062C\u0630\u0648\u0631 \u0635\u063A\u064A\u0631\u0629 \u062A\u0624\u062E\u0630 \u0645\u0646 \u0627\u0644\u062C\u0644\u062F \u0648\u062A\u062D\u0645\u0644 \u0634\u0639\u0631\u062A\u064A\u0646 \u0641\u064A \u0627\u0644\u0645\u062A\u0648\u0633\u0637.",uzun:"\u064A\u064F\u062E\u0637\u064E\u0651\u0637 \u0644\u0644\u0639\u0645\u0644\u064A\u0629 \u0628\u0639\u062F\u062F \u0627\u0644\u0637\u0639\u0648\u0645 \u0644\u0627 \u0628\u0639\u062F\u062F \u0627\u0644\u0634\u0639\u0631\u0627\u062A. \u0627\u0644\u0637\u064F\u0639\u0645 \u0627\u0644\u0648\u0627\u062D\u062F \u064A\u062D\u0645\u0644 \u0645\u0646 \u0634\u0639\u0631\u0629 \u0625\u0644\u0649 \u0623\u0631\u0628\u0639\u060C \u0648\u0645\u062A\u0648\u0633\u0637\u0647 \u0634\u0639\u0631\u062A\u0627\u0646\u060C \u0641\u062B\u0644\u0627\u062B\u0629 \u0622\u0644\u0627\u0641 \u0637\u064F\u0639\u0645 \u062A\u0639\u0646\u064A \u0646\u062D\u0648 \u0633\u062A\u0629 \u0622\u0644\u0627\u0641 \u0634\u0639\u0631\u0629.",olcu:"\u0637\u064F\u0639\u0645 \u0648\u0627\u062D\u062F \u2248 \u0634\u0639\u0631\u062A\u0627\u0646 (\u064A\u062A\u0631\u0627\u0648\u062D \u0628\u064A\u0646 \u0648\u0627\u062D\u062F\u0629 \u0648\u0623\u0631\u0628\u0639)"},folikul:{ad:"\u0627\u0644\u0628\u0635\u064A\u0644\u0629",kisa:"\u062C\u0630\u0631 \u0627\u0644\u0634\u0639\u0631\u0629 \u062A\u062D\u062A \u0627\u0644\u062C\u0644\u062F \u0645\u0639 \u0627\u0644\u063A\u0644\u0627\u0641 \u0627\u0644\u0645\u062D\u064A\u0637 \u0628\u0647.",uzun:"\u0627\u0644\u0634\u0639\u0631\u0629 \u0627\u0644\u062A\u064A \u062A\u0631\u0627\u0647\u0627 \u0647\u064A \u0627\u0644\u062C\u0632\u0621 \u0627\u0644\u062E\u0627\u0631\u062C \u0645\u0646 \u0627\u0644\u0628\u0635\u064A\u0644\u0629. \u0627\u0644\u0645\u0646\u0642\u0648\u0644 \u0641\u064A \u0627\u0644\u0639\u0645\u0644\u064A\u0629 \u0647\u0648 \u0627\u0644\u0628\u0635\u064A\u0644\u0629 \u0646\u0641\u0633\u0647\u0627 \u0644\u0627 \u0627\u0644\u0634\u0639\u0631\u0629\u060C \u0648\u0644\u0647\u0630\u0627 \u064A\u062D\u062A\u0641\u0638 \u0627\u0644\u0634\u0639\u0631 \u0627\u0644\u0645\u0632\u0631\u0648\u0639 \u0628\u0637\u0628\u0639 \u062C\u0630\u0631\u0647 \u0627\u0644\u0623\u0635\u0644\u064A. \u0648\u0643\u062B\u064A\u0631\u064B\u0627 \u0645\u0627 \u062A\u064F\u0633\u062A\u0639\u0645\u0644 \u0643\u0644\u0645\u0629 \u0628\u0635\u064A\u0644\u0629 \u0628\u0645\u0639\u0646\u0649 \u0637\u064F\u0639\u0645."},donor:{ad:"\u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0627\u0646\u062D\u0629",kisa:"\u0634\u0631\u064A\u0637 \u0645\u0624\u062E\u0631\u0629 \u0627\u0644\u0631\u0623\u0633 \u0648\u0627\u0644\u062C\u0627\u0646\u0628\u064A\u0646 \u062D\u064A\u062B \u064A\u0642\u0627\u0648\u0645 \u0627\u0644\u0634\u0639\u0631 \u0627\u0644\u062A\u0633\u0627\u0642\u0637.",uzun:"\u062C\u0630\u0648\u0631 \u0647\u0630\u0647 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0644\u0627 \u062A\u062A\u0623\u062B\u0631 \u0628\u0627\u0644\u0647\u0631\u0645\u0648\u0646 \u0627\u0644\u0645\u0633\u0628\u0628 \u0644\u0644\u062A\u0633\u0627\u0642\u0637\u060C \u0641\u062A\u0633\u062A\u0645\u0631 \u0641\u064A \u0627\u0644\u0646\u0645\u0648 \u0623\u064A\u0646\u0645\u0627 \u0646\u064F\u0642\u0644\u062A. \u0648\u0647\u064A \u0645\u0648\u0631\u062F \u0648\u0627\u062D\u062F \u0644\u0644\u0639\u0645\u0631 \u0643\u0644\u0647\u060C \u0648\u0647\u064A \u0627\u0644\u062A\u064A \u062A\u0636\u0639 \u0633\u0642\u0641 \u0639\u062F\u062F \u0627\u0644\u0637\u0639\u0648\u0645 \u0627\u0644\u0645\u0645\u0643\u0646.",olcu:"\u064A\u064F\u062D\u0633\u0628 \u062D\u062F\u0651\u0647\u0627 \u0628\u0627\u0644\u0639\u062F\u0651 \u0623\u062B\u0646\u0627\u0621 \u0627\u0644\u0641\u062D\u0635 \u0644\u0627 \u0628\u0627\u0644\u062A\u0642\u062F\u064A\u0631"},yogunluk:{ad:"\u0637\u064F\u0639\u0645/\u0633\u0645\xB2 (\u0627\u0644\u0643\u062B\u0627\u0641\u0629)",kisa:"\u0639\u062F\u062F \u0627\u0644\u0637\u0639\u0648\u0645 \u0641\u064A \u0627\u0644\u0633\u0646\u062A\u064A\u0645\u062A\u0631 \u0627\u0644\u0645\u0631\u0628\u0639 \u0627\u0644\u0648\u0627\u062D\u062F\u060C \u0648\u0647\u0648 \u0645\u0627 \u064A\u062D\u062F\u062F \u0627\u0644\u063A\u0632\u0627\u0631\u0629.",uzun:"\u0627\u0644\u0632\u0631\u0627\u0639\u0629 \u0627\u0644\u0643\u062B\u064A\u0641\u0629 \u0644\u064A\u0633\u062A \u0623\u0641\u0636\u0644 \u062F\u0627\u0626\u0645\u064B\u0627\u061B \u0641\u0648\u0642 \u062D\u062F\u0651 \u0645\u0639\u064A\u0651\u0646 \u0644\u0627 \u062A\u062C\u062F \u0627\u0644\u062C\u0630\u0648\u0631 \u062A\u063A\u0630\u064A\u0629 \u0643\u0627\u0641\u064A\u0629. \u0648\u0644\u0623\u062C\u0644 \u0645\u0638\u0647\u0631 \u0637\u0628\u064A\u0639\u064A \u062A\u064F\u062E\u0637\u064E\u0651\u0637 \u062E\u0637 \u0627\u0644\u0634\u0639\u0631 \u0648\u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0648\u0633\u0637\u0649 \u0648\u0627\u0644\u062A\u0627\u062C \u0628\u0643\u062B\u0627\u0641\u0627\u062A \u0645\u062E\u062A\u0644\u0641\u0629.",olcu:"\u0641\u0631\u0648\u0629 \u0631\u0623\u0633\u0643 \u062A\u062D\u0645\u0644 ~80\u2013100 \u0628\u0635\u064A\u0644\u0629/\u0633\u0645\xB2 \xB7 \u0648\u0627\u0644\u0647\u062F\u0641 \u0627\u0644\u0645\u0639\u062A\u0627\u062F \u0641\u064A \u0627\u0644\u0632\u0631\u0627\u0639\u0629 35\u201350 \u0637\u064F\u0639\u0645\u064B\u0627/\u0633\u0645\xB2"},norwood:{ad:"\u062F\u0631\u062C\u0629 \u0646\u0648\u0631\u0648\u0648\u062F",kisa:"\u0645\u0642\u064A\u0627\u0633 \u0645\u0646 \u0648\u0627\u062D\u062F \u0625\u0644\u0649 \u0633\u0628\u0639\u0629 \u064A\u0635\u0641 \u0645\u062F\u0649 \u0627\u062A\u0633\u0627\u0639 \u0627\u0644\u0635\u0644\u0639 \u0627\u0644\u0648\u0631\u0627\u062B\u064A.",uzun:"\u0648\u064F\u0636\u0639 \u0644\u064A\u062A\u062D\u062F\u062B \u0627\u0644\u0637\u0628\u064A\u0628 \u0648\u0627\u0644\u0645\u0631\u064A\u0636 \u0639\u0646 \u0627\u0644\u0634\u064A\u0621 \u0646\u0641\u0633\u0647. \u0643\u0644\u0645\u0627 \u0627\u0631\u062A\u0641\u0639\u062A \u0627\u0644\u062F\u0631\u062C\u0629 \u0627\u062A\u0633\u0639\u062A \u0627\u0644\u0645\u0633\u0627\u062D\u0629 \u0627\u0644\u062E\u0627\u0644\u064A\u0629 \u0648\u0632\u0627\u062F \u0639\u062F\u062F \u0627\u0644\u0637\u0639\u0648\u0645 \u0627\u0644\u0644\u0627\u0632\u0645. \u0623\u0645\u0627 \u062A\u0633\u0627\u0642\u0637 \u0627\u0644\u0646\u0633\u0627\u0621 \u0641\u0644\u0647 \u0645\u0642\u064A\u0627\u0633 \u0645\u0646\u0641\u0635\u0644.",olcu:"\u0661 = \u0627\u0646\u062D\u0633\u0627\u0631 \u062E\u0641\u064A\u0641 \u0639\u0646\u062F \u0627\u0644\u0635\u062F\u063A\u064A\u0646 \xB7 \u0667 = \u0644\u0627 \u064A\u0628\u0642\u0649 \u0634\u0639\u0631 \u0625\u0644\u0627 \u0641\u064A \u0627\u0644\u0645\u0624\u062E\u0631\u0629 \u0648\u0627\u0644\u062C\u0627\u0646\u0628\u064A\u0646"},fue:{ad:"FUE",kisa:"\u062A\u064F\u0642\u062A\u0637\u0641 \u0627\u0644\u062C\u0630\u0648\u0631 \u0648\u0627\u062D\u062F\u0629 \u0648\u0627\u062D\u062F\u0629 \u0648\u062A\u064F\u0648\u0636\u0639 \u0641\u064A \u0642\u0646\u0648\u0627\u062A \u0645\u0641\u062A\u0648\u062D\u0629\u060C \u0628\u0644\u0627 \u063A\u0631\u0632.",uzun:"\u0644\u0627 \u064A\u064F\u0642\u062A\u0637\u0639 \u0634\u0631\u064A\u0637 \u0645\u0646 \u062C\u0644\u062F \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0627\u0646\u062D\u0629\u060C \u0628\u0644 \u062A\u064F\u0633\u062D\u0628 \u0627\u0644\u062C\u0630\u0648\u0631 \u0641\u0631\u0627\u062F\u0649 \u0628\u0631\u0624\u0648\u0633 \u062F\u0642\u064A\u0642\u0629. \u0644\u0630\u0644\u0643 \u0644\u0627 \u062A\u0628\u0642\u0649 \u0646\u062F\u0628\u0629 \u062E\u0637\u064A\u0629 \u0641\u064A \u062
