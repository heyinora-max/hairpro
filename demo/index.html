of the page. In this demo copy the numbers are masked; they fill with the clinic\u2019s own records on delivery.","hk.k.s2.b":"What we process","hk.k.s2.a":"We ask for the minimum a first consultation needs, nothing more.","hk.k.v1":"Name, surname and contact details: phone, e-mail.","hk.k.v2":"The hair and donor area photographs you send.","hk.k.v3":"Age, shedding history and any regular medication.","hk.k.v4":"Consultation record: date, adviser and the plan discussed.","hk.k.s3.b":"Health data is special category","hk.k.s3.m1":"Your photograph and shedding history are special category health data under article 6; they are processed only with your explicit consent.","hk.k.s3.m2":"You may withdraw consent at any time. When you do, your record is deleted the same day.","hk.k.s4.b":"Purpose and retention","hk.k.s4.a":"Your data stays inside the consultation and never joins a marketing list.","hk.k.a1":"Purpose: first assessment, graft range estimate and appointment planning.","hk.k.a2":"Photographs sit in an area only the medical team opens.","hk.k.a3":"Enquiries that do not become patients are deleted after six months.","hk.k.a4":"If you are treated, the record is kept as health legislation requires.","hk.k.a5":"Your photograph is never published anywhere without written consent.","hk.k.s5.b":"Your rights: article 11","hk.k.s5.a":"The law gives you six things you can demand.","hk.k.r1":"Learn whether your data is processed.","hk.k.r2":"Request information about it if it is.","hk.k.r3":"Learn whether it serves its stated purpose.","hk.k.r4":"Ask for correction if it is incomplete or wrong.","hk.k.r5":"Ask for it to be erased or destroyed.","hk.k.r6":"Claim compensation if you have suffered loss.","hk.k.s6.b":"How to apply","hk.k.s6.m":"Send your request in writing to the clinic registered address, or to its registered e-mail address. The clinic replies within thirty days.","hk.k.s6.n":"Applications go to the registered electronic mail (KEP) address or the postal address in the corporate identity block. Both are masked in this demo copy.","hk.c.h1":"Cookie policy","hk.c.alt":"This demo leaves one record in your browser, only what it needs to work. No tracking or advertising cookies.","hk.c.s1.b":"What a cookie is","hk.c.s1.a":"One sentence, without the legal vocabulary.","hk.c.s1.m":"A cookie is a small record a site leaves in your browser. Its job is remembering your preference next visit.","hk.c.s2.b":"What this site uses","hk.c.s2.a":"Of the three cookie families, only the first one is used.","hk.c.tur":"Type","hk.c.ne":"What it does","hk.c.durum":"Status","hk.c.var":"In use","hk.c.yok":"Not used","hk.c.t1.a":"Strictly necessary","hk.c.t1.m":"Your language choice: tr, en or ar. Kept so the site opens in the language you last picked.","hk.c.t2.a":"Measurement","hk.c.t2.m":"Cookies that count visitors and time spent on a page.","hk.c.t3.a":"Advertising","hk.c.t3.m":"Tracking pixels that pass data to advertising networks.","hk.c.s3.b":"How to switch it off","hk.c.s3.a":"Switching it off needs no permission from us.","hk.c.k1":"Clear site data from your browser settings.","hk.c.k2":"Open the page privately and nothing is stored.","hk.c.k3":"After clearing, the site opens in Turkish again, nothing else changes.","hk.c.not":"If measurement is added when the clinic goes live, this page is updated and your consent asked separately.","hk.m.h1":"Regulatory compliance","hk.m.alt":"One source of code produces two publishing surfaces: the domestic information site and, on a separate domain, the international health-tourism site. They are not bound by the same rules.","hk.m.s1.b":"Two publishing surfaces","hk.m.s1.a":"Live, they are published as two separate sites on two separate domains; here they sit at one address so the whole demo travels in a single file. The language selector decides which surface you are on.","hk.m.r1.a":"Domestic surface \xB7 Turkish","hk.m.r1.d":"Advertising Regulation 12/11/2025, art. 5 and 7","hk.m.r1.m":"Health
