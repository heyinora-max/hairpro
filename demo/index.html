      : 'fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
    return '<svg class="ico ' + (cls || '') + '" width="' + s + '" height="' + s +
      '" viewBox="0 0 24 24" ' + boya + ' aria-hidden="true" focusable="false">' + body + '</svg>';
  };

  /* --- 5. veri deposu (demo) ------------------------------------------- */
  HP.store = (function () {
    var s = {};
    return {
      get: function (k, def) { return k in s ? s[k] : def; },
      set: function (k, v) { s[k] = v; return v; },
      toggle: function (k) { s[k] = !s[k]; return s[k]; }
    };
  })();

  /* --- 6. rotalar ------------------------------------------------------ */
  var SAYFALAR = {};
  HP.page = function (id, def) { SAYFALAR[id] = def; return def; };
  HP.pages = SAYFALAR;

  HP.route = { id: 'anasayfa', bolum: 'site', param: '' };

  function hashOku() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    var p = h.split('/');
    /* Hash'in içindeki sorgu dizesi soyulmalı: "#/fiyat?dil=en" biçimi
       aksi halde bilinmeyen rota sayılıp ana sayfaya düşüyordu — ekran
       görüntüsü/bağlantı paylaşan herkesi yanıltıyordu. */
    var id = (p[0] || 'anasayfa').split('?')[0];
    if (!SAYFALAR[id]) id = 'anasayfa';
    return { id: id, bolum: (SAYFALAR[id].bolum || 'site'), param: (p[1] || '').split('?')[0] };
  }

  HP.go = function (id, param) {
    location.hash = '#/' + id + (param ? '/' + param : '');
  };

  /* --- 7. olaylar ------------------------------------------------------ */
  var kancalar = { render: [] };
  HP.on = function (ad, fn) { (kancalar[ad] = kancalar[ad] || []).push(fn); };
  function tetikle(ad) {
    (kancalar[ad] || []).forEach(function (fn) { try { fn(); } catch (e) { console.error('[HP]', ad, e); } });
  }

  /* --- 8. eylemler (data-act) ------------------------------------------ */
  HP.actions = {};
  HP.act = function (ad, fn) { HP.actions[ad] = fn; };

  /* Katman açan eylemler, geri dönülecek ögeyi bilmek zorunda: fare ile
     tıklanan düğme odak ALMAYABİLİR (Safari), o yüzden activeElement'e
     güvenilmez. Son eylem ögesini burada saklıyoruz. */
  var sonTetik = null;

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var fn = HP.actions[el.getAttribute('data-act')];
    if (!fn) return;
    ev.preventDefault();
    sonTetik = el;
    fn(el, ev);
    if (el.getAttribute('role') === 'tab') sekmeSirasi();
  });

  /* --- 8b. odak katmanı (modal · çekmece · mobil menü) ------------------
     ÖLÇÜM (kontrol/a11y-etkilesim.js, 390px):
       çekmece açıldı → odak "button.nav__ac" üzerinde KALDI (dışarıda),
       çekmecenin son ögesinden Tab → "a.atla" (arkadaki sayfa) = KAÇAK,
       Escape ile kapanınca odak tetikleyiciye DÖNMEDİ,
       arka plan inert=false → ekran okuyucu perdenin ardını okuyabiliyordu.
     Dört eksik de burada tek yerde kapanır; her katman aynı sözleşmeyi alır. */
  var ODAK_SEC = 'a[href],area[href],button,input,select,textarea,iframe,summary,[tabindex]';

  function odaklanabilir(kok) {
    return HP.qsa(ODAK_SEC, kok).filter(function (el) {
      if (el.disabled) return false;
      if (el.getAttribute('tabindex') === '-1') return false;
      if (el.closest('[inert]')) return false;
      /* checkOpacity KAPALI olmalı: katmanlar 0 opaklıkla giriş animasyonu
         yapıyor; o ilk karede odaklanabilir öge "yok" sayılırsa odak
         hiç içeri taşınmaz (ölçüldü: modal ve mobil menüde 0 öge). */
      return el.checkVisibility
        ? el.checkVisibility({ checkOpacity: false, checkVisibilityCSS: true })
        : !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length);
    });
  }
  HP.odaklanabilir = odaklanabilir;

  var yigin = [];

  /* el DIŞINDA kalan her şeyi klavyeye ve ekran okuyucuya kapatır.
     `koru` seçicileri muaftır: mobil menü bir DİYALOG DEĞİL, bir açılır
     bölümdür — üst çubuk (kapatma düğmesi orada!) ve alt eylem çubuğu
     ekranda görünür kaldığı için erişilebilir de kalmalıdır. */
  function disariKapat(el, koru) {
    var kilit = [], c = el;
    while (c && c.parentNode && c.parentNode.nodeType === 1) {
      var p = c.parentNode, ch = p.children;
      for (var i = 0; i < ch.length; i++) {
        var k = ch[i];
        if (k === c || k.hasAttribute('inert')) continue;
        /* Canlı bölgeler susturulmamalı: rota duyurusu ve bildirimler. */
        if (k.id === 'hp-duyuru' || k.id === 'hp-toast') continue;
        if (koru && koru.some(function (s) { return k.matches(s); })) continue;
        k.setAttribute('inert', '');
        kilit.push(k);
      }
      c = p;
    }
    return kilit;
  }

  HP.katmanAc = function (el, o) {
    if (!el) return null;
    o = o || {};
    var kayit = {
      el: el,
      kapat: o.kapat,
      koru: o.koru || null,
      /* Sıra önemli: O ANKİ odak en güvenilir tetikleyicidir. `sonTetik`
         yalnız odak gövdedeyken (Safari düğmeye odak vermez) devreye girer —
         önce denenirse ESKİ bir tıklama, güncel odağı ezip yanlış yere döner. */
      tetik: o.tetik ||
        (document.activeElement && document.activeElement !== document.body
          ? document.activeElement : sonTetik),
      kilit: disariKapat(el, o.koru)
    };
    yigin.push(kayit);
    document.body.classList.add('is-kilitli');
    var ilk = o.odak || odaklanabilir(el)[0];
    if (!ilk) { try { el.setAttribute('tabindex', '-1'); } catch (e) { } ilk = el; }
    odakla(ilk);
    return kayit;
  };

  HP.katmanKapat = function (el) {
    var i = -1;
    for (var j = yigin.length - 1; j >= 0; j--) { if (!el || yigin[j].el === el) { i = j; break; } }
    if (i < 0) return false;
    var kayit = yigin.splice(i, 1)[0];
    kayit.kilit.forEach(function (k) { try { k.removeAttribute('inert'); } catch (e) { } });
    if (!yigin.length) document.body.classList.remove('is-kilitli');
    var t = kayit.tetik;
    /* Odak tetikleyiciye döner. Öge çizim sırasında yok olduysa ana başlığa. */
    if (t && t.isConnected) odakla(t); else if (!yigin.length) odakAna(false);
    return true;
  };

  HP.katmanUst = function () { return yigin.length ? yigin[yigin.length - 1] : null; };

  /* Sonsuz döngü olmasın: geri çağrı yığından silmezse elle sil, silinmezse bırak. */
  HP.katmanTumKapat = function () {
    for (var n = yigin.length + 4; yigin.length && n > 0; n--) {
      var u = yigin[yigin.length - 1];
      if (u.kapat) { try { u.kapat(); } catch (e) { console.error('[HP] katman', e); } }
      if (yigin.indexOf(u) >= 0) HP.katmanKapat(u.el);
      if (yigin.indexOf(u) >= 0) { yigin.pop(); document.body.classList.remove('is-kilitli'); }
    }
  };

  function odakla(el) {
    if (!el || !el.focus) return;
    try { el.focus({ preventScroll: true }); } catch (e) { try { el.focus(); } catch (e2) { } }
  }

  /* Sekme tuzağı. inert tek başına yeterdi ama açılış animasyonu sırasında
     ve inert'ten muaf tutulan alanlarda sıra yine dışarı taşabiliyor. */
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Tab') return;
    var ust = HP.katmanUst();
    if (!ust) return;
    var a = odaklanabilir(ust.el);
    if (!a.length) return;
    var su = document.activeElement;
    /* Muaf alan varsa (mobil menü) tuzak kurma: görünür denetimler dışarıda. */
    if (ust.koru && ust.koru.length) return;
    if (!ust.el.contains(su)) { ev.preventDefault(); odakla(ev.shiftKey ? a[a.length - 1] : a[0]); return; }
    if (ev.shiftKey && su === a[0]) { ev.preventDefault(); odakla(a[a.length - 1]); }
    else if (!ev.shiftKey && su === a[a.length - 1]) { ev.preventDefault(); odakla(a[0]); }
  }, true);

  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    var ust = HP.katmanUst();
    if (ust) { ev.preventDefault(); if (ust.kapat) ust.kapat(); else HP.katmanKapat(ust.el); return; }
    HP.closeModal(); HP.closeDrawer();
  });

  /* --- 8c. sekme kalıbı: ok tuşları + gezici sekme sırası ---------------
     ÖLÇÜM: role="tab" veren altı düğmenin altısı da tabindex=0'dı (sekme
     sırasında altı durak) ve ArrowRight hiçbir şey yapmıyordu. WAI-ARIA
     sekme sözleşmesi: yalnız SEÇİLİ sekme sırada durur, oklar seçimi taşır.
     Çekirdekte duruyor ki role="tab" kullanan her sayfa aynı davranışı alsın. */
  function sekmeSirasi() {
    HP.qsa('[role="tablist"]').forEach(function (liste) {
      var a = HP.qsa('[role="tab"]', liste);
      if (!a.length) return;
      var sec = a.filter(function (t) { return t.getAttribute('aria-selected') === 'true'; })[0] || a[0];
      a.forEach(function (t) { t.setAttribute('tabindex', t === sec ? '0' : '-1'); });
    });
  }
  HP.on('render', sekmeSirasi);

  document.addEventListener('keydown', function (ev) {
    var t = ev.target;
    if (!t || !t.getAttribute || t.getAttribute('role') !== 'tab') return;
    var yon = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 1, ArrowUp: -1 }[ev.key];
    if (!yon && ev.key !== 'Home' && ev.key !== 'End') return;
    var liste = t.closest('[role="tablist"]');
    if (!liste) return;
    var dikey = liste.getAttribute('aria-orientation') === 'vertical';
    if (yon && dikey !== (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) return;
    /* RTL'de sağ ok GERİYE gider — Arapça yayında yön okunuşu tersine döner. */
    if (yon && !dikey && document.documentElement.getAttribute('dir') === 'rtl') yon = -yon;
    var a = HP.qsa('[role="tab"]', liste);
    var i = a.indexOf(t);
    if (i < 0) return;
    var h = ev.key === 'Home' ? 0 : ev.key === 'End' ? a.length - 1 : (i + yon + a.length) % a.length;
    ev.preventDefault();
    /* Seçimi mevcut data-act eylemiyle taşı; eylem markup'ı yenileyebildiği
       için odaklanacak ögeyi SONRA yeniden bul. */
    var li = HP.qsa('[role="tablist"]').indexOf(liste);
    a[h].click();
    var yeniListe = HP.qsa('[role="tablist"]')[li] || liste;
    sekmeSirasi();
    odakla(HP.qsa('[role="tab"]', yeniListe)[h] || a[h]);
  });

  /* --- 8d. tablo başlıkları --------------------------------------------
     ÖLÇÜM: #/sac-ekimi karşılaştırma tablosunda th=5 · scope=0,
     #/p-lead lead tablosunda th=7 · scope=0. Yön verilmeyen başlık
     hücresini ekran okuyucu hücreyle eşleştiremiyor. Çizim sonrası
     eksikse tamamlanır — markup'ta scope varsa dokunulmaz. */
  HP.on('render', function () {
    HP.qsa('#app table').forEach(function (tb) {
      HP.qsa('th', tb).forEach(function (th) {
        if (th.getAttribute('scope')) return;
        var satir = th.parentNode, kap = satir && satir.parentNode;
        var basSatir = (kap && kap.tagName === 'THEAD') || satir === tb.rows[0];
        th.setAttribute('scope', basSatir ? 'col' : 'row');
      });
    });
  });

  /* --- 9. katmanlar: toast · modal · drawer ---------------------------- */
  function katman(id) {
    var el = document.getElementById(id);
    if (!el) { el = document.createElement('div'); el.id = id; document.body.appendChild(el); }
    return el;
  }

  HP.toast = function (msg, tip) {
    var k = katman('hp-toast');
    var el = document.createElement('div');
    el.className = 'toast toast--' + (tip || 'ok');
    el.innerHTML = HP.icon(tip === 'uyari' ? 'alertTriangle' : 'checkCircle', 'toast__ico', 18) +
      '<span>' + esc(msg) + '</span>';
    k.appendChild(el);
    setTimeout(function () { el.classList.add('is-out'); }, 2600);
    setTimeout(function () { el.remove(); }, 3100);
  };

  HP.modal = function (o) {
    var k = katman('hp-modal');
    k.className = 'ortu is-acik';
    k.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(o.baslik || '') + '">' +
        '<div class="modal__bas">' +
          '<h2 class="modal__baslik">' + esc(o.baslik || '') + '</h2>' +
          '<button class="ikon-btn" data-act="modal:kapat" aria-label="' + esc(HP.t('genel.kapat')) + '">' +
            HP.icon('x', '', 18) + '</button>' +
        '</div>' +
        '<div class="modal__govde">' + (o.govde || '') + '</div>' +
        (o.alt ? '<div class="modal__alt">' + o.alt + '</div>' : '') +
      '</div>';
    /* Odak içeri taşınır, arka plan inert olur, Escape ve Tab sözleşmesi
       katman yöneticisinden gelir (bkz. 8b). */
    HP.katmanAc(k.querySelector('.modal'), { tetik: o.tetik, kapat: HP.closeModal });
  };
  HP.closeModal = function () {
    var k = document.getElementById('hp-modal');
    if (!k || !k.classList.contains('is-acik')) return;
    HP.katmanKapat(k.querySelector('.modal') || k);
    k.className = 'ortu'; k.innerHTML = '';
  };
  HP.act('modal:kapat', HP.closeModal);

  HP.drawer = function (o) {
    var k = katman('hp-drawer');
    k.className = 'ortu ortu--sag is-acik';
    k.innerHTML =
      '<aside class="cekmece" role="dialog" aria-modal="true" aria-label="' + esc(o.baslik || '') + '">' +
        '<div class="cekmece__bas">' +
          '<div>' +
            (o.ust ? '<div class="cekmece__ust">' + esc(o.ust) + '</div>' : '') +
            '<h2 class="cekmece__baslik">' + esc(o.baslik || '') + '</h2>' +
          '</div>' +
          '<button class="ikon-btn" data-act="cekmece:kapat" aria-label="' + esc(HP.t('genel.kapat')) + '">' +
            HP.icon('x', '', 18) + '</button>' +
        '</div>' +
        '<div class="cekmece__govde">' + (o.govde || '') + '</div>' +
        (o.alt ? '<div class="cekmece__alt">' + o.alt + '</div>' : '') +
      '</aside>';
    HP.katmanAc(k.querySelector('.cekmece'), { tetik: o.tetik, kapat: HP.closeDrawer });
  };
  HP.closeDrawer = function () {
    var k = document.getElementById('hp-drawer');
    if (!k || !k.classList.contains('is-acik')) return;
    HP.katmanKapat(k.querySelector('.cekmece') || k);
    k.className = 'ortu ortu--sag'; k.innerHTML = '';
  };
  HP.act('cekmece:kapat', HP.closeDrawer);

  document.addEventListener('click', function (ev) {
    if (ev.target.id === 'hp-modal') HP.closeModal();
    if (ev.target.id === 'hp-drawer') HP.closeDrawer();
  });

  /* --- 10. erişilebilirlik: atlama · odak · duyuru --------------------- */
  /* Tek sayfa uygulamasında rota değişince belge yeniden yazılır ama ODAK
     eski yerinde kalır: klavye kullanıcısı yeni sayfanın ortasından devam
     eder, ekran okuyucu ise hiçbir şey söylemez. Üç önlem:
       1) her çizimin İLK odaklanabilir ögesi "içeriğe atla" bağlantısıdır,
       2) rota değişiminde odak ana başlığa taşınır (sayfa KAYDIRILMADAN),
       3) görsel gizli aria-live bölgesi hangi sayfanın açıldığını söyler. */

  function anaBaslik() {
    var kok = document.getElementById('app');
    if (!kok || !kok.querySelector) return null;
    return kok.querySelector('h1') || kok.querySelector('main') || null;
  }

  /* kaydir=false → preventScroll: odak halkası için sayfa başa zıplamaz.
     Programatik focus() :focus-visible tetiklemez, görsel halka çıkmaz. */
  function odakAna(kaydir) {
    var h = anaBaslik();
    if (!h || !h.focus) return;
    try { h.setAttribute('tabindex', '-1'); } catch (e) { }
    try { h.focus({ preventScroll: !kaydir }); }
    catch (e) { try { h.focus(); } catch (e2) { } }
    if (kaydir && h.scrollIntoView) { try { h.scrollIntoView(); } catch (e3) { } }
  }
  HP.odakAna = odakAna;
  HP.act('atla', function () { odakAna(true); });

  var duyuruEl = null;
  function duyuruAlani() {
    if (duyuruEl) return duyuruEl;
    var el = document.getElementById('hp-duyuru');
    if (!el) {
      el = document.createElement('div');
      el.id = 'hp-duyuru';
      el.className = 'sr';
      el.setAttribute('aria-live', 'polite');
      el.setAttribute('aria-atomic', 'true');
      try { document.body.appendChild(el); } catch (e) { }
    }
    duyuruEl = el;
    return el;
  }
  /* Metni önce boşaltıp gecikmeyle yazmak şart: aynı düğüme aynı anda yazılan
     metni ekran okuyucular "değişmedi" sayıp sessiz geçiyor. */
  function duyur() {
    var el = duyuruAlani();
    if (!el) return;
    /* Sayfanın KENDİ h1'i en kısa ve en dürüst addır (kelime bütçesi ≤7).
       Bulunamazsa SEO adına düşülür — o anahtar kelime yüklü olduğu için
       dinlemesi daha uzundur, bu yüzden ikinci sırada. */
    var h = anaBaslik();
    var ad = (h && h.tagName === 'H1' && (h.textContent || '').trim()) || '';
    if (!ad || ad.length > 80) ad = (HP.seo && HP.seo.ad) ? HP.seo.ad() : '';
    if (!ad) return;
    el.textContent = '';
    setTimeout(function () { el.textContent = HP.t('a11y.acildi', { sayfa: ad }); }, 140);
  }

  /* --- 11. çizim (görünüme kabuk + sayfa) ------------------------------ */
  var ilkCizim = true;

  HP.render = function () {
    /* Açık katman kalırsa arka planın `inert` kilidi de kalır: yeni sayfa
       çizilir ama klavye ve ekran okuyucu ona ULAŞAMAZ. Çizimden önce boşalt. */
    if (HP.katmanUst()) HP.katmanTumKapat();
    var r = HP.route = hashOku();
    var sayfa = SAYFALAR[r.id];
    var kok = document.getElementById('app');
    var govde = '';
    try {
      govde = sayfa.render(r.param) || '';
    } catch (e) {
      console.error('[HP] sayfa hatası:', r.id, e);
      govde = '<div class="kap"><div class="bos"><p>' + esc(HP.t('genel.hata')) + '</p></div></div>';
    }
    /* Atlama bağlantısının href'i AYNI rotayı gösterir: eylem yakalanmazsa
       bile hash değişmez, yönlendirici tekrar çizmez. */
    var atlaHref = '#/' + r.id + (r.param ? '/' + r.param : '');
    kok.innerHTML =
      '<a class="atla" href="' + esc(atlaHref) + '" data-act="atla">' +
        esc(HP.t('a11y.atla')) + '</a>' +
      (r.bolum === 'panel' ? HP.panelKabuk(govde) : HP.siteKabuk(govde));
    document.documentElement.setAttribute('data-bolum', r.bolum);
    document.documentElement.setAttribute('data-sayfa', r.id);
    window.scrollTo(0, 0);
    tetikle('render');
    /* Duyuru bölgesi İLK çizimde de kurulur: ekran okuyucular yalnız kendinden
       ÖNCE var olan aria-live bölgesindeki değişimi okur. */
    duyuruAlani();
    /* Açılışta odağı çalmak yanlış olur; yalnız rota/dil değişiminde taşı. */
    if (ilkCizim) ilkCizim = false;
    else { odakAna(false); duyur(); }
  };

  window.addEventListener('hashchange', HP.render);

  /* --- 12. açılış ------------------------------------------------------ */
  HP.boot = function () {
    var l = null;
    /* ?dil=en gibi bir parametre varsa o kazanir: dogrudan paylasilabilir link. */
    var m = /[?&]dil=(tr|en|ar)/.exec(location.search || '') || /[?&]dil=(tr|en|ar)/.exec(location.hash || '');
    if (m) l = m[1];
    if (!l) { try { l = localStorage.getItem('hp.lang'); } catch (e) { } }
    HP.lang = DILLER.indexOf(l) >= 0 ? l : 'tr';
    document.documentElement.setAttribute('lang', HP.lang);
    document.documentElement.setAttribute('dir', HP.lang === 'ar' ? 'rtl' : 'ltr');
    document.documentElement.setAttribute('data-lang', HP.lang);
    document.documentElement.setAttribute('data-regime', HP.regime());
    HP.render();
  };
})(window.HP);

/* ===== src/66-marka.js ===== */
/* ============================================================================
   HairPro — 66-marka.js · MARKA KATMANI
   Kliniğin KENDİ logosundan türetilmiştir (yüksek çözünürlüklü kaynak, 08-21).

   Logonun üç unsuru var: serif H+P harf kilidi · H'ye işlenmiş yüz profili ·
   P'nin gövdesini oluşturan SAÇ FOLİKÜLÜ (tel + kök soğanı + kılıf halkası).
   Bunlardan yalnız FOLİKÜL sistemleştirilir: her ölçekte net, tek renkli,
   ve konuyla birebir aynı şey (bir greft = bir folikül). Ornate logo ise
   yer bulduğu yerde (alt bilgi, açılış anı) OLDUĞU GİBİ kullanılır —
   34px'e sıkıştırılmaz, çünkü krom bizote o ölçekte gri lekeye dönüşüyor.

   Dışa açılan: HP.marka.motif() · HP.marka.nav() · HP.marka.kilit()
   ========================================================================== */
(function (HP) {
  'use strict';

  var esc = HP.esc, t = HP.t;

  function r1(v) { return Math.round(v * 10) / 10; }

  /* --- sabit tohumlu üreteç: aynı girdi her zaman aynı deseni verir ------ */
  function uretec(tohum) {
    var s = (tohum * 7919 + 13) % 2147483647;
    return function () {
      s = (s * 48271) % 2147483647;
      return s / 2147483647;
    };
  }

  /* ======================================================================
     1) 1 cm² yoğunluk plakası — greft = nokta + kısa saç sapı
     ====================================================================== */
  function plakaSvg(n) {
    var VB = 120, PAD = 11, ALAN = VB - PAD * 2;
    var cols = Math.ceil(Math.sqrt(n));
    var rows = Math.ceil(n / cols);
    /* Tek satirlar yarim hucre kaydirilir; sigmasi icin sutun genisligi buna gore. */
    var cw = ALAN / (cols + 0.5), ch = ALAN / rows;
    /* Greft fiziksel olarak sabit boyuttadir: yaricap kademeye gore degismez. */
    var r = 2.5;
    var rnd = uretec(n);
    var i = 0, row, col, cx, cy, ac, sap, kaydir;

    var izgara = '';
    for (var k = 1; k < 4; k++) {
      var p = r1(PAD + ALAN * k / 4);
      izgara += '<line x1="' + p + '" y1="' + PAD + '" x2="' + p + '" y2="' + (PAD + ALAN) + '"/>' +
        '<line x1="' + PAD + '" y1="' + p + '" x2="' + (PAD + ALAN) + '" y2="' + p + '"/>';
    }

    var dots = '';
    for (row = 0; row < rows && i < n; row++) {
      kaydir = (row % 2) ? cw * 0.5 : 0;
      for (col = 0; col < cols && i < n; col++) {
        cx = PAD + col * cw + cw / 2 + kaydir + (rnd() - 0.5) * cw * 0.28;
        cy = PAD + row * ch + ch / 2 + (rnd() - 0.5) * ch * 0.28;
        cx = r1(cx); cy = r1(cy);
        ac = -1.24 + rnd() * 0.62;
        sap = 8.4;
        dots += '<line x1="' + cx + '" y1="' + cy + '" x2="' + r1(cx + Math.cos(ac) * sap) +
          '" y2="' + r1(cy + Math.sin(ac) * sap) + '" stroke="currentColor" stroke-opacity=".42" stroke-width="' +
          r1(r * 0.52) + '" stroke-linecap="round"/>';
        dots += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r1(r) + '" fill="currentColor"/>';
        i++;
      }
    }

    return '<svg viewBox="0 0 ' + VB + ' ' + VB + '" width="100%" role="img" aria-label="' +
        esc(t('sn.yog.aria', { n: n })) + '">' +
      '<g stroke="currentColor" stroke-opacity=".10" stroke-width=".6">' + izgara + '</g>' +
      '<rect x="' + PAD + '" y="' + PAD + '" width="' + ALAN + '" height="' + ALAN +
        '" fill="none" stroke="currentColor" stroke-opacity=".24" stroke-width=".9"/>' +
      '<g class="sn-nokta">' + dots + '</g>' +
    '</svg>';
  }

  /* Dışa açık: "kaç greft ne demek" sorusunu gösterek yanıtlayan blok. */
  HP.parca.yogunluk = function () {
    var kademe = [20, 35, 45];
    var kutular = kademe.map(function (n, ix) {
      return '<div class="sn-yog__k' + (ix === 1 ? ' sn-yog__k--vurgu' : '') + '">' +
        '<div class="sn-yog__kare">' + plakaSvg(n) +
          '<span class="sn-yog__olcu">' + esc(t('sn.yog.olcu')) + '</span></div>' +
        '<div class="sn-yog__ust">' +
          '<b class="sn-yog__n sayi">' + HP.num(n) + '</b>' +
          '<span class="sn-yog__birim">' + esc(t('sn.yog.birim')) + '</span>' +
        '</div>' +
        '<span class="sn-yog__et">' + esc(t('sn.yog.' + (ix + 1) + '.et')) + '</span>' +
        '<p class="sn-yog__mt">' + esc(t('sn.yog.' + (ix + 1) + '.mt')) + '</p>' +
      '</div>';
    }).join('');

    return '<div class="sn-yog">' +
      '<div class="sn-yog__yazi">' +
        '<h2 class="d3">' + esc(t('sn.yog.baslik')) + '</h2>' +
        '<p class="g ikincil olcu-dar">' + esc(t('sn.yog.alt')) + '</p>' +
        '<p class="g-xs ucuncul olcu-dar sn-yog__not">' + esc(t('sn.yog.not')) + '</p>' +
      '</div>' +
      '<div class="sn-yog__liste">' + kutular + '</div>' +
    '</div>';
  };

  /* ======================================================================
     2) Vaka ayrıntı çekmecesi
     ====================================================================== */

  /* Greft dağılımı: bölgeye göre sabit ağırlık — veri uydurulmaz, türetilir. */
  var DAGILIM = {
    on:    [['greft.b1', 0.52], ['greft.b3', 0.30], ['greft.b2', 0.18]],
    orta:  [['greft.b3', 0.46], ['greft.b1', 0.28], ['greft.b2', 0.26]],
    tepe:  [['greft.b2', 0.52], ['greft.b3', 0.30], ['greft.b1', 0.18]],
    sakal: [['sn.b.cene', 0.45], ['sn.b.favori', 0.35], ['sn.b.biyik', 0.20]]
  };

  function dagilim(v) {
    var pay = DAGILIM[v.bolge] || DAGILIM.on;
    var out = [], kalan = v.greft, i;
    for (i = 0; i < pay.length - 1; i++) {
      var d = Math.round(v.greft * pay[i][1] / 10) * 10;
      out.push({ k: pay[i][0], n: d });
      kalan -= d;
    }
    out.push({ k: pay[pay.length - 1][0], n: kalan });
    return out;
  }

  function opTarihISO(ay) {
    var d = new Date(HP.NOW.getTime());
    d.setMonth(d.getMonth() - ay);
    return d.toISOString();
  }

  function semaBlok(v) {
    return '<div class="sn-blok">' +
      '<div class="sn-bas">' + esc(t('sn.bas.sema')) + '</div>' +
      '<div class="sn-krs">' +
        '<div class="sn-krs__k">' + HP.norwoodSvg(v.norwood) +
          '<span class="sn-krs__et">' + esc(t('sonuc.oncesi')) + '</span>' +
          '<span class="sn-krs__n sayi">' + esc(t('sn.k.evre', { n: v.norwood })) + '</span>' +
        '</div>' +
        '<div class="sn-krs__ok">' + HP.icon('arrowRight', '', 20) + '</div>' +
        '<div class="sn-krs__k">' + HP.karsilastirSvg('sonra') +
          '<span class="sn-krs__et">' + esc(t('sonuc.sonrasi')) + '</span>' +
          '<span class="sn-krs__n sayi">' + v.ay + esc(t('sonuc.ay')) + '</span>' +
        '</div>' +
      '</div>' +

  }

  function dagilimBlok(v) {
    var d = dagilim(v);
    var enb = Math.max(d[0].n, d[1].n, d[2].n) || 1;
    var cubuk = d.map(function (x) {
      var oran = Math.round(x.n / v.greft * 100);
      return '<div class="sn-bar__d">' +
        '<span class="sn-bar__et">' + esc(t(x.k)) + '</span>' +
        '<span class="sn-bar__v sayi">' + HP.num(x.n) + ' · ' + oran + '%</span>' +
        '<span class="sn-bar__yol"><span class="sn-bar__dol" style="width:' +
          Math.round(x.n / enb * 100) + '%"></span></span>' +
      '</div>';
    }).join('');
    return '<div class="sn-blok">' +
      '<div class="sn-bas">' + esc(t('sn.bas.dagilim')) + '</div>' +
      '<div class="sn-bar">' + cubuk + '</div>' +
    '</div>';
  }

  function kunyeBlok(v) {
    var satir = [
      ['sn.k.kod', esc(v.kod), true],
      ['sn.k.teknik', esc(v.teknik), false],
      ['sn.k.greft', HP.num(v.greft) + ' ' + esc(t('sonuc.greft')), true],
      ['sn.k.nw', esc(t('sn.k.evre', { n: v.norwood })), false],
      ['sn.k.tarih', esc(HP.date(opTarihISO(v.ay))), false],
      ['sn.k.ay', v.ay + esc(t('sonuc.ay')), true]
    ].map(function (s) {
      return '<dt>' + esc(t(s[0])) + '</dt><dd' + (s[2] ? ' class="sayi"' : '') + '>' + s[1] + '</dd>';
    }).join('');
    return '<div class="sn-blok">' +
      '<div class="sn-bas">' + esc(t('sn.bas.kunye')) + '</div>' +
      '<dl class="sn-kunye">' + satir + '</dl>' +
    '</div>';
  }

  /* Zaman çizelgesi: 0. gün → 12. ay. Vakanın bulunduğu ay işaretlenir. */
  var ADIM = [
    { i: 1, ay: 0 }, { i: 2, ay: 0.34 }, { i: 3, ay: 1 },
    { i: 4, ay: 3 }, { i: 5, ay: 6 }, { i: 6, ay: 12 }
  ];

  function zamanBlok(v) {
    var son = -1, i;
    for (i = 0; i < ADIM.length; i++) { if (v.ay >= ADIM[i].ay) son = i; }
    var satir = ADIM.map(function (a, ix) {
      var gecti = v.ay >= a.ay;
      return '<div class="sn-zaman__d' + (gecti ? ' is-gecti' : '') + '">' +

              '<span class="sn-zaman__simdi">' + esc(t('sn.z.simdi', { n: v.ay })) + '</span>' +
            '</div>'
          : '');
    }).join('');
    return '<div class="sn-blok">' +
      '<div class="sn-bas">' + esc(t('sn.bas.zaman')) + '</div>' +
      '<div class="sn-zaman">' + satir + '</div>' +

    var L = HP.VAKA || [];

  };

  HP.act('vaka-detay', function (el) {
    HP.vakaDetay(el.getAttribute('data-kod'));
  });
})(window.HP);

      },

      },
      mezo: {
        ad: 'الميزوثيرابي',
        kisa: 'خليط فيتامينات ومعادن يُوصَّل إلى الفروة بإبر دقيقة.',
        uzun: 'يُترك الخليط عند العمق الذي تجلس فيه الجذور. هو عناية داعمة: لا يعيد الشعر إلى منطقة خلت تمامًا، وليس بديلًا عن العملية.'
      }
    }
  };

  /* --- terim verisini sözlüğe düz anahtar olarak yaz ------------------------
     Parite kurulum anında garanti edilir: üç dil de aynı TERIM iskeletinden
     üretilir, yani bir dilde unutulan alan derlemede değil BURADA patlar. */
  HP.I18N = HP.I18N || {};
  ['tr', 'en', 'ar'].forEach(function (dil) {
    var hedef = HP.I18N[dil] = HP.I18N[dil] || {};
    SIRA.forEach(function (k) {
      var d = TERIM[dil][k];
      hedef['sz.' + k + '.ad'] = d.ad;
      hedef['sz.' + k + '.kisa'] = d.kisa;
      hedef['sz.' + k + '.uzun'] = d.uzun;
      if (d.olcu) hedef['sz.' + k + '.olcu'] = d.olcu;
    });
  });

  /* Hangi terimin ölçüsü var: t() yalnız TANIMLI anahtar için çağrılsın. */
  var OLCULU = {};
  SIRA.forEach(function (k) { if (TERIM.tr[k].olcu) OLCULU[k] = true; });

  HP.I18N.tr = Object.assign(HP.I18N.tr, {
    'sz.baslik': 'Terimler',
    'sz.alt': 'Sayfalarda geçen tıbbi kelimelerin gündelik Türkçe karşılığı.',
    'sz.olcuEt': 'Ölçü',
    'sz.daha': 'Tüm terimler',
    'sz.ac': 'Terimin anlamı: {ad}',
    'sz.not': 'Tanımlar genel bilgidir; sizin durumunuz muayenede ölçülür.'
  });
  HP.I18N.en = Object.assign(HP.I18N.en, {
    'sz.baslik': 'Terms',
    'sz.alt': 'The medical words used across these pages, in plain English.',
    'sz.olcuEt': 'Measure',
    'sz.daha': 'All terms',
    'sz.ac': 'What {ad} means',
    'sz.not': 'These definitions are general; your own case is measured in consultation.'
  });
  HP.I18N.ar = Object.assign(HP.I18N.ar, {
    'sz.baslik': 'المصطلحات',
    'sz.alt': 'الكلمات الطبية الواردة في الصفحات بلغة يومية مفهومة.',
    'sz.olcuEt': 'القياس',
    'sz.daha': 'كل المصطلحات',
    'sz.ac': 'معنى {ad}',
    'sz.not': 'التعريفات معلومات عامة، وحالتك تُقاس في الفحص.'
  });

  /* ==========================================================================
     2 — DESENLER: terim metinde nasıl görünüyor
     Sıra ÖZGÜLLÜKTEN genele: "greft/cm²" önce yakalanmalı, yoksa "greft"
     onu yer. "safir FUE" de "FUE"den önce gelir.
     ⚠ Lookbehind KULLANILMAZ (eski iOS Safari'de sözdizimi hatası verip TÜM
     betiği düşürüyor). Sol sınır yakalanan gruba alınıp indeksle telafi edilir.
     ========================================================================== */
  var TARAMA = ['yogunluk', 'sok', 'safir', 'donor', 'norwood', 'trassiz',
                'mezo', 'prp', 'dhi', 'fue', 'folikul', 'greft'];

  var GOVDE = {
    /* ⚠ İLK HARF İKİ HALDE de yazılabilir: cümle başındaki "Greft sayısında"
       küçük harfli desenle kaçıyordu ve işaret gövde metni yerine bir arayüz
       hapına düşüyordu (ölçüldü, #/anasayfa). */
    tr: {
      yogunluk: '[Gg]reft\\s*/\\s*cm²|[Yy]oğunlu[kğ]\\p{L}*',
      sok:      '[Şş]ok\\s+dökülme\\p{L}*',
      safir:    '[Ss]afir(?:\\s+FUE)?',
      donor:    '[Dd]onör(?:\\s+(?:alan|bölge)\\p{L}*)?',
      norwood:  'Norwood(?:\\s+evre\\p{L}*)?',
      trassiz:  '[Tt]raşsız',
      mezo:     '[Mm]ezoterapi\\p{L}*',
      prp:      'PRP',
      dhi:      'DHI',
      fue:      'FUE',
      folikul:  '[Ff]olikül\\p{L}*',
      greft:    '[Gg]reft\\p{L}*'
    },
    en: {
      yogunluk: '[Gg]rafts?\\s*/\\s*cm²|[Dd]ensit(?:y|ies)',
      sok:      '[Ss]hock\\s+(?:loss|shedding)',
      safir:    '[Ss]apphire(?:\\s+FUE)?',
      donor:    '[Dd]onor(?:\\s+(?:area|zone|region))?',
      norwood:  'Norwood(?:\\s+(?:stage|scale))?',
      trassiz:  '[Nn]o-shave|[Uu]nshaven',
      mezo:     '[Mm]esotherapy',
      prp:      'PRP',
      dhi:      'DHI',
      fue:      'FUE',
      folikul:  '[Ff]ollicular\\s+units?|[Ff]ollicles?',
      greft:    '[Gg]rafts?'
    },
    ar: {
      /* Arapçada tanım ve bağlaç harfleri kelimeye BİTİŞİK yazılır
         (ال، وال، بال، لل، ب، ك، ل، و، ف) — sol sınır bu yüzden desene
         alternatif olarak eklenir, yoksa "والبصيلات" hiç yakalanmaz. */
      yogunluk: 'طُعم\\s*/\\s*سم²|(?:وال|بال|فال|كال|ال|لل|[وفبكل])?كثاف\\p{L}*',
      sok:      '(?:ال)?تساقط\\s+(?:ال)?صدم\\p{L}*',
      safir:    '(?:وال|بال|ال|[وفبكل])?ياقوت\\p{L}*',
      donor:    '(?:ال)?منطق(?:ة|تك|تها)\\s+(?:ال)?مانحة|(?:ال)?مانحة',
      norwood:  '(?:درجة\\s+)?نوروود|Norwood',
      /* Yalnız OLUMSUZ kalıp: çıplak "حلاقة" (tıraş) tersini söyler,
         işaret oraya düşünce terim yanlış cümleye bağlanıyordu. */
      trassiz:  '(?:بلا|دون|بدون)\\s+حلاقة',
      mezo:     '(?:وال|بال|ال|[وفبكل])?ميزوثيرابي',
      prp:      'PRP',
      dhi:      'DHI',
      fue:      'FUE',
      folikul:  '(?:وال|بال|فال|كال|ال|لل|[وفبكل])?بصيل(?:ات|ة|تين|تي)?',
      greft:    '(?:وال|بال|فال|كال|ال|لل|[وفبكل])?ط[\\u064B-\\u0652]*ع[\\u064B-\\u0652]*(?:وم|م)[\\u064B-\\u0652]*(?:ًا)?'
    }
  };

  /* Derlenmiş RegExp önbelleği: her çizimde yeniden kurulmasın. */
  var DERLI = {};
  function desen(dil, k) {
    var anahtar = dil + '|' + k;
    if (!DERLI[anahtar]) {
      var g = (GOVDE[dil] || GOVDE.tr)[k];
      /* 1. grup = sol sınır (satır başı ya da harf/rakam olmayan tek karakter),
         2. grup = terimin kendisi. Sağ sınır ileri-bakışla, tüketilmeden. */
      DERLI[anahtar] = new RegExp('(^|[^\\p{L}\\p{N}_])(' + g + ')(?![\\p{L}\\p{N}_])', 'u');
    }
    return DERLI[anahtar];
  }

  /* ==========================================================================
     3 — İŞARETLEYİCİ
     ========================================================================== */

  /* Metin düğümüne DOKUNULMAYACAK kaplar. <a> ve <button> içinde işaret
     açmak iç içe etkileşim olurdu; başlıklarda kesik çizgi display ölçekte
     kalın durur; <svg>/<canvas> zaten metin taşımaz. */
  var YASAK_ETIKET = {
    SCRIPT: 1, STYLE: 1, SVG: 1, PATH: 1, CANVAS: 1, IFRAME: 1, TEMPLATE: 1,
    INPUT: 1, TEXTAREA: 1, SELECT: 1, OPTION: 1, LABEL: 1,
    A: 1, BUTTON: 1, SUMMARY: 1, CODE: 1, PRE: 1, TIME: 1,
    H1: 1, H2: 1, H3: 1
  };
  /* Sözlüğün KENDİSİ taranmaz: tanımın içinde terimi işaretlemek döngü olur. */
  /* `hap` de dışarıda: kart altındaki "Sınırlı greft" gibi arayüz hapları
     gövde metni değil, etikettir — işaret oraya düşünce okurun terimi
     tanıyacağı CÜMLE işaretsiz kalıyordu. */
  var YASAK_SINIF = ['sz', 'sz-liste', 'sz-kat', 'etiket', 'sayi', 'segment', 'hap'];

  function taranabilir(dugum, kok) {
    var el = dugum.parentNode;
    while (el && el !== kok) {
      if (el.nodeType !== 1) return false;
      if (YASAK_ETIKET[el.tagName]) return false;
      if (el.getAttribute && el.getAttribute('aria-hidden') === 'true') return false;
      var s = el.classList;
      if (s) {
        for (var i = 0; i < YASAK_SINIF.length; i++) if (s.contains(YASAK_SINIF[i])) return false;
      }
      el = el.parentNode;
    }
    return !!el;
  }

  /* TreeWalker ile TEK geçiş: metin düğümleri diziye alınır. Diziye alma
     nedeni, sarma işleminin ağacı değiştirmesi — canlı gezginle mutasyon
     birbirini yer. */
  function metinDugumleri(kok) {
    var w = document.createTreeWalker(kok, 4 /* SHOW_TEXT */, {
      acceptNode: function (n) {
        if (!n.nodeValue || n.nodeValue.length < 3 || !/\S/.test(n.nodeValue)) return 2 /* REJECT */;
        return taranabilir(n, kok) ? 1 /* ACCEPT */ : 2;
      }
    });
    var liste = [], n;
    while ((n = w.nextNode())) liste.push(n);
    return liste;
  }

  function sar(dugum, bas, son, k) {
    var metin = dugum.nodeValue, ana = dugum.parentNode;
    if (!ana) return null;
    var b = document.createElement('button');
    b.className = 'sz';
    b.type = 'button';
    b.setAttribute('data-act', 'sozluk');
    b.setAttribute('data-sz', k);
    b.setAttribute('aria-expanded', 'false');
    b.setAttribute('aria-haspopup', 'dialog');
    b.setAttribute('aria-label', t('sz.ac', { ad: t('sz.' + k + '.ad') }));
    b.appendChild(document.createTextNode(metin.slice(bas, son)));

    var artik = document.createTextNode(metin.slice(son));
    if (bas > 0) ana.insertBefore(document.createTextNode(metin.slice(0, bas)), dugum);
    ana.insertBefore(b, dugum);
    ana.insertBefore(artik, dugum);
    ana.removeChild(dugum);
    return artik;
  }

  var taraniyor = false;
  function tara() {
    /* Sunucu/VM ortamında TreeWalker yok: denetim betikleri bu yolu atlar. */
    if (taraniyor || typeof document === 'undefined' || !document.createTreeWalker) return;
    var kok = document.querySelector('.sayfa') || document.getElementById('app');
    if (!kok) return;
    taraniyor = true;
    try {
      var dugumler = metinDugumleri(kok);
      var dil = HP.lang;
      for (var i = 0; i < TARAMA.length; i++) {
        var k = TARAMA[i], re = desen(dil, k);
        for (var j = 0; j < dugumler.length; j++) {
          var d = dugumler[j];
          if (!d.parentNode) continue;
          var m = re.exec(d.nodeValue);
          if (!m) continue;
          var bas = m.index + m[1].length;
          var artik = sar(d, bas, bas + m[2].length, k);
          if (artik) dugumler[j] = artik;   /* kalan metin sonraki terimlere açık */
          break;                            /* sayfada BİR kez */
        }
      }
    } catch (e) {
      if (window.console) console.error('[HP] sözlük taraması', e);
    }
    taraniyor = false;
  }

  /* ==========================================================================
     4 — BALON / ALT SAYFA
     ========================================================================== */
  var acikDugme = null;

  function katman() {
    var el = document.getElementById('hp-sozluk');
    if (!el) {
      el = document.createElement('div');
      el.id = 'hp-sozluk';
      el.className = 'sz-kat';
      document.body.appendChild(el);
    }
    return el;
  }

  function govde(k) {
    var olcu = OLCULU[k]
      ? '<div class="sz-balon__olcu">' +
          '<span class="sz-balon__et">' + esc(t('sz.olcuEt')) + '</span>' +
          '<span class="sz-balon__deger">' + esc(t('sz.' + k + '.olcu')) + '</span>' +
        '</div>'
      : '';
    return '<div class="sz-perde" data-act="sozluk:kapat"></div>' +
      '<div class="sz-balon" role="dialog" aria-label="' + esc(t('sz.' + k + '.ad')) + '">' +
        '<div class="sz-balon__tut"></div>' +
        '<div class="sz-balon__bas">' +
          (HP.marka && HP.marka.motif ? HP.marka.motif(18, { duz: true, sinif: 'sz-balon__im' }) : '') +
          '<b class="sz-balon__ad">' + esc(t('sz.' + k + '.ad')) + '</b>' +
          '<button class="ikon-btn sz-balon__kapat" data-act="sozluk:kapat" aria-label="' +
            esc(t('genel.kapat')) + '">' + HP.icon('x', '', 16) + '</button>' +
        '</div>' +
        '<p class="sz-balon__tanim">' + esc(t('sz.' + k + '.kisa')) + '</p>' +
        olcu +
        '<a class="sz-balon__daha" href="#/blog" data-act="sozluk:liste">' + esc(t('sz.daha')) + '</a>' +
      '</div>';
  }

  /* Balon, işaretin altına ya da (yer yoksa) üstüne oturur. Konum CSS özel
     değişkenleriyle verilir; satır içi `style` niteliği yazılmaz. */
  function yerlestir() {
    if (!acikDugme) return;
    var kat = document.getElementById('hp-sozluk');
    var balon = kat && kat.querySelector('.sz-balon');
    if (!balon) return;
    if (window.matchMedia && window.matchMedia('(max-width: 640px)').matches) return; /* alt sayfa */

    var r = acikDugme.getBoundingClientRect();
    var gw = window.innerWidth, gh = window.innerHeight;
    var bw = balon.offsetWidth, bh = balon.offsetHeight;
    var kenar = 12;

    var x = r.left + r.width / 2 - bw / 2;
    x = Math.max(kenar, Math.min(x, gw - bw - kenar));

    var ust = (r.bottom + bh + 14 > gh) && (r.top - bh - 14 > 0);
    var y = ust ? r.top - bh - 10 : r.bottom + 10;

    balon.classList.toggle('sz-balon--ust', ust);
    balon.style.setProperty('--sz-x', Math.round(x) + 'px');
    balon.style.setProperty('--sz-y', Math.round(y) + 'px');
    /* Ok, işaretin ortasını gösterir; balon kenara yaslandıysa ok kaymaz. */
    var ok = r.left + r.width / 2 - x - 5;
    balon.style.setProperty('--sz-ok', Math.round(Math.max(12, Math.min(ok, bw - 22))) + 'px');
  }

  function ac(dugme, k) {
    kapat(true);
    var kat = katman();
    kat.innerHTML = govde(k);
    kat.classList.add('is-acik');
    acikDugme = dugme;
    dugme.setAttribute('aria-expanded', 'true');
    yerlestir();
  }

  function kapat(sessiz) {
    var kat = document.getElementById('hp-sozluk');
    if (kat) { kat.classList.remove('is-acik'); kat.innerHTML = ''; }
    if (acikDugme) {
      acikDugme.setAttribute('aria-expanded', 'false');
      /* Odak işaretin kendisine döner: klavye kullanıcısı okuduğu cümlenin
         içinde kalır, sayfanın başına fırlamaz. */
      if (!sessiz && acikDugme.focus) acikDugme.focus();
      acikDugme = null;
    }
  }
  HP.sozlukKapat = kapat;

  HP.act('sozluk', function (el) {
    var k = el.getAttribute('data-sz');
    if (!k || !TERIM.tr[k]) return;
    if (acikDugme === el) { kapat(); return; }
    ac(el, k);
  });
  HP.act('sozluk:kapat', function () { kapat(); });
  HP.act('sozluk:liste', function () { kapat(true); HP.go('blog'); });

  /* Dışarı tıklama · Escape · kaydırma/boyut değişimi */
  document.addEventListener('click', function (ev) {
    if (!acikDugme) return;
    if (ev.target.closest && (ev.target.closest('.sz-balon') || ev.target.closest('.sz'))) return;
    kapat(true);
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && acikDugme) kapat();
  });
  window.addEventListener('scroll', function () { yerlestir(); }, { passive: true });
  window.addEventListener('resize', function () { yerlestir(); });

  /* ==========================================================================
     5 — TAM SÖZLÜK BÖLÜMÜ (#/blog)
     Kendi akordiyonunu kurmaz: sayfadaki .sss kalıbı ve `sss` eylemi aynen
     kullanılır — kullanıcıya ikinci bir aç-kapa davranışı öğretilmez.
     ========================================================================== */
  HP.parca = HP.parca || {};
  HP.parca.sozlukBolum = function () {
    var liste = SIRA.map(function (k) {
      var olcu = OLCULU[k]
        ? '<span class="sz-olcu">' +
            '<span class="sz-olcu__et">' + esc(t('sz.olcuEt')) + '</span>' +
            '<span class="sz-olcu__deger">' + esc(t('sz.' + k + '.olcu')) + '</span>' +
          '</span>'
        : '';
      return '<div class="sss__o">' +
        /* Satır başında folikül motifi DENENDİ ve kaldırıldı: on iki satırda
           tekrarlanınca 15px'te eğik çizgiye benziyor, ad ile arasında da
           yapay bir girinti yaratıyordu. Motif yalnız balonda kalır. */
        '<button class="sss__s" data-act="sss" aria-expanded="false">' +
          '<span>' + esc(t('sz.' + k + '.ad')) + '</span>' +
          HP.icon('chevronDown', '', 20) +
        '</button>' +
        '<div class="sss__c" hidden>' +
          '<span>' + esc(t('sz.' + k + '.uzun')) + '</span>' + olcu +
        '</div>' +
      '</div>';
    }).join('');

    return '<section class="bolum bolum--kagit"><div class="kap">' +
      '<div class="izgara iz-35">' +
        '<div class="yigin g3">' +
          '<span class="etiket bas__etiket">' + esc(t('nav.blog')) + '</span>' +
          '<h2 class="d3">' + esc(t('sz.baslik')) + '</h2>' +
          '<p class="g-sm ikincil olcu-dar">' + esc(t('sz.alt')) + '</p>' +
          '<p class="g-xs ucuncul olcu-dar">' + esc(t('sz.not')) + '</p>' +
        '</div>' +
        '<div class="sz-liste"><div class="sss">' + liste + '</div></div>' +
      '</div>' +
    '</div></section>';
  };

  /* Her çizimden sonra: açık balonu kapat, sayfayı yeniden işaretle. */
  HP.on('render', function () { kapat(true); tara(); });
}(window.HP = window.HP || {}));

/* ===== src/68-hukuk.js ===== */
/* ============================================================================
   HairPro — 68-hukuk.js · ÜÇ YASAL ROTA: #/kvkk · #/cerez · #/mevzuat

   Neden ayrı dosya: alt bilgideki üç yasal bağlantının üçü de #/iletisim'e

  });

  /* --- küçük yardımcılar ------------------------------------------------ */

  /* İç sayfa açılışı: ana sayfayla AYNI sinematik sahne, alçak varyantı.
     64-sahne.js yüklenmediyse sade koyu başlık bloğuna düşer. */
  function sahne(h1, alt, gorsel) {
    if (HP.parca && HP.parca.sahne) {
      return HP.parca.sahne({ ic: true, ust: 'hk.ust', h1: h1, alt: alt, gorsel: gorsel });
    }
    return '<section class="bolum bolum--gece2 gece-alan"><div class="kap">' +
      '<div class="yigin g3">' +
        '<span class="etiket bas__etiket">' + esc(t('hk.ust')) + '</span>' +
        '<h1 class="d2">' + esc(t(h1)) + '</h1>' +
        '<p class="g-lg ikincil olcu">' + esc(t(alt)) + '</p>' +
      '</div>' +
    '</div></section>';
  }

  /* Bölüm başlığında ETİKET YOK: sahnenin üstünde zaten "Yasal bilgilendirme"
     yazıyor, her bölümde tekrar etmesi ekranda dört kopya üretiyordu (ölçüldü:
     1440×2600 kesitte aynı satır 4 kez). Etiket yalnız sahnede kalır. */
  function bas(baslik, alt) {
    if (HP.parca && HP.parca.bas) return HP.parca.bas('', baslik, alt);
    return '<div class="bas"><h2 class="d3">' + esc(t(baslik)) + '</h2>' +
      (alt ? '<p class="g-lg ikincil olcu">' + esc(t(alt)) + '</p>' : '') + '</div>';
  }

  function tikli(anahtarlar) {
    if (HP.parca && HP.parca.tikli) return HP.parca.tikli(anahtarlar);
    return '<ul class="nokta-liste">' + anahtarlar.map(function (k) {
      return '<li><span>' + esc(t(k)) + '</span></li>';
    }).join('') + '</ul>';
  }

  function noktali(anahtarlar) {
    return '<ul class="nokta-liste">' + anahtarlar.map(function (k) {
      return '<li><span class="g">' + esc(t(k)) + '</span></li>';
    }).join('') + '</ul>';
  }

  /* İki sütun: solda başlık bloğu, sağda içerik. Sitenin diğer iç
     sayfalarıyla aynı ritim (bkz. #/iletisim). */
  function ikili(zemin, baslik, alt, sag) {
    return '<section class="bolum ' + zemin + '"><div class="kap">' +
      '<div class="izgara iz-35">' + bas(baslik, alt) + '<div>' + sag + '</div></div>' +
    '</div></section>';
  }

  /* Üç yasal sayfa birbirine bağlı olmalı: birine düşen ötekini de bulsun. */
  function ilgili(bu) {
    var L = [['kvkk', 'alt.kvkk'], ['cerez', 'alt.cerez'], ['mevzuat', 'alt.mevzuat']];
    return '<section class="bolum bolum--dar bolum--kagit2"><div class="kap">' +
      '<div class="satir aralik sar g4">' +
        '<span class="etiket ucuncul">' + esc(t('hk.ilgili')) + '</span>' +
        '<div class="satir sar g3">' +
          L.filter(function (x) { return x[0] !== bu; }).map(function (x) {
            return '<a class="btn btn--cizgi btn--sm" href="#/' + x[0] + '">' +
              esc(t(x[1])) + HP.icon('arrowRight', '', 16) + '</a>';
          }).join('') +
        '</div>' +
      '</div>' +
    '</div></section>';
  }

  /* ======================================================================
     1 — #/kvkk · 6698 sayılı Kanun aydınlatma metni
     ====================================================================== */
  HP.page('kvkk', {
    bolum: 'site',
    render: function () {
      return '' +
      /* 1 — açılış sahnesi (danışman karesi: verinin toplandığı an) */
      sahne('hk.k.h1', 'hk.k.alt', 'danisman') +

      /* 2 — veri sorumlusu: demoda BİLEREK boş olan alanlar açıkça söylenir */
      ikili('bolum--kagit', 'hk.k.s1.b', 'hk.k.s1.a',
        '<div class="kart"><div class="satir-t g3">' + HP.icon('shieldCheck', '', 20) +
          '<p class="g ikincil">' + esc(t('hk.k.s1.m')) + '</p>' +
        '</div></div>') +

      /* 3 — işlenen veri türleri */
      ikili('bolum--kagit2', 'hk.k.s2.b', 'hk.k.s2.a',
        noktali(['hk.k.v1', 'hk.k.v2', 'hk.k.v3', 'hk.k.v4'])) +

      /* 4 — özel nitelikli veri (m.6): sayfanın en kritik bandı, koyu zemin */
      '<section class="bolum bolum--dar bolum--gece gece-alan"><div class="kap-dar">' +
        '<h2 class="d3">' + esc(t('hk.k.s3.b')) + '</h2>' +
        '<div class="mevzuat mt-4">' + HP.icon('lock', '', 16) +
          '<div class="yigin g2">' +
            '<span>' + esc(t('hk.k.s3.m1')) + '</span>' +
            '<span>' + esc(t('hk.k.s3.m2')) + '</span>' +
          '</div>' +
        '</div>' +
      '</div></section>' +

      /* 5 — amaç ve saklama süresi */
      ikili('bolum--kagit', 'hk.k.s4.b', 'hk.k.s4.a',
        tikli(['hk.k.a1', 'hk.k.a2', 'hk.k.a3', 'hk.k.a4', 'hk.k.a5'])) +

      /* 6 — ilgili kişinin hakları (m.11) */
      ikili('bolum--kagit2', 'hk.k.s5.b', 'hk.k.s5.a',
        noktali(['hk.k.r1', 'hk.k.r2', 'hk.k.r3', 'hk.k.r4', 'hk.k.r5', 'hk.k.r6'])) +

      /* 7 — başvuru yolu */
      '<section class="bolum bolum--dar bolum--gece2 gece-alan"><div class="kap-dar">' +
        '<h2 class="d3">' + esc(t('hk.k.s6.b')) + '</h2>' +
        '<p class="g-lg ikincil olcu mt-3">' + esc(t('hk.k.s6.m')) + '</p>' +
        '<p class="g-sm ucuncul mt-3">' + esc(t('hk.k.s6.n')) + '</p>' +
      '</div></section>' +

      ilgili('kvkk');
    }
  });

  /* ======================================================================
     2 — #/cerez · çerez politikası (demo dürüstlüğü: yalnız zorunlu kayıt)
     ====================================================================== */
  var CEREZ = [
    { a: 'hk.c.t1.a', m: 'hk.c.t1.m', var: true },
    { a: 'hk.c.t2.a', m: 'hk.c.t2.m', var: false },
    { a: 'hk.c.t3.a', m: 'hk.c.t3.m', var: false }
  ];

  HP.page('cerez', {
    bolum: 'site',
    render: function () {
      var satirlar = CEREZ.map(function (c) {
        return '<tr>' +
          '<td><b>' + esc(t(c.a)) + '</b></td>' +
          '<td>' + esc(t(c.m)) + '</td>' +
          '<td class="sag"><span class="hap ' + (c.var ? 'hap--ok' : 'hap--hata') + '">' +
            esc(t(c.var ? 'hk.c.var' : 'hk.c.yok')) + '</span></td>' +
        '</tr>';
      }).join('');

      return '' +
      /* 1 — açılış sahnesi (aletler karesi: teknik, sakin, iddiasız) */
      sahne('hk.c.h1', 'hk.c.alt', 'aletler') +

      /* 2 — tanım: tek cümle, hukuk dili yok */
      ikili('bolum--kagit', 'hk.c.s1.b', 'hk.c.s1.a',
        '<p class="g-lg ikincil olcu">' + esc(t('hk.c.s1.m')) + '</p>') +

      /* 3 — üç çerez ailesi: hangisi kullanılıyor, hangisi kullanılmıyor.
             "Kullanılmıyor" satırları da GÖSTERİLİR: eksik olanı saklamak
             yerine adını koymak dürüstlüğün kendisidir. */
      '<section class="bolum bolum--kagit2"><div class="kap">' +
        bas('hk.c.s2.b', 'hk.c.s2.a') +
        '<div class="tablo-sarma mt-5"><table class="tablo tablo--tik">' +
          '<thead><tr>' +
            '<th>' + esc(t('hk.c.tur')) + '</th>' +
            '<th>' + esc(t('hk.c.ne')) + '</th>' +
            '<th class="sag">' + esc(t('hk.c.durum')) + '</th>' +
          '</tr></thead>' +
          '<tbody>' + satirlar + '</tbody>' +
        '</table></div>' +
      '</div></section>' +

      /* 4 — kapatma yolu + ileriye dönük taahhüt */
      '<section class="bolum bolum--dar bolum--gece gece-alan"><div class="kap-dar">' +
        '<h2 class="d3">' + esc(t('hk.c.s3.b')) + '</h2>' +
        '<p class="g ikincil olcu mt-3">' + esc(t('hk.c.s3.a')) + '</p>' +
        '<div class="mt-4">' + tikli(['hk.c.k1', 'hk.c.k2', 'hk.c.k3']) + '</div>' +
        '<div class="mevzuat mt-5">' + HP.icon('info', '', 16) +
          '<span>' + esc(t('hk.c.not')) + '</span>' +
        '</div>' +
      '</div></section>' +

      ilgili('cerez');
    }
  });

  /* ======================================================================
     3 — #/mevzuat · DEMONUN VİTRİNİ
     Kuralı anlatmak yetmez: sayfanın o kurala nasıl uyduğu madde madde
     gösterilir, sonra ziyaretçi rejimi kendi eliyle değiştirip doğrular.
     ====================================================================== */
  var UYGULAMA = ['hk.m.u1', 'hk.m.u2', 'hk.m.u3', 'hk.m.u4',
                  'hk.m.u5', 'hk.m.u6', 'hk.m.u7', 'hk.m.u8'];

  function rejimKart(ad, dayanak, metin, aktif) {
    return '<article class="kart' + (aktif ? ' kart--vurgu' : '') + '">' +
      '<div class="yigin g3">' +
        '<div class="satir aralik sar g2">' +
          '<h3 class="b2">' + esc(t(ad)) + '</h3>' +
          (aktif ? '<span class="hap hap--mavi">' + esc(t('hk.m.simdi')) + '</span>' : '') +
        '</div>' +
        '<span class="etiket ucuncul">' + esc(t(dayanak)) + '</span>' +
        '<p class="g-sm ikincil">' + esc(t(metin)) + '</p>' +
      '</div>' +
    '</article>';
  }

  HP.page('mevzuat', {
    bolum: 'site',
    render: function () {
      var trRejim = !HP.serbest();

      var maddeler = UYGULAMA.map(function (k, i) {
        return '<article class="kart satir-t g3">' +
          '<span class="teknik__no sayi">0' + (i + 1) + '</span>' +
          '<p class="g-sm">' + esc(t(k)) + '</p>' +
        '</article>';
      }).join('');

      /* Canlı denetim: ziyaretçi rejimi kendi eliyle değiştirsin. Karşı
         rejimin düğmesi gösterilir — bulunduğu rejime geçirmek boş tıklama
         olurdu. data-act="dil" eylemi 41-kabuk.js'te tanımlıdır. */
      var dene = '<div class="satir sar g3 mt-4">' +
        '<button class="btn btn--ana btn--sm" data-act="dil" data-dil="' +
          (trRejim ? 'en' : 'tr') + '">' +
          esc(t(trRejim ? 'hk.m.dEn' : 'hk.m.dTr')) + '</button>' +
        '<a class="btn btn--cizgi btn--sm" href="#/fiyat">' +
          esc(t('hk.m.dFiyat')) + HP.icon('arrowRight', '', 16) + '</a>' +
      '</div>';

      return '' +
      /* 1 — açılış sahnesi (ekip karesi: kurala uyan taraf insandır) */
      sahne('hk.m.h1', 'hk.m.alt', 'ekip') +

      /* 2 — iki rejim yan yana; yürürlükte olan işaretli */
      '<section class="bolum bolum--kagit"><div class="kap">' +
        bas('hk.m.s1.b', 'hk.m.s1.a') +
        '<div class="izgara iz-2 mt-5">' +
          rejimKart('hk.m.r1.a', 'hk.m.r1.d', 'hk.m.r1.m', trRejim) +
          rejimKart('hk.m.r2.a', 'hk.m.r2.d', 'hk.m.r2.m', !trRejim) +
        '</div>' +
      '</div></section>' +

      /* 3 — kuralın arayüzdeki karşılığı: satış argümanı burada kanıtlanır */
      '<section class="bolum bolum--kagit2"><div class="kap">' +
        bas('hk.m.s2.b', 'hk.m.s2.a') +
        '<div class="izgara iz-2 mt-5">' + maddeler + '</div>' +
      '</div></section>' +

      /* 4 — canlı deneme + sorumluluk sınırı */
      '<section class="bolum bolum--dar bolum--gece gece-alan"><div class="kap-dar">' +
        '<h2 class="d3">' + esc(t('hk.m.s3.b')) + '</h2>' +
        '<p class="g-lg ikincil olcu mt-3">' + esc(t('hk.m.s3.a')) + '</p>' +
        dene +
        '<div class="mevzuat mt-5">' + HP.icon('shield', '', 16) +
          '<span>' + esc(t('hk.m.not')) + '</span>' +
        '</div>' +
      '</div></section>' +

      ilgili('mevzuat');
    }
  });
}(window.HP = window.HP || {}));

  /* --- yardımcılar ------------------------------------------------------ */
  function rota() { return (HP.route && HP.route.id) || 'anasayfa'; }
  function param() { return (HP.route && HP.route.param) || ''; }
  function panelMi() { return (HP.route && HP.route.bolum) === 'panel'; }
  function dilKodu() { return DIL_ETIKET[HP.lang] || 'tr-TR'; }

  function adres(id, prm, dil) {
    return ALAN + (dil ? '?dil=' + dil : '') + '#/' + id + (prm ? '/' + prm : '');
  }

  /* Sözlükte anahtar yoksa HP.t anahtarın kendisini döndürür; onu başlığa
     basmak "seo.t.p-ozet" gibi bir çöp üretirdi. Panel rotaları tek başlık
     altında toplanır, bilinmeyen rota ana sayfaya düşer. */
  function metinVar(anahtar) {
    var v = t(anahtar);
    return v === anahtar ? null : v;
  }
  function sayfaAnahtari() {
    if (panelMi()) return 'panel';
    return metinVar('seo.t.' + rota()) ? rota() : 'anasayfa';
  }

  /* Yazı sayfasının adı ve özeti veriden gelir: her yazı kendi başlığını alır. */
  function yazi() {
    if (rota() !== 'yazi' || !HP.BLOG) return null;
    var b = null, p = param();
    HP.BLOG.forEach(function (y) { if (y.slug === p) b = y; });
    return b || HP.BLOG[0] || null;
  }

  /* --- şema düğümleri --------------------------------------------------- */
  function klinikDugumu() {
    return {
      '@type': 'MedicalClinic',
      '@id': ALAN + '#klinik',
      name: MARKA,
      url: ALAN,
      telephone: TEL,
      inLanguage: dilKodu(),
      medicalSpecialty: 'Dermatology',
      description: t('klinik.alt'),
      address: {
        '@type': 'PostalAddress',
        addressLocality: t('seo.ilce'),
        addressRegion: t('seo.il'),
        addressCountry: 'TR'
      },
      areaServed: { '@type': 'City', name: t('seo.il') },
      availableLanguage: DILLER.map(function (d) {
        return { '@type': 'Language', name: DIL_ADI[d], alternateName: d };
      }),
      openingHoursSpecification: [{
        '@type': 'OpeningHoursSpecification',
        dayOfWeek: GUNLER, opens: '09:00', closes: '20:00'
      }],
      availableService: TEKNIK.map(function (k) { return { '@id': ALAN + '#islem-' + k }; })
    };
  }

  function islemDugumleri() {
    return TEKNIK.map(function (k) {
      return {
        '@type': 'MedicalProcedure',
        '@id': ALAN + '#islem-' + k,
        name: t('teknik.' + k + '.ad'),
        description: t('teknik.' + k + '.metin'),
        howPerformed: t('teknik.' + k + '.metin'),
        procedureType: 'https://schema.org/SurgicalProcedure',
        bodyLocation: t('seo.bolge'),
        inLanguage: dilKodu(),
        url: adres('sac-ekimi'),
        provider: { '@id': ALAN + '#klinik' }
      };
    });
  }

  function sssDugumu() {
    var sorular = [];
    for (var i = 1; i <= 6; i++) {
      var s = metinVar('sss.' + i + '.s'), c = metinVar('sss.' + i + '.c');
      if (!s || !c) continue;
      sorular.push({
        '@type': 'Question', name: s,
        acceptedAnswer: { '@type': 'Answer', text: c }
      });
    }
    if (!sorular.length) return null;
    return {
      '@type': 'FAQPage',
      '@id': ALAN + '#sss',
      name: t('sss.baslik'),
      url: adres(SSS_ROTA),
      inLanguage: dilKodu(),
      mainEntity: sorular
    };
  }

  function yaziDugumu(b) {
    return {
      '@type': 'BlogPosting',
      '@id': ALAN + '#yazi-' + b.slug,
      headline: b.bas,
      description: b.ozet,
      articleSection: b.kat,
      datePublished: b.tarih,
      inLanguage: 'tr-TR',
      url: adres('yazi', b.slug),
      isPartOf: { '@id': ALAN + '#site' },
      author: { '@id': ALAN + '#klinik' },
      publisher: { '@id': ALAN + '#klinik' }
    };
  }

  function kirintiDugumu(ad) {
    var ogeler = [{
      '@type': 'ListItem', position: 1, name: t('seo.ev'), item: adres('anasayfa')
    }];
    if (rota() !== 'anasayfa') {
      ogeler.push({ '@type': 'ListItem', position: 2, name: ad, item: adres(rota(), param()) });
    }
    return { '@type': 'BreadcrumbList', '@id': ALAN + '#kirinti-' + rota(), itemListElement: ogeler };
  }

  /* --- şemanın tamamı --------------------------------------------------- */
  HP.seo = HP.seo || {};

  HP.seo.ad = function () {
    var b = yazi();
    if (b) return b.bas;
    return t('seo.t.' + sayfaAnahtari());
  };
  HP.seo.aciklama = function () {
    var b = yazi();
    if (b && b.ozet) return b.ozet;
    return t('seo.d.' + sayfaAnahtari());
  };
  HP.seo.baslik = function () { return HP.seo.ad() + ' | ' + MARKA; };

  HP.seo.veri = function () {
    var ad = HP.seo.ad(), acik = HP.seo.aciklama(), b = yazi();
    var graf = [
      {
        '@type': 'WebSite', '@id': ALAN + '#site',
        name: MARKA, url: ALAN, inLanguage: dilKodu(),
        publisher: { '@id': ALAN + '#klinik' }
      },
      {
        '@type': 'WebPage', '@id': adres(rota(), param()),
        url: adres(rota(), param()), name: ad, description: acik,
        inLanguage: dilKodu(),
        isPartOf: { '@id': ALAN + '#site' },
        about: { '@id': ALAN + '#klinik' },
        breadcrumb: { '@id': ALAN + '#kirinti-' + rota() }
      },
      kirintiDugumu(ad),
      klinikDugumu()
    ].concat(islemDugumleri());

    /* SSS şeması YALNIZ soruların ekranda göründüğü rotada yayınlanır:
       görünmeyen içeriğin şeması Google'ın da yasağıdır. */
    if (rota() === SSS_ROTA) { var s = sssDugumu(); if (s) graf.push(s); }
    if (b) graf.push(yaziDugumu(b));

    return { '@context': 'https://schema.org', '@graph': graf };
  };

  /* --- belge başı (head) ------------------------------------------------ */
  var nd = {};
  function basOge(sec, etiket, oz) {
    if (nd[sec]) return nd[sec];
    var el = null;
    try { el = document.head && document.head.querySelector && document.head.querySelector(sec); }
    catch (e) { el = null; }
    if (!el) {
      el = document.createElement(etiket);
      if (oz) for (var k in oz) el.setAttribute(k, oz[k]);
      try { document.head.appendChild(el); } catch (e2) { }
    }
    nd[sec] = el;
    return el;
  }
  function icerik(sec, etiket, oz, deger) {
    var el = basOge(sec, etiket, oz);
    if (el && el.setAttribute) el.setAttribute('content', deger);
  }

  HP.seo.guncelle = function () {
    var baslik = HP.seo.baslik(), acik = HP.seo.aciklama();
    var kanonik = adres(rota(), param());

    try { document.title = baslik; } catch (e) { }

    icerik('meta[name="description"]', 'meta', { name: 'description' }, acik);
    icerik('meta[property="og:title"]', 'meta', { property: 'og:title' }, baslik);
    icerik('meta[property="og:description"]', 'meta', { property: 'og:description' }, acik);
    icerik('meta[property="og:url"]', 'meta', { property: 'og:url' }, kanonik);
    icerik('meta[property="og:locale"]', 'meta', { property: 'og:locale' }, dilKodu().replace('-', '_'));
    icerik('meta[name="twitter:title"]', 'meta', { name: 'twitter:title' }, baslik);
    icerik('meta[name="twitter:description"]', 'meta', { name: 'twitter:description' }, acik);

    var kn = basOge('link[rel="canonical"]', 'link', { rel: 'canonical' });
    if (kn && kn.setAttribute) kn.setAttribute('href', kanonik);

    /* hreflang: ?dil=xx bağlantısı gerçekten çalışır (40-app.js boot okur). */
    DILLER.concat('x-default').forEach(function (d) {
      var kod = d === 'x-default' ? 'tr' : d;
      var sec = 'link[rel="alternate"][hreflang="' + d + '"]';
      var el = basOge(sec, 'link', { rel: 'alternate', hreflang: d });
      if (el && el.setAttribute) el.setAttribute('href', adres(rota(), param(), kod));
    });

    /* Panelde şema YOK: yönetim ekranı yayın yüzeyi değildir. */
    var ld = basOge('script#hp-ld', 'script', { type: 'application/ld+json', id: 'hp-ld' });
    if (!ld) return;
    if (panelMi()) { ld.textContent = ''; return; }
    var metin = '';
    try { metin = JSON.stringify(HP.seo.veri(), null, 2); } catch (e) { metin = ''; }
    /* JSON içindeki "<" kaçırılır: script kapanış etiketine benzeyen bir dizi
       belgeyi erken kapatmasın. (⚠ Bu dosyada o etiket DÜZ YAZILAMAZ — yorumun
       içinde bile olsa derlenmiş tek-dosya belgeyi orada bölerdi.) */
    ld.textContent = metin.replace(/</g, '\\u003c');
  };

  HP.on('render', HP.seo.guncelle);
})(window.HP);

  HP.telGecerli = function (ham) {

  /* Kapaklı yazı kartı. .kart + .izgara: çocuklar ızgara öğesi olduğu için
     <a class="foto"> blok davranır ve aspect-ratio uygulanır. */
  function kapakKart(b, i, oran, siki) {
    return '<article class="kart izgara' + (siki ? ' kart--sik' : '') +
        '" data-blog-kat="' + esc(b.kat) + '">' +
      '<a class="foto ' + oran + '" href="#/yazi/' + esc(b.slug) + '">' +
        '<img src="' + kapak(i) + '" alt="' + kapakAlt(i) + '">' +
        '<span class="foto__ust">' + esc(b.kat) + '</span>' +
      '</a>' +
      '<div class="yigin g3">' +
        '<h3 class="b2"><a href="#/yazi/' + esc(b.slug) + '">' + esc(b.bas) + '</a></h3>' +
        '<p class="g-sm ikincil">' + esc(b.ozet) + '</p>' +
        meta(b) +
      '</div>' +
    '</article>';
  }

  function meta(b) {
    return '<div class="satir sar g3 g-xs ucuncul">' +
      '<span class="sayi">' + esc(HP.date(b.tarih)) + '</span>' +
      '<span>·</span>' +
      '<span><b class="sayi">' + b.dk + '</b> ' + esc(t('blog.dk')) + '</span>' +
    '</div>';
  }

  function bul(slug) {
    var r = null;
    HP.BLOG.forEach(function (b) { if (b.slug === slug) r = b; });
    return r;
  }

  /* --- kategori filtresi -------------------------------------------------- */
  HP.act('blog-filtre', function (el) {
    var f = el.getAttribute('data-kat');
    HP.qsa('[data-act="blog-filtre"]').forEach(function (x) { x.classList.remove('is-secili'); });
    el.classList.add('is-secili');
    HP.qsa('[data-blog-kat]').forEach(function (k) {
      k.classList.toggle('gizle', f !== '*' && k.getAttribute('data-blog-kat') !== f);
    });
  });

  /* ======================================================================
     1 — BLOG LİSTESİ
     ====================================================================== */
  HP.page('blog', {
    bolum: 'site',
    render: function () {
      var one = HP.BLOG[0];

      /* Kategori segmenti: veriden türetilir. Hap sayısı kategori sayısına bağlı
         olduğu için telefonda kabın içine sığmayabilir → .segment-kay sarmalayıcı
         onu tam-taşma yatay kaydırıcıya çevirir (bkz. 01-base.css). */
      var katlar = [];
      HP.BLOG.forEach(function (b) { if (katlar.indexOf(b.kat) < 0) katlar.push(b.kat); });
      var segment = '<div class="segment-kay"><div class="segment" role="group">' +
        '<button class="segment__d is-secili" data-act="blog-filtre" data-kat="*">' +
          esc(t('genel.tumu')) + '</button>' +
        katlar.map(function (k) {
          return '<button class="segment__d" data-act="blog-filtre" data-kat="' + esc(k) + '">' +
            esc(k) + '</button>';
        }).join('') +
      '</div></div>';

      /* öne çıkan: kapak 5fr sütunda ≈705px, yogunluk 1600px'in %44'ü */
      var oneCikan = '<div class="izgara iz-53 mt-6" data-blog-kat="' + esc(one.kat) + '">' +
        '<a class="foto foto--169" href="#/yazi/' + esc(one.slug) + '">' +
          '<img src="' + kapak(0) + '" alt="' + kapakAlt(0) + '">' +
          '<span class="foto__ust">' + esc(one.kat) + '</span>' +
        '</a>' +
        '<div class="yigin g4">' +
          '<span class="etiket bas__etiket">' + esc(t('blog.one')) + '</span>' +
          '<h2 class="b1"><a href="#/yazi/' + esc(one.slug) + '">' + esc(one.bas) + '</a></h2>' +
          '<p class="g ikincil">' + esc(one.ozet) + '</p>' +
          meta(one) +
          '<div class="satir">' +
            '<a class="btn btn--cizgi btn--sm" href="#/yazi/' + esc(one.slug) + '">' +
              esc(t('blog.oku')) + HP.icon('arrowRight', '', 16) + '</a>' +
          '</div>' +
        '</div>' +
      '</div>';

      /* ikinci sıra: iki geniş kart — kapak ≈514px (kaynak 1100–1600) */
      var kartlar = HP.BLOG.slice(1, 3).map(function (b, i) {
        return kapakKart(b, i + 1, 'foto--169', false);
      }).join('');

      /* arşiv: üçlü sıra, daha uzun 4:3 kapak — kapak ≈334px */
      var arsiv = HP.BLOG.slice(3).map(function (b, i) {
        return kapakKart(b, i + 3, 'foto--43', true);
      }).join('');

      return '' +
      /* 1 — açılış sahnesi. Bilgi merkezinin eylemi listenin kendisi olduğu için
             sahne düğmesizdir; hemen altındaki filtre şeridi o işi görür. */
      (HP.parca.sahne
        ? HP.parca.sahne({
            ic: true,
            ust: 'nav.blog', h1: 'blog.baslik', alt: 'blog.alt',
            gorsel: 'blogKapak', gorselM: 'blogKapak'
          })
        : '<section class="bolum bolum--gece2 gece-alan"><div class="kap">' +
            '<div class="yigin g3">' +
              '<span class="etiket bas__etiket">' + esc(t('nav.blog')) + '</span>' +
              '<h1 class="d2">' + esc(t('blog.baslik')) + '</h1>' +
              '<p class="g-lg ikincil olcu">' + esc(t('blog.alt')) + '</p>' +
            '</div>' +
          '</div></section>') +

      /* 2 — filtre + öne çıkan + iki yazı kartı */
      '<section class="bolum bolum--kagit"><div class="kap">' +
        segment +
        oneCikan +
        '<div class="izgara iz-2 mt-6">' + kartlar + '</div>' +
      '</div></section>' +

      /* 3 — arşiv: üçlü kapaklı sıra */
      '<section class="bolum bolum--kagit2"><div class="kap">' +
        '<div class="satir aralik sar g4">' +
          '<span class="etiket ucuncul">' + esc(t('blog.arsiv')) + '</span>' +
          '<span class="g-xs ucuncul">' + esc(t('blog.temsili')) + '</span>' +
        '</div>' +
        '<div class="izgara iz-3 mt-5">' + arsiv + '</div>' +
      '</div></section>' +

      /* 4 — TERİMLER: sitenin tıbbi kelime dağarcığının tek adresi.
             Bilgi merkezinin altına konuldu, iletişim sayfasının SSS'inin
             değil: SSS "ne yapacağım" sorusudur, sözlük "ne okuyorum".
             Bölümü 67-sozluk.js üretir; buradaki tek iş yerini vermek. */
      (HP.parca.sozlukBolum ? HP.parca.sozlukBolum() : '') +

      /* 5 — ortak kapanış bandı */
      kapanis('blog.ctaBas', 'blog.cta');
    }
  });

  /* ======================================================================
     2 — YAZI DETAYI  (#/yazi/<slug>)
     ====================================================================== */
  HP.page('yazi', {
    bolum: 'site',
    render: function (param) {
      var b = bul(param) || HP.BLOG[0];
      if (!b) {
        return '<section class="bolum bolum--kagit"><div class="kap"><div class="bos">' +
          HP.icon('fileText', '', 26) + '<p>' + esc(t('yazi.yok')) + '</p>' +
          '<a class="btn btn--cizgi btn--sm" href="#/blog">' + esc(t('yazi.geri')) + '</a>' +
        '</div></div></section>';
      }
      var i = HP.BLOG.indexOf(b);

      var govde = b.govde.map(function (p) {
        return '<p class="g-lg olcu">' + esc(p) + '</p>';
      }).join('');

      var ilgili = [(i + 1) % HP.BLOG.length, (i + 2) % HP.BLOG.length]
        .map(function (n) {
          return kapakKart(HP.BLOG[n], n, 'foto--169', false);
        }).join('');

      return '' +
      /* 1 — kapak + başlık bloğu. Makale kapağı listedekiyle AYNI karedir
             (kapak(i)): yazı hangi sayfada görünürse görünsün kimliği değişmez.
             Kapak 7fr sütunda = 658px, en dar kaynak 1100px'in altında kalır. */
      '<section class="bolum bolum--dar bolum--gece2 gece-alan"><div class="kap">' +
        '<a class="btn btn--sade btn--sm" href="#/blog">' + HP.icon('arrowLeft', '', 16) +
          esc(t('yazi.geri')) + '</a>' +
        '<div class="izgara iz-754 mt-4">' +
          '<div class="foto foto--169">' +
            '<img src="' + kapak(i) + '" alt="' + kapakAlt(i) + '">' +
            '<span class="foto__ust">' + esc(b.kat) + '</span>' +

            '<span class="g-xs ucuncul sayi">' + esc(HP.date(b.tarih)) + '</span>' +

            '<span class="g-xs ucuncul">' + esc(t('blog.temsili')) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="yigin g4 mt-5">' +
          '<h1 class="d2 olcu">' + esc(b.bas) + '</h1>' +
          '<p class="g-lg ikincil olcu">' + esc(b.ozet) + '</p>' +
        '</div>' +
      '</div></section>' +

      /* 2 — gövde + yan sütun */
      '<section class="bolum bolum--kagit"><div class="kap">' +
        '<div class="izgara iz-754">' +
          '<div class="yigin g5">' + govde + '</div>' +
          '<div class="yigin g5 olcu-34">' +
            /* dikey portre yalnız 34ch (~270px) genişlikte: kaynak 800px */
            '<div class="foto foto--34"><img src="' + HP.img.portre +
              '" alt="' + esc(t('alt.g.portre')) + '"></div>' +
            '<div class="kart kart--sik">' +
              '<div class="satir-t g3">' + HP.icon('shieldCheck', '', 20) +
                '<div class="yigin g1">' +
                  '<b class="g-sm">' + esc(t('yazi.inceleme')) + '</b>' +
                  '<span class="g-xs ucuncul">' + esc(t('yazi.guncel')) + ': ' +
                    '<span class="sayi">' + esc(HP.date(b.tarih)) + '</span></span>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div></section>' +

      /* 3 — ilgili yazılar */
      '<section class="bolum bolum--dar bolum--kagit2"><div class="kap">' +
        '<span class="etiket ucuncul">' + esc(t('yazi.ilgili')) + '</span>' +
        '<div class="izgara iz-2 mt-4">' + ilgili + '</div>' +
      '</div></section>' +

      /* 4 — ortak kapanış bandı */
      kapanis('yazi.cta', 'yazi.ctaAlt');
    }
  });

  /* ======================================================================
     3 — İLETİŞİM + SSS
     ====================================================================== */
  /* sayi=true → değer rakamsaldır: Arapça (RTL) yayında ters okunmasın diye
     <bdi dir="ltr"> ile yalıtılır. */
  function bilgiSatir(ikon, etiketK, deger, sayi) {
    var d = sayi ? '<bdi dir="ltr">' + esc(deger) + '</bdi>' : esc(deger);
    return '<div class="satir-t g3">' + HP.icon(ikon, '', 18) +
      '<div class="yigin g1">' +
        '<span class="g-xs ucuncul">' + esc(t(etiketK)) + '</span>' +
        '<b class="g' + (sayi ? ' sayi' : '') + '">' + d + '</b>' +
      '</div>' +
    '</div>';
  }

  HP.page('iletisim', {
    bolum: 'site',
    render: function () {
      var sss = '<div class="sss">' + [1, 2, 3, 4, 5, 6].map(function (n) {
        return '<div class="sss__o">' +
          '<button class="sss__s" data-act="sss" aria-expanded="false">' +
            '<span>' + esc(t('sss.' + n + '.s')) + '</span>' +
            HP.icon('chevronDown', '', 20) +
          '</button>' +
          '<div class="sss__c" hidden>' + esc(t('sss.' + n + '.c')) + '</div>' +
        '</div>';
      }).join('') + '</div>';

      /* Sahne metninin altına asılan güven şeridi: sayfanın vaadini sahnenin
         içinde bitirir, altındaki bölüm doğrudan işe (form) girebilsin. */
      var sahneEk = HP.parca.tikli(['hero.guven1', 'hero.guven3', 'klinik.m4']);

      return '' +
      /* 1 — açılış sahnesi: kliniğin bulunduğu şehir, gece. */
      (HP.parca.sahne
        ? HP.parca.sahne({
            ic: true,
            ust: 'nav.iletisim', h1: 'ilet.baslik', alt: 'ilet.alt',
            gorsel: 'sehir', gorselM: 'sehir', ek: sahneEk
          })
        : '<section class="bolum bolum--gece2 gece-alan"><div class="kap">' +
            '<div class="yigin g4">' +
              '<span class="etiket bas__etiket">' + esc(t('nav.iletisim')) + '</span>' +
              '<h1 class="d2">' + esc(t('ilet.baslik')) + '</h1>' +
              '<p class="g-lg ikincil olcu">' + esc(t('ilet.alt')) + '</p>' +
              sahneEk +
            '</div>' +
          '</div></section>') +

      /* 2 — iletişim bilgileri + klinik karesi | analiz formu
             (3fr sütun ≈423px, klinik2 kaynağı 1200px) */
      '<section class="bolum bolum--kagit"><div class="kap">' +
        '<div class="izgara iz-35">' +
          '<div class="yigin g4">' +
            '<div class="kart"><div class="yigin g5">' +
              bilgiSatir('phone', 'ilet.tel', '+90 534 471 66 92', true) +
              bilgiSatir('mapPin', 'ilet.adres', t('alt.adres')) +
              bilgiSatir('clock', 'ilet.saatB', t('alt.saat')) +
              bilgiSatir('translate', 'ilet.dil', t('ilet.dilDeger')) +
            '</div></div>' +
            '<div class="foto foto--43"><img src="' + HP.img.klinik2 +
              '" alt="' + esc(t('alt.g.klinik2')) + '"></div>' +
            '<p class="g-sm ikincil">' + esc(t('ilet.fotoNot')) + '</p>' +
          '</div>' +
          '<div>' + HP.parca.form() + '</div>' +
        '</div>' +
      '</div></section>' +

      /* 3 — SSS */
      '<section class="bolum bolum--kagit2"><div class="kap">' +
        '<div class="izgara iz-35">' +
          '<div class="yigin g3">' +
            '<span class="etiket bas__etiket">' + esc(t('nav.sss')) + '</span>' +
            '<h2 class="d3">' + esc(t('sss.baslik')) + '</h2>' +
            '<p class="g-sm ikincil olcu-dar">' + esc(t('ilet.sssAlt')) + '</p>' +
          '</div>' +
          '<div>' + sss + '</div>' +
        '</div>' +
      '</div></section>' +

      /* 4 — KVKK bilgilendirme. Bu bant kapanış CTA'sına ÇEVRİLMEDİ: iletişim
             sayfasının kendisi zaten eylemdir (form + WhatsApp + telefon), üstüne
             üçüncü bir "bize ulaşın" bandı koymak tekrar olurdu. Buradaki içerik
             veri işleme bilgilendirmesi; yerini bir düğmeye bırakamaz. */
      '<section class="bolum bolum--dar bolum--gece gece-alan"><div class="kap-dar">' +
        '<h3 class="b3">' + esc(t('ilet.kvkkBaslik')) + '</h3>' +
        '<div class="mevzuat mt-4">' + HP.icon('shield', '', 16) +
          '<div class="yigin g1">' +
            '<span>' + esc(t('ilet.kvkk1')) + '</span>' +
            '<span>' + esc(t('ilet.kvkk2')) + '</span>' +
            '<span>' + esc(t('ilet.kvkk3')) + '</span>' +
          '</div>' +
        '</div>' +
      '</div></section>';
    }
  });
})(window.HP);
