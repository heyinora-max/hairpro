:"Lokal anestezi uygulan\u0131r. Anestezi s\u0131ras\u0131nda k\u0131sa s\xFCreli batma hissi olur, sonras\u0131nda a\u011Fr\u0131 beklenmez.","sss.2.s":"Ne zaman i\u015Fe d\xF6nebilirim?","sss.2.c":"Tra\u015Fs\u0131z y\xF6ntemde ertesi g\xFCn, klasik y\xF6ntemde ortalama \xFC\xE7 g\xFCn sonra sosyal hayata d\xF6n\xFCl\xFCr.","sss.3.s":"Ekilen sa\xE7lar d\xF6k\xFCl\xFCr m\xFC?","sss.3.c":"\u0130kinci ve d\xF6rd\xFCnc\xFC hafta aras\u0131nda \u015Fok d\xF6k\xFClme normaldir. K\xF6kler kal\u0131r, sa\xE7 \xFC\xE7\xFCnc\xFC aydan itibaren yeniden \xE7\u0131kar.","sss.4.s":"Sonu\xE7 ne zaman belli olur?","sss.4.c":"Alt\u0131nc\u0131 ayda g\xF6r\xFCn\xFCr yo\u011Funluk olu\u015Fur. Nihai sonu\xE7 on iki\u2013on sekiz ay aras\u0131nda de\u011Ferlendirilir.","sss.5.s":"Ka\xE7 greft gerekir?","sss.5.c":"D\xF6k\xFClme evresi ve don\xF6r yo\u011Funlu\u011Funa ba\u011Fl\u0131d\u0131r. Hesaplay\u0131c\u0131 tahmin verir, kesin say\u0131 muayenede belirlenir.","sss.6.s":"Ya\u015F s\u0131n\u0131r\u0131 var m\u0131?","sss.6.c":"D\xF6k\xFClme paterni oturduktan sonra, genellikle yirmi be\u015F ya\u015F \xFCzerinde uygulanmas\u0131 tercih edilir.","sss.7.s":"Ense b\xF6lgesinde iz kal\u0131r m\u0131?","sss.7.c":"FUE'de kesi yap\u0131lmaz; her greft ayr\u0131 ayr\u0131 al\u0131n\u0131r ve geride milimetrenin alt\u0131nda nokta izler kal\u0131r. Bu izler sa\xE7 bir numara makineyle kesildi\u011Finde g\xF6r\xFCnmez. Tamamen s\u0131f\u0131r numaraya vuruyorsan\u0131z dikkatli bakan biri fark edebilir; muayenede don\xF6r yo\u011Funlu\u011Funuzu \xF6l\xE7\xFCp bunu size a\xE7\u0131k\xE7a s\xF6yleriz.","sss.8.s":"Yapay g\xF6r\xFCn\xFCr m\xFC?","sss.8.c":"Do\u011Fall\u0131k greft say\u0131s\u0131ndan de\u011Fil, \xE7izgiden gelir. \xD6n s\u0131raya yaln\u0131z tek k\xF6kl\xFC greftler yerle\u015Ftirilir, arkaya do\u011Fru \xE7ok k\xF6kl\xFCler ge\xE7er; \xE7izgi d\xFCz de\u011Fil, hafif k\u0131r\u0131kl\u0131 \xE7izilir ve sa\xE7 \xE7\u0131k\u0131\u015F a\xE7\u0131s\u0131 kom\u015Fu sa\xE7larla ayn\u0131 tutulur. Bu \xFC\xE7 \u015Fey do\u011Fru yap\u0131ld\u0131\u011F\u0131nda sonu\xE7 \u0131slak sa\xE7ta bile ay\u0131rt edilmez.","sss.9.s":"Tutmazsa ne oluyor?","sss.9.c":"Greftlerin k\xFC\xE7\xFCk bir k\u0131sm\u0131n\u0131n tutmamas\u0131 beklenen bir durumdur; planlama bunu hesaba katar. On ikinci ayda birlikte de\u011Ferlendiririz: kapsama beklenenin alt\u0131ndaysa ve don\xF6r kapasiteniz elveriyorsa d\xFCzeltme seans\u0131 planlan\u0131r. Hangi durumda \xFCcretsiz, hangi durumda \xFCcretli oldu\u011Funu \xF6n g\xF6r\xFC\u015Fmede yaz\u0131l\u0131 olarak s\xF6yleriz.","sss.10.s":"\u0130\u015F yerinde belli olur mu?","sss.10.c":"\u0130lk \xFC\xE7 g\xFCn k\u0131zar\u0131kl\u0131k ve hafif \xF6dem olur; \u015Fapka tak\u0131labilir ama s\u0131k\u0131 olmamal\u0131. Tra\u015Fs\u0131z y\xF6ntemde sa\xE7 kesilmedi\u011Fi i\xE7in ertesi g\xFCn sosyal hayata d\xF6nebilirsiniz. Klasik y\xF6ntemde don\xF6r alan k\u0131sa olur, o y\xFCzden \xE7o\u011Fu ki\u015Fi bir hafta izin al\u0131yor.","sss.11.s":"\u015Eehir d\u0131\u015F\u0131ndan geliyorum, ka\xE7 g\xFCn kalmam gerekir?","sss.11.c":"\u0130ki gece yeterli. Birinci g\xFCn muayene, kan tetkikleri, \xE7izim ve operasyon; ikinci g\xFCn klinikte ilk y\u0131kama ve bak\u0131m anlat\u0131m\u0131; \xFC\xE7\xFCnc\xFC g\xFCn u\xE7u\u015F serbest. Klinik \u015Ei\u015Fli'de, havaliman\u0131na yakla\u015F\u0131k k\u0131rk dakika. Konaklama ve transferi biz satm\u0131yoruz ama anla\u015Fmal\u0131 otelin ad\u0131n\u0131 ve yol tarifini yaz\u0131l\u0131 g\xF6nderiyoruz.","sss.12.s":"Fiyat\u0131 ne zaman ve nas\u0131l \xF6\u011Frenece\u011Fim?","sss.12.c":"Foto\u011Fraflar\u0131n\u0131z\u0131 g\xF6nderirsiniz; ayn\u0131 g\xFCn greft aral\u0131\u011F\u0131n\u0131z\u0131 yazar\u0131z. Fiyat\u0131 bu aral\u0131\u011Fa g\xF6re WhatsApp \xFCzerinden yaz\u0131l\u0131 iletiriz. Klini\u011Fe geldi\u011Finizde rakam de\u011Fi\u015Fmez; yaln\u0131z greft say\u0131s\u0131 muayenede \xF6l\xE7\xFCmle netle\u015Fir. Mevzuat gere\u011 the clinic calendar, the follow-up plan from the procedure page, the reply time from the last thirty days of measurement.","p.gr.klinik":"Clinic","p.gr.pazarlama":"Marketing","p.gr.yonetim":"Admin","bant.baslik":"What is a graft?","bant.metin":"A graft is a tiny package of roots taken from the skin; it holds about two hairs on average. Planning happens at that scale.","zaman.dk":"min","zaman.sa":"h","zaman.gun":"d","demo.etiket":"DEMO","demo.metin":"A sample build prepared for HairPro Clinic Turkey. Content and data are illustrative.","demo.panel":"Open admin panel","demo.site":"Back to site","nav.sacEkimi":"Hair Transplant","nav.tedaviler":"Treatments","nav.sonuclar":"Results","nav.klinik":"Clinic","nav.yolculuk":"The Procedure","nav.fiyat":"Pricing","nav.blog":"Blog","nav.sss":"FAQ","nav.iletisim":"Contact","nav.randevu":"Free consultation","nav.menu":"Menu","hero.ust":"ISTANBUL \xB7 HAIR TRANSPLANT CLINIC","hero.h1":"Your own hair, again.","hero.alt":"Natural hairline with no-shave DHI. Consultation is free.","hero.cta1":"Send my photos","hero.cta2":"See results","hero.guven1":"The doctor reviews your photos","hero.guven2":"No-shave option","hero.guven3":"Written reply the same day","guven.baslik":"About the clinic","guven.1.n":"3","guven.1.a":"techniques offered","guven.2.n":"12","guven.2.a":"months of follow-up","guven.3.n":"3","guven.3.a":"consultation languages","teknik.baslik":"Techniques we use","teknik.alt":"We decide together which one suits you, during your free consultation.","teknik.dhi.metin":"Grafts go in directly with a Choi pen, no channels opened. Denser placement, faster healing.","teknik.dhi.m1":"No channels","teknik.dhi.m2":"High density","teknik.dhi.m3":"Faster healing","teknik.safir.metin":"Channels are opened with sapphire blades. Tissue trauma drops and crusting clears sooner.","teknik.safir.m1":"Sapphire blade","teknik.safir.m2":"Large areas","teknik.safir.m3":"Less crusting","teknik.trassiz.metin":"Your hair is not cut. You can go out the next day. Graft numbers are limited.","teknik.trassiz.m1":"No haircut","teknik.trassiz.m2":"Next-day return","teknik.trassiz.m3":"Limited grafts","tedavi.baslik":"Supporting treatments","tedavi.alt":"Applied before and after the transplant to support the health of your hair.","tedavi.prp.ad":"PRP","tedavi.prp.metin":"Growth factors drawn from your own blood strengthen the follicles.","tedavi.mezo.ad":"Mesotherapy","tedavi.mezo.metin":"A vitamin and mineral blend is injected into the scalp to improve nourishment.","tedavi.kok.ad":"Stem cell","tedavi.kok.metin":"Stem cell support aims to renew weakened follicles.","greft.baslik":"How many grafts","greft.alt":"Pick your hair loss stage and see the estimated range.","greft.norwood":"Hair loss stage","greft.bolge":"Area to be treated","greft.b1":"Front hairline","greft.b2":"Crown (vertex)","greft.b3":"Mid-scalp","greft.sonuc":"Estimated graft range","greft.sure":"Estimated operation time","greft.saat":"hours","greft.not":"This is an estimate. The exact number is set at examination, by measuring donor density.","greft.cta":"Send my photos","sonuc.baslik":"Results","sonuc.alt":"Every case is published with its date, technique and graft count.","sonuc.dogru.baslik":"No patient photographs here \u2014 on purpose","sonuc.dogru.p1":"Result photographs may only be published with the patient's written consent. We hold those consents. We still keep the frames off the internet: once a photograph is out there it cannot be taken back, and most of our patients would rather it were not.","sonuc.dogru.p2":"We show the frames on screen at the clinic during your consultation \u2014 with the date, the graft count and the matching pair shot in the same light. If you like, we pick the case closest to your own and look at them side by side.","sonuc.dogru.p3":"What follows are measurement diagrams: which area received how many grafts and how the coverage is distributed. Each card carries the doctor's note for that case. The photo gallery component is built and switched on in the panel \u2014 if the clinic decides to publish, consented frames land here with date, technique and consent labels.","sonuc.dogru.cta":"Show me the case closest to mine","sonuc.filtre.hepsi":"All","sonuc.filtre.on":"Hairline","sonuc.filtre.tepe":"Crown","sonuc.seans":"Session {n} of {t}","sonuc.oncesi":"Before","sonuc.sonrasi":"After","sonuc.ay":" months","sonuc.greft":"grafts","sonuc.uyari":"Results of any surgical or interventional procedure may vary from person to person. Please seek a detailed opinion from your doctor before the procedure.","sonuc.uyariKisa":"Results vary from person to person.","sonuc.onam":"Patient images are published only with a signed consent form; the frames here are diagrams.","sonuc.etkilesim":"Comments and likes are turned off on our posts, as the regulation requires.","yolculuk.baslik":"How the procedure works","yolculuk.alt":"The standard path we follow, from first consultation to one-year follow-up.","yolculuk.1.g":"Step 1","yolculuk.1.a":"Consultation","yolculuk.1.m":"You send your photos. We set the graft count and the right technique.","yolculuk.2.g":"Step 2","yolculuk.2.a":"Exam and design","yolculuk.2.m":"Blood tests are done, the hairline is designed together and approved by you.","yolculuk.3.g":"Step 3","yolculuk.3.a":"Procedure","yolculuk.3.m":"One session under local anaesthetic; the time follows the graft count. You go home the same day.","yolculuk.4.g":"Step 4","yolculuk.4.a":"First wash and follow-up","yolculuk.4.m":"First wash at the clinic the next day, then check-ups for a full year.","yolculuk.dahil":"Examination, medication set and one year of follow-up are included.","klinik.baslik":"The clinic","klinik.alt":"Every procedure takes place at our Ministry of Health licensed clinic in Istanbul.","klinik.m1":"Procedures are performed under physician supervision.","klinik.m2":"Single-use sterile materials.","klinik.m3":"Turkish, English and Arabic support.","klinik.m4":"Twelve months of follow-up after surgery.","yorum.baslik":"Patient stories","yorum.kapali.baslik":"We do not show patient reviews in the Turkish edition","yorum.kapali.metin":"The 12/11/2025 Promotion Regulation (Art. 5/1-e) bars using patient satisfaction statements promotionally in publications aimed at Turkey. We do not bend the rule. Ask us directly and we answer in writing.","yorum.kapali.dil":"Show the English version","fiyat.kapali.baslik":"We cannot print the price here \u2014 but we are not hiding it","fiyat.kapali.metin":"The same regulation (Art. 5/1-m) bars fees, discounts and campaigns in publications aimed at Turkey. Here is how it works: you send your photos, we write back the same day with your graft range, and the price follows in writing.","fiyat.kapali.cta":"Send me the price","sss.baslik":"Frequently asked","sss.anaAlt":"What people ask most before deciding.","sss.tumu":"See all twelve","sss.1.s":"Is the procedure painful?","sss.1.c":"A local anaesthetic is used. You feel a brief sting while it is given, and no pain is expected afterwards.","sss.2.s":"When can I return to work?","sss.2.c":"The next day with the no-shave method, and after about three days with the classic method.","sss.3.s":"Do transplanted hairs fall out?","sss.3.c":"Shock loss between weeks two and four is normal. The roots stay, and hair regrows from the third month.","sss.4.s":"When are results visible?","sss.4.c":"Visible density forms by month six. The final result is assessed between twelve and eighteen months.","sss.5.s":"How many grafts do I need?","sss.5.c":"It depends on your loss stage and donor density. The calculator estimates; examination gives the exact number.","sss.6.s":"Is there an age limit?","sss.6.c":"It is usually preferred after twenty-five, once the pattern of hair loss has settled.","sss.7.s":"Will there be scars at the back?","sss.7.c":"FUE makes no incision; each graft is taken individually and leaves dot marks under a millimetre. They are invisible once the hair is clipped to a number one. If you shave to the skin, someone looking closely may notice. We measure your donor density at the examination and tell you plainly.","sss.8.s":"Will it look artificial?","sss.8.c":"Natural results come from the line, not the graft count. Only single-hair grafts go in the front row, multi-hair grafts sit behind them, the line is drawn slightly irregular rather than straight, and the exit angle matches the neighbouring hair. Get those three right and the result holds up even with wet hair.","sss.9.s":"What if it does not take?","sss.9.c":"A small share of grafts not surviving is expected and the plan allows for it. At month twelve we review it together: if coverage is below plan and your donor capacity allows, a corrective session is scheduled. We tell you in writing, before the operation, when that is free of charge and when it is not.","sss.10.s":"Will people at work notice?","sss.10.c":"Expect redness and mild swelling for three days; a loose hat is fine. With the no-shave method your hair is not cut, so you can go out the next day. With the classic method the donor area is clipped short, which is why most people take a week off.","sss.11.s":"I am travelling in \u2014 how many nights do I need?","sss.11.c":"Two nights. Day one: examination, blood tests, hairline design and the operation. Day two: first wash at the clinic and aftercare briefing. Day three: you are free to fly. The clinic is in \u015Ei\u015Fli, roughly forty minutes from the airport. We do not sell accommodation or transfers, but we send you the partner hotel and directions in writing.","sss.12.s":"When and how do I learn the price?","sss.12.c":"You send your photos; we write back the same day with your graft range. The price follows that range and comes to you in writing on WhatsApp. The figure does not change when you arrive; only the graft count is finalised by measurement at the examination.","form.baslik":"Free hair analysis","form.alt":"Three details are enough. Our team replies the same day.","form.ad":"Your name","form.tel":"Phone","form.foto":"Add photos (crown and front)","form.fotoNot":"Optional, but it makes the estimate far more accurate.","form.kvkk":"I have read the notice on how my personal data is processed.","form.gonder":"Start analysis","form.wa":"Message on WhatsApp","form.basarili":"Request received. Nothing is actually sent in this demo.","alt.g.tekDhi":"A gloved hand holds a slim instrument over a sterile drape.","alt.g.tekSafir":"Two pairs of gloved hands work with fine forceps over a draped field.","alt.g.tekTras":"A person seen from behind against a dark backdrop, hair in view.","alt.g.klinik1":"Under the surgical lamp, a masked team stands at the head of the table.","alt.g.klinik2":"Two staff in caps and masks lean over the person on the table.","alt.g.konsultasyon":"A wide frame of the operating room, four staff around the table.","alt.g.hekim":"Studio portrait of a person in a white coat against a dark backdrop.","alt.g.ekip":"A person in blue scrubs sits on a gurney, stethoscope around the neck.","alt.g.danisman":"Close portrait of a person resting a hand on the chin, dark backdrop.","alt.g.aletler":"Surgical instruments laid out in perforated steel trays, staff blurred behind.","alt.g.makro2":"Macro frame of curved, light-catching strands on a black ground.","alt.g.yogunluk":"Seen from above, a dense surface of fine strands standing upright.","alt.g.mikro":"A dense bundle of pale fine strands lit from the side.","alt.g.portre":"Profile of a closely cropped head; the nape and ear are visible.","alt.g.kendi1":"A sterile instrument tray laid out in the operating room, staff blurred behind it.","alt.g.kendi2":"Gloved hands sorting grafts on a wooden spatula next to petri dishes.","alt.g.kendi3":"A masked clinician at work, wearing three-times surgical magnifying loupes.","alt.adres":"\u015Ei\u015Fli, Istanbul","alt.saat":"Every day 09:00 \u2013 20:00","alt.hizmet":"Services","alt.kurumsal":"Company","alt.yas 011F\xFC ve ense b\xF6lgesindeki don\xF6r yo\u011Funlu\u011Fu.","Don\xF6r alan s\u0131n\u0131rl\u0131d\u0131r. Bir ki\u015Fiden \xF6m\xFCr boyu al\u0131nabilecek greft say\u0131s\u0131 bellidir; bu y\xFCzden ilk operasyonda alan\u0131n tamam\u0131n\u0131 kapatmak yerine \xF6ncelik s\u0131ras\u0131 belirlenir. Genellikle \xF6n sa\xE7 \xE7izgisi \xF6nce planlan\u0131r, \xE7\xFCnk\xFC y\xFCz \xE7er\xE7evesini o belirler.","Bu sitedeki greft haritas\u0131 \xF6l\xE7\xFCm\xFC \u015F\xF6yle yapar: se\xE7ti\u011Finiz b\xF6lgelerin santimetrekare cinsinden alan\u0131, hedeflenen yo\u011Funlukla \xE7arp\u0131l\u0131r. Tek seansta g\xFCvenli \xFCst s\u0131n\u0131r 4.500 greft kabul edilir; daha fazlas\u0131 gerekiyorsa iki seans planlan\u0131r. Kesin say\u0131, muayenede don\xF6r yo\u011Funlu\u011Fu santimetrekare ba\u015F\u0131na \xF6l\xE7\xFClerek \xE7\u0131kar."]},{slug:"norwood",kat:"Temel bilgi",dk:4,tarih:"2026-07-14",bas:"Norwood skalas\u0131 nedir?",ozet:"Erkek tipi sa\xE7 d\xF6k\xFClmesini yedi evreye ay\u0131ran \xF6l\xE7ek. Planlaman\u0131n ortak dili budur.",govde:["Norwood skalas\u0131, erkek tipi sa\xE7 d\xF6k\xFClmesini yedi evrede tan\u0131mlar. Klinikler aras\u0131nda ortak dil olmas\u0131n\u0131n sebebi budur: evre s\xF6ylendi\u011Finde herkes ayn\u0131 tabloyu anlar.","Evre 2 ve 3 \xE7o\u011Funlukla \xF6n \xE7izgi gerilemesidir. Evre 4\u2019ten sonra tepe b\xF6lgesi de a\xE7\u0131lmaya ba\u015Flar ve iki b\xF6lge birle\u015Fme e\u011Filimine girer. Evre 6 ve 7\u2019de don\xF6r alan\u0131n yeterlili\u011Fi belirleyici hale gelir.","Evre tek ba\u015F\u0131na yeterli de\u011Fildir. Ayn\u0131 evredeki iki ki\u015Fide don\xF6r yo\u011Funlu\u011Fu farkl\u0131ysa planlama da farkl\u0131 olur."]},{slug:"trassiz",kat:"Teknik",dk:5,tarih:"2026-06-30",bas:"Tra\u015Fs\u0131z ekim kimler i\xE7in uygun?",ozet:"Sa\xE7 kesilmeden yap\u0131l\u0131r, ertesi g\xFCn sosyal hayata d\xF6n\xFCl\xFCr. Ama greft say\u0131s\u0131nda s\u0131n\u0131r vard\u0131r.",govde:["Tra\u015Fs\u0131z ekimde don\xF6r b\xF6lgeden al\u0131nan k\xF6kler sa\xE7 kesilmeden toplan\u0131r. En b\xFCy\xFCk avantaj\u0131 g\xF6r\xFCn\xFCrl\xFCk: operasyonun ertesi g\xFCn\xFC i\u015Fe d\xF6nmek m\xFCmk\xFCnd\xFCr.","S\u0131n\u0131r \u015Fudur: tra\u015Fs\u0131z y\xF6ntemde tek seansta al\u0131nabilecek greft say\u0131s\u0131 klasik y\xF6nteme g\xF6re daha d\xFC\u015F\xFCkt\xFCr. Geni\u015F alan kapat\u0131lmas\u0131 gerekiyorsa iki seans planlan\u0131r ya da k\u0131smi tra\u015F \xF6nerilir.","Uygunluk karar\u0131 don\xF6r yo\u011Funlu\u011Fu ve sa\xE7 uzunlu\u011Funa g\xF6re verilir. Muayenede birlikte belirlenir."]},{slug:"ilk-30-gun",kat:"Sonras\u0131",dk:7,tarih:"2026-06-12",bas:"Ekimden sonra ilk 30 g\xFCn",ozet:"Kabuklanma, \u015Fok d\xF6k\xFClme ve bekleme. \u0130lk ay sonucu de\u011Fil, iyile\u015Fmeyi anlat\u0131r.",govde:["\u0130lk \xFC\xE7 g\xFCn \xF6dem ve hassasiyet beklenir. \u0130lk y\u0131kama klinikte yap\u0131l\u0131r ve nas\u0131l devam edilece\u011Fi anlat\u0131l\u0131r.","Yedinci g\xFCnden itibaren kabuklar d\xF6k\xFClmeye ba\u015Flar. \u0130kinci ve d\xF6rd\xFCnc\xFC hafta aras\u0131nda ekilen sa\xE7lar\u0131n b\xFCy\xFCk b\xF6l\xFCm\xFC d\xF6k\xFCl\xFCr; buna \u015Fok d\xF6k\xFClme denir ve normaldir. K\xF6kler yerinde kal\u0131r.","\xDC\xE7\xFCnc\xFC aydan sonra yeni \xE7\u0131k\u0131\u015F ba\u015Flar. Alt\u0131nc\u0131 ayda g\xF6r\xFCn\xFCr yo\u011Funluk olu\u015Fur, nihai de\u011Ferlendirme on iki ile on sekizinci ay aras\u0131nda yap\u0131l\u0131r."]},{slug:"dhi-safir",kat:"Teknik",dk:5,tarih:"2026-05-26",bas:"DHI ile safir FUE aras\u0131ndaki fark",ozet:"\u0130kisi de FUE ailesindendir. Fark, k\xF6k\xFCn nas\u0131l yerle\u015Ftirildi\u011Finde.",govde:["Safir FUE\u2019de \xF6nce safir u\xE7larla kanallar a\xE7\u0131l\u0131r, sonra k\xF6kler yerle\u015Ftirilir. DHI\u2019de kanal a\xE7ma ve yerle\u015Ftirme tek ad\u0131mda, Choi kalemiyle yap\u0131l\u0131r.","DHI daha y\xFCksek s\u0131kl\u0131k ve daha k\u0131sa k\xF6ks\xFCz s\xFCre sa\u011Flar; s\u0131k sa\xE7 aras\u0131na ekim yaparken avantajl\u0131d\u0131r. Safir FUE geni\u015F alanlarda daha h\u0131zl\u0131 ilerler.","Hangi y\xF6ntemin uygun oldu\u011Fu alan\u0131n b\xFCy\xFCkl\xFC\u011F\xFCne, mevcut sa\xE7 yo\u011Funlu\u011Funa ve don\xF6r kapasitesine g\xF6re belirlenir."]},{slug:"donor",kat:"Planlama",dk:4,tarih:"2026-05-08",bas:"Don\xF6r alan neden s\u0131n\u0131rl\u0131d\u0131r?",ozet:"Ense ve \u015Fakak b\xF6lgesindeki k\xF6kler d\xF6k\xFClmeye diren\xE7lidir. Say\u0131lar\u0131 ise sabittir.",govde:["Sa\xE7 ekiminde kullan\u0131lan k\xF6kler ense ve \u015Fakak b\xF6lgesinden al\u0131n\u0131r. Bu b\xF6lgedeki k\xF6kler hormonal d\xF6k\xFClmeye diren\xE7lidir; ekildikleri yerde de bu \xF6zelli\u011Fi korurlar.","Bu b\xF6lgenin kapasitesi sabittir. Fazla al\u0131m don\xF6r alanda seyrelmeye yol a\xE7ar ve geri d\xF6n\xFC\u015F\xFC yoktur; bu y\xFCzden planlama tek operasyona de\u011Fil, \xF6m\xFCr boyu kapasiteye g\xF6re yap\u0131l\u0131r.","\u0130yi bir plan, bug\xFCnk\xFC a\xE7\u0131kl\u0131\u011F\u0131 kapat\u0131rken on y\u0131l sonraki d\xF6k\xFClme i\xE7in de pay b\u0131rak\u0131r."]}],en:[{slug:"kac-greft",kat:"Planning",dk:6,tarih:"2026-07-28",bas:"How many grafts do I need?",ozet:"Three things set the graft count: your loss stage, the area to be covered and donor density.",govde:["The graft count is not a preference; it is the result of a measurement. Three things decide it: the stage your hair loss has reached, the size of the area to be covered, and the donor density at the nape.","The donor area is limited. The number of grafts one person can give over a lifetime is finite, so the first operation sets an order of priority instead of covering everything at once. The front hairline is usually planned first, because it frames the face.","The graft map on this site measures it like this: the area of the zones you select, in square centimetres, is multiplied by the target density. The safe ceiling for a single session is taken as 4,500 grafts; if more is needed, two sessions are planned. The exact number comes out of the examination, where donor density is measured per square centimetre."]},{slug:"norwood",kat:"Basics",dk:4,tarih:"2026-07-14",bas:"What is the Norwood scale?",ozet:"The scale that splits male pattern hair loss into seven stages. It is the shared language of planning.",govde:["The Norwood scale describes male pattern hair loss in seven stages. That is why it works as a shared language between clinics: name the stage and everyone pictures the same thing.","Stages 2 and 3 are mostly a receding front line. From stage 4 the crown starts to open as well, and the two areas tend to merge. At stages 6 and 7 the question becomes whether the donor area is enough.","The stage alone is not enough. If two people at the same stage have different donor densities, their plans differ too."]},{slug:"trassiz",kat:"Technique",dk:5,tarih:"2026-06-30",bas:"Who is no-shave suitable for?",ozet:"Done without cutting your hair, with a return to daily life the next day. Graft numbers are limited, though.",govde:["In a no-shave transplant the roots are harvested from the donor area without cutting the hair. The main advantage is discretion: going back to work the day after the operation is possible.","Here is the limit: the number of grafts that can be taken in a single no-shave session is lower than with the classic method. If a wide area has to be covered, two sessions are planned or a partial shave is suggested.","Suitability is decided on donor density and hair length. We settle it together at the examination."]},{slug:"ilk-30-gun",kat:"Aftercare",dk:7,tarih:"2026-06-12",bas:"The first 30 days after surgery",ozet:"Crusting, shock loss and waiting. The first month shows you healing, not the result.",govde:["Swelling and tenderness are expected in the first three days. The first wash is done at the clinic, and you are shown how to carry on at home.","From day seven the crusts start to come away. Between weeks two and four most of the transplanted hairs shed; this is called shock loss and it is normal. The roots stay in place.","New growth begins after the third month. Visible density forms by month six, and the final assessment is made between months twelve and eighteen."]},{slug:"dhi-safir",kat:"Technique",dk:5,tarih:"2026-05-26",bas:"DHI versus sapphire FUE",ozet:"Both belong to the FUE family. The difference is in how the root is placed.",govde:["In sapphire FUE the channels are opened first with sapphire blades, then the roots are placed. In DHI, opening and placing happen in one step, with the Choi pen.","DHI allows a higher density and keeps the root outside the body for less time; it helps when planting between existing hair. Sapphire FUE moves faster across wide areas.","Which method fits is decided by the size of the area, the density of the existing hair and the donor capacity."]},{slug:"donor",kat:"Planning",dk:4,tarih:"2026-05-08",bas:"Why is the donor area limited?",ozet:"Roots at the nape and temples resist shedding. Their number, however, is fixed.",govde:["The roots used in a hair transplant are taken from the nape and the temples. Roots from that area resist hormonal shedding, and they keep that trait wherever they are planted.","The capacity of that area is fixed. Over-harvesting thins the donor area and cannot be undone, so planning follows lifetime capacity rather than a single operation.","A good plan covers today\u2019s opening while leaving a reserve for the shedding of ten years from now."]}],ar:[{slug:"kac-greft",kat:"\u0627\u0644\u062A\u062E\u0637\u064A\u0637",dk:6,tarih:"2026-07-28",bas:"\u0643\u0645 \u0628\u0635\u064A\u0644\u0629 \u0623\u062D\u062A\u0627\u062C\u061F",ozet:"\u062B\u0644\u0627\u062B\u0629 \u0639\u0648\u0627\u0645\u0644 \u062A\u062D\u062F\u0651\u062F \u0639\u062F\u062F \u0627\u0644\u0628\u0635\u064A\u0644\u0627\u062A: \u0645\u0631\u062D\u0644\u0629 \u0627\u0644\u062A\u0633\u0627\u0642\u0637\u060C \u0648\u0627\u0644\u0645\u0633\u0627\u062D\u0629 \u0627\u0644\u0645\u0631\u0627\u062F \u062A\u063A\u0637\u064A\u062A\u0647\u0627\u060C \u0648\u0643\u062B\u0627\u0641\u0629 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0627\u0646\u062D\u0629.",govde:["\u0639\u062F\u062F \u0627\u0644\u0628\u0635\u064A\u0644\u0627\u062A \u0644\u064A\u0633 \u062E\u064A\u0627\u0631\u064B\u0627 \u0634\u062E\u0635\u064A\u064B\u0627 \u0628\u0644 \u0646\u062A\u064A\u062C\u0629 \u0642\u064A\u0627\u0633. \u062A\u062D\u062F\u0651\u062F\u0647 \u062B\u0644\u0627\u062B\u0629 \u0639\u0648\u0627\u0645\u0644: \u0627\u0644\u0645\u0631\u062D\u0644\u0629 \u0627\u0644\u062A\u064A \u0628\u0644\u063A\u0647\u0627 \u0627\u0644\u062A\u0633\u0627\u0642\u0637\u060C \u0648\u0645\u0633\u0627\u062D\u0629 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0631\u0627\u062F \u062A\u063A\u0637\u064A\u062A\u0647\u0627\u060C \u0648\u0643\u062B\u0627\u0641\u0629 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0627\u0646\u062D\u0629 \u0641\u064A \u0645\u0624\u062E\u0631\u0629 \u0627\u0644\u0631\u0623\u0633.","\u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0627\u0646\u062D\u0629 \u0645\u062D\u062F\u0648\u062F\u0629. \u0641\u0639\u062F\u062F \u0627\u0644\u0628\u0635\u064A\u0644\u0627\u062A \u0627\u0644\u062A\u064A \u064A\u0645\u0643\u0646 \u0623\u062E\u0630\u0647\u0627 \u0645\u0646 \u0627\u0644\u0634\u062E\u0635 \u0637\u0648\u0627\u0644 \u062D\u064A\u0627\u062A\u0647 \u062B\u0627\u0628\u062A\u060C \u0648\u0644\u0630\u0644\u0643 \u062A\u064F\u062D\u062F\u064E\u0651\u062F \u0623\u0648\u0644\u0648\u064A\u0627\u062A \u0641\u064A \u0627\u0644\u0639\u0645\u0644\u064A\u0629 \u0627\u0644\u0623\u0648\u0644\u0649 \u0628\u062F\u0644 \u062A\u063A\u0637\u064A\u0629 \u0627\u0644\u0645\u0633\u0627\u062D\u0629 \u0643\u0644\u0647\u0627 \u062F\u0641\u0639\u0629 \u0648\u0627\u062D\u062F\u0629. \u0648\u064A\u064F\u062E\u0637\u064E\u0651\u0637 \u0639\u0627\u062F\u0629\u064B \u0644\u062E\u0637 \u0627\u0644\u0634\u0639\u0631 \u0627\u0644\u0623\u0645\u0627\u0645\u064A \u0623\u0648\u0644\u064B\u0627 \u0644\u0623\u0646\u0647 \u064A\u0631\u0633\u0645 \u0625\u0637\u0627\u0631 \u0627\u0644\u0648\u062C\u0647.","\u0648\u062A\u064F\u062C\u0631\u064A \u062E\u0631\u064A\u0637\u0629 \u0627\u0644\u0628\u0635\u064A\u0644\u0627\u062A \u0641\u064A \u0647\u0630\u0627 \u0627\u0644\u0645\u0648\u0642\u0639 \u0627\u0644\u0642\u064A\u0627\u0633 \u0639\u0644\u0649 \u0647\u0630\u0627 \u0627\u0644\u0646\u062D\u0648: \u062A\u064F\u0636\u0631\u0628 \u0645\u0633\u0627\u062D\u0629 \u0627\u0644\u0645\u0646\u0627\u0637\u0642 \u0627\u0644\u062A\u064A \u062A\u062E\u062A\u0627\u0631\u0647\u0627 \u0628\u0627\u0644\u0633\u0646\u062A\u064A\u0645\u062A\u0631 \u0627\u0644\u0645\u0631\u0628\u0651\u0639 \u0641\u064A \u0627\u0644\u0643\u062B\u0627\u0641\u0629 \u0627\u0644\u0645\u0633\u062A\u0647\u062F\u0641\u0629. \u0648\u064A\u064F\u0639\u062A\u0645\u062F 4,500 \u0628\u0635\u064A\u0644\u0629 \u062D\u062F\u064B\u0651\u0627 \u0622\u0645\u0646\u064B\u0627 \u0644\u0644\u062C\u0644\u0633\u0629 \u0627\u0644\u0648\u0627\u062D\u062F\u0629\u060C \u0648\u0625\u0646 \u0644\u0632\u0645 \u0623\u0643\u062B\u0631 \u062A\u064F\u062E\u0637\u064E\u0651\u0637 \u062C\u0644\u0633\u062A\u0627\u0646. \u0623\u0645\u0651\u0627 \u0627\u0644\u0639\u062F\u062F \u0627\u0644\u062F\u0642\u064A\u0642 \u0641\u064A\u0638\u0647\u0631 \u0641\u064A \u0627\u0644\u0641\u062D\u0635 \u0628\u0642\u064A\u0627\u0633 \u0643\u062B\u0627\u0641\u0629 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0627\u0646\u062D\u0629 \u0644\u0643\u0644 \u0633\u0646\u062A\u064A\u0645\u062A\u0631 \u0645\u0631\u0628\u0651\u0639."]},{slug:"norwood",kat:"\u0645\u0639\u0644\u0648\u0645\u0627\u062A \u0623\u0633\u0627\u0633\u064A\u0629",dk:4,tarih:"2026-07-14",bas:"\u0645\u0627 \u0647\u0648 \u0645\u0642\u064A\u0627\u0633 \u0646\u0648\u0631\u0648\u0648\u062F\u061F",ozet:"\u0645\u0642\u064A\u0627\u0633 \u064A\u0642\u0633\u0651\u0645 \u062A\u0633\u0627\u0642\u0637 \u0627\u0644\ 1Fal g\xF6r\xFCn\xFCm i\xE7in \xF6n sa\xE7 \xE7izgisi, orta b\xF6lge ve tepe farkl\u0131 yo\u011Funluklarda planlan\u0131r.",olcu:"Kendi sa\xE7l\u0131 derinizde ~80\u2013100 folik\xFCl/cm\xB2 \xB7 ekimde tipik hedef 35\u201350 greft/cm\xB2"},norwood:{ad:"Norwood evresi",kisa:"Erkek tipi sa\xE7 d\xF6k\xFClmesinin yayg\u0131nl\u0131\u011F\u0131n\u0131 birden yediye anlatan \xF6l\xE7ek.",uzun:"Hekimle hastan\u0131n ayn\u0131 \u015Feyi konu\u015Fabilmesi i\xE7in kullan\u0131l\u0131r. Evre y\xFCkseldik\xE7e a\xE7\u0131lan alan ve gereken greft say\u0131s\u0131 artar. Kad\u0131n tipi d\xF6k\xFClme bu \xF6l\xE7ekle de\u011Fil, ayr\u0131 bir \xF6l\xE7ekle anlat\u0131l\u0131r.",olcu:"1 = \u015Fakaklarda hafif a\xE7\u0131lma \xB7 7 = yaln\u0131z ense ve yanlar sa\xE7l\u0131"},fue:{ad:"FUE",kisa:"K\xF6kleri tek tek al\u0131p a\xE7\u0131lan kanallara yerle\u015Ftiren, diki\u015Fsiz y\xF6ntem.",uzun:"Don\xF6rden \u015Ferit halinde deri kesilmez; k\xF6kler mikro u\xE7larla teker teker \xE7\u0131kar\u0131l\u0131r. Bu y\xFCzden ensede \xE7izgi bi\xE7iminde diki\u015F izi kalmaz ve iyile\u015Fme daha k\u0131sa s\xFCrer.",olcu:"A\xE7\u0131l\u0131m\u0131: Follicular Unit Extraction \u2014 k\xF6k \xFCnitesi \xE7\u0131karma"},safir:{ad:"Safir FUE",kisa:"Kanallar\u0131n \xE7elik yerine safir u\xE7lu b\u0131\xE7akla a\xE7\u0131ld\u0131\u011F\u0131 FUE.",uzun:"Safir u\xE7 daha ince ve d\xFCzg\xFCn bir kanal a\xE7ar; ama\xE7 dokuda daha az tahri\u015F ve daha s\u0131k yerle\u015Fimdir. Y\xF6ntemin geri kalan\u0131 FUE ile birebir ayn\u0131d\u0131r, de\u011Fi\u015Fen yaln\u0131z kanal ucudur."},dhi:{ad:"DHI",kisa:"Kanal a\xE7madan, kalem u\xE7lu aletle k\xF6k\xFC do\u011Frudan yerle\u015Ftiren y\xF6ntem.",uzun:"Choi kalemi kanal\u0131 a\xE7ar ve k\xF6k\xFC ayn\u0131 hareketle b\u0131rak\u0131r. K\xF6k d\u0131\u015Far\u0131da daha k\u0131sa bekler, ayr\u0131ca mevcut sa\xE7lar\u0131n aras\u0131na seyrelmi\u015F b\xF6lgeye ekim yapmak kolayla\u015F\u0131r.",olcu:"A\xE7\u0131l\u0131m\u0131: Direct Hair Implantation \u2014 do\u011Frudan sa\xE7 yerle\u015Ftirme"},trassiz:{ad:"Tra\u015Fs\u0131z ekim",kisa:"Sa\xE7\u0131n\u0131z kesilmeden yap\u0131lan ekim; ertesi g\xFCn g\xFCnl\xFCk hayata d\xF6n\xFCl\xFCr.",uzun:"Yaln\u0131z k\xF6klerin al\u0131naca\u011F\u0131 k\xFC\xE7\xFCk alan, \xFCstteki uzun sa\xE7\u0131n alt\u0131nda kalacak \u015Fekilde k\u0131salt\u0131l\u0131r; d\u0131\u015Far\u0131dan g\xF6r\xFCnmez. Buna kar\u015F\u0131l\u0131k tek seansta al\u0131nabilen greft say\u0131s\u0131 s\u0131n\u0131rl\u0131 kal\u0131r."},sok:{ad:"\u015Eok d\xF6k\xFClme",kisa:"Ekimden sonraki haftalarda ekilen tellerin d\xF6k\xFClmesi; k\xF6k yerinde kal\u0131r.",uzun:"Beklenen bir a\u015Famad\u0131r, ba\u015Far\u0131s\u0131zl\u0131k de\u011Fildir. Tel d\xFC\u015Fer ama k\xF6k deride kal\u0131r ve yeni sa\xE7 \xE7\u0131kar\u0131r. Panik yaratan k\u0131s\u0131m budur; oysa takvimin normal par\xE7as\u0131d\u0131r.",olcu:"Genelde 2.\u20138. haftalar \xB7 yeni \xE7\u0131k\u0131\u015F 3.\u20134. aydan itibaren"},prp:{ad:"PRP",kisa:"Kendi kan\u0131n\u0131zdan ayr\u0131\u015Ft\u0131r\u0131lan yo\u011Fun plazman\u0131n sa\xE7l\u0131 deriye verilmesi.",uzun:"Kan al\u0131n\u0131r, santrif\xFCjde trombositten zengin k\u0131sm\u0131 ayr\u0131l\u0131r ve sa\xE7l\u0131 deriye enjekte edilir. Var olan sa\xE7\u0131 desteklemek i\xE7in kullan\u0131lan bir bak\u0131md\u0131r; sa\xE7 ekiminin yerine ge\xE7mez.",olcu:"A\xE7\u0131l\u0131m\u0131: Platelet-Rich Plasma \u2014 trombositten zengin plazma"},mezo:{ad:"Mezoterapi",kisa:"Sa\xE7l\u0131 deriye k\xFC\xE7\xFCk i\u011Fnelerle vitamin ve mineral kar\u0131\u015F\u0131m\u0131 verilmesi.",uzun:"Kar\u0131\u015F\u0131m do\u011Frudan k\xF6klerin bulundu\u011Fu derinli\u011Fe b\u0131rak\u0131l\u0131r. Destekleyici bir bak\u0131md\u0131r: tamamen a\xE7\u0131lm\u0131\u015F bir alan\u0131 yeniden sa\xE7land\u0131rmaz, ekimin alternatifi de\u011Fildir."}},en:{greft:{ad:"Graft",kisa:"A tiny package of roots taken from the skin; it holds about two hairs.",uzun:"Planning is done in grafts, not in hairs. One graft can carry one to four hairs, two on average. So 3,000 grafts means roughly 6,000 hairs.",olcu:"1 graft \u2248 2 hairs (varies between 1 and 4)"},folikul:{ad:"Follicle",kisa:"The root of a hair under the skin, together with the sheath around it.",uzun:"The hair you see is the part that grows out of the follicle. Surgery moves the follicle itself, not the hair, which is why transplanted hair keeps the habits of its original root."},donor:{ad:"Donor area",kisa:"The band at the back and sides where hair resists thinning.",uzun:"Roots there are insensitive to the hormone that causes loss, so they keep growing wherever they are moved. It is a one-off supply for life, and it sets the ceiling on total grafts.",olcu:"Its limit is counted during examination, never estimated"},yogunluk:{ad:"Grafts/cm\xB2 (density)",kisa:"How many grafts go into one square centimetre; it sets the thickness.",uzun:"Packing more is not automatically better: above a point the roots cannot be fed. For a natural look the hairline, mid-scalp and crown are planned at different densities.",olcu:"Your own scalp holds ~80\u2013100 follicles/cm\xB2 \xB7 a typical transplant target is 35\u201350 grafts/cm\xB2"},norwood:{ad:"Norwood stage",kisa:"A one-to-seven scale describing how far male pattern loss has gone.",uzun:"It exists so surgeon and patient describe the same thing. The higher the stage, the larger the bare area and the more grafts it takes. Female pattern loss uses a separate scale.",olcu:"1 = slight temple recession \xB7 7 = only the back and sides still have hair"},fue:{ad:"FUE",kisa:"Roots are taken out one by one and set into opened channels; no stitches.",uzun:"No strip of skin is cut from the donor; roots are removed individually with micro punches. That is why no line-shaped scar is left at the back and healing takes less time.",olcu:"Stands for Follicular Unit Extraction"},safir:{ad:"Sapphire FUE",kisa:"FUE in which the channels are opened with a sapphire blade, not steel.",uzun:"A sapphire tip opens a thinner, smoother channel; the aim is less irritation in the tissue and closer placement. Everything else is ordinary FUE \u2014 only the blade changes."},dhi:{ad:"DHI",kisa:"A pen-tipped tool places the root directly, without opening a channel first.",uzun:"The Choi pen opens the channel and releases the root in one movement. The root spends less time outside the body, and it becomes easier to plant between existing hairs.",olcu:"Stands for Direct Hair Implantation"},trassiz:{ad:"No-shave transplant",kisa:"Surgery without cutting your hair; you can go out the next day.",uzun:"Only the small patch the roots come from is trimmed, hidden under the longer hair above it, so nothing shows. In exchange, the number of grafts one session can take stays limited."},sok:{ad:"Shock loss",kisa:"The transplanted hairs fall out in the weeks after surgery; the roots stay.",uzun:"It is an expected stage, not a failure. The hair drops but the root remains in the skin and grows a new one. This is the part that frightens people, though it belongs to the normal timeline.",olcu:"Usually weeks 2\u20138 \xB7 regrowth from month 3\u20134 onwards"},prp:{ad:"PRP",kisa:"Concentrated plasma separated from your own blood, injected into the scalp.",uzun:"Blood is drawn, the platelet-rich fraction is separated in a centrifuge and injected into the scalp. It is a treatment that supports existing hair; it does not replace a transplant.",olcu:"Stands for Platelet-Rich Plasma"},mezo:{ad:"Mesotherapy",kisa:"A vitamin and mineral mix delivered into the scalp with fine needles.",uzun:"The mix is left at the depth where the roots sit. It is supportive care: it will not bring hair back to a fully bare area and it is not an alternative to surgery."}},ar:{greft:{ad:"\u0627\u0644\u0637\u064F\u0639\u0645",kisa:"\u062D\u0632\u0645\u0629 \u062C\u0630\u0648\u0631 \u0635\u063A\u064A\u0631\u0629 \u062A\u0624\u062E\u0630 \u0645\u0646 \u0627\u0644\u062C\u0644\u062F \u0648\u062A\u062D\u0645\u0644 \u0634\u0639\u0631\u062A\u064A\u0646 \u0641\u064A \u0627\u0644\u0645\u062A\u0648\u0633\u0637.",uzun:"\u064A\u064F\u062E\u0637\u064E\u0651\u0637 \u0644\u0644\u0639\u0645\u0644\u064A\u0629 \u0628\u0639\u062F\u062F \u0627\u0644\u0637\u0639\u0648\u0645 \u0644\u0627 \u0628\u0639\u062F\u062F \u0627\u0644\u0634\u0639\u0631\u0627\u062A. \u0627\u0644\u0637\u064F\u0639\u0645 \u0627\u0644\u0648\u0627\u062D\u062F \u064A\u062D\u0645\u0644 \u0645\u0646 \u0634\u0639\u0631\u0629 \u0625\u0644\u0649 \u0623\u0631\u0628\u0639\u060C \u0648\u0645\u062A\u0648\u0633\u0637\u0647 \u0634\u0639\u0631\u062A\u0627\u0646\u060C \u0641\u062B\u0644\u0627\u062B\u0629 \u0622\u0644\u0627\u0641 \u0637\u064F\u0639\u0645 \u062A\u0639\u0646\u064A \u0646\u062D\u0648 \u0633\u062A\u0629 \u0622\u0644\u0627\u0641 \u0634\u0639\u0631\u0629.",olcu:"\u0637\u064F\u0639\u0645 \u0648\u0627\u062D\u062F \u2248 \u0634\u0639\u0631\u062A\u0627\u0646 (\u064A\u062A\u0631\u0627\u0648\u062D \u0628\u064A\u0646 \u0648\u0627\u062D\u062F\u0629 \u0648\u0623\u0631\u0628\u0639)"},folikul:{ad:"\u0627\u0644\u0628\u0635\u064A\u0644\u0629",kisa:"\u062C\u0630\u0631 \u0627\u0644\u0634\u0639\u0631\u0629 \u062A\u062D\u062A \u0627\u0644\u062C\u0644\u062F \u0645\u0639 \u0627\u0644\u063A\u0644\u0627\u0641 \u0627\u0644\u0645\u062D\u064A\u0637 \u0628\u0647.",uzun:"\u0627\u0644\u0634\u0639\u0631\u0629 \u0627\u0644\u062A\u064A \u062A\u0631\u0627\u0647\u0627 \u0647\u064A \u0627\u0644\u062C\u0632\u0621 \u0627\u0644\u062E\u0627\u0631\u062C \u0645\u0646 \u0627\u0644\u0628\u0635\u064A\u0644\u0629. \u0627\u0644\u0645\u0646\u0642\u0648\u0644 \u0641\u064A \u0627\u0644\u0639\u0645\u0644\u064A\u0629 \u0647\u0648 \u0627\u0644\u0628\u0635\u064A\u0644\u0629 \u0646\u0641\u0633\u0647\u0627 \u0644\u0627 \u0627\u0644\u0634\u0639\u0631\u0629\u060C \u0648\u0644\u0647\u0630\u0627 \u064A\u062D\u062A\u0641\u0638 \u0627\u0644\u0634\u0639\u0631 \u0627\u0644\u0645\u0632\u0631\u0648\u0639 \u0628\u0637\u0628\u0639 \u062C\u0630\u0631\u0647 \u0627\u0644\u0623\u0635\u0644\u064A. \u0648\u0643\u062B\u064A\u0631\u064B\u0627 \u0645\u0627 \u062A\u064F\u0633\u062A\u0639\u0645\u0644 \u0643\u0644\u0645\u0629 \u0628\u0635\u064A\u0644\u0629 \u0628\u0645\u0639\u0646\u0649 \u0637\u064F\u0639\u0645."},donor:{ad:"\u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0627\u0646\u062D\u0629",kisa:"\u0634\u0631\u064A\u0637 \u0645\u0624\u062E\u0631\u0629 \u0627\u0644\u0631\u0623\u0633 \u0648\u0627\u0644\u062C\u0627\u0646\u0628\u064A\u0646 \u062D\u064A\u062B \u064A\u0642\u0627\u0648\u0645 \u0627\u0644\u0634\u0639\u0631 \u0627\u0644\u062A\u0633\u0627\u0642\u0637.",uzun:"\u062C\u0630\u0648\u0631 \u0647\u0630\u0647 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0644\u0627 \u062A\u062A\u0623\u062B\u0631 \u0628\u0627\u0644\u0647\u0631\u0645\u0648\u0646 \u0627\u0644\u0645\u0633\u0628\u0628 \u0644\u0644\u062A\u0633\u0627\u0642\u0637\u060C \u0641\u062A\u0633\u062A\u0645\u0631 \u0641\u064A \u0627\u0644\u0646\u0645\u0648 \u0623\u064A\u0646\u0645\u0627 \u0646\u064F\u0642\u0644\u062A. \u0648\u0647\u064A \u0645\u0648\u0631\u062F \u0648\u0627\u062D\u062F \u0644\u0644\u0639\u0645\u0631 \u0643\u0644\u0647\u060C \u0648\u0647\u064A \u0627\u0644\u062A\u064A \u062A\u0636\u0639 \u0633\u0642\u0641 \u0639\u062F\u062F \u0627\u0644\u0637\u0639\u0648\u0645 \u0627\u0644\u0645\u0645\u0643\u0646.",olcu:"\u064A\u064F\u062D\u0633\u0628 \u062D\u062F\u0651\u0647\u0627 \u0628\u0627\u0644\u0639\u062F\u0651 \u0623\u062B\u0646\u0627\u0621 \u0627\u0644\u0641\u062D\u0635 \u0644\u0627 \u0628\u0627\u0644\u062A\u0642\u062F\u064A\u0631"},yogunluk:{ad:"\u0637\u064F\u0639\u0645/\u0633\u0645\xB2 (\u0627\u0644\u0643\u062B\u0627\u0641\u0629)",kisa:"\u0639\u062F\u062F \u0627\u0644\u0637\u0639\u0648\u0645 \u0641\u064A \u0627\u0644\u0633\u0646\u062A\u064A\u0645\u062A\u0631 \u0627\u0644\u0645\u0631\u0628\u0639 \u0627\u0644\u0648\u0627\u062D\u062F\u060C \u0648\u0647\u0648 \u0645\u0627 \u064A\u062D\u062F\u062F \u0627\u0644\u063A\u0632\u0627\u0631\u0629.",uzun:"\u0627\u0644\u0632\u0631\u0627\u0639\u0629 \u0627\u0644\u0643\u062B\u064A\u0641\u0629 \u0644\u064A\u0633\u062A \u0623\u0641\u0636\u0644 \u062F\u0627\u0626\u0645\u064B\u0627\u061B \u0641\u0648\u0642 \u062D\u062F\u0651 \u0645\u0639\u064A\u0651\u0646 \u0644\u0627 \u062A\u062C\u062F \u0627\u0644\u062C\u0630\u0648\u0631 \u062A\u063A\u0630\u064A\u0629 \u0643\u0627\u0641\u064A\u0629. \u0648\u0644\u0623\u062C\u0644 \u0645\u0638\u0647\u0631 \u0637\u0628\u064A\u0639\u064A \u062A\u064F\u062E\u0637\u064E\u0651\u0637 \u062E\u0637 \u0627\u0644\u0634\u0639\u0631 \u0648\u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0648\u0633\u0637\u0649 \u0648\u0627\u0644\u062A\u0627\u062C \u0628\u0643\u062B\u0627\u0641\u0627\u062A \u0645\u062E\u062A\u0644\u0641\u0629.",olcu:"\u0641\u0631\u0648\u0629 \u0631\u0623\u0633\u0643 \u062A\u062D\u0645\u0644 ~80\u2013100 \u0628\u0635\u064A\u0644\u0629/\u0633\u0645\xB2 \xB7 \u0648\u0627\u0644\u0647\u062F\u0641 \u0627\u0644\u0645\u0639\u062A\u0627\u062F \u0641\u064A \u0627\u0644\u0632\u0631\u0627\u0639\u0629 35\u201350 \u0637\u064F\u0639\u0645\u064B\u0627/\u0633\u0645\xB2"},norwood:{ad:"\u062F\u0631\u062C\u0629 \u0646\u0648\u0631\u0648\u0648\u062F",kisa:"\u0645\u0642\u064A\u0627\u0633 \u0645\u0646 \u0648\u0627\u062D\u062F \u0625\u0644\u0649 \u0633\u0628\u0639\u0629 \u064A\u0635\u0641 \u0645\u062F\u0649 \u0627\u062A\u0633\u0627\u0639 \u0627\u0644\u0635\u0644\u0639 \u0627\u0644\u0648\u0631\u0627\u062B\u064A.",uzun:"\u0648\u064F\u0636\u0639 \u0644\u064A\u062A\u062D\u062F\u062B \u0627\u0644\u0637\u0628\u064A\u0628 \u0648\u0627\u0644\u0645\u0631\u064A\u0636 \u0639\u0646 \u0627\u0644\u0634\u064A\u0621 \u0646\u0641\u0633\u0647. \u0643\u0644\u0645\u0627 \u0627\u0631\u062A\u0641\u0639\u062A \u0627\u0644\u062F\u0631\u062C\u0629 \u0627\u062A\u0633\u0639\u062A \u0627\u0644\u0645\u0633\u0627\u062D\u0629 \u0627\u0644\u062E\u0627\u0644\u064A\u0629 \u0648\u0632\u0627\u062F \u0639\u062F\u062F \u0627\u0644\u0637\u0639\u0648\u0645 \u0627\u0644\u0644\u06  only with your explicit consent.","hk.k.s3.m2":"You may withdraw consent at any time. When you do, your record is deleted the same day.","hk.k.s4.b":"Purpose and retention","hk.k.s4.a":"Your data stays inside the consultation and never joins a marketing list.","hk.k.a1":"Purpose: first assessment, graft range estimate and appointment planning.","hk.k.a2":"Photographs sit in an area only the medical team opens.","hk.k.a3":"Enquiries that do not become patients are deleted after six months.","hk.k.a4":"If you are treated, the record is kept as health legislation requires.","hk.k.a5":"Your photograph is never published anywhere without written consent.","hk.k.s5.b":"Your rights: article 11","hk.k.s5.a":"The law gives you six things you can demand.","hk.k.r1":"Learn whether your data is processed.","hk.k.r2":"Request information about it if it is.","hk.k.r3":"Learn whether it serves its stated purpose.","hk.k.r4":"Ask for correction if it is incomplete or wrong.","hk.k.r5":"Ask for it to be erased or destroyed.","hk.k.r6":"Claim compensation if you have suffered loss.","hk.k.s6.b":"How to apply","hk.k.s6.m":"Send your request in writing to the clinic registered address, or to its registered e-mail address. The clinic replies within thirty days.","hk.k.s6.n":"Applications go to the registered electronic mail (KEP) address or the postal address in the corporate identity block. Both are masked in this demo copy.","hk.c.h1":"Cookie policy","hk.c.alt":"This demo leaves one record in your browser, only what it needs to work. No tracking or advertising cookies.","hk.c.s1.b":"What a cookie is","hk.c.s1.a":"One sentence, without the legal vocabulary.","hk.c.s1.m":"A cookie is a small record a site leaves in your browser. Its job is remembering your preference next visit.","hk.c.s2.b":"What this site uses","hk.c.s2.a":"Of the three cookie families, only the first one is used.","hk.c.tur":"Type","hk.c.ne":"What it does","hk.c.durum":"Status","hk.c.var":"In use","hk.c.yok":"Not us
