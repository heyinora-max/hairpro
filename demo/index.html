  /* ======================================================================
     1 — küçük yardımcılar (yalnız bu dosyanın işi)
     ====================================================================== */
  var DURUMLAR = ['yeni', 'ulasildi', 'teklif', 'randevu', 'operasyon', 'kayip'];
  var TIPLER = ['operasyon', 'konsultasyon', 'kontrol'];
  var TIP_IKON = { operasyon: 'scissors', konsultasyon: 'messageCircle', kontrol: 'stethoscope' };
  /* Halka + liste ortak renk merdiveni: büyükten küçüğe koyudan açığa. */
  var MAVI_SIRA = ['#14456F', '#1D5FA2', '#2C7FD0', '#5DA5E6', '#93C7F2'];

  function bul(liste, alan, deger) {
    for (var i = 0; i < liste.length; i++) { if (liste[i][alan] === deger) return liste[i]; }
    return null;
  }
  function gunEkle(d, n) { return new Date(d.getTime() + n * 86400000); }
  function gunKod(d) { return d.toISOString().slice(0, 10); }
  function dkFark(iso) { return (DB.simdi - new Date(iso)) / 60000; }
  function slaSinif(d) { return d < 30 ? 'sla--iyi' : d < 120 ? 'sla--dikkat' : 'sla--gec'; }
  function sureMetni(d) {
    return d < 60 ? Math.round(d) + ' ' + t('zaman.dk') : Math.round(d / 60) + ' ' + t('zaman.sa');
  }
  function kisaAd(ad) {
    var p = String(ad || '').trim().split(/\s+/);
    return p.length < 2 ? p[0] : p[0] + ' ' + p[1].charAt(0) + '.';
  }
  function kaynakBilgi(k) {
    var s = bul(DB.kaynaklar, 'k', k) || { k: k, ikon: 'globe' };
    return { ikon: s.ikon, ad: t('p.kaynak.' + s.k) };
  }
  function durumRozet(d) {
    return '<span class="' + HP.cx('durum', 'durum--' + d) + '"><span class="nokta"></span>' + esc(t('p.durum.' + d)) + '</span>';
  }
  function slaHucre(l) {
    var bekliyor = l.ilkYanitDk == null;
    var d = bekliyor ? dkFark(l.geldi) : l.ilkYanitDk;
    return '<span class="sla ' + slaSinif(d) + '">' +
      HP.icon(bekliyor ? 'clock' : 'check', '', 14) +
      esc(sureMetni(d)) + '</span>';
  }
  function haftaBasi(d) { return gunEkle(d, -((d.getUTCDay() + 6) % 7)); }
  function gunRandevulari(kod) {
    return DB.randevu.filter(function (r) { return r.gun === kod; })
      .sort(function (a, b) { return a.saat < b.saat ? -1 : a.saat > b.saat ? 1 : 0; });
  }

  /* ======================================================================
     1b — site formundan düşen kayıtlar (BULGU 16)
     Site ile panel iki ayrı demo gibi duruyordu. Gönderilen form artık
     HP.store'da yaşar ve p-lead listesinin BAŞINA girer. Sunucu yok:
     kayıt yalnız açık sekmenin ömrü kadar durur, panelde de öyle yazar.
     ====================================================================== */
  /* Ülke telefon önekinden okunur (uzun önek önce). Numara tanınmazsa
     görüşme dili ülkeyi belirler — uydurma yerine en iyi tahmin. */
  var TEL_ULKE = [
    ['966', 'SA', 'Suudi Arabistan', '🇸🇦'], ['971', 'AE', 'BAE', '🇦🇪'],
    ['965', 'KW', 'Kuveyt', '🇰🇼'], ['964', 'IQ', 'Irak', '🇮🇶'],
    ['90', 'TR', 'Türkiye', '🇹🇷'], ['44', 'GB', 'Birleşik Krallık', '🇬🇧'],
    ['49', 'DE', 'Almanya', '🇩🇪'], ['33', 'FR', 'Fransa', '🇫🇷'],
    ['31', 'NL', 'Hollanda', '🇳🇱'], ['39', 'IT', 'İtalya', '🇮🇹'],
    ['40', 'RO', 'Romanya', '🇷🇴'], ['1', 'US', 'ABD', '🇺🇸']
  ];
  var DIL_ULKE = {
    tr: ['TR', 'Türkiye', '🇹🇷'],
    en: ['GB', 'Birleşik Krallık', '🇬🇧'],
    ar: ['SA', 'Suudi Arabistan', '🇸🇦']
  };

  function ulkeOku(tel) {
    var n = String(tel || '').replace(/\D/g, '');
    if (/^0/.test(n)) n = '90' + n.slice(1);
    for (var i = 0; i < TEL_ULKE.length; i++) {
      if (n.indexOf(TEL_ULKE[i][0]) === 0) {
        return { k: TEL_ULKE[i][1], ad: TEL_ULKE[i][2], bayrak: TEL_ULKE[i][3] };
      }
    }
    var d = DIL_ULKE[HP.lang] || DIL_ULKE.tr;
    return { k: d[0], ad: d[1], bayrak: d[2] };
  }

  HP.leadYeniler = function () { return HP.store.get('yeniLead', []); };
  HP.leadListesi = function () { return HP.leadYeniler().concat(DB.lead); };
  HP.leadBul = function (id) { return bul(HP.leadListesi(), 'id', id); };

  /* o = { ad, tel }. DB.lead ile BİREBİR aynı veri şekli üretir; tek fark
     `yeni` bayrağı (rozet için) ve `tel` alanı. */
  HP.leadEkle = function (o) {
    var liste = HP.leadYeniler();
    var u = ulkeOku(o.tel);
    /* ÖNCELİK: ziyaretçinin greft haritasında kurduğu plan. Yoksa yedek.
       (Eskiden yalnız HP.hesapla() okunuyordu; harita seçimi panele hiç
       yansımıyordu — site ve panel iki ayrı demo gibi duruyordu.) */
    var hz = HP.haritaOzet ? HP.haritaOzet() : null;
    var h = hz || (HP.hesapla ? HP.hesapla() : { min: 2400, max: 3200 });
    var d = { evre: (hz && hz.evre) || (HP.hesapDurum && HP.hesapDurum.evre) || 3 };
    var kayit = {
      id: 'L' + (2900 + liste.length),
      ad: o.ad,
      tel: o.tel,
      ulke: u.k, ulkeAd: u.ad, bayrak: u.bayrak, dil: HP.lang,
      kaynak: 'site',
      norwood: d.evre,
      greft: Math.round((h.min + h.max) / 2),
      teknik: hz && hz.teknik ? HP.t('teknik.' + hz.teknik + '.ad') : 'DHI',
      durum: 'yeni',
      danisman: HP.lang === 'ar' ? 'mahmoud' : 'zeynep',
      geldi: DB.simdi.toISOString(),
      ilkYanitDk: null,
      fotoVar: false,
      onam: 'yok',
      teklifEur: null,
      not: t('p.lead.yeniNot'),
      yeni: true
    };
    liste.unshift(kayit);
    HP.store.set('yeniLead', liste);
    /* Kenar çubuğundaki "bekleyen" rozeti de artsın: bağlantı görünür olsun. */
    DB.kpi.leadYeni += 1;
    return kayit;
  };

  /* --- seriler (grafikler gerçek veriden beslenir) ---------------------- */
  function gunlukBasvuru(n) {
    var out = [], i, j, k, c;
    for (i = n - 1; i >= 0; i--) {
      k = gunKod(gunEkle(DB.simdi, -i)); c = 0;
      for (j = 0; j < DB.lead.length; j++) { if (DB.lead[j].geldi.slice(0, 10) === k) c += 1; }
      out.push(c);
    }
    return out;
  }
  function gunlukRandevu(a, b) {
    var out = [], i, j, k, c;
    for (i = a; i <= b; i++) {
      k = gunKod(gunEkle(DB.simdi, i)); c = 0;
      for (j = 0; j < DB.randevu.length; j++) { if (DB.randevu[j].gun === k) c += 1; }
      out.push(c);
    }
    return out;
  }
  function yanitSerisi(n) {
    var out = [], i;
    for (i = 0; i < DB.lead.length && out.length < n; i++) {
      if (DB.lead[i].ilkYanitDk != null) out.push(DB.lead[i].ilkYanitDk);
    }
    return out.reverse();
  }
  function takipciSerisi(n) {
    var s = DB.sosyal.seri, out = [], i;
    for (i = Math.max(0, s.length - n); i < s.length; i++) out.push(s[i].takipci);
    return out;
  }
  function haftalikTakipci() {
    var s = DB.sosyal.seri, p = [], l = [], i, son = s[s.length - 1];
    for (i = 0; i < s.length; i += 7) {
      p.push(s[i].takipci);
      l.push(HP.dateShort(s[i].gun + 'T12:00:00Z'));
    }
    if (p[p.length - 1] !== son.takipci) {
      p.push(son.takipci);
      l.push(HP.dateShort(son.gun + 'T12:00:00Z'));
    }
    return { points: p, labels: l };
  }
  function saatAraligindaLead(a, b) {
    var c = 0, i, y;
    for (i = 0; i < DB.lead.length; i++) {
      y = dkFark(DB.lead[i].geldi) / 60;
      if (y >= a && y < b) c += 1;
    }
    return c;
  }

  /* --- KPI kartı --------------------------------------------------------- */
  function kpiKart(o) {
    return '<article class="kpi' + (o.durum ? ' kpi--' + o.durum : '') + '">' +
      '<div class="kpi__b">' + HP.icon(o.ikon, '', 16) + '<span>' + esc(o.baslik) + '</span></div>' +
      '<div class="kpi__n">' + esc(o.deger) + '</div>' +
      '<div class="kpi__alt">' +
        (o.dg == null ? '' :
          '<span class="' + HP.cx('kpi__dg', 'kpi__dg--' + (o.dg >= 0 ? 'yukari' : 'asagi')) + '">' +
            HP.icon(o.dg >= 0 ? 'arrowUp' : 'arrowDown', '', 13) +
            esc(HP.pct(Math.abs(o.dg), 0)) + '</span>') +
        '<span>' + esc(o.alt) + '</span>' +
      '</div>' +
      '<div class="kpi__spark">' + C.spark({ points: o.seri, width: 260, height: 34, color: o.renk }) + '</div>' +
    '</article>';
  }

  /* ======================================================================

     ====================================================================== */
  HP.page('p-ozet', {
    bolum: 'panel',
    render: function () {
      var K = DB.kpi;

      /* KPI'ların değişimleri gerçek veriden türetilir, uydurulmaz */
      var son7 = saatAraligindaLead(0, 168), onceki7 = saatAraligindaLead(168, 336);
      var d7 = onceki7 ? Math.round((son7 - onceki7) / onceki7 * 100) : 0;

      var seri = DB.sosyal.seri;
      var onceki30 = seri[Math.max(0, seri.length - 31)].takipci;

      var hb = haftaBasi(DB.simdi), haftaOp = 0, i;

        haftaOp += gunRandevulari(gunKod(gunEkle(hb, i))).filter(function (r) {
          return r.tip === 'operasyon';
        }).length;
      }
      var bugunKod = gunKod(DB.simdi);
      var acikRandevu = DB.randevu.filter(function (r) { return r.gun >= bugunKod; }).length;

        }),

        })
      ].join('');

      /* çizgi grafik — 90 gün haftalık özet (13 nokta) */
      var ht = haftalikTakipci();
      var grafikKart =
        '<section class="p-kart">' +
          '<div class="p-kart__bas"><b>' + esc(t('p.grafik.baslik')) + '</b>' +
            '<span>' + esc(t('p.grafik.alt')) + '</span></div>' +
          '<div class="p-kart__ic">' + C.line({
            series: [{ name: t('p.grafik.seri'), points: ht.points, color: '#3688DB' }],
            labels: ht.labels, width: 720, height: 240,
            yFormat: function (v) { return HP.num(Math.round(v)); }
          }) + '</div>' +
        '</section>';

      /* kaynak dağılımı — halka + okunur liste */
      var kaynakVeri = DB.kaynaklar.map(function (k) {
        var n = 0;
        DB.lead.forEach(function (l) { if (l.kaynak === k.k) n += 1; });
        return { label: t('p.kaynak.' + k.k), value: n, ikon: k.ikon };
      }).sort(function (a, b) { return b.value - a.value; });
      /* Renk sırası büyükten küçüğe koyulaşan tek aile: liste sırası = halka sırası,
         böylece ayrı bir renk göstergesine gerek kalmaz. */
      kaynakVeri.forEach(function (k, i) { k.color = MAVI_SIRA[i % MAVI_SIRA.length]; });

      var kaynakKart =
        '<section class="p-kart">' +
          '<div class="p-kart__bas"><b>' + esc(t('p.kaynak.baslik')) + '</b>' +
            '<span>' + esc(t('p.huni.alt')) + '</span></div>' +
          '<div class="p-kart__ic"><div class="izgara iz-2 g4">' +
            '<div class="olcu-34">' + C.donut({
              data: kaynakVeri, size: 170, thickness: 21,
              center: { value: DB.lead.length, label: t('p.kaynak.toplam') }
            }) + '</div>' +
            '<div class="yigin g3">' + kaynakVeri.map(function (k) {
              return '<div class="satir g3">' + HP.icon(k.ikon, '', 16) +
                '<span class="buyu g-xs">' + esc(k.label) + '</span>' +
                '<b class="sayi g-xs">' + HP.num(k.value) + '</b></div>';
            }).join('') + '</div>' +
          '</div></div>' +
        '</section>';

      /* huni — kademe kademe daralan gerçek sayılar */
      function kademe(liste) {
        return DB.lead.filter(function (l) { return liste.indexOf(l.durum) >= 0; }).length;
      }
      var huniKart =
        '<section class="p-kart">' +
          '<div class="p-kart__bas"><b>' + esc(t('p.huni.baslik')) + '</b>' +
            '<span>' + esc(t('p.huni.alt')) + '</span></div>' +
          '<div class="p-kart__ic">' + C.funnel({
            width: 520,
            steps: [
              { label: t('p.kpi.basvuru'), value: DB.lead.length, color: '#14456F' },
              { label: t('p.durum.ulasildi'), value: kademe(['ulasildi', 'teklif', 'randevu', 'operasyon', 'kayip']), color: '#14456F' },
              { label: t('p.durum.teklif'), value: kademe(['teklif', 'randevu', 'operasyon']), color: '#14456F' },
              { label: t('p.durum.randevu'), value: kademe(['randevu', 'operasyon']), color: '#14456F' },
              { label: t('p.durum.operasyon'), value: kademe(['operasyon']), color: '#14456F' }
            ]
          }) + '</div>' +
        '</section>';

      /* dikkat isteyenler — en uzun bekleyen 5 başvuru */
      var gecikenler = DB.lead.filter(function (l) {
        return l.durum === 'yeni' && dkFark(l.geldi) > 120;
      }).slice(0, 5);

      var dikkatKart =
        '<section class="p-kart">' +
          '<div class="p-kart__bas"><b>' + esc(t('p.dikkat.baslik')) + '</b>' +
            '<span>' + esc(t('p.dikkat.alt')) + '</span></div>' +
          '<div class="p-kart__ic p-kart__ic--sifir">' + (gecikenler.length
            ? gecikenler.map(function (l) {
                return '<a class="p-satir" href="#/p-lead" data-act="lead-ac" data-id="' + esc(l.id) + '">' +
                  HP.icon('alertTriangle', '', 17) +
                  '<span class="p-satir__m"><b>' + esc(l.ad) + '</b>' +
                    '<span>' + esc(l.bayrak + ' ' + l.ulkeAd + ' · ' + kaynakBilgi(l.kaynak).ad) + '</span></span>' +
                  '<span class="sla sla--gec">' + esc(HP.rel(l.geldi)) + '</span></a>';
              }).join('')
            : '<div class="bos">' + HP.icon('checkCircle', '', 24) +
              '<p>' + esc(t('p.dikkat.bos')) + '</p></div>') +
          '</div>' +
        '</section>';

      return '' +
        '<div class="p-bas">' +
          '<div><h1>' + esc(t('p.nav.ozet')) + '</h1>' +
            '<p>' + esc(t('p.ozet.alt')) + '</p></div>' +
          '<div class="p-arac">' +
            '<span class="hap hap--uyari">' + HP.icon('alert', '', 15) +
              esc(HP.num(K.leadYeni) + ' ' + t('p.kpi.yeni')) + '</span>' +
            '<a class="btn btn--cizgi btn--sm" href="#/p-lead">' + esc(t('p.nav.lead')) + '</a>' +
          '</div>' +
        '</div>' +
        '<div class="kpi-iz">' + kpiler + '</div>' +
        '<div class="p-iz-73">' + grafikKart + kaynakKart + '</div>' +
        '<div class="p-iz-64">' + huniKart + dikkatKart + '</div>';
    }
  });

  /* ======================================================================
     3 — p-lead · hasta adayları tablosu
     ====================================================================== */
  HP.page('p-lead', {
    bolum: 'panel',
    render: function () {
      /* Site formundan gelenler listenin BAŞINDA: demoda gönderilen istek
         panelde anında görünsün (BULGU 16). */
      var liste = HP.leadListesi();
      var yeniler = HP.leadYeniler();
      var say = {}, i;
      for (i = 0; i < DURUMLAR.length; i++) say[DURUMLAR[i]] = 0;
      liste.forEach(function (l) { say[l.durum] += 1; });

      var segment = '<div class="segment">' +
        '<button class="segment__d is-secili" data-act="lead-filtre" data-durum="hepsi">' +
          esc(t('genel.tumu')) + ' ' + HP.num(liste.length) + '</button>' +
        DURUMLAR.map(function (d) {
          return '<button class="segment__d" data-act="lead-filtre" data-durum="' + d + '">' +
            esc(t('p.durum.' + d)) + ' ' + HP.num(say[d]) + '</button>';
        }).join('') + '</div>';

      var basliklar = ['hasta', 'kaynak', 'greft', 'durum', 'yanit', 'danisman', 'geldi'].map(function (k) {
        return '<th' + (k === 'greft' ? ' class="sag"' : '') + '>' + esc(t('p.tablo.' + k)) + '</th>';
      }).join('');

      var satirlar = liste.map(function (l) {
        var kb = kaynakBilgi(l.kaynak);
        var dn = bul(DB.danisman, 'k', l.danisman) || { ad: '—' };
        return '<tr data-act="lead-ac" data-id="' + esc(l.id) + '" data-durum-satir="' + esc(l.durum) + '">' +
          '<td><span class="satir g3"><span>' + esc(l.bayrak) + '</span>' +
            '<span class="p-satir__m"><b>' + esc(l.ad) + '</b>' +
            '<span>' + esc(l.ulkeAd) + '</span></span>' +
            (l.yeni ? '<span class="hap hap--mavi">' + esc(t('p.lead.yeniRozet')) + '</span>' : '') +
          '</span></td>' +
          '<td><span class="satir g2">' + HP.icon(kb.ikon, '', 15) +
            '<span class="g-xs">' + esc(kb.ad) + '</span></span></td>' +
          '<td class="sag sayi">' + HP.num(l.greft) + '</td>' +
          '<td>' + durumRozet(l.durum) + '</td>' +
          '<td>' + slaHucre(l) + '</td>' +
          '<td><span class="avatar" title="' + esc(dn.ad) + '">' +
            esc(HP.initials(dn.ad)) + '</span></td>' +
          '<td class="g-xs ucuncul">' + esc(HP.rel(l.geldi)) + '</td>' +
        '</tr>';
      }).join('');

      return '' +
        '<div class="p-bas">' +
          '<div><h1>' + esc(t('p.nav.lead')) + '</h1>' +
            '<p>' + esc(t('p.lead.alt')) + '</p></div>' +
          '<div class="p-arac"><span class="hap">' + HP.icon('filter', '', 15) +
            esc(HP.num(say.yeni) + ' ' + t('p.durum.yeni')) + '</span></div>' +
        '</div>' +
        (yeniler.length
          ? '<div class="mevzuat mt-3">' + HP.icon('info', '', 16) +
              '<span>' + esc(t('p.lead.demoNot')) + '</span></div>'
          : '') +
        '<div class="kaydir-x">' + segment + '</div>' +
        '<div class="tablo-sarma"><table class="tablo">' +
          '<thead><tr>' + basliklar + '</tr></thead>' +
          '<tbody>' + satirlar + '</tbody>' +
        '</table></div>';
    }
  });

  /* durum filtresi: satırları gizler, sayfayı yeniden çizmez */
  HP.act('lead-filtre', function (el) {
    var d = el.getAttribute('data-durum');
    HP.qsa('[data-act="lead-filtre"]').forEach(function (x) {
      x.classList.toggle('is-secili', x === el);
    });
    HP.qsa('[data-durum-satir]').forEach(function (tr) {
      tr.classList.toggle('gizle', d !== 'hepsi' && tr.getAttribute('data-durum-satir') !== d);
    });
  });

  /* ======================================================================
     3b — p-giris · panelin kapısı (BULGU 17)
     Satılan kalemin adı "Özel Yönetim Paneli". Panel şimdiye kadar sitenin
     bir rotası gibi açılıyordu; kapı görünmüyordu. Bu sayfa o kapıdır —
     demo olduğu için şifre sormaz, ama panelin ayrı bir yer olduğunu söyler.
     bolum='site' bilinçli: kapı, panelin KENDİ kabuğunun dışında durmalı.
     ====================================================================== */
  HP.page('p-giris', {
    bolum: 'site',
    render: function () {
      var im = '';
      if (HP.marka && HP.marka.monogram) im = HP.marka.monogram();
      if (!im && HP.marka && HP.marka.motif) im = HP.marka.motif(52);

      /* gece2 (#050A12): monogramın `screen` karışımı ancak AYNI zeminde dikişsiz. */
      return '<section class="bolum bolum--gece2 gece-alan"><div class="kap-dar">' +
        (HP.parca && HP.parca.formCss ? HP.parca.formCss() : '') +
        '<div class="bas bas--merkez">' + im +
          '<h1 class="d3">' + esc(t('p.giris.baslik')) + '</h1>' +
          '<p class="g-sm ikincil">' + esc(t('p.giris.alt')) + '</p>' +
        '</div>' +
        '<div class="kart kart--genis">' +
          '<form class="form-govde" novalidate onsubmit="return false">' +
            '<div class="alan">' +
              '<label class="alan__et" for="g-eposta">' + esc(t('p.giris.eposta')) + '</label>' +
              '<input class="girdi" type="email" id="g-eposta" name="eposta" autocomplete="email"' +
                ' inputmode="email" value="' + esc(t('p.giris.mail')) + '">' +
              '<p class="alan__hata" id="g-eposta-hata" hidden></p>' +
            '</div>' +
            '<button class="btn btn--ana btn--blok" data-act="p-giris">' +
              HP.icon('lock', '', 17) + esc(t('p.giris.gir')) + '</button>' +
          '</form>' +
          '<div class="mevzuat mt-4">' + HP.icon('info', '', 16) +
            '<span>' + esc(t('p.giris.not')) + '</span></div>' +
        '</div>' +
      '</div></section>';
    }
  });

  /* Şifre yok, ama e-posta biçimi GERÇEKTEN denetlenir: kapının çalıştığı
     görülsün. Doğrulama yardımcısı 50-boot.js'te (ortak katman). */
  HP.act('p-giris', function () {
    var g = document.getElementById('g-eposta');
    var v = (g && g.value ? g.value : '').trim();
    var gecerli = /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v);
    if (HP.alanHata) HP.alanHata('g-eposta', gecerli ? '' : t('p.giris.hata'));
    if (!gecerli) { if (g && g.focus) g.focus(); return; }
    HP.store.set('panelGiris', v);
    location.hash = '#/p-ozet';
  });

  /* ======================================================================
     4 — lead çekmecesi (50-boot.js · data-act="lead-ac")
     ====================================================================== */
  HP.leadCekmece = function (l) {
    var kb = kaynakBilgi(l.kaynak);
    var dn = bul(DB.danisman, 'k', l.danisman) || { ad: '—', dil: '—' };
    var bekliyor = l.ilkYanitDk == null;

    var kutular = [
      [t('p.tablo.greft'), HP.num(l.greft), true],
      [t('p.cek.norwood'), String(l.norwood), true],
      [t('p.cek.teknik'), l.teknik, false],
      [t('p.tablo.durum'), t('p.durum.' + l.durum), false]
    ].map(function (x) {
      return '<div class="yigin g1">' +
        '<span class="etiket ucuncul">' + esc(x[0]) + '</span>' +
        '<b class="b3' + (x[2] ? ' sayi' : '') + '">' + esc(x[1]) + '</b></div>';
    }).join('');

    var kunye = [
      [t('p.tablo.kaynak'), kb.ad],
      [t('p.tablo.danisman'), dn.ad + ' · ' + dn.dil],
      [t('p.cek.foto'), l.fotoVar ? t('p.cek.var') : t('p.cek.yok')],
      [t('p.cek.onam'), l.onam === 'alindi' ? t('p.cek.onamAlindi')
        : l.onam === 'bekliyor' ? t('p.cek.onamBekliyor') : '—']
    ];
    if (l.teklifEur != null) kunye.push([t('p.cek.teklif'), HP.eur(l.teklifEur)]);

    var kunyeHtml = '<div class="kart yigin g3">' + kunye.map(function (x) {
      return '<div class="satir aralik g3 g-xs">' +
        '<span class="ucuncul">' + esc(x[0]) + '</span><b>' + esc(x[1]) + '</b></div>';
    }).join('') + '</div>';

    var zaman = '<ul class="nokta-liste g-xs">' +
      '<li><span><b>' + esc(t('p.zaman.geldi')) + '</b> ' +
        '<span class="ucuncul">' + esc(HP.date(l.geldi) + ' · ' + HP.time(l.geldi)) + '</span></span></li>' +
      '<li><span><b>' + esc(bekliyor ? t('p.zaman.bekliyor') : t('p.zaman.ulasildi')) + '</b> ' +
        '<span class="ucuncul">' + esc(sureMetni(bekliyor ? dkFark(l.geldi) : l.ilkYanitDk)) + '</span></span></li>' +
      (l.teklifEur == null ? '' :
        '<li><span><b>' + esc(t('p.zaman.teklif')) + '</b> ' +
          '<span class="ucuncul">' + esc(HP.eur(l.teklifEur)) + '</span></span></li>') +
    '</ul>';

    return {
      ust: l.id + ' · ' + l.bayrak + ' ' + l.ulkeAd,
      baslik: l.ad,
      govde: '<div class="gece-alan yigin g5">' +
        '<div class="izgara iz-2 g4">' + kutular + '</div>' +
        '<div class="yigin g3"><span class="etiket ucuncul">' + esc(t('p.cek.zaman')) + '</span>' +
          zaman + '</div>' +
        kunyeHtml +
        '<div class="yigin g2"><span class="etiket ucuncul">' + esc(t('p.cek.not')) + '</span>' +
          '<p class="g-sm">' + esc(l.not || t('p.cek.notYok')) + '</p></div>' +
        (l.teklifEur == null ? '' :
          '<div class="mevzuat">' + HP.icon('shield', '', 16) +
            '<span>' + esc(t('p.cek.fiyatNot')) + '</span></div>') +
      '</div>',
      /* çekmece zemini gece; düğmeler de gece bağlamında olmalı */
      alt: '<div class="gece-alan satir buyu g3">' +
        '<a class="btn btn--wa buyu" href="#/p-lead" data-act="yakinda">' +
          HP.icon('whatsapp', '', 18) + esc(t('p.cek.wa')) + '</a>' +
        '<button class="btn btn--cizgi" data-act="yakinda">' +
          HP.icon('phone', '', 18) + esc(t('p.cek.ara')) + '</button>' +
      '</div>'
    };
  };

  /* ======================================================================
     5 — p-randevu · iki haftalık takvim
     ====================================================================== */
  HP.page('p-randevu', {
    bolum: 'panel',
    render: function () {
      var bas = haftaBasi(DB.simdi), bugun = gunKod(DB.simdi), i;

      var gunBasliklari = '';
      for (i = 1; i <= 7; i++) gunBasliklari += '<div class="takvim__b">' + esc(t('p.gun.' + i)) + '</div>';

      var hucreler = '';
      for (i = 0; i < 14; i++) {
        var gd = gunEkle(bas, i), kod = gunKod(gd), liste = gunRandevulari(kod);
        hucreler += '<div class="takvim__g' + (kod === bugun ? ' is-bugun' : '') + '">' +
          '<span class="takvim__n">' + esc(HP.dateShort(gd.toISOString())) + '</span>' +
          liste.slice(0, 3).map(function (r) {
            return '<div class="' + HP.cx('rnd', 'rnd--' + r.tip) + '" data-act="yakinda">' +
              '<b>' + esc(r.saat) + '</b><span>' + esc(kisaAd(r.hasta)) + '</span></div>';
          }).join('') +
          (liste.length > 3 ? '<span class="takvim__n">+' + (liste.length - 3) + '</span>' : '') +
        '</div>';
      }

      var bugunListe = gunRandevulari(bugun);
      var sayac = { operasyon: 0, konsultasyon: 0, kontrol: 0 }, dolu = 0;
      bugunListe.forEach(function (r) { sayac[r.tip] += 1; dolu += r.sure; });

      var gunGorunum =
        '<section class="p-kart">' +
          '<div class="p-kart__bas"><b>' + esc(HP.date(DB.simdi.toISOString())) + '</b>' +
            '<span>' + esc(t('p.gun.' + (((DB.simdi.getUTCDay() + 6) % 7) + 1))) + '</span></div>' +
          '<div class="p-kart__ic p-kart__ic--sifir">' + (bugunListe.length
            ? bugunListe.map(function (r) {
                return '<div class="p-satir">' + HP.icon(TIP_IKON[r.tip], '', 17) +
                  '<span class="p-satir__m"><b>' + esc(r.saat + ' · ' + r.hasta) + '</b>' +
                    '<span>' + esc(t('p.rnd.' + r.tip) + ' · ' + r.oda + ' · ' +
                      HP.num(r.greft) + ' ' + t('sonuc.greft')) + '</span></span>' +
                  '<span class="sayi g-xs ucuncul">' +
                    esc(HP.num(r.sure / 60, 1) + ' ' + t('zaman.sa')) + '</span></div>';
              }).join('')
            : '<div class="bos">' + HP.icon('calendar', '', 24) +
              '<p>' + esc(t('p.rnd.bosGun')) + '</p></div>') +
          '</div>' +
        '</section>';

      var ozetSatir = TIPLER.map(function (x) {
        return '<div class="p-satir">' + HP.icon(TIP_IKON[x], '', 17) +
          '<span class="p-satir__m"><b>' + esc(t('p.rnd.' + x)) + '</b></span>' +
          '<b class="sayi">' + HP.num(sayac[x]) + '</b></div>';
      }).join('') +
        '<div class="p-satir">' + HP.icon('clock', '', 17) +
          '<span class="p-satir__m"><b>' + esc(t('p.rnd.doluSaat')) + '</b></span>' +
          '<b class="sayi">' + esc(HP.num(dolu / 60, 1) + ' ' + t('zaman.sa')) + '</b></div>';

      var bugunKart =
        '<section class="p-kart">' +
          '<div class="p-kart__bas"><b>' + esc(t('p.rnd.bugun')) + '</b>' +
            '<span>' + esc(HP.dateShort(DB.simdi.toISOString())) + '</span></div>' +
          '<div class="p-kart__ic p-kart__ic--sifir">' + ozetSatir + '</div>' +
          '<div class="p-kart__ic satir sar g2">' + TIPLER.map(function (x) {
            return '<span class="' + HP.cx('rnd', 'rnd--' + x) + '">' + esc(t('p.rnd.' + x)) + '</span>';
          }).join('') + '</div>' +
        '</section>';

      return '' +
        '<div class="p-bas">' +
          '<div><h1>' + esc(t('p.nav.randevu')) + '</h1>' +
            '<p>' + esc(t('p.rnd.alt')) + '</p></div>' +
          '<div class="p-arac"><div class="segment">' +
            '<button class="segment__d is-secili" data-act="rnd-gorunum" data-gorunum="hafta">' +
              esc(t('p.rnd.hafta')) + '</button>' +
            '<button class="segment__d" data-act="rnd-gorunum" data-gorunum="gun">' +
              esc(t('p.rnd.gun')) + '</button>' +
          '</div></div>' +
        '</div>' +
        '<div class="p-iz-73">' +
          '<div>' +
            '<div id="p-rnd-hafta"><div class="takvim">' + gunBasliklari + hucreler + '</div></div>' +
            '<div id="p-rnd-gun" class="gizle">' + gunGorunum + '</div>' +
          '</div>' +
          bugunKart +
        '</div>';
    }
  });

  /* hafta / gün geçişi: yeniden çizim yok, yalnız görünürlük */
  HP.act('rnd-gorunum', function (el) {
    var g = el.getAttribute('data-gorunum');
    HP.qsa('[data-act="rnd-gorunum"]').forEach(function (x) {
      x.classList.toggle('is-secili', x === el);
    });
    var h = document.getElementById('p-rnd-hafta');
    var d = document.getElementById('p-rnd-gun');
    if (h) h.classList.toggle('gizle', g !== 'hafta');
    if (d) d.classList.toggle('gizle', g !== 'gun');
  });
})(window.HP);

/* ===== src/21-panel-b.js ===== */
/* ============================================================================
   HairPro — 21-panel-b.js · Panelin ikinci yarısı
   Rotalar: p-vaka · p-icerik · p-seo · p-sosyal · p-uyum  (+ vaka çekmecesi)
   Kural: yeni CSS yok, satır içi style yok, metin yalnız i18n'den.
   Genişlik gerektiren tek şey ilerleme çubuğudur; o da render kancasında
   data-oran'dan okunarak verilir (50-boot.js'teki karşılaştırıcı ile aynı yol).
   ========================================================================== */
(function (HP) {
  'use strict';
  var esc = HP.esc, t = HP.t, num = HP.num;

  /* ======================================================================
     0 — metinler (üç dil birden)
     ====================================================================== */
  HP.I18N = HP.I18N || {};

  HP.I18N.tr = Object.assign(HP.I18N.tr || {}, {
    'pb.kayit': '{n} kayıt',
    'pb.seo.enUst': 'hacme göre ilk {n}',
    'pb.tumu': 'Tümü',

  /* ======================================================================
     1 — dosya içi küçük parçalar (HP üzerine yazılmaz: çakışma olmasın)
     ====================================================================== */
  function hap(sinif, metin) {
    return '<span class="hap' + (sinif ? ' ' + sinif : '') + '">' + esc(metin) + '</span>';
  }

  function pBas(baslikK, altK, arac) {
    return '<div class="p-bas">' +
      '<div><h1>' + esc(t(baslikK)) + '</h1><p>' + esc(t(altK)) + '</p></div>' +
      (arac ? '<div class="p-arac">' + arac + '</div>' : '') +
      '</div>';
  }

  function segment(act, secili, ogeler) {
    return '<div class="segment">' + ogeler.map(function (o) {
      return '<button class="segment__d' + (o.k === secili ? ' is-secili' : '') +
        '" data-act="' + act + '" data-deger="' + esc(o.k) + '">' + esc(t(o.et)) + '</button>';
    }).join('') + '</div>';
  }

  function kpi(o) {
    return '<div class="kpi' + (o.sinif ? ' ' + o.sinif : '') + '">' +
      '<div class="kpi__b">' + HP.icon(o.ikon, '', 16) + '<span>' + esc(o.baslik) + '</span></div>' +
      '<div class="kpi__n">' + esc(o.deger) + '</div>' +
      '<div class="kpi__alt">' +
        (o.dg ? '<span class="kpi__dg ' + ('kpi__dg--' + (o.yon || 'yukari')) + '">' +
          HP.icon(o.yon === 'asagi' ? 'trendingDown' : 'trending', '', 13) + esc(o.dg) + '</span>' : '') +
        '<span>' + esc(o.alt) + '</span>' +
      '</div></div>';
  }

  function kartBas(baslik, sag) {
    return '<div class="p-kart__bas"><b>' + esc(baslik) + '</b>' +
      (sag ? '<span>' + esc(sag) + '</span>' : '') + '</div>';
  }

  /* etiket + değer satırı (çekmece ve kartların içi) */
  function veriSatir(etiket, deger) {
    return '<div class="satir aralik g4">' +
      '<span class="g-sm ucuncul">' + esc(etiket) + '</span>' +
      '<b class="sayi">' + esc(deger) + '</b></div>';
  }

  /* ilerleme çubuğu: değer data-oran'da durur, genişliği render kancası verir */
  function cubuk(oran) {
    return '<span class="cubuk"><span class="cubuk__ic" data-oran="' + oran + '"></span></span>';
  }

  HP.on('render', function () {
    HP.qsa('[data-oran]').forEach(function (el) {
      var v = parseFloat(el.getAttribute('data-oran'));
      if (isNaN(v)) v = 0;
      el.style.width = Math.max(0, Math.min(100, v)) + '%';
    });
  });

  /* ======================================================================
     2 — VAKA ARŞİVİ + ONAM TAKİBİ
     ====================================================================== */
  function vakaDurum(v) {
    if (v.onam !== 'alindi') return 'bekliyor';
    return v.yayin.length ? 'yayinda' : 'taslak';
  }

  function vakaKart(v) {
    var d = vakaDurum(v);
    var ok = v.onam === 'alindi';
    return '<article class="kart kart--sik yigin g3" data-vaka="' + d + '" data-act="vaka-ac" data-id="' + esc(v.id) + '">' +
      '<div class="satir aralik g3">' +
        '<b class="sayi">' + esc(v.kod) + '</b>' +
        hap(ok ? 'hap--ok' : 'hap--uyari', t(ok ? 'pb.vaka.onamAlindi' : 'pb.vaka.onamBekliyor')) +
      '</div>' +
      '<div class="satir sar g2">' +
        hap('hap--mavi', v.teknik) +
        hap('', num(v.greft) + ' ' + t('sonuc.greft')) +
      '</div>' +
      '<div class="satir aralik g3 g-xs ucuncul">' +
        '<span>' + esc(HP.date(v.tarih)) + '</span>' +
        '<span>' + esc(v.ayGecti + t('sonuc.ay') + ' · ' + t('pb.vaka.evre') + ' ' + v.norwood) + '</span>' +
      '</div>' +
      (ok
        ? '<div class="satir aralik g3">' +
            '<span class="g-xs ucuncul">' + esc(t('pb.vaka.diller')) + '</span>' +
            '<span class="satir g2">' + (v.yayin.length
              ? v.yayin.map(function (l) { return hap('hap--mavi', l.toUpperCase()); }).join('')
              : hap('', t('pb.vaka.yayindaDegil'))) + '</span>' +
          '</div>'
        : '<div class="satir g2 g-xs">' + HP.icon('alertTriangle', '', 15) +
            '<span>' + esc(t('pb.vaka.kapali') + (v.yayin.length ? ' · ' + t('pb.vaka.cekildi') : '')) + '</span>' +
          '</div>') +
    '</article>';
  }

  HP.act('vaka-sekme', function (el) {
    var f = el.getAttribute('data-deger');
    HP.qsa('[data-act="vaka-sekme"]').forEach(function (x) { x.classList.remove('is-secili'); });
    el.classList.add('is-secili');
    HP.qsa('[data-vaka]').forEach(function (k) {
      k.classList.toggle('gizle', f !== 'hepsi' && k.getAttribute('data-vaka') !== f);
    });
  });

  HP.page('p-vaka', {
    bolum: 'panel',
    render: function () {
      var hepsi = HP.DB.vaka.slice().sort(function (a, b) { return a.tarih < b.tarih ? 1 : -1; });
      var alindi = hepsi.filter(function (v) { return v.onam === 'alindi'; }).length;
      var bekleyen = hepsi.length - alindi;
      var oran = Math.round(alindi / hepsi.length * 100);

      var rejim = [
        ['pb.vaka.trSatir', false, 'pb.uyum.day1'],
        ['pb.vaka.enSatir', true, 'pb.uyum.day2'],
        ['pb.vaka.arSatir', true, 'pb.uyum.day2']
      ].map(function (r) {
        return '<div class="p-satir">' +
          HP.icon(r[1] ? 'globe' : 'lock', '', 17) +
          '<div class="p-satir__m"><b>' + esc(t(r[0])) + '</b><span>' + esc(t(r[2])) + '</span></div>' +
          hap(r[1] ? 'hap--ok' : 'hap--uyari', t(r[1] ? 'pb.vaka.acik' : 'pb.vaka.kapaliK')) +
        '</div>';
      }).join('');

      return '' +
      pBas('pb.vaka.baslik', 'pb.vaka.alt',
        segment('vaka-sekme', 'hepsi', [
          { k: 'hepsi', et: 'pb.tumu' },
          { k: 'yayinda', et: 'pb.vaka.fYayinda' },
          { k: 'bekliyor', et: 'pb.vaka.fBekleyen' }
        ]) +
        '<button class="btn btn--ana btn--sm" data-act="yakinda">' + HP.icon('plus', '', 16) +
          esc(t('pb.vaka.ekle')) + '</button>') +

      /* onam özeti + yayın rejimi */
      '<div class="izgara iz-53">' +
        '<div class="p-kart">' +
          kartBas(t('pb.vaka.onamBaslik'), t('pb.kayit', { n: hepsi.length })) +
          '<div class="p-kart__ic yigin g5">' +
            '<div class="yigin g2">' +
              '<div class="satir aralik g4"><span class="g-sm">' + esc(t('pb.vaka.arsivde')) + '</span>' +
                '<b class="sayi">' + num(alindi) + '</b></div>' + cubuk(oran) +
            '</div>' +
            '<div class="yigin g2">' +
              '<div class="satir aralik g4"><span class="g-sm">' + esc(t('pb.vaka.eksik')) + '</span>' +
                '<b class="sayi">' + num(bekleyen) + '</b></div>' + cubuk(100 - oran) +
            '</div>' +
            '<div class="mevzuat">' + HP.icon('info', '', 16) +
              '<span>' + esc(t('sonuc.onam')) + '</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="p-kart">' +
          kartBas(t('pb.vaka.rejimBaslik'), '') +
          '<div class="p-kart__ic p-kart__ic--sifir">' + rejim + '</div>' +
        '</div>' +
      '</div>' +

      /* arşiv ızgarası */
      '<div class="p-kart__bas"><b>' + esc(t('pb.vaka.grid')) + '</b>' +
        '<span>' + esc(t('pb.kayit', { n: 12 })) + '</span></div>' +
      '<div class="izgara iz-3">' + hepsi.slice(0, 12).map(vakaKart).join('') + '</div>' +

      '<div class="mevzuat">' + HP.icon('info', '', 16) +
        '<span>' + esc(t('sonuc.uyari')) + '</span></div>';
    }
  });

  /* --- vaka çekmecesi ---------------------------------------------------- */
  HP.vakaCekmece = function (v) {
    var ok = v.onam === 'alindi';
    var diller = ok && v.yayin.length ? v.yayin : [];

    var onamSatir = [
      { m: t('pb.vaka.form'), ok: ok },
      { m: t('pb.vaka.uyariBasili'), ok: v.uyariMetni === true },
      { m: t('pb.vaka.dilOnay'), ok: ok && diller.length > 0 }
    ].map(function (s) {
      return '<div class="satir aralik g4"><span class="g-sm">' + esc(s.m) + '</span>' +
        hap(s.ok ? 'hap--ok' : 'hap--uyari', t(s.ok ? 'pb.vaka.tamam' : 'pb.vaka.bekliyor')) + '</div>';
    }).join('');

    return {
      ust: t('pb.vaka.cekUst'),
      baslik: v.kod,
      govde: '<div class="gece-alan yigin g5">' +
        '<div class="satir sar g2">' +
          hap('hap--mavi', v.teknik) +
          hap(ok ? 'hap--ok' : 'hap--uyari', t(ok ? 'pb.vaka.onamAlindi' : 'pb.vaka.onamBekliyor')) +
        '</div>' +
        '<div class="kart kart--sik yigin g3">' +
          veriSatir(t('pb.vaka.tarih'), HP.date(v.tarih)) +
          veriSatir(t('pb.vaka.greftE'), num(v.greft)) +
          veriSatir(t('pb.vaka.evre'), String(v.norwood)) +
          veriSatir(t('pb.vaka.gecen'), v.ayGecti + t('sonuc.ay')) +
        '</div>' +
        '<div class="kart kart--sik yigin g3">' +
          '<b class="b3">' + esc(t('pb.vaka.onamBaslik')) + '</b>' + onamSatir +
        '</div>' +
        '<div class="satir aralik sar g3">' +
          '<span class="g-sm ucuncul">' + esc(t('pb.vaka.diller')) + '</span>' +
          '<span class="satir g2">' + (diller.length
            ? diller.map(function (l) { return hap('hap--mavi', l.toUpperCase()); }).join('')
            : hap('hap--uyari', t('pb.vaka.yayindaDegil'))) + '</span>' +
        '</div>' +
        '<div class="mevzuat">' + HP.icon('info', '', 16) +
          '<span>' + esc(t('sonuc.uyari') + ' ' + t('sonuc.onam')) + '</span></div>' +
      '</div>',
      alt: '<div class="gece-alan satir g3">' +
        '<button class="btn btn--ana btn--sm" data-act="yakinda">' +
          esc(t(ok ? 'pb.vaka.yayinaAl' : 'pb.vaka.onamIste')) + '</button>' +
        '<button class="btn btn--sade btn--sm" data-act="cekmece:kapat">' +
          esc(t('genel.kapat')) + '</button>' +
      '</div>'
    };
  };

    'norwood': ['tr', 'en', 'ar'],
    'trassiz': ['tr', 'en'],
    'ilk-30-gun': ['tr', 'en', 'ar'],
    'dhi-safir': ['tr', 'en'],
    'donor': ['tr']
  };

  HP.act('seo-dil', function (el) {
    var d = el.getAttribute('data-deger');
    HP.qsa('[data-act="seo-dil"]').forEach(function (x) { x.classList.remove('is-secili'); });

      r.classList.toggle('gizle', d !== 'hepsi' && r.getAttribute('data-kelime-dil') !== d);

  HP.act('seo-sirala', function (el) {
    var govde = document.getElementById('seo-govde');
    if (!govde) return;
    var artan = el.getAttribute('data-yon') !== 'artan';
    el.setAttribute('data-yon', artan ? 'artan' : 'azalan');
    HP.qsa('tr', govde).sort(function (a, b) {
      var x = parseInt(a.getAttribute('data-sira'), 10), y = parseInt(b.getAttribute('data-sira'), 10);
      return artan ? x - y : y - x;
    }).forEach(function (r) { govde.appendChild(r); });
  });

  function seoSatir(k) {
    var fark = k.oncekiSira - k.sira;
    var yon = fark > 0 ? 'yukari' : fark < 0 ? 'asagi' : 'esit';
    var ikon = fark > 0 ? 'arrowUp' : fark < 0 ? 'arrowDown' : 'minus';
    return '<tr data-kelime-dil="' + esc(k.dil) + '" data-sira="' + k.sira + '">' +
      '<td>' + esc(k.kelime) + '</td>' +
      '<td>' + hap('', k.dil.toUpperCase()) + '</td>' +

      '<td><span class="sira"><span class="sira__n">' + num(k.sira) + '</span>' +
        '<span class="sira__d ' + ('sira__d--' + yon) + '">' + HP.icon(ikon, '', 13) +
        (fark ? num(Math.abs(fark)) : '') + '</span></span></td>' +
      '<td><span class="satir g3"><span class="cubuk buyu">' +
        '<span class="cubuk__ic" data-oran="' + k.zorluk + '"></span></span>' +
        '<span class="sayi g-xs">' + num(k.zorluk) + '</span></span></td>' +

    '</tr>';

  HP.page('p-seo', {
    bolum: 'panel',
    render: function () {
      var seo = HP.DB.seo;
      var ilk10 = seo.filter(function (k) { return k.sira <= 10; }).length;
      var yukselen = seo.filter(function (k) { return k.oncekiSira > k.sira; }).length;
      var ortSira = Math.round(seo.reduce(function (a, k) { return a + k.sira; }, 0) / seo.length);
      var toplam = seo.reduce(function (a, k) { return a + k.hacim; }, 0);

      var siralanmis = seo.slice().sort(function (a, b) { return b.hacim - a.hacim; }).slice(0, 18);

/* HairPro — görsel kancası. TEK yerden <img> hijyeni.
 *
 * Sorun: 21 <img> etiketi altı ayrı görünüm dosyasında string birleştirmeyle
 * üretiliyor ve hiçbirinde width/height yok. Tarayıcı karenin oranını ancak
 * bayt indikten sonra öğrendiği için — oranı CSS'ten öğrenemediği yerlerde —
 * yerleşim yükleme anında zıplıyor (üst çubuk kelime markası, alt bilgi kilidi).
 *
 * Çözüm: görünüm dosyalarına hiç dokunmadan, DOM'a giren her <img>'ye
 * HP.imgBoyut sözlüğünden ölçüyü yaz. MutationObserver geri çağrısı, eklenen
 * düğümler BOYANMADAN önceki mikro-görevde çalışır; öznitelik oraya yetişir,
 * dolayısıyla zıplama hiç oluşmaz.
 *
 * Aynı geçişte iki iş daha yapılır:
 *   decoding="async"  — kod çözme ana iş parçacığını kilitlemez
 *   loading="lazy"    — ilk ekranda olmayan kareler istek üretmez
 *
 * ⚠ Sahne (hero) zemini İSTİSNADIR: ekranın en üstündeki en büyük karedir,
 *   LCP odur. Görünen sürümü istekli (eager + fetchpriority=high) kalır;
 *   görünmeyen kardeşi (masaüstünde --m, mobilde --d) tembelleşir ve
 *   display:none olduğu için hiç indirilmez. Öncesinde İKİSİ de iniyordu.
 */
(function (HP) {
  'use strict';
  if (typeof document === 'undefined') return;

  var BOYUT = HP.imgBoyut || {};
  var ters = null;                       /* src UZUNLUĞU -> [{s, o}, …] */

  /* HP.img'nin değeri iki derlemede farklıdır: canlıda "g/9f3.webp",
     artifact'ta "data:image/webp;base64,…". Sözlüğü çalışma anında HP.img
     üzerinden çevirmek ikisini de tek kodla karşılar.

     ⚠ Anahtar olarak src metni KULLANILMAZ. Artifact sürümünde o metin
     400 KB'lık bir data-URI'dir; nesne anahtarı yapmak her aramada o kadar
     baytın karmasını hesaplatır. Bunun yerine önce UZUNLUĞA göre kova,
     sonra kovadaki (neredeyse hep tek) adayla tam karşılaştırma: aynı sonuç,
     karma maliyeti sıfır. */
  function harita() {
    if (ters) return ters;
    ters = {};
    var im = HP.img || {}, k, s;
    for (k in im) {
      if (!Object.prototype.hasOwnProperty.call(im, k)) continue;
      s = im[k];
      if (!s || !BOYUT[k]) continue;
      (ters[s.length] || (ters[s.length] = [])).push({ s: s, o: BOYUT[k] });
    }
    return ters;
  }

  function olcu(src) {
    if (!src) return null;
    var kova = harita()[src.length];
    if (!kova) return null;
    for (var i = 0; i < kova.length; i++) if (kova[i].s === src) return kova[i].o;
    return null;
  }

  /* Sahnenin hangi kardeşinin görüneceğini CSS 780px'te belirliyor
     (bkz. src/08-sahne.css). Aynı eşiği burada okuruz; getComputedStyle
     çağırmak her çizimde yerleşim hesabı zorlardı. */
  function mobilMi() {
    return !!(window.matchMedia && window.matchMedia('(max-width: 780px)').matches);
  }

  /* Erken indirilmesi gereken kareler: sahnenin görünen zemini ve üst çubuk
     kelime markası. Geri kalan her şey ilk ekranın altındadır. */
  function istekli(g) {
    var s = ' ' + (g.getAttribute('class') || '') + ' ';
    if (s.indexOf(' sahne__g--d ') > -1) return !mobilMi();
    if (s.indexOf(' sahne__g--m ') > -1) return mobilMi();
    return s.indexOf(' marka__kelime ') > -1;
  }

  function isle(g) {
    if (g.getAttribute('data-hp-boyut')) return;
    g.setAttribute('data-hp-boyut', '1');

    var o = olcu(g.getAttribute('src'));
    /* Öznitelikler yalnız CSS ölçü vermediğinde etkilidir; .foto/.sahne__g gibi
       oranı zaten kilitli sarmalayıcılarda zararsızdır, kilitli olmayan
       yerlerde (logo) oranı verir. Bu yüzden koşulsuz yazılır. */

      g.setAttribute('width', o[0]);
      g.setAttribute('height', o[1]);

        g.setAttribute('fetchpriority', 'high');
      } else {
        g.setAttribute('loading', 'lazy');
      }
    }
  }

  function tara(kok) {
    if (!kok || kok.nodeType !== 1) return;
    if (kok.tagName === 'IMG') isle(kok);
    var l = kok.getElementsByTagName ? kok.getElementsByTagName('img') : [];
    for (var i = 0; i < l.length; i++) isle(l[i]);
  }

  HP.gorselHijyen = tara;                /* elle çizen yerler de çağırabilir */

  function baglan() {
    tara(document.body);
    if (!window.MutationObserver) return;
    new MutationObserver(function (kayitlar) {
      for (var i = 0; i < kayitlar.length; i++) {
        var e = kayitlar[i].addedNodes;
        for (var j = 0; j < e.length; j++) tara(e[j]);
      }
    }).observe(document.documentElement, { childList: true, subtree: true });
  }

  /* Gözlemci ÇİZİMDEN ÖNCE bağlanmalı; yoksa ilk rotanın kareleri kaçar. */
  if (document.body) baglan();
  else document.addEventListener('DOMContentLoaded', baglan);
}(window.HP = window.HP || {}));

/* ===== src/50-boot.js ===== */
/* ============================================================================
   HairPro — 50-boot.js
   Ortak etkileşimler + açılış. Kural: sayaçlar ve grafikler HTML'de zaten
   DOĞRU değeri taşır; JS yalnızca canlandırır. JS çalışmazsa sayfa yine doğru.
   ========================================================================== */
(function (HP) {
  'use strict';

  /* --- SSS akordiyonu ---------------------------------------------------- */
  HP.act('sss', function (el) {
    var o = el.closest('.sss__o');
    var acik = o.classList.contains('is-acik');
    HP.qsa('.sss__o').forEach(function (x) {
      x.classList.remove('is-acik');
      var c = x.querySelector('.sss__c'); if (c) c.hidden = true;
      var b = x.querySelector('.sss__s'); if (b) b.setAttribute('aria-expanded', 'false');
    });
    if (!acik) {
      o.classList.add('is-acik');
      var c = o.querySelector('.sss__c'); if (c) c.hidden = false;
      el.setAttribute('aria-expanded', 'true');
    }
  });

  /* --- greft hesaplayıcı -------------------------------------------------- */
  HP.hesapDurum = { evre: 3, bolge: { on: true, orta: false, tepe: false } };

  HP.hesapla = function () {
    var d = HP.hesapDurum;
    var n = HP.NORWOOD.filter(function (x) { return x.e === d.evre; })[0] || HP.NORWOOD[1];
    var pay = 0;
    HP.BOLGE.forEach(function (b) { if (d.bolge[b.k]) pay += b.pay; });
    if (pay === 0) pay = 0.4;
    var min = Math.round(n.min * pay / 0.4 / 50) * 50;
    var max = Math.round(n.max * pay / 0.4 / 50) * 50;
    var sa1 = Math.max(3, Math.round(min / HP.GREFT_SAAT));
    var sa2 = Math.max(sa1 + 1, Math.round(max / HP.GREFT_SAAT));
    return { min: min, max: max, sa1: sa1, sa2: sa2 };
  };

  function hesapYaz() {
    var s = HP.hesapla();
    var a = document.getElementById('hesap-aralik');
    var b = document.getElementById('hesap-sure');
    if (a) a.textContent = HP.num(s.min) + '–' + HP.num(s.max);
    if (b) b.textContent = s.sa1 + '–' + s.sa2 + ' ' + HP.t('greft.saat');
  }

  HP.act('nw', function (el) {
    HP.hesapDurum.evre = parseInt(el.getAttribute('data-evre'), 10);
    HP.qsa('.norwood__d').forEach(function (x) { x.classList.remove('is-secili'); });
    el.classList.add('is-secili');
    hesapYaz();
  });
  HP.act('bolge', function (el) {
    var k = el.getAttribute('data-bolge');
    HP.hesapDurum.bolge[k] = !HP.hesapDurum.bolge[k];
    el.classList.toggle('is-secili', HP.hesapDurum.bolge[k]);
    hesapYaz();
  });

  /* --- öncesi/sonrası kaydırıcı -------------------------------------------- */
  function karsilastir() {
    HP.qsa('.karsilastir input[type="range"]').forEach(function (r) {
      function guncelle() {
        var v = r.value;
        var kutu = r.closest('.karsilastir');
        var ust = kutu.querySelector('.karsilastir__ust');
        var tut = kutu.querySelector('.karsilastir__tut');
        if (ust) ust.style.clipPath = 'inset(0 ' + (100 - v) + '% 0 0)';
        if (tut) tut.style.insetInlineStart = v + '%';
      }
      r.addEventListener('input', guncelle);
      guncelle();
    });
  }

  /* --- sonuç filtresi ------------------------------------------------------- */
  HP.act('vaka-filtre', function (el) {
    var f = el.getAttribute('data-filtre');
    HP.qsa('[data-act="vaka-filtre"]').forEach(function (x) { x.classList.remove('is-secili'); });
    el.classList.add('is-secili');
    HP.qsa('[data-vaka-bolge]').forEach(function (k) {
      k.classList.toggle('gizle', f !== 'hepsi' && k.getAttribute('data-vaka-bolge') !== f);
    });
  });

  /* --- form: doğrulama · başarı kartı · panele düşen kayıt ---------------
     Eskiden "form-gonder" tek satırdı ve BOŞ formda bile "alındı" diyordu
     (BULGU 16). Klinik demoyu ilk denediğinde yaptığı şey tam olarak buydu.
     Şimdi: ad + telefon + KVKK zorunlu, hata metni alanın ALTINDA ve
     aria-describedby ile bağlı, odak ilk hatalı alana gider. */

  /* Hata metnini alanın altına yazar/siler. mesaj boşsa alan temizlenir.
     Panel giriş kapısı da (21-panel-a.js) bu yardımcıyı kullanır. */
  HP.alanHata = function (id, mesaj) {
    var g = document.getElementById(id);
    var h = document.getElementById(id + '-hata');
    var bag = document.getElementById(id + '-alan') || g;   /* onay kutusunda sarmalayıcı */
    if (h) {
      if (mesaj) {
        h.innerHTML = HP.icon('alertTriangle', '', 15) + '<span>' + HP.esc(mesaj) + '</span>';
        h.hidden = false;
      } else {
        h.hidden = true;
        h.innerHTML = '';
      }
    }
    if (bag) {
      if (mesaj) {
        bag.setAttribute('aria-invalid', 'true');
        bag.setAttribute('aria-describedby', id + '-hata');
      } else {
        bag.removeAttribute('aria-invalid');
        bag.removeAttribute('aria-describedby');
      }
    }
    return g;
  };

  function deger(id) {
    var el = document.getElementById(id);
    return el && el.value != null ? String(el.value).trim() : '';
  }

  HP.act('form-gonder', function () {
    var ad = deger('f-ad');
    var tel = deger('f-tel');
    var kv = document.getElementById('f-kvkk');
    var onay = !!(kv && kv.checked);

    var eAd = ad.length < 2 ? HP.t('form.hata.ad') : '';
    var eTel = !tel ? HP.t('form.hata.telBos')
      : (HP.telGecerli && !HP.telGecerli(tel)) ? HP.t('form.hata.tel') : '';
    var eKv = onay ? '' : HP.t('form.hata.kvkk');

    HP.alanHata('f-ad', eAd);
    HP.alanHata('f-tel', eTel);
    HP.alanHata('f-kvkk', eKv);

    /* Odak İLK hatalı alana: ekran okuyucu hatayı burada duyurur. */
    var ilk = eAd ? 'f-ad' : eTel ? 'f-tel' : eKv ? 'f-kvkk' : '';
    if (ilk) {
      var el = document.getElementById(ilk);
      if (el && el.focus) el.focus();
      return;
    }

    /* Kayıt panele düşer (yalnız oturum içinde) ve form yerini
       "sırada ne var" kartına bırakır. */
    if (HP.leadEkle) HP.leadEkle({ ad: ad, tel: tel });
    HP.store.set('formGonderildi', true);
    var kutu = document.getElementById('form-kutu');
    if (kutu && HP.parca && HP.parca.formSonraki) {
      kutu.innerHTML = HP.parca.formSonraki();
      if (kutu.scrollIntoView) kutu.scrollIntoView({ block: 'center' });
    }
  });

  HP.act('form-yeni', function () {
    HP.store.set('formGonderildi', false);
    var kutu = document.getElementById('form-kutu');
    if (!kutu || !HP.parca || !HP.parca.formGovde) return;
    kutu.innerHTML = HP.parca.formGovde();
    var a = document.getElementById('f-ad');
    if (a && a.focus) a.focus();
  });

  /* --- panel: satır ayrıntısı ------------------------------------------------- */
  HP.act('lead-ac', function (el) {
    var id = el.getAttribute('data-id');
    /* Site formundan düşen kayıtlar HP.DB.lead'de DEĞİL, HP.store'da:
       arama ikisini birden gezen HP.leadBul üzerinden yapılır. */
    var l = HP.leadBul ? HP.leadBul(id)
      : HP.DB.lead.filter(function (x) { return x.id === id; })[0];
    if (!l || !HP.leadCekmece) return;
    HP.drawer(HP.leadCekmece(l));
  });

  HP.act('vaka-ac', function (el) {
    var id = el.getAttribute('data-id');
    var v = HP.DB.vaka.filter(function (x) { return x.id === id; })[0];
    if (!v || !HP.vakaCekmece) return;
    HP.drawer(HP.vakaCekmece(v));
  });

  HP.act('yakinda', function () { HP.toast(HP.t('demo.metin'), 'uyari'); });

  /* --- her çizimden sonra ------------------------------------------------------ */
  HP.on('render', function () {
    karsilastir();
    if (HP.grafikleriCiz) HP.grafikleriCiz();
  });

  /* --- açılış -------------------------------------------------------------------- */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', HP.boot);
  } else {
    HP.boot();
  }
})(window.HP);

</script>
