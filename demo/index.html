xFCrkiye'ye y\xF6nelik yay\u0131nda tan\u0131t\u0131m amac\u0131yla kullan\u0131lmas\u0131n\u0131 yasakl\u0131yor. Kural\u0131 esnetmiyoruz. Merak etti\u011Finiz bir \u015Fey varsa do\u011Frudan sorun; yaz\u0131l\u0131 cevap veririz.","yorum.kapali.dil":"\u0130ngilizce s\xFCr\xFCmde g\xF6ster","fiyat.kapali.baslik":"Fiyat\u0131 sayfada yazam\u0131yoruz \u2014 ama sizden saklam\u0131yoruz","fiyat.kapali.metin":"Ayn\u0131 y\xF6netmelik (Md. 5/1-m) \xFCcret, indirim ve kampanya bilgisini T\xFCrkiye'ye y\xF6nelik yay\u0131nda yasakl\u0131yor. \u015E\xF6yle ilerliyoruz: foto\u011Fraf\u0131n\u0131z\u0131 g\xF6nderirsiniz, ayn\u0131 g\xFCn greft aral\u0131\u011F\u0131n\u0131z\u0131 yazar\u0131z, fiyat\u0131 o aral\u0131\u011Fa g\xF6re yaz\u0131l\u0131 iletiriz. Klini\u011Fe geldi\u011Finizde rakam de\u011Fi\u015Fmez; yaln\u0131z greft say\u0131s\u0131 \xF6l\xE7\xFCmle netle\u015Fir.","fiyat.kapali.cta":"Fiyat\u0131 bana yaz\u0131n","sss.baslik":"S\u0131k sorulanlar","sss.anaAlt":"Karar vermeden \xF6nce en \xE7ok sorulanlar.","sss.tumu":"On iki sorunun tamam\u0131","sss.1.s":"Operasyon a\u011Fr\u0131l\u0131 m\u0131?","sss.1.c":"Lokal anestezi uygulan\u0131r. Anestezi s\u0131ras\u0131nda k\u0131sa s\xFCreli batma hissi olur, sonras\u0131nda a\u011Fr\u0131 beklenmez.","sss.2.s":"Ne zaman i\u015Fe d\xF6nebilirim?","sss.2.c":"Tra\u015Fs\u0131z y\xF6ntemde ertesi g\xFCn, klasik y\xF6ntemde ortalama \xFC\xE7 g\xFCn sonra sosyal hayata d\xF6n\xFCl\xFCr.","sss.3.s":"Ekilen sa\xE7lar d\xF6k\xFCl\xFCr m\xFC?","sss.3.c":"\u0130kinci ve d\xF6rd\xFCnc\xFC hafta aras\u0131nda \u015Fok d\xF6k\xFClme normaldir. K\xF6kler kal\u0131r, sa\xE7 \xFC\xE7\xFCnc\xFC aydan itibaren yeniden \xE7\u0131kar.","sss.4.s":"Sonu\xE7 ne zaman belli olur?","sss.4.c":"Alt\u0131nc\u0131 ayda g\xF6r\xFCn\xFCr yo\u011Funluk olu\u015Fur. Nihai sonu\xE7 on iki\u2013on sekiz ay aras\u0131nda de\u011Ferlendirilir.","sss.5.s":"Ka\xE7 greft gerekir?","sss.5.c":"D\xF6k\xFClme evresi ve don\xF6r yo\u011Funlu\u011Funa ba\u011Fl\u0131d\u0131r. Hesaplay\u0131c\u0131 tahmin verir, kesin say\u0131 muayenede belirlenir.","sss.6.s":"Ya\u015F s\u0131n\u0131r\u0131 var m\u0131?","sss.6.c":"D\xF6k\xFClme paterni oturduktan sonra, genellikle yirmi be\u015F ya\u015F \xFCzerinde uygulanmas\u0131 tercih edilir.","sss.7.s":"Ense b\xF6lgesinde iz kal\u0131r m\u0131?","sss.7.c":"FUE'de kesi yap\u0131lmaz; her greft ayr\u0131 ayr\u0131 al\u0131n\u0131r ve geride milimetrenin alt\u0131nda nokta izler kal\u0131r. Bu izler sa\xE7 bir numara makineyle kesildi\u011Finde g\xF6r\xFCnmez. Tamamen s\u0131f\u0131r numaraya vuruyorsan\u0131z dikkatli bakan biri fark edebilir; muayenede don\xF6r yo\u011Funlu\u011Funuzu \xF6l\xE7\xFCp bunu size a\xE7\u0131k\xE7a s\xF6yleriz.","sss.8.s":"Yapay g\xF6r\xFCn\xFCr m\xFC?","sss.8.c":"Do\u011Fall\u0131k greft say\u0131s\u0131ndan de\u011Fil, \xE7izgiden gelir. \xD6n s\u0131raya yaln\u0131z tek k\xF6kl\xFC greftler yerle\u015Ftirilir, arkaya do\u011Fru \xE7ok k\xF6kl\xFCler ge\xE7er; \xE7izgi d\xFCz de\u011Fil, hafif k\u0131r\u0131kl\u0131 \xE7izilir ve sa\xE7 \xE7\u0131k\u0131\u015F a\xE7\u0131s\u0131 kom\u015Fu sa\xE7larla ayn\u0131 tutulur. Bu \xFC\xE7 \u015Fey do\u011Fru yap\u0131ld\u0131\u011F\u0131nda sonu\xE7 \u0131slak sa\xE7ta bile ay\u0131rt edilmez.","sss.9.s":"Tutmazsa ne oluyor?","sss.9.c":"Greftlerin k\xFC\xE7\xFCk bir k\u0131sm\u0131n\u0131n tutmamas\u0131 beklenen bir durumdur; planlama bunu hesaba katar. On ikinci ayda birlikte de\u011Ferlendiririz: kapsama beklenenin alt\u0131ndaysa ve don\xF6r kapasiteniz elveriyorsa d\xFCzeltme seans\u0131 planlan\u0131r. Hangi durumda \xFCcretsiz, hangi durumda \xFCcretli oldu\u011Funu \xF6n g\xF6r\xFC\u015Fmede yaz\u0131l\u0131 olarak s\xF6yleriz.","sss.10.s":"\u0130\u015F yerinde belli olur mu?","sss.10.c":"\u0130lk \xFC\xE7 g\xFCn k\u0131zar\u0131kl\u0131k ve hafif \xF6dem olur; \u015Fapka tak\u0131labilir ama s\u0131k\u0131 olmamal\u0131. Tra\u015Fs\u0131z y\xF6ntemde sa\xE7 kesilmedi\u011Fi i\xE7in ertesi g\xFCn sosyal hayata d\xF6nebilirsiniz. Klasik y\xF6ntemde don\xF6r alan k\u0131sa olur, o y\xFCzden \xE7o\u011Fu ki\u015Fi bir hafta izin al\u0131yor.","sss.11.s":"\u015Eehir d\u0131\u015F\u0131ndan geliyorum, ka\xE7 g\xFCn kalmam gerekir?","sss.11.c":"\u0130ki gece yeterli. Birinci g\xFCn muayene, kan tetkikleri, \xE7izim ve operasyon; ikinci g\xFCn klinikte ilk y\u0131kama ve bak\u0131m anlat\u0131m\u0131; \xFC\xE7\xFCnc\xFC g\xFCn u\xE7u\u015F serbest. Klinik \u015Ei\u015Fli'de, havaliman\u0131na yakla\u015F\u0131k k\u0131rk dakika. Konaklama ve transferi biz satm\u0131yoruz ama anla\u015Fmal\u0131 otelin ad\u0131n\u0131 ve yol tarifini yaz\u0131l\u0131 g\xF6nderiyoruz.","sss.12.s":"Fiyat\u0131 ne zaman ve nas\u0131l \xF6\u011Frenece\u011Fim?","sss.12.c":"Foto\u011Fraflar\u0131n\u0131z\u0131 g\xF6nderirsiniz; ayn\u0131 g\xFCn greft aral\u0131\u011F\u0131n\u0131z\u0131 yazar\u0131z. Fiyat\u0131 bu aral\u0131\u011Fa g\xF6re WhatsApp \xFCzerinden yaz\u0131l\u0131 iletiriz. Klini\u011Fe geldi\u011Finizde rakam de\u011Fi\u015Fmez; yaln\u0131z greft say\u0131s\u0131 muayenede \xF6l\xE7\xFCmle netle\u015Fir. Mevzuat gere\u011Fi \xFCcret bilgisini T\xFCrk\xE7e yay\u0131nda sayfada g\xF6steremiyoruz, size do\u011Frudan yaz\u0131yoruz.","form.baslik":"\xDCcretsiz sa\xE7 analizi","form.alt":"Ad ve telefon yeterli. Ayn\u0131 g\xFCn yaz\u0131l\u0131 d\xF6n\xFC\u015F yap\u0131yoruz.","form.ad":"Ad\u0131n\u0131z","form.tel":"Telefon","form.foto":"Foto\u011Fraf ekleyin (tepe ve \xF6n a\xE7\u0131dan)","form.fotoNot":"\u0130ste\u011Fe ba\u011Fl\u0131, ama tahmini \xE7ok daha do\u011Fru yapar.","form.kvkk":"Ki\u015Fisel verilerimin i\u015Flenmesine ili\u015Fkin ayd\u0131nlatma metnini okudum.","form.gonder":"Analizi ba\u015Flat","form.wa":"WhatsApp\u2019tan yaz\u0131n","form.basarili":"Ba\u015Fvurunuz al\u0131nd\u0131. Demoda ger\xE7ek g\xF6nderim yap\u0131lmaz.","alt.g.tekDhi":"Eldivenli el, steril \xF6rt\xFC \xFCzerinde ince bir aleti tutuyor.","alt.g.tekSafir":"\u0130ki \xE7ift eld u":"Book a consultation","nav.menu":"Menu","hero.ust":"ISTANBUL \xB7 HAIR TRANSPLANT CLINIC","hero.h1":"Your own hair, again.","hero.alt":"Natural hairline with no-shave DHI. The journey starts with a consultation.","hero.cta1":"Free hair analysis","hero.cta2":"See results","hero.guven1":"Graft range and technique advice","hero.guven2":"No-shave option","hero.guven3":"Written reply the same day","guven.baslik":"About the clinic","guven.1.n":"3","guven.1.a":"techniques offered","guven.2.n":"12","guven.2.a":"months of follow-up","guven.3.n":"3","guven.3.a":"consultation languages","teknik.baslik":"Techniques we use","teknik.alt":"We decide together which one suits you, during your free consultation.","teknik.dhi.metin":"Grafts go in directly with a Choi pen, no channels opened. Denser placement, faster healing.","teknik.dhi.m1":"No channels","teknik.dhi.m2":"High density","teknik.dhi.m3":"Faster healing","teknik.safir.metin":"Channels are opened with sapphire blades. Tissue trauma drops and crusting clears sooner.","teknik.safir.m1":"Sapphire blade","teknik.safir.m2":"Large areas","teknik.safir.m3":"Less crusting","teknik.trassiz.metin":"Your hair is not cut. You can go out the next day. Graft numbers are limited.","teknik.trassiz.m1":"No haircut","teknik.trassiz.m2":"Next-day return","teknik.trassiz.m3":"Limited grafts","tedavi.baslik":"Supporting treatments","tedavi.alt":"Applied before and after the transplant to support the health of your hair.","tedavi.prp.ad":"PRP","tedavi.prp.metin":"Growth factors drawn from your own blood strengthen the follicles.","tedavi.mezo.ad":"Mesotherapy","tedavi.mezo.metin":"A vitamin and mineral blend is injected into the scalp to improve nourishment.","tedavi.kok.ad":"Stem cell","tedavi.kok.metin":"Stem cell support aims to renew weakened follicles.","greft.baslik":"How many grafts","greft.alt":"Pick your hair loss stage and see the estimated range.","greft.norwood":"Hair loss stage","greft.bolge":"Area to be treated","greft.b1":"Front hairline","greft.b2":"Crown (vertex)","greft.b3":"Mid-scalp","greft.sonuc":"Estimated graft range","greft.sure":"Estimated operation time","greft.saat":"hours","greft.not":"This is an estimate. The exact number is set at examination, by measuring donor density.","greft.cta":"Ask a surgeon about this","sonuc.baslik":"Results","sonuc.alt":"Every case is published with its date, technique and graft count.","sonuc.dogru.baslik":"No patient photographs here \u2014 on purpose","sonuc.dogru.p1":"Result photographs may only be published with the patient's written consent. We hold those consents. We still keep the frames off the internet: once a photograph is out there it cannot be taken back, and most of our patients would rather it were not.","sonuc.dogru.p2":"We show the frames on screen at the clinic during your consultation \u2014 with the date, the graft count and the matching pair shot in the same light. If you like, we pick the case closest to your own and look at them side by side.","sonuc.dogru.p3":"What follows are measurement diagrams: which area received how many grafts and how the coverage is distributed. Each card carries the doctor's note for that case. The photo gallery component is built and switched on in the panel \u2014 if the clinic decides to publish, consented frames land here with date, technique and consent labels.","sonuc.dogru.cta":"Show me the case closest to mine","sonuc.filtre.hepsi":"All","sonuc.filtre.on":"Hairline","sonuc.filtre.tepe":"Crown","sonuc.seans":"Session {n} of {t}","sonuc.oncesi":"Before","sonuc.sonrasi":"After","sonuc.ay":" months","sonuc.greft":"grafts","sonuc.uyari":"Results of any surgical or interventional procedure may vary from person to person. Please seek a detailed opinion from your doctor before the procedure.","sonuc.uyariKisa":"Results vary from person to person.","sonuc.onam":"Patient images are published only with a signed consent form; the frames here are diagrams.","sonuc.etkilesim":"Comments and likes are turned off on our posts, as the regulation requires.","yolculuk.baslik":"How the procedure works","yolculuk.alt":"The standard path we follow, from first consultation to one-year follow-up.","yolculuk.1.g":"Step 1","yolculuk.1.a":"Consultation","yolculuk.1.m":"You send your photos. We set the graft count and the right technique.","yolculuk.2.g":"Step 2","yolculuk.2.a":"Exam and design","yolculuk.2.m":"Blood tests are done, the hairline is designed together and approved by you.","yolculuk.3.g":"Step 3","yolculuk.3.a":"Procedure","yolculuk.3.m":"One session under local anaesthetic; the time follows the graft count. You go home the same day.","yolculuk.4.g":"Step 4","yolculuk.4.a":"First wash and follow-up","yolculuk.4.m":"First wash at the clinic the next day, then check-ups for a full year.","yolculuk.dahil":"Examination, medication set and one year of follow-up are included.","klinik.baslik":"The clinic","klinik.alt":"Every procedure takes place at our Ministry of Health licensed clinic in Istanbul.","klinik.m1":"Procedures are performed under physician supervision.","klinik.m2":"Single-use sterile materials.","klinik.m3":"Turkish, English and Arabic support.","klinik.m4":"Twelve months of follow-up after surgery.","yorum.baslik":"Patient stories","yorum.kapali.baslik":"We do not show patient reviews in the Turkish edition","yorum.kapali.metin":"The 12/11/2025 Promotion Regulation (Art. 5/1-e) bars using patient satisfaction statements promotionally in publications aimed at Turkey. We do not bend the rule. Ask us directly and we answer in writing.","yorum.kapali.dil":"Show the English version","fiyat.kapali.baslik":"We cannot print the price here \u2014 but we are not hiding it","fiyat.kapali.metin":"The same regulation (Art. 5/1-m) bars fees, discounts and campaigns in publications aimed at Turkey. Here is how it works: you send your photos, we write back the same day with your graft range, and the price follows in writing.","fiyat.kapali.cta":"Send me the price","sss.baslik":"Frequently asked","sss.anaAlt":"What people ask most before deciding.","sss.tumu":"See all twelve","sss.1.s":"Is the procedure painful?","sss.1.c":"A local anaesthetic is used. You feel a brief sting while it is given, and no pain is expected afterwards.","sss.2.s":"When can I return to work?","sss.2.c":"The next day with the no-shave method, and after about three days with the classic method.","sss.3.s":"Do transplanted hairs fall out?","sss.3.c":"Shock loss between weeks two and four is normal. The roots stay, and hair regrows from the third month.","sss.4.s":"When are results visible?","sss.4.c":"Visible density forms by month six. The final result is assessed between twelve and eighteen months.","sss.5.s":"How many grafts do I need?","sss.5.c":"It depends on your loss stage and donor density. The calculator estimates; examination gives the exact number.","sss.6.s":"Is there an age limit?","sss.6.c":"It is usually preferred after twenty-five, once the pattern of hair loss has settled.","sss.7.s":"Will there be scars at the back?","sss.7.c":"FUE makes no incision; each graft is taken individually and leaves dot marks under a millimetre. They are invisible once the hair is clipped to a number one. If you shave to the skin, someone looking closely may notice. We measure your donor density at the examination and tell you plainly.","sss.8.s":"Will it look artificial?","sss.8.c":"Natural results come from the line, not the graft count. Only single-hair grafts go in the front row, multi-hair grafts sit behind them, the line is drawn slightly irregular rather than straight, and the exit angle matches the neighbouring hair. Get those three right and the result holds up even with wet hair.","sss.9.s":"What if it does not take?","sss.9.c":"A small share of grafts not surviving is expected and the plan allows for it. At month twelve we review it together: if coverage is below plan and your donor capacity allows, a corrective session is scheduled. We tell you in writing, before the operation, when that is free of charge and when it is not.","sss.10.s":"Will people at work notice?","sss.10.c":"Expect redness and mild swelling for three days; a loose hat is fine. With the no-shave method your hair is not cut, so you can go out the next day. With the classic method the donor area is clipped short, which is why most people take a week off.","sss.11.s":"I am travelling in \u2014 how many nights do I need?","sss.11.c":"Two nights. Day one: examination, blood tests, hairline design and the operation. Day two: first wash at the clinic and aftercare briefing. Day three: you are free to fly. The clinic is in \u015Ei\u015Fli, roughly forty minutes from the airport. We do not sell accommodation or transfers, but we send you the partner hotel and directions in writing.","sss.12.s":"When and how do I learn the price?","sss.12.c":"You send your photos; we write back the same day with your graft range. The price follows that range and comes to you in writing on WhatsApp. The figure does not change when you arrive; only the graft count is finalised by measurement at the examination.","form.baslik":"Free hair analysis","form.alt":"Your name and phone are enough. We reply in writing the same day.","form.ad":"Your name","form.tel":"Phone","form.foto":"Add photos (crown and front)","form.fotoNot":"Optional, but it makes the estimate far more accurate.","form.kvkk":"I have read the notice on how my personal data is processed.","form.gonder":"Start analysis","form.wa":"Message on WhatsApp","form.basarili":"Request received. Nothing is actually sent in this demo.","alt.g.tekDhi":"A gloved hand holds a slim instrument over a sterile drape.","alt.g.tekSafir":"Two pairs of gloved hands work with fine forceps over a draped field.","alt.g.tekTras":"A person seen from behind against a dark backdrop, hair in view.","alt.g.klinik1":"Under the surgical lamp, a masked team stands at the head of the table.","alt.g.klinik2":"Two staff in caps and masks lean over the person on the table.","alt.g.konsultasyon":"A wide frame of the operating room, four staff around the table.","alt.g.hekim":"Studio portrait of a person in a white coat against a dark backdrop.","alt.g.ekip":"A person in blue scrubs sits on a gurney, stethoscope around the neck.","alt.g.danisman":"Close portrait of a person resting a hand on the chin, dark backdrop.","alt.g.aletler":"Surgical instruments laid out in perforated steel trays, staff blurred behind.","alt.g.makro2":"Macro frame of curved, light-catching strands on a black ground.","alt.g.yogunluk":"Seen from above, a dense surface of fine strands standing upright.","alt.g.mikro":"A dense bundle of pale fine strands lit from the side.","alt.g.portre":"Profile of a closely cropped head; the nape and ear are visible.","alt.g.kendi1":"A sterile instrument tray laid out in the operating room, staff blurred behind it.","alt.g.kendi2":"Gloved hands sorting grafts on a wooden spatula next to petri dishes.","alt.g.kendi3":"A masked clinician at work, wearing three-times surgical magnifying loupes.","alt.adres":"\u015Ei\u015Fli, Istanbul","alt.saat":"Every day 09:00 \u2013 20:00","alt.hizmet":"Services","alt.kurumsal":"Company","alt.yasal":"Legal","alt.kvkk":"Privacy notice","alt.cerez":"Cookie policy","alt.mevzuat":"Advertising regulation notice","alt.telif":"This page is a demo build.","p.ara":"Search patient, country or number","p.nav.ozet":"Overview","p.nav.lead":"Leads","p.nav.randevu":"Appointments","p.nav.vaka":"Case archive","p.nav.icerik":"Content","p.nav.seo":"SEO","p.nav.sosyal":"Social media","p.nav.uyum":"Compliance","p.cikis":"Back to site","p.rol":"Clinic manager"},window.HP=window.HP||{},HP.I18N=HP.I18N||{},HP.I18N.ar={"genel.kapat":"\u0625\u063A\u0644\u0627\u0642","genel.hata":"\u062A\u0639\u0630\u0651\u0631 \u062A\u062D\u0645\u064A\u0644 \u0647\u0630\u0627 \u0627\u0644\u0642\u0633\u0645.","genel.devam":"\u0645\u062A\u0627\u0628\u0639\u0629","genel.geri":"\u0631\u062C\u0648\u0639","genel.tum r. Yani \xFC\xE7 bin greft kabaca alt\u0131 bin tel demektir. Klinikler greft \xFCzerinden konu\u015Fur \xE7\xFCnk\xFC ekilen birim k\xF6k\xFCn kendisidir, tel de\u011Fil. Greft ba\u015F\u0131na d\xFC\u015Fen tel say\u0131s\u0131 ki\u015Fiden ki\u015Fiye bir ile d\xF6rt aras\u0131nda de\u011Fi\u015Fir; ayn\u0131 greft say\u0131s\u0131n\u0131n iki ki\u015Fide farkl\u0131 dolgunluk vermesinin sebeplerinden biri budur.","\u0130kinci \xF6l\xE7\xFC aland\u0131r. A\xE7\u0131k b\xF6lge santimetrekare cinsinden \xF6l\xE7\xFCl\xFCr ve bu sitedeki greft haritas\u0131 tam olarak bunu yapar: se\xE7ti\u011Finiz b\xF6lgelerin alan\u0131n\u0131 hesaplar. Somut konu\u015Fal\u0131m. Yaln\u0131z \xF6n sa\xE7 \xE7izgisi band\u0131 otuz d\xF6rt santimetrekare tutar. \xD6n \xE7izgiye orta b\xF6lge ve \u015Fakak k\xF6\u015Feleri eklendi\u011Finde alan doksan be\u015F santimetrekareye \xE7\u0131kar. Tepe b\xF6lgesi de kat\u0131ld\u0131\u011F\u0131nda y\xFCz otuz sekiz santimetrekareyi bulur. Alan b\xFCy\xFCd\xFCk\xE7e gereken greft do\u011Fru orant\u0131l\u0131 artar.","\xDC\xE7\xFCnc\xFC \xF6l\xE7\xFC hedeflenen yo\u011Funluktur: santimetrekareye ka\xE7 greft ekilece\u011Fi. Sitedeki hesap varsay\u0131lan olarak santimetrekareye otuz greft al\u0131r. Sa\u011Fl\u0131kl\u0131 bir sa\xE7l\u0131 derideki do\u011Fal yo\u011Funluk bundan y\xFCksektir; ekimde ama\xE7 do\u011Fal s\u0131kl\u0131\u011F\u0131 birebir taklit etmek de\u011Fil, \u0131\u015F\u0131\u011F\u0131 kesen ve deriyi g\xF6stermeyen bir \xF6rt\xFC kurmakt\u0131r. Yo\u011Funlu\u011Fu art\u0131rmak greft ihtiyac\u0131n\u0131 do\u011Frudan art\u0131r\u0131r ve bu, don\xF6r alandan daha fazla al\u0131m demektir. Yani yo\u011Funluk bedava bir tercih de\u011Fildir.","Hesab\u0131n kendisi bundan sonra basittir: greft say\u0131s\u0131, alan ile yo\u011Funlu\u011Fun \xE7arp\u0131m\u0131d\u0131r. Santimetrekareye otuz greft hedefinde otuz d\xF6rt santimetrekarelik \xF6n \xE7izgi band\u0131 dokuz y\xFCz k\u0131rk ile bin y\xFCz aras\u0131nda bir plan \xE7\u0131kar\u0131r. Doksan be\u015F santimetrekarelik orta \xF6l\xE7ekli bir a\xE7\u0131kl\u0131k iki bin alt\u0131 y\xFCz yirmi ile \xFC\xE7 bin seksen aras\u0131nda. Y\xFCz otuz sekiz santimetrekare ise \xFC\xE7 bin sekiz y\xFCz yirmi ile d\xF6rt bin d\xF6rt y\xFCz doksan aras\u0131nda. Aral\u0131k, \xF6l\xE7\xFCmdeki yakla\u015F\u0131k y\xFCzde sekizlik pay\u0131 yans\u0131t\u0131r; tek bir say\u0131 vermek yerine aral\u0131k vermek daha d\xFCr\xFCstt\xFCr.","D\xF6rd\xFCnc\xFC k\u0131s\u0131t hesapta g\xF6r\xFCnmez ama plan\u0131 as\u0131l o belirler: don\xF6r alan\u0131n kapasitesi. Ense ve iki \u015Fakak b\xF6lgesindeki k\xF6kler hormonal d\xF6k\xFClmeye diren\xE7lidir ve say\u0131lar\u0131 sabittir. Bir ki\u015Fiden \xF6m\xFCr boyu g\xFCvenle al\u0131nabilecek greft i\xE7in planlamada alt\u0131 bin taban olarak kabul edilir. Bu rakam, bug\xFCnk\xFC a\xE7\u0131kl\u0131\u011F\u0131 kapatmak i\xE7in harcanabilecek b\xFCt\xE7enin tamam\u0131 de\u011Fildir: on y\u0131l sonraki d\xF6k\xFClme i\xE7in pay b\u0131rakmak gerekir, \xE7\xFCnk\xFC ekim mevcut sa\xE7\u0131n d\xF6k\xFClmesini durdurmaz.","Tek bir operasyonda al\u0131nabilecek greft i\xE7in de bir tavan vard\u0131r; planlamada d\xF6rt bin be\u015F y\xFCz kabul edilir. Bunun \xFCzerindeki planlar iki seansa b\xF6l\xFCn\xFCr ve seanslar aras\u0131na don\xF6r alan\u0131n toparlanmas\u0131 i\xE7in s\xFCre konur. Sitedeki greft haritas\u0131 bir plan bu tavan\u0131 a\u015Ft\u0131\u011F\u0131nda ekranda s\xF6yler, \xF6m\xFCr boyu kapasiteyi a\u015Ft\u0131\u011F\u0131nda ise ayr\u0131ca uyar\u0131r. Uyar\u0131 bir hata mesaj\u0131 de\u011Fildir; ileri evrelerde plan\u0131n ger\xE7ekten iki a\u015Famal\u0131 olmas\u0131 t\u0131bbi bir ger\xE7ektir.","Alan\u0131n tamam\u0131 ilk operasyonda kapat\u0131lmak zorunda de\u011Fildir; \xE7o\u011Fu durumda kapat\u0131lmamal\u0131d\u0131r da. \xD6ncelik s\u0131ras\u0131 genellikle \xF6n sa\xE7 \xE7izgisinden ba\u015Flar, \xE7\xFCnk\xFC y\xFCz \xE7er\xE7evesini o belirler ve aynada ilk bak\u0131lan yer oras\u0131d\u0131r. Tepe b\xF6lgesi ikinci s\u0131raya al\u0131nabilir, hatta bilin\xE7li olarak beklemeye b\u0131rak\u0131labilir. Bu bir k\u0131s\u0131tlama de\u011Fil, s\u0131n\u0131rl\u0131 bir kayna\u011F\u0131 en \xE7ok fark edilen yere yat\u0131rma karar\u0131d\u0131r ve karar sizinle birlikte verilir.","Kesin say\u0131 muayenede \xE7\u0131kar. Orada don\xF6r yo\u011Funlu\u011Fu santimetrekare ba\u015F\u0131na say\u0131l\u0131r, sa\xE7 telinin kal\u0131nl\u0131\u011F\u0131 \xF6l\xE7\xFCl\xFCr, sa\xE7 ile ten aras\u0131ndaki renk kontrast\u0131 de\u011Ferlendirilir ve sa\xE7l\u0131 derinin esnekli\u011Fi kontrol edilir. \u0130nce telli ve a\xE7\u0131k tenli birinde ayn\u0131 greft say\u0131s\u0131 daha seyrek g\xF6r\xFCn\xFCr; kal\u0131n telli ve sa\xE7\u0131 tenine yak\u0131n renkte olan birinde daha dolgun. Bu y\xFCzden ayn\u0131 Norwood evresindeki iki ki\u015Fi ayn\u0131 plan\u0131 almak zorunda de\u011Fildir.","\xD6n de\u011Ferlendirme i\xE7in istedi\u011Fimiz \u015Fey karma\u015F\u0131k de\u011Fil: g\xFCn \u0131\u015F\u0131\u011F\u0131nda, sa\xE7 kuruyken \xE7ekilmi\u015F \xF6nden, tepeden, iki profilden ve enseden birer kare. Ense foto\u011Fraf\u0131 \xF6zellikle \xF6nemlidir, \xE7\xFCnk\xFC don\xF6r kapasitesi hakk\u0131ndaki ilk fikri o verir. Kareler ula\u015Ft\u0131ktan sonra size bir greft aral\u0131\u011F\u0131, uygun g\xF6r\xFClen teknik ve tahmini operasyon s\xFCresi yaz\u0131l\u0131 olarak iletilir. Bu yaz\u0131 bir \xF6n de\u011Ferlendirmedir; kesinle\u015Fmesi i\xE7in y\xFCz y\xFCze muayene gerekir ve muayenede say\u0131 de\u011Fi\u015Febilir.","\u0130nternette s\u0131k g\xF6r\xFClen sabit paketleri de konu\u015Fal\u0131m: iki bin greft, \xFC\xE7 bin greft, d\xF6rt bin greft. Bu paketler bir \xF6l\xE7\xFCm de\u011Fil, bir fiyatland\u0131rma kolayl\u0131\u011F\u0131d\u0131r. Alan\u0131n\u0131z iki bin d\xF6rt y\xFCz greft gerektiriyorsa iki binlik paket eksik kal\u0131r, \xFC\xE7 binlik paket ise gere\u011Finden fazla k\xF6k almak anlam\u0131na gelir \u2014 \xFCstelik \xF6m\xFCr boyu kapasitenizden. Say\u0131 \xF6nce \xF6l\xE7\xFCl\xFCr, plan sonra kurulur; tersi \xE7al\u0131\u015Fmaz.","Son olarak, ameliyat g\xFCn\xFCnde say\u0131n\u0131n de\u011Fi\u015Febilece\u011Fini bilin. Muayenede planlanan greft aral\u0131\u011F\u0131 bir \xFCst s\u0131n\u0131r de\u011Fil bir hedeftir; don\xF6r alandan \xE7\u0131kar\u0131lan k\xF6kler beklenenden az ya da \xE7ok tel i\xE7erebilir, sa\xE7l\u0131 derinin esnekli\u011Fi ekim s\u0131ras\u0131nda farkl\u0131 davranabilir. B\xF6yle bir durumda karar hekimindir ve gerek\xE7esi size o g\xFCn anlat\u0131l\u0131r. Planlanandan az greft ekilmesi bir eksik de\u011Fil, don\xF6r\xFC korumaya y\xF6nelik bir tercih olabilir."]},{slug:"norwood",kat:"Temel bilgi",tarih:"2026-07-14",bas:"Norwood skalas\u0131 nedir?",ozet:"Erkek tipi sa\xE7 d\xF6k\xFClmesini yedi evreye ay\u0131ran \xF6l\xE7ek. Planlaman\u0131n ortak dili budur.",govde:["Norwood skalas\u0131, erkek tipi sa\xE7 d\xF6k\xFClmesini yedi evreye ay\u0131ran bir tan\u0131m \xF6l\xE7e\u011Fidir. Kliniklerin ortak dili olmas\u0131n\u0131n sebebi pratiktir: evre s\xF6ylendi\u011Finde iki hekim ayn\u0131 tabloyu zihninde canland\u0131r\u0131r, hasta da kendi durumunu bir yere oturtabilir. \xD6l\xE7ek bir te\u015Fhis de\u011Fildir ve tek ba\u015F\u0131na tedavi karar\u0131 vermez; yaln\u0131zca d\xF6k\xFClmenin nereye geldi\u011Fini tarif eder. Planlama bu tarifin \xFCzerine kurulur, ondan ibaret de\u011Fildir.","Birinci evre, ergenlik sonras\u0131 sa\xE7 \xE7izgisinin normal kabul edilen h\xE2lidir; hen\xFCz d\xF6k\xFClmeden s\xF6z edilmez. \u0130kinci evrede \u015Fakak k\xF6\u015Feleri hafif\xE7e geri \xE7ekilir ve sa\xE7 \xE7izgisi d\xFCz olmaktan \xE7\u0131k\u0131p hafif bir kavis al\u0131r. Bu evre \xE7o\u011Fu erkekte otuzlu ya\u015Flardan \xF6nce g\xF6r\xFCl\xFCr ve kendi ba\u015F\u0131na ilerleyici bir s\xFCrecin i\u015Fareti olmayabilir. Bu a\u015Famada yap\u0131lacak en do\u011Fru \u015Fey, d\xF6k\xFClmenin h\u0131z\u0131n\u0131 birka\xE7 y\u0131l boyunca foto\u011Frafla izlemektir.","\xDC\xE7\xFCnc\xFC evrede \u015Fakak k\xF6\u015Felerindeki geri \xE7ekilme belirginle\u015Fir ve sa\xE7 \xE7izgisi harf bi\xE7imini almaya ba\u015Flar. Bu evrenin bir alt tipi vard\u0131r: tepe b\xF6lgesinin \xF6n \xE7izgiden ba\u011F\u0131ms\u0131z olarak a\xE7\u0131ld\u0131\u011F\u0131 durum. Alt tip \xF6nemlidir, \xE7\xFCnk\xFC \xF6n \xE7izgi ile tepe iki ayr\u0131 sorun gibi g\xF6r\xFCn\xFCr ama tek bir don\xF6r b\xFCt\xE7esinden kar\u015F\u0131lan\u0131r. \xDC\xE7\xFCnc\xFC evre, sa\xE7 ekimi d\xFC\u015F\xFCnenlerin klini\u011Fe en s\u0131k ba\u015Fvurdu\u011Fu evredir.","D\xF6rd\xFCnc\xFC evrede tepe b\xF6lgesi de g\xF6zle g\xF6r\xFCl\xFCr bi\xE7imde a\xE7\u0131l\u0131r ve \xF6n b\xF6lge ile tepe aras\u0131nda bir sa\xE7 band\u0131 kal\u0131r. Bu band ilerleyen evrelerde incelir. Be\u015Finci evrede band belirgin bi\xE7imde seyrelir; alt\u0131nc\u0131 evrede b\xFCy\xFCk \xF6l\xE7\xFCde kaybolur ve iki a\xE7\u0131kl\u0131k birle\u015Fir. Yedinci evrede yaln\u0131z enseden kulak \xFCstlerine uzanan at nal\u0131 bi\xE7imindeki diren\xE7li ku\u015Fak kal\u0131r. Bu ku\u015Fak, sa\xE7 ekiminin don\xF6r alan\u0131d\u0131r.","Evrelerin kabaca kar\u015F\u0131l\u0131k geldi\u011Fi greft aral\u0131klar\u0131 vard\u0131r. Sitedeki hesapta santimetrekareye otuz greft hedeflendi\u011Finde ikinci evre dokuz y\xFCz elli ile bin y\xFCz greft, \xFC\xE7\xFCnc\xFC evre iki bin alt\u0131 y\xFCz ile \xFC\xE7 bin y\xFCz, d\xF6rd\xFCnc\xFC evre \xFC\xE7 bin sekiz y\xFCz ile d\xF6rt bin be\u015F y\xFCz, be\u015Finci evre be\u015F bin alt\u0131 y\xFCz elli ile alt\u0131 bin alt\u0131 y\xFCz elli, alt\u0131nc\u0131 evre ise alt\u0131 bin sekiz y\xFCz ile sekiz bin aras\u0131nda bir plan \xE7\u0131kar\u0131r. Bu aral\u0131klar ba\u015Flang\u0131\xE7 noktas\u0131d\u0131r, sonu\xE7 de\u011Fil.","Be\u015Finci evreden sonra tabloya ikinci bir soru girer: don\xF6r alan yetiyor mu? \xD6m\xFCr boyu g\xFCvenle al\u0131nabilecek greft i\xE7in planlamada alt\u0131 bin taban kabul edilir. Alt\u0131nc\u0131 ve yedinci evrede hesaplanan ihtiya\xE7 bu taban\u0131n \xFCzerine \xE7\u0131kabilir. Bu bir veri hatas\u0131 de\u011Fildir, ger\xE7e\u011Fin kendisidir; b\xF6yle durumlarda hedef b\xFCt\xFCn alan\u0131 kapatmak olmaktan \xE7\u0131kar, en g\xF6r\xFCn\xFCr b\xF6lgeye tatmin edici bir \xF6rt\xFC kurmak olur.","Evre tek ba\u015F\u0131na yeterli bir \xF6l\xE7\xFC de\u011Fildir. Ayn\u0131 evredeki iki ki\u015Fide don\xF6r yo\u011Funlu\u011Fu farkl\u0131ysa planlar da farkl\u0131 olur. Sa\xE7 telinin kal\u0131nl\u0131\u011F\u0131, sa\xE7 ile ten aras\u0131ndaki renk kontrast\u0131, sa\xE7l\u0131 derinin esnekli\u011Fi ve sa\xE7\u0131n dalgal\u0131 olup olmamas\u0131 ayn\u0131 greft say\u0131s\u0131n\u0131n ne kadar dolgun g\xF6r\xFCnece\u011Fini de\u011Fi\u015Ftirir. Dalgal\u0131 sa\xE7 ayn\u0131 greftle daha fazla hacim verir; ince ve d\xFCz sa\xE7 daha az.","Ya\u015F ve aile \xF6yk\xFCs\xFC de karara girer. Yirmili ya\u015Flar\u0131n ba\u015F\u0131nda h\u0131zl\u0131 ilerleyen bir d\xF6k\xFClmede, bug\xFCnk\xFC a\xE7\u0131kl\u0131\u011F\u0131 kapatmak kadar \xF6nemli olan \u015Fey on y\u0131l sonras\u0131n\u0131 hesaba katmakt\u0131r. Ekilen k\xF6kler diren\xE7lidir ama aralar\u0131ndaki do\u011Fal sa\xE7 d\xF6k\xFClmeye devam edebilir. Bu y\xFCzden \xF6n \xE7izgi tasar\u0131m\u0131 ya\u015Fa g\xF6re yap\u0131l\u0131r: yirmi ya\u015F\u0131ndaki bir y\xFCz \xE7izgisini kal\u0131c\u0131 olarak yerle\u015Ftirmek, k\u0131rk ya\u015F\u0131nda do\u011Fal g\xF6r\xFCnmeyen bir sonu\xE7 b\u0131rakabilir.","Evre nas\u0131l belirlenir? Muayenede ya da g\xF6nderdi\u011Finiz foto\u011Fraflarla. Bunun i\xE7in g\xFCn \u0131\u015F\u0131\u011F\u0131nda, sa\xE7 kuruyken \xE7ekilmi\u015F be\u015F kare yeterlidir: \xF6nden, tepeden, iki profilden ve enseden. I\u015F\u0131k \xF6nemlidir; tepe lambas\u0131 alt\u0131nda \xE7ekilen kareler a\xE7\u0131kl\u0131\u011F\u0131 oldu\u011Fundan b\xFCy\xFCk g\xF6sterir. Ayn\u0131 kareleri alt\u0131 ay arayla tekrarlamak, d\xF6k\xFClmenin h\u0131z\u0131n\u0131 g\xF6steren en basit ve en ucuz \xF6l\xE7\xFCm y\xF6ntemidir.","Son olarak: evre bir kader de\u011Fildir. Skala ilerlemenin ola\u011Fan seyrini tarif eder, herkesin o seyri izleyece\u011Fini s\xF6ylemez. Baz\u0131 ki\u015Filerde d\xF6k\xFClme \xFC\xE7\xFCnc\xFC evrede y\u0131llarca durur. Bu y\xFCzden hem t\u0131bbi takip hem de foto\u011Frafla izlem, operasyon karar\u0131n\u0131n par\xE7as\u0131d\u0131r. Klini\u011Fe geldi\u011Finizde ilk konu\u015Ftu\u011Fumuz \u015Fey hangi tekni\u011Fin uygulanaca\u011F\u0131 de\u011Fil, d\xF6k\xFClmenin hangi h\u0131zda ilerledi\u011Fidir.","Skalan\u0131n kapsamad\u0131\u011F\u0131 durumlar da var. Norwood yaln\u0131z erkek tipi, yani belirli bir \xF6r\xFCnt\xFCy\xFC izleyen d\xF6k\xFClmeyi tarif eder. Sa\xE7\u0131n tepe ve yanlarda birlikte ve e\u015Fit bi\xE7imde seyreldi\u011Fi yayg\u0131n tipte d\xF6k\xFClme bu \xF6l\xE7e\u011Fe oturmaz. Tiroid sorunlar\u0131, demir eksikli\u011Fi, baz\u0131 ila\xE7lar ve stres kaynakl\u0131 d\xF6k\xFClmeler de ba\u015Fka tablolar \xFCretir. Bu y\xFCzden ekim karar\u0131 \xF6ncesinde kan tetkiki istenmesi rutin bir ad\u0131md\u0131r, gereksiz bir formalite de\u011Fil.","Kad\u0131nlarda d\xF6k\xFClme farkl\u0131 bir \xF6l\xE7ekle de\u011Ferlendirilir; Norwood bu tabloyu tarif etmez. Kad\u0131n tipi d\xF6k\xFClmede sa\xE7 \xE7izgisi genellikle korunur ve seyrelme tepe b\xF6lgesinde, ortadan ayr\u0131lan \xE7izginin iki yan\u0131nda g\xF6r\xFCl\xFCr. Planlama mant\u0131\u011F\u0131 benzerdir \u2014 alan, yo\u011Funluk ve don\xF6r kapasitesi yine belirleyicidir \u2014 ama evre tan\u0131m\u0131 ve beklenen seyir ba\u015Fkad\u0131r. Bu ayr\u0131m\u0131 bilmek, internetten okunan bir evre numaras\u0131n\u0131 kendine yak\u0131\u015Ft\u0131rman\u0131n neden yan\u0131lt\u0131c\u0131 oldu\u011Funu da a\xE7\u0131klar.","Klini\u011Fe geldi\u011Finizde evrenin nas\u0131l kullan\u0131ld\u0131\u011F\u0131n\u0131 da g\xF6r\xFCrs\xFCn\xFCz: numara bir etiket olarak de\u011Fil, bir ba\u015Flang\u0131\xE7 \xF6l\xE7\xFCs\xFC olarak konu\u015Fulur. Konu\u015Fman\u0131n as\u0131l k\u0131sm\u0131 sizin ne bekledi\u011Finizle ilgilidir. Yirmi ya\u015F\u0131ndaki bir sa\xE7 \xE7izgisi mi, ya\u015F\u0131n\u0131za uygun olgun bir \xE7izgi mi istiyorsunuz; tepe b\xF6lgesi sizin i\xE7in ne kadar \xF6nemli. Bu tercihlerin kar\u015F\u0131l\u0131\u011F\u0131 greft say\u0131s\u0131d\u0131r ve o say\u0131n\u0131n kar\u015F\u0131l\u0131\u011F\u0131 da don\xF6r alandan al\u0131nacak payd\u0131r."]},{slug:"trassiz",kat:"Teknik",tarih:"2026-06-30",bas:"Tra\u015Fs\u0131z ekim kimler i\xE7in uygun?",ozet:"Sa\xE7 kesilmeden yap\u0131l\u0131r, ertesi g\xFCn sosyal hayata d\xF6n\xFCl\xFCr. Ama greft say\u0131s\u0131nda s\u0131n\u0131r vard\u0131r.",govde:["Tra\u015Fs\u0131z ekimde don\xF6r b\xF6lgeden al\u0131nan k\xF6kler, sa\xE7 kesilmeden toplan\u0131r. Klasik y\xF6ntemde ense b\xF6lgesi bir numaraya vurulur ve k\xF6kler a\xE7\u0131kta \xE7al\u0131\u015F\u0131larak al\u0131n\u0131r; tra\u015Fs\u0131z y\xF6ntemde ise sa\xE7 uzun b\u0131rak\u0131l\u0131r, k\xFC\xE7\xFCk b\xF6l\xFCmler halinde ayr\u0131l\u0131r ve k\xF6kler mevcut sa\xE7\u0131n aras\u0131ndan tek tek \xE7\u0131kar\u0131l\u0131r. Al\u0131nan greft ayn\u0131 grefttir, de\u011Fi\u015Fen \u015Fey ona nas\u0131l ula\u015F\u0131ld\u0131\u011F\u0131d\u0131r. Ekim taraf\u0131nda da fark yoktur: kanallar a\xE7\u0131l\u0131r ya da implanter kalem kullan\u0131l\u0131r.","En b\xFCy\xFCk avantaj\u0131 g\xF6r\xFCn\xFCrl\xFCkt\xFCr. Ense tra\u015Flanmad\u0131\u011F\u0131 i\xE7in operasyondan sonra don\xF6r b\xF6lge uzun sa\xE7\u0131n alt\u0131nda kal\u0131r. Ekim alan\u0131ndaki kabuklar ilk hafta boyunca g\xF6r\xFCn\xFCr, ancak ense b\xF6lgesindeki i\u015Flem izleri d\u0131\u015Far\u0131dan fark edilmez. Bu, i\u015Fini uzaktan y\xFCr\xFCtemeyen ya da izin alma imk\xE2n\u0131 s\u0131n\u0131rl\u0131 olan ki\u015Filer i\xE7in pratik bir fark yarat\u0131r: operasyonun ertesi g\xFCn\xFC sosyal hayata d\xF6nmek \xE7o\u011Fu durumda m\xFCmk\xFCnd\xFCr.","S\u0131n\u0131r greft say\u0131s\u0131ndad\u0131r. Uzun sa\xE7 aras\u0131ndan \xE7al\u0131\u015Fmak, ayn\u0131 s\xFCrede daha az k\xF6k toplanmas\u0131 demektir; her greft i\xE7in sa\xE7\u0131n ayr\u0131lmas\u0131, k\xF6k\xFCn bulunmas\u0131 ve etraftaki tellere zarar verilmemesi gerekir. Bu y\xFCzden tra\u015Fs\u0131z y\xF6ntemde tek seansta g\xFCvenle al\u0131nabilecek greft say\u0131s\u0131 klasik y\xF6nteme g\xF6re daha d\xFC\u015F\xFCkt\xFCr. Sitedeki kar\u015F\u0131la\u015Ft\u0131rmada bu y\xF6ntemin tipik band\u0131 bin be\u015F y\xFCz ile iki bin be\u015F y\xFCz greft aras\u0131nda verilir.","S\xFCre de farkl\u0131d\u0131r. Greft ba\u015F\u0131na harcanan zaman daha uzun oldu\u011Fu i\xE7in toplam operasyon s\xFCresi, ayn\u0131 greft say\u0131s\u0131nda di\u011Fer y\xF6ntemlerden fazla \xE7\u0131kar. Bin be\u015F y\xFCz greftlik bir tra\u015Fs\u0131z plan yakla\u015F\u0131k yedi saat, iki bin be\u015F y\xFCz greftlik bir plan yakla\u015F\u0131k dokuz saat s\xFCrer. Bu s\xFCre haz\u0131rl\u0131\u011F\u0131, lokal anesteziyi, \xE7izimi ve araya giren molalar\u0131 i\xE7erir; yani klini\u011Fe geldi\u011Finiz saat ile \xE7\u0131kt\u0131\u011F\u0131n\u0131z saat aras\u0131ndaki farkt\u0131r.","Kimler i\xE7in uygundur? \xD6n sa\xE7 \xE7izgisi gerilemesi belirgin ama alan g\xF6rece k\xFC\xE7\xFCk olan ki\u015Filer bu y\xF6ntemin en do\u011Fal adaylar\u0131d\u0131r. \u0130kinci ve \xFC\xE7\xFCnc\xFC evredeki bir a\xE7\u0131kl\u0131k, tra\u015Fs\u0131z y\xF6ntemin greft band\u0131na rahat\xE7a s\u0131\u011Far. Sa\xE7\u0131n\u0131 uzun kullanan, mesle\u011Fi gere\u011Fi k\u0131sa sa\xE7la g\xF6r\xFCnmek istemeyen ya da izin alamad\u0131\u011F\u0131 i\xE7in hemen i\u015Fine d\xF6nmesi gereken ki\u015Filer i\xE7in de mant\u0131kl\u0131 bir se\xE7imdir.","Kimler i\xE7in uygun de\u011Fildir? Geni\u015F bir alan kapat\u0131lmas\u0131 gerekiyorsa, yani d\xF6rd\xFCnc\xFC evre ve sonras\u0131nda, tek seansta gereken greft say\u0131s\u0131 bu y\xF6ntemin band\u0131n\u0131 a\u015Far. B\xF6yle durumlarda ya iki seans planlan\u0131r ya da k\u0131smi tra\u015F \xF6nerilir. Mevcut sa\xE7\u0131 zaten \xE7ok k\u0131sa olan biri i\xE7in tra\u015Fs\u0131z \xE7al\u0131\u015Fman\u0131n bir avantaj\u0131 kalmaz; don\xF6r b\xF6lgedeki sa\xE7\u0131n en az iki \xFC\xE7 santimetre olmas\u0131 gerekir ki k\xF6kler sa\xE7\u0131n alt\u0131nda gizlenebilsin.","K\u0131smi tra\u015F \xE7o\u011Fu zaman iyi bir orta yoldur. Bu yakla\u015F\u0131mda don\xF6r b\xF6lgenin yaln\u0131zca bir \u015Feridi tra\u015Flan\u0131r, \xFCstteki uzun sa\xE7 indirildi\u011Finde o \u015Ferit tamamen kapan\u0131r. B\xF6ylece klasik y\xF6ntemin greft verimine yakla\u015F\u0131l\u0131r ve g\xF6r\xFCn\xFCrl\xFCk sorunu da b\xFCy\xFCk \xF6l\xE7\xFCde \xE7\xF6z\xFCl\xFCr. Hangi geni\u015Flikte bir \u015Feride ihtiya\xE7 oldu\u011Fu, planlanan greft say\u0131s\u0131na ve don\xF6r yo\u011Funlu\u011Funa g\xF6re muayenede belirlenir.","Operasyon sonras\u0131 bak\u0131mda birka\xE7 fark vard\u0131r. Uzun sa\xE7la y\u0131kama daha dikkat ister: k\xF6p\xFCk ekim alan\u0131na do\u011Frudan bast\u0131r\u0131lmadan uygulan\u0131r, durulama \u0131l\u0131k ve d\xFC\u015F\xFCk bas\u0131n\xE7l\u0131 su ile yap\u0131l\u0131r, sa\xE7 havluyla ovulmaz. Kabuklar\u0131n d\xF6k\xFClmesi uzun sa\xE7 aras\u0131nda biraz daha uzun s\xFCrebilir. \u0130lk y\u0131kama klinikte yap\u0131l\u0131r ve nas\u0131l devam edilece\u011Fi ad\u0131m ad\u0131m g\xF6sterilir; evde tekrarlayaca\u011F\u0131n\u0131z hareketleri orada birlikte prova ederiz.","Kabul edilmesi gereken bir ger\xE7ek \u015Fu: tra\u015Fs\u0131z ekim bir teknik \xFCst\xFCnl\xFCk de\u011Fil, bir tercih meselesidir. Ekilen k\xF6k ayn\u0131 k\xF6kt\xFCr ve tutma davran\u0131\u015F\u0131 y\xF6ntemin ad\u0131na g\xF6re de\u011Fi\u015Fmez. Tra\u015Fs\u0131z y\xF6ntemin sundu\u011Fu \u015Fey, ayn\u0131 i\u015Fi g\xF6r\xFCn\xFCrl\xFCk bedeli \xF6demeden yapt\u0131rma imk\xE2n\u0131d\u0131r. Bunun kar\u015F\u0131l\u0131\u011F\u0131nda tek seansta daha az greft ve daha uzun bir operasyon g\xFCn\xFC kabul edilir. Bu takas herkes i\xE7in mant\u0131kl\u0131 olmayabilir.","Karar muayenede birlikte verilir. Bak\u0131lan \u015Feyler bellidir: don\xF6r yo\u011Funlu\u011Fu, mevcut sa\xE7 uzunlu\u011Fu, kapat\u0131lacak alan\u0131n b\xFCy\xFCkl\xFC\u011F\xFC ve sizin g\xF6r\xFCn\xFCrl\xFCk konusundaki \xF6nceli\u011Finiz. Bu d\xF6rd\xFC ayn\u0131 y\xF6ne i\u015Faret ediyorsa tra\u015Fs\u0131z y\xF6ntem uygundur. \u0130\u015Faret etmiyorsa, size uymayan bir y\xF6ntemi \xF6nermek yerine neden uymad\u0131\u011F\u0131n\u0131 anlatmay\u0131 tercih ediyoruz; sonu\xE7ta de\u011Ferlendirilecek olan y\xF6ntemin ad\u0131 de\u011Fil, bir y\u0131l sonraki g\xF6r\xFCnt\xFCd\xFCr.","Operasyon g\xFCn\xFCn\xFCn prati\u011Fi de karara girer. Yedi ila dokuz saatlik bir g\xFCn, aralarda k\u0131sa molalar ve bir \xF6\u011F\xFCn yemekle ge\xE7er. Tra\u015Fs\u0131z \xE7al\u0131\u015Fmada don\xF6r b\xF6lge k\xFC\xE7\xFCk b\xF6l\xFCmler halinde a\xE7\u0131ld\u0131\u011F\u0131 i\xE7in pozisyon de\u011Fi\u015Fimi biraz daha s\u0131kt\u0131r. Uzaktan gelen bir hasta i\xE7in bu, ayn\u0131 g\xFCn u\xE7u\u015F planlaman\u0131n zor oldu\u011Fu anlam\u0131na gelir; operasyon g\xFCn\xFCn\xFCn ertesi sabah\u0131na ilk y\u0131kama randevusu konur ve d\xF6n\xFC\u015F genellikle o g\xFCnden sonra planlan\u0131r.","Tra\u015Fs\u0131z y\xF6ntemin de\u011Fi\u015Ftirmedi\u011Fi \u015Feyleri de netle\u015Ftirelim. Don\xF6r alan\u0131n \xF6m\xFCr boyu kapasitesi de\u011Fi\u015Fmez; planlamada alt\u0131 bin greft taban\u0131 bu y\xF6ntemde de ge\xE7erlidir. \u015Eok d\xF6k\xFClme yine ikinci ile d\xF6rd\xFCnc\xFC hafta aras\u0131nda ya\u015Fan\u0131r. Nihai de\u011Ferlendirme yine on ikinci ile on sekizinci ay aras\u0131nda yap\u0131l\u0131r. Y\xF6ntem yaln\u0131zca don\xF6r alandaki k\xF6k\xFCn nas\u0131l topland\u0131\u011F\u0131n\u0131 de\u011Fi\u015Ftirir; k\xF6k\xFCn davran\u0131\u015F\u0131n\u0131, iyile\u015Fme takvimini ve plan\u0131n s\u0131n\u0131rlar\u0131n\u0131 de\u011Fi\u015Ftirmez.","Fiyatland\u0131rma taraf\u0131nda bir not: tra\u015Fs\u0131z y\xF6ntem ayn\u0131 greft say\u0131s\u0131nda daha uzun s\xFCrer ve daha fazla ekip zaman\u0131 ister. T\xFCrk\xE7e yay\u0131nda \xFCcret bilgisi mevzuat gere\u011Fi verilmez, ama s\xFCrenin ve eme\u011Fin farkl\u0131 oldu\u011Funu bilmek beklentiyi do\u011Fru kurman\u0131za yard\u0131mc\u0131 olur. G\xF6r\xFC\u015Fmede size verilen teklif, y\xF6ntemin ad\u0131na de\u011Fil planlanan greft say\u0131s\u0131na ve o plan i\xE7in gereken zamana dayan\u0131r."]},{slug:"ilk-30-gun",kat:"Sonras\u0131",tarih:"2026-06-12",bas:"Ekimden sonra ilk 30 g\xFCn",ozet:"Kabuklanma, \u015Fok d\xF6k\xFClme ve bekleme. \u0130lk ay sonucu de\u011Fil, iyile\u015Fmeyi anlat\u0131r.",govde:["\u0130lk ay\u0131 do\u011Fru \xE7er\xE7eveye oturtmak, sonraki bir y\u0131l\u0131 rahat ge\xE7irmenin en kolay yoludur: bu ay size sonucu de\u011Fil, iyile\u015Fmeyi g\xF6sterir. Otuzuncu g\xFCnde aynada g\xF6rd\xFC\u011F\xFCn\xFCz \u015Fey, on ikinci ayda g\xF6rece\u011Finizle ilgili \xE7ok az fikir verir. Buna ra\u011Fmen ilk ay \xF6nemlidir, \xE7\xFCnk\xFC k\xF6klerin yerine oturdu\u011Fu ve enfeksiyon riskinin en y\xFCksek oldu\u011Fu d\xF6nem buras\u0131d\u0131r. Kurallar basit ve say\u0131l\u0131d\u0131r.","\u0130lk \xFC\xE7 g\xFCn \xF6dem ve hassasiyet beklenir. \u015Ei\u015Flik genellikle al\u0131ndan ba\u015Flar ve yer \xE7ekimiyle g\xF6z \xE7evresine iner; ikinci ve \xFC\xE7\xFCnc\xFC g\xFCn en belirgin h\xE2lini al\u0131r, sonra kendili\u011Finden geriler. Bu d\xF6nemde ba\u015F\u0131n y\xFCksekte tutulmas\u0131 i\u015Fe yarar: s\u0131rt\xFCst\xFC ve ba\u015F yast\u0131kla desteklenmi\u015F \u015Fekilde uyumak, \xF6demin da\u011F\u0131lmas\u0131n\u0131 kolayla\u015Ft\u0131r\u0131r. Ekim alan\u0131na hi\xE7bir \u015Feyin de\u011Fmemesi gerekir; yast\u0131kla temas etmemesi i\xE7in bir seyahat yast\u0131\u011F\u0131 \xE7o\u011Fu zaman yeterlidir.","\u0130lk y\u0131kama klinikte, operasyonun ertesi g\xFCn\xFC yap\u0131l\u0131r. Bunu personelin yapmas\u0131 bir formalite de\u011Fil: y\u0131kaman\u0131n bas\u0131nc\u0131, k\xF6p\xFC\u011F\xFCn ne kadar bekletilece\u011Fi ve durulaman\u0131n nas\u0131l olaca\u011F\u0131 g\xF6sterilerek \xF6\u011Fretilir. Ayn\u0131 g\xFCn eve g\xF6nderilen \xFCr\xFCnlerle g\xFCnl\xFCk y\u0131kamaya ba\u015Flan\u0131r. Y\u0131kama korkulacak bir \u015Fey de\u011Fildir; aksine kabuklar\u0131n zaman\u0131nda ve travmas\u0131z d\xF6k\xFClmesini sa\u011Flayan \u015Fey d\xFCzenli y\u0131kamad\u0131r.","D\xF6rd\xFCnc\xFC g\xFCnden itibaren kabuklar olu\u015Fur ve yakla\u015F\u0131k onuncu g\xFCne kadar d\xF6k\xFCl\xFCr. Bu kabuklar kan\u0131n ve doku s\u0131v\u0131s\u0131n\u0131n kurumas\u0131yla olu\u015Fan ince katmanlard\u0131r. Elle kopar\u0131lmamalar\u0131 gerekir; kopar\u0131lan kabuk yan\u0131ndaki grefti de yerinden oynatabilir. D\xFCzenli y\u0131kamayla kabuklar kendili\u011Finden yumu\u015Far ve d\xF6k\xFCl\xFCr. Onuncu g\xFCn\xFCn sonunda ekim alan\u0131 \xE7o\u011Fu ki\u015Fide belirgin bi\xE7imde temizlenmi\u015F olur.","Don\xF6r alan genellikle ekim alan\u0131ndan daha h\u0131zl\u0131 iyile\u015Fir. \u0130lk g\xFCnlerde hafif bir gerginlik ve kar\u0131ncalanma ola\u011Fand\u0131r; k\u0131zar\u0131kl\u0131k bir ile iki hafta i\xE7inde geriler. Tra\u015Fl\u0131 yap\u0131lan operasyonlarda ense b\xF6lgesindeki noktalar sa\xE7 uzad\u0131k\xE7a kaybolur. Bu b\xF6lgede ka\u015F\u0131nt\u0131 s\u0131k g\xF6r\xFCl\xFCr ve iyile\u015Fmenin normal bir par\xE7as\u0131d\u0131r; ka\u015F\u0131mak yerine nemlendirmek ve hekimin \xF6nerdi\u011Fi \xFCr\xFCnleri kullanmak do\u011Fru olan\u0131d\u0131r.","\u0130kinci ile d\xF6rd\xFCnc\xFC hafta aras\u0131nda ekilen sa\xE7lar\u0131n b\xFCy\xFCk b\xF6l\xFCm\xFC d\xF6k\xFCl\xFCr. Buna \u015Fok d\xF6k\xFClme denir ve normaldir. D\xF6k\xFClen \u015Fey sa\xE7 telidir, k\xF6k de\u011Fil; k\xF6k yerinde kal\u0131r ve yeni bir d\xF6ng\xFCye girmek \xFCzere dinlenmeye \xE7ekilir. Bu d\xF6nem, s\xFCrecin psikolojik olarak en zor k\u0131sm\u0131d\u0131r: ilk hafta iyi g\xF6r\xFCnen alan \xFC\xE7\xFCnc\xFC hafta sonunda ba\u015Flang\u0131\xE7taki h\xE2line d\xF6ner. Bu bir ba\u015Far\u0131s\u0131zl\u0131k i\u015Fareti de\u011Fildir, beklenen bir a\u015Famad\u0131r.","\u0130lk ay boyunca ka\xE7\u0131n\u0131lmas\u0131 gereken \u015Feyler k\u0131sa bir listedir. Do\u011Frudan g\xFCne\u015F, ilk iki hafta tamamen; sonras\u0131nda \u015Fapka yerine g\xF6lge tercih edilir. Terletici spor, sauna, hamam ve havuz ilk ay boyunca yoktur; deniz de \xF6yle. S\u0131k\u0131 \u015Fapka ve kask ekim alan\u0131na bask\u0131 yapt\u0131\u011F\u0131 i\xE7in ilk on g\xFCn kullan\u0131lmaz. Sigara ve alkol\xFCn dola\u015F\u0131m\u0131 etkiledi\u011Fi bilinir; ilk haftada azalt\u0131lmas\u0131, m\xFCmk\xFCnse b\u0131rak\u0131lmas\u0131 \xF6nerilir.","\u0130\u015Fe d\xF6n\xFC\u015F, i\u015Fin niteli\u011Fine ba\u011Fl\u0131d\u0131r. Masa ba\u015F\u0131 bir i\u015Fte \xFC\xE7\xFCnc\xFC g\xFCnden itibaren \xE7al\u0131\u015Fmak \xE7o\u011Fu ki\u015Fi i\xE7in m\xFCmk\xFCnd\xFCr; kabuklanma s\xFCrerken g\xF6r\xFCn\xFCrl\xFCk tek engeldir. Fiziksel i\u015F yapanlar\u0131n, terleme ve toz nedeniyle ilk on g\xFCn\xFC beklemesi daha do\u011Frudur. Hafif y\xFCr\xFCy\xFC\u015Fe ilk g\xFCnden ba\u015Flanabilir. A\u011F\u0131rl\u0131k \xE7al\u0131\u015Fmas\u0131na ve ko\u015Fuya d\xF6rd\xFCnc\xFC haftadan sonra, kademeli olarak d\xF6n\xFCl\xFCr.","Otuzuncu g\xFCnden sonra takvim yava\u015Flar. \xDC\xE7\xFCnc\xFC ayda ilk yeni \xE7\u0131k\u0131\u015Flar g\xF6r\xFClmeye ba\u015Flar; bu teller ba\u015Flang\u0131\xE7ta ince ve renksizdir, zamanla kal\u0131nla\u015F\u0131r. Alt\u0131nc\u0131 ayda g\xF6zle g\xF6r\xFCl\xFCr bir yo\u011Funluk olu\u015Fur ve \xE7evredeki insanlar fark\u0131 fark etmeye ba\u015Flar. Dokuzuncu ayda sa\xE7 uzunluk ve doku olarak \xE7evresine benzer. Nihai de\u011Ferlendirme on ikinci ile on sekizinci ay aras\u0131nda yap\u0131l\u0131r; tepe b\xF6lgesi genellikle en ge\xE7 sonu\xE7 veren yerdir.","Takip program\u0131 bu takvime g\xF6re kurulur. Klinik olarak birinci hafta, birinci ay, \xFC\xE7\xFCnc\xFC ay, alt\u0131nc\u0131 ay ve on ikinci ayda kontrol yap\u0131l\u0131r. Kontroller ayn\u0131 a\xE7\u0131lardan \xE7ekilen foto\u011Fraflarla kay\u0131t alt\u0131na al\u0131n\u0131r; k\u0131yaslama ancak ayn\u0131 \u0131\u015F\u0131k ve ayn\u0131 a\xE7\u0131yla anlaml\u0131 olur. Arada bir sorunuz oldu\u011Funda kontrol g\xFCn\xFCn\xFC beklemeniz gerekmez. Yazd\u0131\u011F\u0131n\u0131zda yan\u0131t ayn\u0131 g\xFCn i\xE7inde d\xF6ner ve gerekiyorsa hekim sizi tekrar g\xF6rmek ister.","\u0130lk g\xFCnlerde uyku, beslenme ve ila\xE7 d\xFCzeni de sonucun par\xE7as\u0131d\u0131r. Hekimin yazd\u0131\u011F\u0131 a\u011Fr\u0131 kesici ve \xF6dem ilac\u0131 tarif edildi\u011Fi \u015Fekilde kullan\u0131l\u0131r; kendi ba\u015F\u0131n\u0131za kan suland\u0131r\u0131c\u0131 etkisi olan ila\xE7 eklemek do\u011Fru de\u011Fildir. Bol su i\xE7mek \xF6demin \xE7\xF6z\xFClmesine yard\u0131mc\u0131 olur. \u0130lk gece uykusu \xE7o\u011Fu ki\u015Fide b\xF6l\xFCn\xFCr, bu beklenen bir \u015Feydir. Yast\u0131\u011F\u0131n k\u0131l\u0131f\u0131n\u0131n temiz olmas\u0131 ve her g\xFCn de\u011Fi\u015Fmesi, basit ama i\u015Fe yarayan bir \xF6nlemdir.","Klini\u011Fi hangi durumlarda araman\u0131z gerekti\u011Fini de bilin. \xDC\xE7\xFCnc\xFC g\xFCnden sonra artan a\u011Fr\u0131, tek noktada toplanan k\u0131zar\u0131kl\u0131k ve \u0131s\u0131 art\u0131\u015F\u0131, ak\u0131nt\u0131, otuz sekiz dereceyi ge\xE7en ate\u015F ya da don\xF6r alanda beklenmedik bir kanama vakit kaybetmeden bildirilmelidir. Bunlar s\u0131k g\xF6r\xFClen durumlar de\u011Fildir, ama erken haber verildi\u011Finde kolay \xE7\xF6z\xFCl\xFCr. Kontrol g\xFCn\xFCn\xFC beklemeyin; yaz\u0131n, yan\u0131t ayn\u0131 g\xFCn i\xE7inde d\xF6ner.","Bu ay\u0131n kayd\u0131n\u0131 tutman\u0131z da i\u015Finize yarar. Operasyondan hemen sonra, yedinci g\xFCnde, otuzuncu g\xFCnde ve sonra her ay ayn\u0131 be\u015F a\xE7\u0131dan foto\u011Fraf \xE7ekin: \xF6nden, tepeden, iki profilden ve enseden. I\u015F\u0131k her seferinde ayn\u0131 olsun, tercihen g\xFCn \u0131\u015F\u0131\u011F\u0131. \u015Eok d\xF6k\xFClme haftalar\u0131nda bu kareler i\u015Fe yarar; \xFC\xE7\xFCnc\xFC ayda geriye bakt\u0131\u011F\u0131n\u0131zda neyin de\u011Fi\u015Fti\u011Fini haf\u0131zan\u0131za de\u011Fil kayda sorars\u0131n\u0131z."]},{slug:"dhi-safir",kat:"Teknik",tarih:"2026-05-26",bas:"DHI ile safir FUE aras\u0131ndaki fark",ozet:"\u0130kisi de FUE ailesindendir. Fark, k\xF6k\xFCn nas\u0131l yerle\u015Ftirildi\u011Finde.",govde:["\u0130ki y\xF6ntem de FUE ailesindendir ve ilk yar\u0131lar\u0131 birebir ayn\u0131d\u0131r. Fark, k\xF6k\xFCn sa\xE7l\u0131 deriye nas\u0131l yerle\u015Ftirildi\u011Findedir. Bu ayr\u0131m\u0131 bilmek i\u015Fe yarar, \xE7\xFCnk\xFC tan\u0131t\u0131m dilinde iki y\xF6ntem sanki bamba\u015Fka iki ameliyatm\u0131\u015F gibi anlat\u0131l\u0131r. De\u011Fildir. Ayn\u0131 greft, ayn\u0131 don\xF6r alandan, ayn\u0131 mikromotor yard\u0131m\u0131yla al\u0131n\u0131r; ayr\u0131m son ad\u0131mda ba\u015Flar ve o ad\u0131m\u0131n da kendi i\xE7inde avantajlar\u0131 ve maliyetleri vard\u0131r.","Ortak yar\u0131 \u015F\xF6yle i\u015Fler. Don\xF6r alan lokal anestezi ile uyu\u015Fturulur. K\xF6kler, \xE7ap\u0131 bir milimetrenin alt\u0131nda olan silindirik u\xE7larla tek tek \xE7\u0131kar\u0131l\u0131r. \xC7\u0131kar\u0131lan greftler b\xFCy\xFCte\xE7 alt\u0131nda ayr\u0131\u015Ft\u0131r\u0131l\u0131r, i\xE7erdikleri tel say\u0131s\u0131na g\xF6re gruplan\u0131r ve so\u011Fuk saklama sol\xFCsyonunda bekletilir. Bu gruplama \xF6nemlidir: tek telli greftler \xF6n sa\xE7 \xE7izgisine, \xE7ok telli olanlar arka planda hacim verilecek b\xF6lgelere ayr\u0131l\u0131r. Do\u011Fal g\xF6r\xFCn\xFCm\xFCn b\xFCy\xFCk k\u0131sm\u0131 bu ayr\u0131mdan gelir.","Safir FUE\u2019de yerle\u015Ftirmeden \xF6nce kanal a\xE7ma ad\u0131m\u0131 vard\u0131r. Ekim yap\u0131lacak alana, safir u\xE7lu b\u0131\xE7aklarla ince yar\u0131klar a\xE7\u0131l\u0131r. Bu yar\u0131klar\u0131n a\xE7\u0131s\u0131, y\xF6n\xFC ve derinli\u011Fi sa\xE7\u0131n nas\u0131l \xE7\u0131kaca\u011F\u0131n\u0131 belirler; \xF6n \xE7izgide a\xE7\u0131 y\xFCzeye \xE7ok yak\u0131n tutulur, tepe b\xF6lgesinde ise sa\xE7 d\xF6n\xFC\u015F y\xF6n\xFCne uygun bir yerle\u015Fim aran\u0131r. Kanallar a\xE7\u0131ld\u0131ktan sonra greftler bu yar\u0131klara pens yard\u0131m\u0131yla yerle\u015Ftirilir.","Safir ucun kendisi bir marka de\u011Fil, malzeme fark\u0131d\u0131r. \xC7elik u\xE7lara g\xF6re daha keskin ve daha p\xFCr\xFCzs\xFCz bir kesit b\u0131rak\u0131r. Pratikteki kar\u015F\u0131l\u0131\u011F\u0131, dokudaki travman\u0131n ve buna ba\u011Fl\u0131 kabuklanman\u0131n bir miktar azalmas\u0131d\u0131r. Bu, tek ba\u015F\u0131na sonucun kalitesini belirleyen bir etken de\u011Fildir; kanal\u0131n a\xE7\u0131s\u0131 ve s\u0131kl\u0131\u011F\u0131 \xE7ok daha belirleyicidir. U\xE7 malzemesini sonucun tamam\u0131 gibi sunan anlat\u0131lara temkinli yakla\u015Fmakta fayda var.","DHI\u2019de kanal a\xE7ma ve yerle\u015Ftirme tek ad\u0131mda yap\u0131l\u0131r. Choi ad\u0131 verilen implanter kalemin ucuna greft y\xFCklenir; kalem deriye bat\u0131r\u0131l\u0131r ve ayn\u0131 hareketle k\xF6k b\u0131rak\u0131l\u0131r. Ayr\u0131 bir kanal a\xE7ma a\u015Famas\u0131 olmad\u0131\u011F\u0131 i\xE7in k\xF6klerin v\xFCcut d\u0131\u015F\u0131nda ge\xE7irdi\u011Fi s\xFCre k\u0131sal\u0131r. Kalemin ucu greftin \xE7ap\u0131na g\xF6re se\xE7ilir, yani her greft kendi \xF6l\xE7\xFCs\xFCnde bir yuvaya yerle\u015Fir. Bu, kanamay\u0131 ve \xF6demi bir miktar azalt\u0131r.","DHI\u2019nin \xF6ne \xE7\u0131kt\u0131\u011F\u0131 yer, mevcut sa\xE7 aras\u0131na ekim yap\u0131lmas\u0131 gereken durumlard\u0131r. Seyrelmi\u015F ama tamamen a\xE7\u0131lmam\u0131\u015F bir b\xF6lgede b\u0131\xE7akla kanal a\xE7mak, aradaki sa\u011Fl\u0131kl\u0131 k\xF6klere zarar verme riski ta\u015F\u0131r. Kalem daha kontroll\xFC bir hareketle \xE7al\u0131\u015F\u0131r ve o riski azalt\u0131r. Ayn\u0131 sebeple y\xFCksek yo\u011Funluk hedeflenen k\xFC\xE7\xFCk alanlarda ve \xF6n sa\xE7 \xE7izgisinin ilk s\u0131ralar\u0131nda DHI tercih edilebilir.","Safir FUE\u2019nin \xF6ne \xE7\u0131kt\u0131\u011F\u0131 yer geni\u015F alanlard\u0131r. Kanallar\u0131n \xF6nce topluca a\xE7\u0131lmas\u0131, ekip \xE7al\u0131\u015Fmas\u0131n\u0131 h\u0131zland\u0131r\u0131r ve b\xFCy\xFCk bir alan\u0131n tek g\xFCnde bitirilmesini kolayla\u015Ft\u0131r\u0131r. Say\u0131larla s\xF6ylemek gerekirse \xFC\xE7 bin greftlik bir safir plan\u0131 yakla\u015F\u0131k alt\u0131 saat, be\u015F bin greftlik bir plan yakla\u015F\u0131k dokuz saat s\xFCrer. DHI taraf\u0131nda iki bin greftlik bir plan yakla\u015F\u0131k alt\u0131 saat, \xFC\xE7 bin be\u015F y\xFCz greftlik bir plan yakla\u015F\u0131k sekiz saat s\xFCrer.","Bu say\u0131lar iki y\xF6ntem aras\u0131nda bir yar\u0131\u015F oldu\u011Funu g\xF6stermez; kapsad\u0131klar\u0131 greft bantlar\u0131n\u0131n farkl\u0131 oldu\u011Funu g\xF6sterir. Sitedeki teknik kar\u015F\u0131la\u015Ft\u0131rmada DHI\u2019nin tipik band\u0131 iki bin ile \xFC\xE7 bin be\u015F y\xFCz, safir FUE\u2019nin band\u0131 \xFC\xE7 bin ile be\u015F bin greft olarak verilir. Yani y\xF6ntem se\xE7imi \xE7o\u011Fu zaman kapat\u0131lacak alan\u0131n b\xFCy\xFCkl\xFC\u011F\xFC taraf\u0131ndan belirlenir; hasta bir y\xF6ntemi se\xE7mez, plan\u0131n gere\u011Fi bir y\xF6ntemi \xF6ne \xE7\u0131kar\u0131r.","\u0130yile\u015Fme taraf\u0131nda iki y\xF6ntem birbirine yak\u0131nd\u0131r. Kabuklanma her ikisinde de d\xF6rd\xFCnc\xFC ile onuncu g\xFCn aras\u0131nda d\xF6k\xFCl\xFCr. DHI\u2019de daha k\xFC\xE7\xFCk yaralar a\xE7\u0131ld\u0131\u011F\u0131 i\xE7in kabuklar bir miktar daha ince olabilir. \u015Eok d\xF6k\xFClme her iki y\xF6ntemde de ikinci ile d\xF6rd\xFCnc\xFC hafta aras\u0131nda ya\u015Fan\u0131r ve her ikisinde de nihai de\u011Ferlendirme on ikinci ile on sekizinci ay aras\u0131nda yap\u0131l\u0131r. Y\xF6ntem, takvimi de\u011Fi\u015Ftirmez.","Karar \xFC\xE7 \u015Feye bak\u0131larak verilir: kapat\u0131lacak alan\u0131n b\xFCy\xFCkl\xFC\u011F\xFC, o alanda mevcut sa\xE7 olup olmad\u0131\u011F\u0131 ve don\xF6r kapasitesi. Bu \xFC\xE7\xFC de\u011Ferlendirildikten sonra hangi y\xF6ntemin uygun oldu\u011Fu genellikle kendili\u011Finden ortaya \xE7\u0131kar. Bazen ikisi birlikte kullan\u0131l\u0131r: \xF6n \xE7izgi kalemle, arka plan kanal y\xF6ntemiyle. Size bir y\xF6ntemin di\u011Ferinden \xFCst\xFCn oldu\u011Fu s\xF6ylenirse, hangi \xF6l\xE7\xFCye g\xF6re \xFCst\xFCn oldu\u011Funu sormak yerinde olur.","As\u0131l belirleyici olan \u015Fey, \xE7o\u011Fu tan\u0131t\u0131mda ge\xE7meyen bir ba\u015Fl\u0131kta toplan\u0131r: greftin ya\u015Fama oran\u0131. Bunu belirleyen unsurlar y\xF6ntemin ad\u0131 de\u011Fildir; k\xF6k\xFCn v\xFCcut d\u0131\u015F\u0131nda ge\xE7irdi\u011Fi s\xFCre, saklama sol\xFCsyonunun s\u0131cakl\u0131\u011F\u0131, greftin pensle ne kadar s\u0131k\u0131ld\u0131\u011F\u0131, ekim alan\u0131n\u0131n kanlanmas\u0131 ve ekibin deneyimidir. \u0130ki y\xF6ntem de do\u011Fru uyguland\u0131\u011F\u0131nda benzer sonu\xE7 verir; yanl\u0131\u015F uyguland\u0131\u011F\u0131nda ikisi de ayn\u0131 \xF6l\xE7\xFCde ba\u015Far\u0131s\u0131z olur. Fark, uygulayanda ortaya \xE7\u0131kar.","Piyasada birle\u015Fik adlar da dola\u015F\u0131yor: safir u\xE7la a\xE7\u0131lan kanala kalemle ekim yap\u0131ld\u0131\u011F\u0131nda ortaya \xE7\u0131kan tarifler ya da ba\u015F\u0131na s\u0131fat eklenmi\u015F y\xF6ntem adlar\u0131. Bunlar\u0131n bir k\u0131sm\u0131 ger\xE7ek bir uygulama fark\u0131n\u0131 anlat\u0131r, bir k\u0131sm\u0131 yaln\u0131zca isimlendirmedir. Ay\u0131rt etmenin pratik yolu \u015Fu: size anlat\u0131lan \u015Feyin hangi ad\u0131m\u0131 de\u011Fi\u015Ftirdi\u011Fini sorun. Cevap kanal\u0131n a\xE7\u0131l\u0131\u015F\u0131n\u0131, greftin bekleme s\xFCresini ya da yerle\u015Fim a\xE7\u0131s\u0131n\u0131 tarif etmiyorsa, ortada teknik bir fark yok demektir.","Bir de do\u011Fal g\xF6r\xFCn\xFCm\xFC belirleyen, y\xF6ntemden ba\u011F\u0131ms\u0131z \xFC\xE7 detay var. Birincisi \xF6n sa\xE7 \xE7izgisinin d\xFCz de\u011Fil hafif d\xFCzensiz \xE7izilmesi; do\u011Fada sa\xE7 \xE7izgisi cetvelle \xE7ekilmi\u015F gibi durmaz. \u0130kincisi ilk s\u0131ralara yaln\u0131z tek telli greftlerin konmas\u0131. \xDC\xE7\xFCnc\xFCs\xFC a\xE7\u0131n\u0131n sa\xE7\u0131n kendi \xE7\u0131k\u0131\u015F y\xF6n\xFCne uydurulmas\u0131. Bu \xFC\xE7\xFC do\u011Fru yap\u0131ld\u0131\u011F\u0131nda y\xF6ntemin ad\u0131 g\xF6r\xFCnmez olur; yanl\u0131\u015F yap\u0131ld\u0131\u011F\u0131nda hi\xE7bir y\xF6ntem onu kurtarmaz."]},{slug:"donor",kat:"Planlama",tarih:"2026-05-08",bas:"Don\xF6r alan neden s\u0131n\u0131rl\u0131d\u0131r?",ozet:"Ense ve \u015Fakak b\xF6lgesindeki k\xF6kler d\xF6k\xFClmeye diren\xE7lidir. Say\u0131lar\u0131 ise sabittir.",govde:["Sa\xE7 ekiminde kullan\u0131lan k\xF6kler ense ve iki \u015Fakak b\xF6lgesinden al\u0131n\u0131r. Bu b\xF6lgeye don\xF6r alan denir ve at nal\u0131 bi\xE7imindeki bir ku\u015Fa\u011Fa kar\u015F\u0131l\u0131k gelir. Se\xE7im keyf\xEE de\u011Fildir: bu b\xF6lgedeki k\xF6kler hormonal d\xF6k\xFClmeye diren\xE7lidir. Erkek tipi sa\xE7 d\xF6k\xFClmesinde sa\xE7 kayb\u0131na yol a\xE7an hormonal etkiye bu k\xF6kler duyars\u0131zd\u0131r ve bu \xF6zelliklerini ekildikleri yerde de korurlar. Sa\xE7 ekiminin i\u015Fe yaramas\u0131n\u0131n temel sebebi budur.","Bu dayan\u0131kl\u0131l\u0131k, k\xF6k\xFCn bulundu\u011Fu yerden de\u011Fil kendisinden gelir. Enseden al\u0131n\u0131p tepeye ekilen bir k\xF6k, tepenin hormonal ortam\u0131na girdi\u011Finde de d\xF6k\xFClmez; ta\u015F\u0131d\u0131\u011F\u0131 \xF6zelli\u011Fi beraberinde g\xF6t\xFCr\xFCr. Uzun s\xFCredir bilinen bu ilke, sa\xE7 ekiminin b\xFCt\xFCn mant\u0131\u011F\u0131n\u0131 kurar. Ayn\u0131 ilkenin tersi de do\u011Frudur: d\xF6k\xFClmeye yatk\u0131n bir b\xF6lgeden al\u0131nan k\xF6k, nereye ekilirse ekilsin d\xF6k\xFClmeye devam eder. Bu y\xFCzden don\xF6r alan\u0131n s\u0131n\u0131rlar\u0131 dikkatle belirlenir.","Kapasite sabittir. Bir ki\u015Finin don\xF6r alan\u0131nda belirli say\u0131da k\xF6k vard\u0131r ve bu say\u0131 art\u0131r\u0131lamaz. Al\u0131nabilecek toplam greft, o alandaki k\xF6k say\u0131s\u0131 ile alandan ne kadar seyreltmeye tahamm\xFCl edilebilece\u011Finin \xE7arp\u0131m\u0131d\u0131r. Planlamada \xF6m\xFCr boyu g\xFCvenle al\u0131nabilecek greft i\xE7in alt\u0131 bin taban olarak kabul edilir. Yay\u0131nlanan aral\u0131klar daha y\xFCksek \xFCst s\u0131n\u0131rlardan s\xF6z eder; taban al\u0131nmas\u0131n\u0131n sebebi, fazla s\xF6z vermenin bedelinin geri d\xF6n\xFClemez olmas\u0131d\u0131r.","A\u015F\u0131r\u0131 al\u0131m neye benzer? Don\xF6r b\xF6lge, kalan sa\xE7 uzunken normal g\xF6r\xFCn\xFCr ama sa\xE7 k\u0131sald\u0131\u011F\u0131nda alt\u0131ndaki deri a\xE7\u0131\u011Fa \xE7\u0131kar. Bu g\xF6r\xFCnt\xFCn\xFCn geri d\xF6n\xFC\u015F\xFC yoktur; al\u0131nan k\xF6k yerine konmaz. Daha da \xF6nemlisi, a\u015F\u0131r\u0131 al\u0131m gelecekteki bir operasyon ihtimalini ortadan kald\u0131r\u0131r. Bir ki\u015Fi otuz ya\u015F\u0131nda don\xF6r\xFCn\xFCn b\xFCy\xFCk b\xF6l\xFCm\xFCn\xFC harcarsa, k\u0131rk be\u015F ya\u015F\u0131nda ilerleyen d\xF6k\xFClme i\xE7in elinde kaynak kalmaz.","Kapasite muayenede \xF6l\xE7\xFCl\xFCr. Don\xF6r alanda santimetrekare ba\u015F\u0131na d\xFC\u015Fen k\xF6k say\u0131s\u0131 say\u0131l\u0131r; bu de\u011Fer ki\u015Fiden ki\u015Fiye belirgin bi\xE7imde de\u011Fi\u015Fir. Yo\u011Funlu\u011Fu y\xFCksek bir don\xF6re sahip ki\u015Fide ayn\u0131 alandan daha fazla greft al\u0131nabilir. Say\u0131m\u0131n yan\u0131nda telin kal\u0131nl\u0131\u011F\u0131na da bak\u0131l\u0131r: kal\u0131n telli bir ki\u015Fide daha az greft daha fazla kapama sa\u011Flar, yani ayn\u0131 sonu\xE7 daha az kaynakla elde edilir. Bu iki \xF6l\xE7\xFCm, plan\u0131n ger\xE7ek \xFCst s\u0131n\u0131r\u0131n\u0131 verir.","Bir de operasyon ba\u015F\u0131na s\u0131n\u0131r vard\u0131r. Tek seansta g\xFCvenle al\u0131nabilecek greft i\xE7in planlamada d\xF6rt bin be\u015F y\xFCz kabul edilir. Bu s\u0131n\u0131r don\xF6r alan\u0131n toparlanmas\u0131yla ilgilidir: k\u0131sa s\xFCrede \xE7ok say\u0131da k\xF6k \xE7\u0131karmak, b\xF6lgedeki kanlanmay\u0131 ve iyile\u015Fmeyi zorlar. Daha b\xFCy\xFCk planlar iki seansa b\xF6l\xFCn\xFCr ve seanslar aras\u0131na genellikle en az on iki ay konur. Bekleme s\xFCresi bir formalite de\u011Fil, don\xF6r alan\u0131n iyile\u015Fme takvimidir.","\u0130yi bir plan, bug\xFCnk\xFC a\xE7\u0131kl\u0131\u011F\u0131 kapat\u0131rken yar\u0131na pay b\u0131rak\u0131r. Sa\xE7 ekimi mevcut sa\xE7\u0131n d\xF6k\xFClmesini durdurmaz; ekilen k\xF6kler kal\u0131c\u0131d\u0131r ama aralar\u0131ndaki do\u011Fal sa\xE7 kendi seyrini izler. Bu y\xFCzden \xF6n \xE7izgi tasarlan\u0131rken ya\u015F hesaba kat\u0131l\u0131r ve tepe b\xF6lgesi \xE7o\u011Fu zaman bilin\xE7li olarak sonraya b\u0131rak\u0131l\u0131r. Yirmili ya\u015Flar\u0131ndaki bir ki\u015Fide b\xFCt\xFCn don\xF6r\xFC tek seferde harcamak, k\u0131sa vadede iyi g\xF6r\xFCn\xFCp uzun vadede se\xE7eneksiz b\u0131rakan bir karard\u0131r.","\xD6ncelik s\u0131ras\u0131 da bu k\u0131s\u0131ttan do\u011Far. \xD6n sa\xE7 \xE7izgisi genellikle ilk s\u0131radad\u0131r, \xE7\xFCnk\xFC y\xFCz \xE7er\xE7evesini o belirler ve aynada ilk bak\u0131lan yer oras\u0131d\u0131r. Tepe b\xF6lgesi geni\u015F bir aland\u0131r ve kapat\u0131lmas\u0131 \xE7ok greft ister; buna kar\u015F\u0131l\u0131k g\xFCnl\xFCk hayatta daha az fark edilir. S\u0131n\u0131rl\u0131 bir kayna\u011F\u0131 en g\xF6r\xFCn\xFCr b\xF6lgeye yat\u0131rmak, \xE7o\u011Fu ki\u015Fi i\xE7in do\u011Fru karard\u0131r. Bu bir kural de\u011Fil, birlikte verilen bir tercihtir.","Sakal ve g\xF6vde k\u0131llar\u0131 baz\u0131 durumlarda yard\u0131mc\u0131 kaynak olarak de\u011Ferlendirilir. Bu k\xF6klerin dokusu sa\xE7tan farkl\u0131d\u0131r; genellikle daha kal\u0131n ve daha k\u0131vr\u0131ml\u0131d\u0131r. Bu y\xFCzden \xF6n sa\xE7 \xE7izgisinde de\u011Fil, arka planda hacim gerektiren b\xF6lgelerde kullan\u0131l\u0131rlar. Yard\u0131mc\u0131 kaynak, t\xFCkenmi\u015F bir don\xF6r\xFCn yerini tutmaz; yaln\u0131zca baz\u0131 planlarda ek bir pay sa\u011Flar. Uygun olup olmad\u0131\u011F\u0131 muayenede, k\u0131l\u0131n dokusuna ve yo\u011Funlu\u011Funa bak\u0131larak de\u011Ferlendirilir.","Don\xF6r alan\u0131 korumak i\xE7in yap\u0131labilecekler basittir. D\xF6k\xFClmeye kar\u015F\u0131 hekimin \xF6nerdi\u011Fi t\u0131bbi tedavinin s\xFCrd\xFCr\xFClmesi, mevcut sa\xE7\u0131n korunmas\u0131na yard\u0131mc\u0131 olur ve don\xF6re duyulan ihtiyac\u0131 geciktirir. Y\u0131ll\u0131k kontroller, hem ekilen b\xF6lgenin hem don\xF6r alan\u0131n kay\u0131t alt\u0131na al\u0131nmas\u0131n\u0131 sa\u011Flar. Bir sonraki operasyon karar\u0131 bu kay\u0131tlara bak\u0131larak verilir. Elinizdeki kayna\u011F\u0131n s\u0131n\u0131rl\u0131 oldu\u011Funu bilmek, onu iyi kullanman\u0131n ilk ad\u0131m\u0131d\u0131r.","\u0130z konusunu da a\xE7al\u0131m. K\xF6kler tek tek, milimetre alt\u0131 u\xE7larla \xE7\u0131kar\u0131ld\u0131\u011F\u0131 i\xE7in don\xF6r alanda b\u0131\xE7ak izi kalmaz; geriye \xE7ok say\u0131da nokta bi\xE7iminde iz kal\u0131r. Bu noktalar sa\xE7 uzad\u0131k\xE7a g\xF6r\xFCnmez olur. \xC7ok k\u0131sa sa\xE7la, \xF6rne\u011Fin bir numara ile taranan bir kafada dikkatli bakan biri fark\u0131 g\xF6rebilir. Al\u0131m ne kadar dengeli da\u011F\u0131t\u0131l\u0131rsa noktalar o kadar az belli olur; bu, cerrahi plan\u0131n g\xF6r\xFCn\xFCr k\u0131sm\u0131d\u0131r.","Birden fazla operasyon ge\xE7irme ihtimalini ba\u015Ftan hesaba katmak, don\xF6r\xFC koruman\u0131n en etkili yoludur. \u0130kinci bir operasyon \xE7o\u011Fu zaman ilerleyen d\xF6k\xFClme i\xE7in, \xFC\xE7\xFCnc\xFCs\xFC ise nadiren gerekir. Her operasyondan sonra don\xF6r alan\u0131n yo\u011Funlu\u011Fu bir miktar d\xFC\u015Fer ve bir sonraki i\xE7in elde kalan pay azal\u0131r. Bu y\xFCzden ilk planda ne kadar greft kullan\u0131ld\u0131\u011F\u0131, on y\u0131l sonraki se\xE7enekleri do\u011Frudan belirler. Karar bug\xFCn\xFCn aynas\u0131na de\u011Fil, b\xFCt\xFCn bir takvime bak\u0131larak verilir."]}],en:[{slug:"kac-greft",kat:"Planning",tarih:"2026-07-28",bas:"How many grafts do I need?",ozet:"Three things set the graft count: your loss stage, the area to be covered and donor density.",govde:["The graft count is not a preference; it is the result of a measurement. Three things decide it: the stage your hair loss has reached, the size of the area to be covered in square centimetres, and the donor density at the nape. Any figure quoted before those three are measured is a guess. That is why an exact number given over the phone, from a single photograph, deserves caution: a photograph shows the open area, not the donor capacity behind it.","First, the term itself. A graft is a small package of roots lifted whole from the scalp; it holds two hairs on average. So three thousand grafts is roughly six thousand hairs. Clinics count in grafts because the unit that is planted is the root, not the hair. Hairs per graft vary from one to four between people, and that is one reason the same graft count looks fuller on one head than another.","The second measure is area. The open region is measured in square centimetres, and the graft map on this site does exactly that: it calculates the area of the zones you select. To be concrete: the front hairline band alone comes to thirty-four square centimetres. Add the mid-scalp and the temple corners and the area rises to ninety-five. Bring the crown in as well and it reaches one hundred and thirty-eight. Grafts needed rise in direct proportion.","The third measure is target density: how many grafts go into each square centimetre. The calculation on this site takes thirty grafts per square centimetre as its default. Natural density on a healthy scalp is higher than that; the aim in a transplant is not to copy natural density but to build a cover that blocks the light and hides the skin. Raising the density raises the graft requirement directly, and that means taking more from the donor area. Density is not a free choice.","The arithmetic after that is simple: the graft count is the area multiplied by the density. At thirty grafts per square centimetre, a thirty-four square centimetre hairline band gives a plan of nine hundred and forty to eleven hundred grafts. A mid-sized opening of ninety-five square centimetres gives two thousand six hundred and twenty to three thousand and eighty. One hundred and thirty-eight square centimetres gives three thousand eight hundred and twenty to four thousand four hundred and ninety. The range carries the roughly eight per cent margin in the measurement itself; a range is more honest than a single number.","A fourth constraint never appears in the arithmetic, yet it is the one that shapes the plan: the capacity of the donor area. The roots at the nape and at both temples resist hormonal shedding, and their number is fixed. For planning, six thousand grafts is taken as the floor for what can safely be taken from one person over a lifetime. That figure is not a budget to be spent on today\u2019s opening: a reserve has to be left for the shedding of ten years from now, because a transplant does not stop native hair from thinning.","There is a ceiling per operation as well; planning takes four thousand five hundred grafts as the limit for a single session. Plans above that are split into two sessions, with time in between for the donor area to recover. The graft map on this site says so on screen when a plan passes that ceiling, and it warns separately when a plan passes the lifetime figure. The warning is not an error message: at advanced stages a genuinely two-stage plan is a medical fact.","The whole area does not have to be covered in the first operation, and in most cases it should not be. The order of priority usually starts at the front hairline, because that is what frames the face and it is the first place you look in a mirror. The crown can go second, or be deliberately left waiting. This is not a restriction; it is a decision to invest a limited resource where it shows most, and it is a decision made with you.","The exact number comes out of the examination. There the donor density is counted per square centimetre, the calibre of the hair is measured, the contrast between hair and skin is assessed and the laxity of the scalp is checked. On someone with fine hair and pale skin the same graft count looks sparser; on someone with thick hair close in colour to their skin it looks fuller. That is why two people at the same Norwood stage do not have to receive the same plan.","What we ask for in a first assessment is not complicated: photographs taken in daylight with dry hair, one each from the front, the top, both profiles and the nape. The nape frame matters most, because it gives the first read on donor capacity. Once the frames arrive you receive a graft range, the technique considered suitable and an estimated operating time, in writing. That note is a preliminary assessment; it becomes final only after a face-to-face examination, and the number can change there.","A word about the fixed packages you see online: two thousand grafts, three thousand, four thousand. Those packages are a pricing convenience, not a measurement. If your area calls for two thousand four hundred grafts, the two-thousand package falls short and the three-thousand package means taking more roots than needed \u2014 out of a lifetime capacity. The number is measured first and the plan is built after; it does not work the other way round.","Finally, know that the number can change on the day of surgery. The graft range planned at examination is a target, not an upper limit: the roots taken from the donor area may carry fewer or more hairs than expected, and the scalp may behave differently during placement. In that case the decision is the surgeon\u2019s and the reason is explained to you the same day. Planting fewer grafts than planned may be a choice made to protect the donor, not a shortfall."]},{slug:"norwood",kat:"Basics",tarih:"2026-07-14",bas:"What is the Norwood scale?",ozet:"The scale that splits male pattern hair loss into seven stages. It is the shared language of planning.",govde:["The Norwood scale is a descriptive scale that divides male pattern hair loss into seven stages. Its use as a shared language between clinics is practical: name the stage and two doctors picture the same thing, and the patient can place his own situation somewhere. The scale is not a diagnosis and it does not decide treatment on its own; it only describes how far the loss has come. Planning is built on that description, not limited to it.","Stage one is the hairline considered normal after adolescence; there is no loss to speak of yet. At stage two the temple corners pull back slightly and the hairline loses its straight edge for a gentle curve. Most men see this stage before their thirties, and on its own it need not signal a progressive process. The most useful thing to do here is to track the speed of the loss with photographs over a few years.","At stage three the recession at the temple corners becomes clear and the hairline starts to take a letter shape. This stage has a variant: the crown opening independently of the front line. The variant matters, because the front and the crown look like two separate problems but are paid for out of one donor budget. Stage three is the point at which people most often come to a clinic about a transplant.","At stage four the crown opens visibly as well, and a band of hair remains between the front region and the crown. That band thins as the stages advance. At stage five it is noticeably sparse; at stage six it largely disappears and the two openings join. At stage seven only the resistant horseshoe running from the nape to above the ears is left. That horseshoe is the donor area of a hair transplant.","Each stage corresponds roughly to a graft range. With the target of thirty grafts per square centimetre used on this site, stage two gives a plan of nine hundred and fifty to eleven hundred grafts, stage three two thousand six hundred to three thousand one hundred, stage four three thousand eight hundred to four thousand five hundred, stage five five thousand six hundred and fifty to six thousand six hundred and fifty, and stage six six thousand eight hundred to eight thousand. These ranges are a starting point, not a conclusion.","From stage five onward a second question enters the picture: is the donor area enough? Planning takes six thousand grafts as the floor for what can safely be taken over a lifetime. At stages six and seven the calculated requirement can exceed that floor. This is not a data error, it is the reality; in such cases the aim stops being coverage of the whole area and becomes a satisfying cover over the region that shows most.","The stage alone is not a sufficient measure. If two people at the same stage have different donor densities, their plans differ too. Hair calibre, the contrast between hair and skin, the laxity of the scalp and whether the hair is wavy all change how full the same graft count looks. Wavy hair gives more volume for the same grafts; fine, straight hair gives less.","Age and family history enter the decision as well. Where loss is advancing quickly in someone in his early twenties, taking the next ten years into account matters as much as covering today\u2019s opening. Transplanted roots are resistant, but the native hair between them can carry on thinning. That is why the hairline is designed with age in mind: fixing a twenty-year-old\u2019s hairline permanently can leave a result that does not read as natural at forty.","How is the stage established? At the examination, or from the photographs you send. Five frames taken in daylight with dry hair are enough: front, top, both profiles and the nape. Light matters; frames shot under a ceiling lamp make the opening look larger than it is. Repeating the same frames six months apart is the simplest and cheapest way to measure how fast the loss is moving.","Finally: a stage is not a destiny. The scale describes the usual course of progression; it does not say everyone will follow it. In some people the loss stalls at stage three for years. That is why both medical follow-up and photographic tracking are part of the decision to operate. When you come to the clinic, the first thing we talk about is not which technique will be used but how fast the loss is moving.","There are also situations the scale does not cover. Norwood describes male pattern loss only, that is, loss that follows a particular pattern. Diffuse thinning, where hair thins evenly across the top and sides together, does not fit the scale. Thyroid problems, iron deficiency, certain medicines and stress-related shedding produce other pictures. That is why blood tests are a routine step before a transplant decision, not a needless formality.","Hair loss in women is assessed on a different scale; Norwood does not describe that picture. In female pattern loss the hairline is usually preserved and the thinning shows at the top, on either side of the parting. The planning logic is similar \u2014 area, density and donor capacity are still what decide \u2014 but the stage definitions and the expected course are different. Knowing that distinction also explains why a stage number read online is a misleading thing to pin on yourself.","When you come to the clinic you also see how the stage is actually used: the number is discussed as an opening measure, not as a label. The substance of the conversation is what you expect. Do you want a twenty-year-old\u2019s hairline or a mature one that suits your age; how much does the crown matter to you. Those preferences translate into a graft count, and that count translates into a share taken from the donor area."]},{slug:"trassiz",kat:"Technique",tarih:"2026-06-30",bas:"Who is no-shave suitable for?",ozet:"Done without cutting your hair, with a return to daily life the next day. Graft numbers are limited, though.",govde:["In a no-shave transplant the roots are harvested from the donor area without cutting the hair. In the classic method the nape is clipped short and the roots are taken with the field exposed; in the no-shave method the hair is left long, separated in small sections, and the roots are drawn out one by one from between the existing hairs. The graft is the same graft; what changes is how it is reached. On the planting side nothing changes either: channels are opened, or an implanter pen is used.","The main advantage is discretion. Because the nape is not clipped, the donor area stays hidden under long hair after the operation. Crusting in the recipient area is visible through the first week, but the traces of work at the nape are not noticeable from outside. That makes a practical difference for people who cannot work remotely or have little room to take leave: going back to social life the day after the operation is possible in most cases.","The limit is in the graft count. Working between long hairs means fewer roots harvested in the same time; for every graft the hair has to be parted, the root found, and the surrounding hairs kept undamaged. The number of grafts that can safely be taken in a single no-shave session is therefore lower than with the classic method. In the comparison on this site, the typical band for this method is given as one thousand five hundred to two thousand five hundred grafts.","The timing differs too. Because more time is spent per graft, the total operating time comes out longer than with the other methods at the same graft count. A no-shave plan of one thousand five hundred grafts takes about seven hours; one of two thousand five hundred takes about nine. That time includes preparation, local anaesthesia, the design drawing and the breaks in between \u2014 in other words, the gap between the hour you arrive at the clinic and the hour you leave.","Who does it suit? People with a clear hairline recession over a relatively small area are the most natural candidates. An opening at stage two or three fits comfortably inside this method\u2019s graft band. It is also a sensible choice for people who wear their hair long, whose work makes short hair unwelcome, or who cannot take leave and must return to work immediately.","Who does it not suit? If a wide area has to be covered, that is from stage four onward, the grafts needed in a single session exceed this method\u2019s band. In such cases either two sessions are planned or a partial shave is suggested. For someone whose hair is already very short there is no advantage left in working unshaven; the donor hair needs to be at least two or three centimetres long for the harvest points to stay hidden beneath it.","A partial shave is often a good middle path. In that approach only a strip of the donor area is clipped, and the long hair above it covers the strip completely when let down. This brings the graft yield close to the classic method while largely solving the visibility problem. How wide a strip is needed is decided at the examination, according to the planned graft count and the donor density.","Aftercare differs in a few respects. Washing with long hair asks for more care: the foam is applied without pressing it into the recipient area, rinsing is done with lukewarm, low-pressure water, and the hair is not rubbed with a towel. Crusts can take a little longer to come away from between long hairs. The first wash is done at the clinic and the routine is shown step by step; we rehearse the movements you will repeat at home together, there.","One thing worth accepting: no-shave is a preference, not a technical superiority. The root pla
