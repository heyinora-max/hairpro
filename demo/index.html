:c.greft,norwood:c.norwood,ay:c.ay,bolge:c.bolge,onam:c.onam}})});var h={tr:[{slug:"kac-greft",kat:"Planlama",dk:6,tarih:"2026-07-28",bas:"Ka\xE7 grefte ihtiyac\u0131m var?",ozet:"Greft say\u0131s\u0131n\u0131 belirleyen \xFC\xE7 \u015Fey: d\xF6k\xFClme evresi, ekilecek alan ve don\xF6r b\xF6lgenin yo\u011Funlu\u011Fu.",govde:["Greft say\u0131s\u0131 bir tercih de\u011Fil, \xF6l\xE7\xFCm sonucudur. \xDC\xE7 \u015Fey belirler: d\xF6k\xFClmenin hangi evrede oldu\u011Fu, kapat\u0131lacak alan\u0131n b\xFCy\xFCkl\xFC\u011F\xFC ve ense b\xF6lgesindeki don\xF6r yo\u011Funlu\u011Fu.","Don\xF6r alan s\u0131n\u0131rl\u0131d\u0131r. Bir ki\u015Fiden \xF6m\xFCr boyu al\u0131nabilecek greft say\u0131s\u0131 bellidir; bu y\xFCzden ilk operasyonda alan\u0131n tamam\u0131n\u0131 kapatmak yerine \xF6ncelik s\u0131ras\u0131 belirlenir. Genellikle \xF6n sa\xE7 \xE7izgisi \xF6nce planlan\u0131r, \xE7\xFCnk\xFC y\xFCz \xE7er\xE7evesini o belirler.","Bu sitedeki greft haritas\u0131 \xF6l\xE7\xFCm\xFC \u015F\xF6yle yapar: se\xE7ti\u011Finiz b\xF6lgelerin santimetrekare cinsinden alan\u0131, hedeflenen yo\u011Funlukla \xE7arp\u0131l\u0131r. Tek seansta g\xFCvenli \xFCst s\u0131n\u0131r 4.500 greft kabul edilir; daha fazlas\u0131 gerekiyorsa iki seans planlan\u0131r. Kesin say\u0131, muayenede don\xF6r yo\u011Funlu\u011Fu santimetrekare ba\u015F\u0131na \xF6l\xE7\xFClerek \xE7\u0131kar."]},{slug:"norwood",kat:"Temel bilgi",dk:4,tarih:"2026-07-14",bas:"Norwood skalas\u0131 nedir?",ozet:"Erkek tipi sa\xE7 d\xF6k\xFClmesini yedi evreye ay\u0131ran \xF6l\xE7ek. Planlaman\u0131n ortak dili budur.",govde:["Norwood skalas\u0131, erkek tipi sa\xE7 d\xF6k\xFClmesini yedi evrede tan\u0131mlar. Klinikler aras\u0131nda ortak dil olmas\u0131n\u0131n sebebi budur: evre s\xF6ylendi\u011Finde herkes ayn\u0131 tabloyu anlar.","Evre 2 ve 3 \xE7o\u011Funlukla \xF6n \xE7izgi gerilemesidir. Evre 4\u2019ten sonra tepe b\xF6lgesi de a\xE7\u0131lmaya ba\u015Flar ve iki b\xF6lge birle\u015Fme e\u011Filimine girer. Evre 6 ve 7\u2019de don\xF6r alan\u0131n yeterlili\u011Fi belirleyici hale gelir.","Evre tek ba\u015F\u0131na yeterli de\u011Fildir. Ayn\u0131 evredeki iki ki\u015Fide don\xF6r yo\u011Funlu\u011Fu farkl\u0131ysa planlama da farkl\u0131 olur."]},{slug:"trassiz",kat:"Teknik",dk:5,tarih:"2026-06-30",bas:"Tra\u015Fs\u0131z ekim kimler i\xE7in uygun?",ozet:"Sa\xE7 kesilmeden yap\u0131l\u0131r, ertesi g\xFCn sosyal hayata d\xF6n\xFCl\xFCr. Ama greft say\u0131s\u0131nda s\u0131n\u0131r vard\u0131r.",govde:["Tra\u015Fs\u0131z ekimde don\xF6r b\xF6lgeden al\u0131nan k\xF6kler sa\xE7 kesilmeden toplan\u0131r. En b\xFCy\xFCk avantaj\u0131 g\xF6r\xFCn\xFCrl\xFCk: operasyonun ertesi g\xFCn\xFC i\u015Fe d\xF6nmek m\xFCmk\xFCnd\xFCr.","S\u0131n\u0131r \u015Fudur: tra\u015Fs\u0131z y\xF6ntemde tek seansta al\u0131nabilecek greft say\u0131s\u0131 klasik y\xF6nteme g\xF6re daha d\xFC\u015F\xFCkt\xFCr. Geni\u015F alan kapat\u0131lmas\u0131 gerekiyorsa iki seans planlan\u0131r ya da k\u0131smi tra\u015F \xF6nerilir.","Uygunluk karar\u0131 don\xF6r yo\u011Funlu\u011Fu ve sa\xE7 uzunlu\u011Funa g\xF6re verilir. Muayenede birlikte belirlenir."]},{slug:"ilk-30-gun",kat:"Sonras\u0131",dk:7,tarih:"2026-06-12",bas:"Ekimden sonra ilk 30 g\xFCn",ozet:"Kabuklanma, \u015Fok d\xF6k\xFClme ve bekleme. \u0130lk ay sonucu de\u011Fil, iyile\u015Fmeyi anlat\u0131r.",govde:["\u0130lk \xFC\xE7 g\xFCn \xF6dem ve hassasiyet beklenir. \u0130lk y\u0131kama klinikte yap\u0131l\u0131r ve nas\u0131l devam edilece\u011Fi anlat\u0131l\u0131r.","Yedinci g\xFCnden itibaren kabuklar d\xF6k\xFClmeye ba\u015Flar. \u0130kinci ve d\xF6rd\xFCnc\xFC hafta aras\u0131nda ekilen sa\xE7lar\u0131n b\xFCy\xFCk b\xF6l\xFCm\xFC d\xF6k\xFCl\xFCr; buna \u015Fok d\xF6k\xFClme denir ve normaldir. K\xF6kler yerinde kal\u0131r.","\xDC\xE7\xFCnc\xFC aydan sonra yeni \xE7\u0131k\u0131\u015F ba\u015Flar. Alt\u0131nc\u0131 ayda g\xF6r\xFCn\xFCr yo\u011Funluk olu\u015Fur, nihai de\u011Ferlendirme on iki ile on sekizinci ay aras\u0131nda yap\u0131l\u0131r."]},{slug:"dhi-safir",kat:"Teknik",dk:5,tarih:"2026-05-26",bas:"DHI ile safir FUE aras\u0131ndaki fark",ozet:"\u0130kisi de FUE ailesindendir. Fark, k\xF6k\xFCn nas\u0131l yerle\u015Ftirildi\u011Finde.",govde:["Safir FUE\u2019de \xF6nce safir u\xE7larla kanallar a\xE7\u0131l\u0131r, sonra k\xF6kler yerle\u015Ftirilir. DHI\u2019de kanal a\xE7ma ve yerle\u015Ftirme tek ad\u0131mda, Choi kalemiyle yap\u0131l\u0131r.","DHI daha y\xFCksek s\u0131kl\u0131k ve daha k\u0131sa k\xF6ks\xFCz s\xFCre sa\u011Flar; s\u0131k sa\xE7 aras\u0131na ekim yaparken avantajl\u0131d\u0131r. Safir FUE geni\u015F alanlarda daha h\u0131zl\u0131 ilerler.","Hangi y\xF6ntemin uygun oldu\u011Fu alan\u0131n b\xFCy\xFCkl\xFC\u011F\xFCne, mevcut sa\xE7 yo\u011Funlu\u011Funa ve don\xF6r kapasitesine g\xF6re belirlenir."]},{slug:"donor",kat:"Planlama",dk:4,tarih:"2026-05-08",bas:"Don\xF6r alan neden s\u0131n\u0131rl\u0131d\u0131r?",ozet:"Ense ve \u015Fakak b\xF6lgesindeki k\xF6kler d\xF6k\xFClmeye diren\xE7lidir. Say\u0131lar\u0131 ise sabittir.",govde:["Sa\xE7 ekiminde kullan\u0131lan k\xF6kler ense ve \u015Fakak b\xF6lgesinden al\u0131n\u0131r. Bu b\xF6lgedeki k\xF6kler hormonal d\xF6k\xFClmeye diren\xE7lidir; ekildikleri yerde de bu \xF6zelli\u011Fi korurlar.","Bu b\xF6lgenin kapasitesi sabittir. Fazla al\u0131m don\xF6r alanda seyrelmeye yol a\xE7ar ve geri d\xF6n\xFC\u015F\xFC yoktur; bu y\xFCzden planlama tek operasyona de\u011Fil, \xF6m\xFCr boyu kapasiteye g\xF6re yap\u0131l\u0131r.","\u0130yi bir plan, bug\xFCnk\xFC a\xE7\u0131kl\u0131\u011F\u0131 kapat\u0131rken on y\u0131l sonraki d\xF6k\xFClme i\xE7in de pay b\u0131rak\u0131r."]}],en:[{slug:"kac-greft",kat:"Planning",dk:6,tarih:"2026-07-28",bas:"How many grafts do I need?",ozet:"Three things set the graft count: your loss stage, the area to be covered and donor density.",govde:["The graft count is not a preference; it is the result of a measurement. Three things decide it: the stage your hair loss has reached, the size of the area to be covered, and the donor density at the nape.","The donor area is limited. The number of grafts one person can give over a lifetime is finite, so the first operation sets an order of priority instead of covering everything at once. The front hairline is usually planned first, because it frames the face.","The graft map on this site measures it like this: the area of the zones you select, in square centimetres, is multiplied by the target density. The safe ceiling for a single session is taken as 4,500 grafts; if more is needed, two sessions are planned. The exact number comes out of the examination, where donor density is measured per square centimetre."]},{slug:"norwood",kat:"Basics",dk:4,tarih:"2026-07-14",bas:"What is the Norwood scale?",ozet:"The scale that splits male pattern hair loss into seven stages. It is the shared language of planning.",govde:["The Norwood scale describes male pattern hair loss in seven stages. That is why it works as a shared language between clinics: name the stage and everyone pictures the same thing.","Stages 2 and 3 are mostly a receding front line. From stage 4 the crown starts to open as well, and the two areas tend to merge. At stages 6 and 7 the question becomes whether the donor area is enough.","The stage alone is not enough. If two people at the same stage have different donor densities, their plans differ too."]},{slug:"trassiz",kat:"Technique",dk:5,tarih:"2026-06-30",bas:"Who is no-shave suitable for?",ozet:"Done without cutting your hair, with a return to daily life the next day. Graft numbers are limited, though.",govde:["In a no-shave transplant the roots are harvested from the donor area without cutting the hair. The main advantage is discretion: going back to work the day after the operation is possible.","Here is the limit: the number of grafts that can be taken in a single no-shave session is lower than with the classic method. If a wide area has to be covered, two sessions are planned or a partial shave is suggested.","Suitability is decided on donor density and hair length. We settle it together at the examination."]},{slug:"ilk-30-gun",kat:"Aftercare",dk:7,tarih:"2026-06-12",bas:"The first 30 days after surgery",ozet:"Crusting, shock loss and waiting. The first month shows you healing, not the result.",govde:["Swelling and tenderness are expected in the first three days. The first wash is done at the clinic, and you are shown how to carry on at home.","From day seven the crusts start to come away. Between weeks two and four most of the transplanted hairs shed; this is called shock loss and it is normal. The roots stay in place.","New growth begins after the third month. Visible density forms by month six, and the final assessment is made between months twelve and eighteen."]},{slug:"dhi-safir",kat:"Technique",dk:5,tarih:"2026-05-26",bas:"DHI versus sapphire FUE",ozet:"Both belong to the FUE family. The difference is in how the root is placed.",govde:["In sapphire FUE the channels are opened first with sapphire blades, then the roots are placed. In DHI, opening and placing happen in one step, with the Choi pen.","DHI allows a higher density and keeps the root outside the body for less time; it helps when planting between existing hair. Sapphire FUE moves faster across wide areas.","Which method fits is decided by the size of the area, the density of the existing hair and the donor capacity."]},{slug:"donor",kat:"Planning",dk:4,tarih:"2026-05-08",bas:"Why is the donor area limited?",ozet:"Roots at the nape and temples resist shedding. Their number, however, is fixed.",govde:["The roots used in a hair transplant are taken from the nape and the temples. Roots from that area resist hormonal shedding, and they keep that trait wherever they are planted.","The capacity of that area is fixed. Over-harvesting thins the donor area and cannot be undone, so planning follows lifetime capacity rather than a single operation.","A good plan covers today\u2019s opening while leaving a reserve for the shedding of ten years from now."]}],ar:[{slug:"kac-greft",kat:"\u0627\u0644\u062A\u062E\u0637\u064A\u0637",dk:6,tarih:"2026-07-28",bas:"\u0643\u0645 \u0628\u0635\u064A\u0644\u0629 \u0623\u062D\u062A\u0627\u062C\u061F",ozet:"\u062B\u0644\u0627\u062B\u0629 \u0639\u0648\u0627\u0645\u0644 \u062A\u062D\u062F\u0651\u062F \u0639\u062F\u062F \u0627\u0644\u0628\u0635\u064A\u0644\u0627\u062A: \u0645\u0631\u062D\u0644\u0629 \u0627\u0644\u062A\u0633\u0627\u0642\u0637\u060C \u0648\u0627\u0644\u0645\u0633\u0627\u062D\u0629 \u0627\u0644\u0645\u0631\u0627\u062F \u062A\u063A\u0637\u064A\u062A\u0647\u0627\u060C \u0648\u0643\u062B\u0627\u0641\u0629 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0627\u0646\u062D\u0629.",govde:["\u0639\u062F\u062F \u0627\u0644\u0628\u0635\u064A\u0644\u0627\u062A \u0644\u064A\u0633 \u062E\u064A\u0627\u0631\u064B\u0627 \u0634\u062E\u0635\u064A\u064B\u0627 \u0628\u0644 \u0646\u062A\u064A\u062C\u0629 \u0642\u064A\u0627\u0633. \u062A\u062D\u062F\u0651\u062F\u0647 \u062B\u0644\u0627\u062B\u0629 \u0639\u0648\u0627\u0645\u0644: \u0627\u0644\u0645\u0631\u062D\u0644\u0629 \u0627\u0644\u062A\u064A \u0628\u0644\u063A\u0647\u0627 \u0627\u0644\u062A\u0633\u0627\u0642\u0637\u060C \u0648\u0645\u0633\u0627\u062D\u0629 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0631\u0627\u062F \u062A\u063A\u0637\u064A\u062A\u0647\u0627\u060C \u0648\u0643\u062B\u0627\u0641\u0629 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0627\u0646\u062D\u0629 \u0641\u064A \u0645\u0624\u062E\u0631\u0629 \u0627\u0644\u0631\u0623\u0633.","\u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0645\u0627\u0646\u062D\u0629 \u0645\u062D\u062F\u0648\u062F\u0629. \u0641\u0639\u062F\u062F \u0627\u0644\u0628\u0635\u064A\u0644\u0627\u062A \u0627\u0644\u062A\u064A \u064A\u0645\u0643\u0646 \u0623\u062E\u0630\u0647\u0627 \u0645\u0646 \u0627\u0644\u0634\u062E\u0635 \u0637\u0648\u0627\u0644 \u062D\u064A\u0627\u062A\u0647 \u062B\u0627\u0628\u 013100 folik\xFCl/cm\xB2 \xB7 ekimde tipik hedef 35\u201350 greft/cm\xB2"},norwood:{ad:"Norwood evresi",kisa:"Erkek tipi sa\xE7 d\xF6k\xFClmesinin yayg\u0131nl\u0131\u011F\u0131n\u0131 birden yediye anlatan \xF6l\xE7ek.",uzun:"Hekimle hastan\u0131n ayn\u0131 \u015Feyi konu\u015Fabilmesi i\xE7in kullan\u0131l\u0131r. Evre y\xFCkseldik\xE7e a\xE7\u0131lan alan ve gereken greft say\u0131s\u0131 artar. Kad\u0131n tipi d\xF6k\xFClme bu \xF6l\xE7ekle de\u011Fil, ayr\u0131 bir \xF6l\xE7ekle anlat\u0131l\u0131r.",olcu:"1 = \u015Fakaklarda hafif a\xE7\u0131lma \xB7 7 = yaln\u0131z ense ve yanlar sa\xE7l\u0131"},fue:{ad:"FUE",kisa:"K\xF6kleri tek tek al\u0131p a\xE7\u0131lan kanallara yerle\u015Ftiren, diki\u015Fsiz y\xF6ntem.",uzun:"Don\xF6rden \u015Ferit halinde deri kesilmez; k\xF6kler mikro u\xE7larla teker teker \xE7\u0131kar\u0131l\u0131r. Bu y\xFCzden ensede \xE7izgi bi\xE7iminde diki\u015F izi kalmaz ve iyile\u015Fme daha k\u0131sa s\xFCrer.",olcu:"A\xE7\u0131l\u0131m\u0131: Follicular Unit Extraction \u2014 k\xF6k \xFCnitesi \xE7\u0131karma"},safir:{ad:"Safir FUE",kisa:"Kanallar\u0131n \xE7elik yerine safir u\xE7lu b\u0131\xE7akla a\xE7\u0131ld\u0131\u011F\u0131 FUE.",uzun:"Safir u\xE7 daha ince ve d\xFCzg\xFCn bir kanal a\xE7ar; ama\xE7 dokuda daha az tahri\u015F ve daha s\u0131k yerle\u015Fimdir. Y\xF6ntemin geri kalan\u0131 FUE ile birebir ayn\u0131d\u0131r, de\u011Fi\u015Fen yaln\u0131z kanal ucudur."},dhi:{ad:"DHI",kisa:"Kanal a\xE7madan, kalem u\xE7lu aletle k\xF6k\xFC do\u011Frudan yerle\u015Ftiren y\xF6ntem.",uzun:"Choi kalemi kanal\u0131 a\xE7ar ve k\xF6k\xFC ayn\u0131 hareketle b\u0131rak\u0131r. K\xF6k d\u0131\u015Far\u0131da daha k\u0131sa bekler, ayr\u0131ca mevcut sa\xE7lar\u0131n aras\u0131na seyrelmi\u015F b\xF6lgeye ekim yapmak kolayla\u015F\u0131r.",olcu:"A\xE7\u0131l\u0131m\u0131: Direct Hair Implantation \u2014 do\u011Frudan sa\xE7 yerle\u015Ftirme"},trassiz:{ad:"Tra\u015Fs\u0131z ekim",kisa:"Sa\xE7\u0131n\u0131z kesilmeden yap\u0131lan ekim; ertesi g\xFCn g\xFCnl\xFCk hayata d\xF6n\xFCl\xFCr.",uzun:"Yaln\u0131z k\xF6klerin al\u0131naca\u011F\u0131 k\xFC\xE7\xFCk alan, \xFCstteki uzun sa\xE7\u0131n alt\u0131nda kalacak \u015Fekilde k\u0131salt\u0131l\u0131r; d\u0131\u015Far\u0131dan g\xF6r\xFCnmez. Buna kar\u015F\u0131l\u0131k tek seansta al\u0131nabilen greft say\u0131s\u0131 s\u0131n\u0131rl\u0131 kal\u0131r."},sok:{ad:"\u015Eok d\xF6k\xFClme",kisa:"Ekimden sonraki haftalarda ekilen tellerin d\xF6k\xFClmesi; k\xF6k yerinde kal\u0131r.",uzun:"Beklenen bir a\u015Famad\u0131r, ba\u015Far\u0131s\u0131zl\u0131k de\u011Fildir. Tel d\xFC\u015Fer ama k\xF6k deride kal\u0131r ve yeni sa\xE7 \xE7\u0131kar\u0131r. Panik yaratan k\u0131s\u0131m budur; oysa takvimin normal par\xE7as\u0131d\u0131r.",olcu:"Genelde 2.\u20138. haftalar \xB7 yeni \xE7\u0131k\u0131\u015F 3.\u20134. aydan itibaren"},prp:{ad:"PRP",kisa:"Kendi kan\u0131n\u0131zdan ayr\u0131\u015Ft\u0131r\u0131lan yo\u011Fun plazman\u0131n sa\xE7l\u0131 deriye verilmesi.",uzun:"Kan al\u0131n\u0131r, santrif\xFCjde trombositten zengin k\u0131sm\u0131 ayr\u0131l\u0131r ve sa\xE7l\u0131 deriye enjekte edilir. Var olan sa\xE7\u0131 desteklemek i\xE7in kullan\u0131lan bir bak\u0131md\u0131r; sa\xE7 ekiminin yerine ge\xE7mez.",olcu:"A\xE7\u0131l\u0131m\u0131: Platelet-Rich Plasma \u2014 trombositten zengin plazma"},mezo:{ad:"Mezoterapi",kisa:"Sa\xE7l\u0131 deriye k\xFC\xE7\xFCk i\u011Fnelerle vitamin ve mineral kar\u0131\u015F\u0131m\u0131 verilmesi.",uzun:"Kar\u0131\u015F\u0131m do\u011Frudan k\xF6klerin bulundu\u011Fu derinli\u011Fe b\u0131rak\u0131l\u0131r. Destekleyici bir bak\u0131md\u0131r: tamamen a\xE7\u0131lm\u0131\u015F bir alan\u0131 yeniden sa\xE7land\u0131rmaz, ekimin alternatifi de\u011Fildir."}},en:{greft:{ad:"Graft",kisa:"A tiny package of roots taken from the skin; it holds about two hairs.",uzun:"Planning is done in grafts, not in hairs. One graft can carry one to four hairs, two on average. So 3,000 grafts means roughly 6,000 hairs.",olcu:"1 graft \u2248 2 hairs (varies between 1 and 4)"},folikul:{ad:"Follicle",kisa:"The root of a hair under the skin, together with the sheath around it.",uzun:"The hair you see is the part that grows out of the follicle. Surgery moves the follicle itself, not the hair, which is why transplanted hair keeps the habits of its original root."},donor:{ad:"Donor area",kisa:"The band at the back and sides where hair resists thinning.",uzun:"Roots there are insensitive to the hormone that causes loss, so they keep growing wherever they are moved. It is a one-off supply for life, and it sets the ceiling on total grafts.",olcu:"Its limit is counted during examination, never estimated"},yogunluk:{ad:"Grafts/cm\xB2 (density)",kisa:"How many grafts go into one square centimetre; it sets the thickness.",uzun:"Packing more is not automatically better: above a point the roots cannot be fed. For a natural look the hairline, mid-scalp and crown are planned at different densities.",olcu:"Your own scalp holds ~80\u2013100 follicles/cm\xB2 \xB7 a typical transplant target is 35\u201350 grafts/cm\xB2"},norwood:{ad:"Norwood stage",kisa:"A one-to-seven scale describing how far male pattern loss has gone.",uzun:"It exists so surgeon and patient describe the same thing. The higher the stage, the larger the bare area and the more grafts it takes. Female pattern loss uses a separate scale.",olcu:"1 = slight temple recession \xB7 7 = only the back and sides still have hair"},fue:{ad:"FUE",kisa:"Roots are taken out one by one and set into opened channels; no stitches.",uzun:"No strip of skin is cut from the donor; roots are removed individually with micro punches. That is why no line-shaped scar is left at the back and healing takes less time.",olcu:"Stands for Follicular Unit Extraction"},safir:{ad:"Sapphire FUE",kisa:"FUE in which the channels are opened with a sapphire blade, not steel.",uzun:"A sapphire tip opens a thinner, smoother channel; the aim is less irritation in the tissue and closer placement. Everything else is ordinary FUE \u2014 only the blade changes."},dhi:{ad:"DHI",kisa:"A pen-tipped tool places the root directly, without opening a channel first.",uzun:"The Choi pen opens the channel and releases the root in one movement. The root spends less time outside the body, and it becomes easier to plant between existing hairs.",olcu:"Stands for Direct Hair Implantation"},trassiz:{ad:"No-shave transplant",kisa:"Surgery without cutting your hair; you can go out the next day.",uzun:"Only the small patch the roots come from is trimmed, hidden under the longer hair above it, so nothing shows. In exchange, the number of grafts one session can take stays limited."},sok:{ad:"Shock loss",kisa:"The transplanted hairs fall out in the weeks after surgery; the roots stay.",uzun:"It is an expected stage, not a failure. The hair drops but the root remains in the skin and grows a new one. This is the part that frightens people, though it belongs to the normal timeline.",olcu:"Usually weeks 2\u20138 \xB7 regrowth from month 3\u20134 onwards"},prp:{ad:"PRP",kisa:"Concentrated plasma separated from your own blood, injected into the scalp.",uzun:"Blood is drawn, the platelet-rich fraction is separated in a centrifuge and injected into the scalp. It is a treatment that supports existing hair; it does not replace a transplant.",olcu:"Stands for Platelet-Rich Plasma"},mezo:{ad:"Mesotherapy",kisa:"A vitamin and mineral mix delivered into the scalp with fine needles.",uzun:"The mix is left at the depth where the roots sit. It is supportive care: it will not bring hair back to a fully bare area and it is not an alternative to surgery."}},ar:{greft:{ad:"\u0627\u0644\u0637\u064F\u0639\u0645",kisa:"\u062D\u0632\u0645\u0629 \u062C\u0630\u0648\u0631 \u0635\u063A\u064A\u0631\u0629 \u062A\u0624\u062E\u0630 \u0645\u0646 \u0627\u0644\u062C\u0644\u062F \u0648\u062A\u062D\u0645\u0644 \u0634\u0639\u0631\u062A\u064A\u0646 \u0641\u064A \u0627\u0644\u0645\u062A\u0648\u0633\u0637.",uzun:"\u064A\u0  diye tutulur.","hk.c.t2.a":"\xD6l\xE7\xFCmleme","hk.c.t2.m":"Ziyaret\xE7i say\u0131s\u0131n\u0131 ve sayfada ge\xE7en s\xFCreyi \xF6l\xE7en \xE7erezler.","hk.c.t3.a":"Reklam","hk.c.t3.m":"Reklam a\u011Flar\u0131na veri ta\u015F\u0131yan takip pikselleri.","hk.c.s3.b":"Nas\u0131l kapat\u0131rs\u0131n\u0131z","hk.c.s3.a":"Kapatmak i\xE7in bizden izin istemenize gerek yok.","hk.c.k1":"Taray\u0131c\u0131 ayarlar\u0131ndan site verilerini silebilirsiniz.","hk.c.k2":"Gizli sekmede a\xE7arsan\u0131z hi\xE7bir kay\u0131t kalmaz.","hk.c.k3":"Sildi\u011Finizde site yeniden T\xFCrk\xE7e a\xE7\u0131l\u0131r, ba\u015Fka bir \u015Fey de\u011Fi\u015Fmez.","hk.c.not":"Klinik yay\u0131na ge\xE7ti\u011Finde \xF6l\xE7\xFCmleme eklenirse bu sayfa g\xFCncellenir ve onay\u0131n\u0131z ayr\u0131ca sorulur.","hk.m.h1":"Mevzuat uyumu","hk.m.alt":"Bu site iki ayr\u0131 yay\u0131n rejimine g\xF6re kurguland\u0131: T\xFCrk\xE7e yay\u0131n ile yabanc\u0131 dilli yay\u0131n ayn\u0131 kurallara tabi de\u011Fil.","hk.m.s1.b":"\u0130ki rejim, tek site","hk.m.s1.a":"Dili de\u011Fi\u015Ftirdi\u011Finizde sayfan\u0131n uydu\u011Fu kural da de\u011Fi\u015Fir.","hk.m.r1.a":"T\xFCrk\xE7e yay\u0131n","hk.m.r1.d":"12/11/2025 Tan\u0131t\u0131m Y\xF6netmeli\u011Fi","hk.m.r1.m":"Sa\u011Fl\u0131k kurulu\u015Flar\u0131 T\xFCrk\xE7e tan\u0131t\u0131mda \xFCcret, kampanya ve hasta yorumu yay\u0131mlayamaz. Site T\xFCrk\xE7edeyken bu b\xF6l\xFCmler kapan\u0131r.","hk.m.r2.a":"Yabanc\u0131 dilli yay\u0131n","hk.m.r2.d":"26/4/2025 Sa\u011Fl\u0131k Turizmi Y\xF6netmeli\u011Fi, madde 13/2","hk.m.r2.m":"Yetki belgeli kurulu\u015Fun sitesi en az bir yabanc\u0131 dilde olmak zorundad\u0131r. \u0130ngilizce ve Arap\xE7a yay\u0131n bu y\xFCzden vard\u0131r.","hk.m.s2.b":"Sitede nas\u0131l uygulan\u0131yor","hk.m.s2.a":"Kural metinde kalmad\u0131; sekiz maddesi de aray\xFCze g\xF6m\xFCld\xFC.","hk.m.u1":"Dil T\xFCrk\xE7eyken fiyat sayfas\u0131 \xFCcret vermez; yerini fiyat\u0131 belirleyen \xF6l\xE7\xFCler al\u0131r.","hk.m.u2":"Hasta yorumlar\u0131 T\xFCrk\xE7e yay\u0131nda gizlenir, \u0130ngilizce ve Arap\xE7ada g\xF6r\xFCn\xFCr.","hk.m.u3":"\xD6ncesi-sonras\u0131 kareleri yaln\u0131z yaz\u0131l\u0131 Ek-1 onam\u0131 ve \xE7ekim tarihiyle yay\u0131mlan\u0131r.","hk.m.u4":"\u201CSonu\xE7lar ki\u015Fiden ki\u015Fiye de\u011Fi\u015Fir\u201D uyar\u0131s\u0131 her sonu\xE7 g\xF6rselinin alt\u0131nda sabittir.","hk.m.u5":"Payla\u015F\u0131lan g\xF6rsellerde yorum ve be\u011Feni kapat\u0131l\u0131r: madde 7/g.","hk.m.u6":"Aciliyet, k\u0131tl\u0131k ve indirim dili hi\xE7bir dilde kullan\u0131lmaz.","hk.m.u7":"Klinik seyahat paketi satmaz; u\xE7u\u015F, otel ve transfer i\xE7eri\u011Fi yoktur.","hk.m.u8":"Hasta say\u0131s\u0131, ba\u015Far\u0131 oran\u0131 ve \xF6d\xFCl iddias\u0131 hi\xE7bir sayfada ge\xE7mez.","hk.m.s3.b":"Kendiniz deneyin","hk.m.s3.a":"Dili de\u011Fi\u015Ftirin, sonra fiyat sayfas\u0131n\u0131 a\xE7\u0131n: ayn\u0131 sayfan\u0131n iki halini g\xF6r\xFCrs\xFCn\xFCz.","hk.m.simdi":"\u015Eu anki rejim","hk.m.dTr":"T\xFCrk\xE7eye ge\xE7","hk.m.dEn":"\u0130ngilizceye ge\xE7","hk.m.dFiyat":"Fiyat sayfas\u0131n\u0131 a\xE7","hk.m.not":"Bu sayfa bilgilendirmedir; nihai uyum denetimi klini\u011Fin hukuk dan\u0131\u015Fman\u0131ndad\u0131r."}),a.I18N.en=Object.assign(a.I18N.en||{},{"hk.ust":"Legal notice","hk.ilgili":"Other legal pages","hk.k.h1":"Protection of personal data","hk.k.alt":"Under Law no. 6698: which data we process, why, how long we keep it, and your rights.","hk.k.s1.b":"Data controller","hk.k.s1.a":"The party processing your data is the clinic itself.","hk.k.s1.m":"Trade name, tax number and registered address are entered from the admin panel. In this demo those fields stay empty.","hk.k.s2.b":"What we process","hk.k.s2.a":"We ask for the minimum a first consultation needs, nothing more.","hk.k.v1":"Name, surname and contact details: phone, e-mail.","hk.k.v2":"The hair and donor area photographs you send.","hk.k.v3":"Age, shedding history and any regular medication.","hk.k.v4":"Consultation record: date, adviser and the plan discussed.","hk.k.s3.b":"Health data is special category","hk.k.s3.m1":"Your photograph and shedding history are special category health data under article 6; they are processed only with your explicit consent.","hk.k.s3.m2":"You may withdraw consent at any time. When you do, your record is deleted the same day.","hk.k.s4.b":"Purpose and retention","hk.k.s4.a":"Your data stays inside the consultation and never joins a marketing list.","hk.k.a1":"Purpose: first assessment, graft range estimate and appointment planning.","hk.k.a2":"Photographs sit in an area only the medical team opens.","hk.k.a3":"Enquiries that do not become patients are deleted after six months.","hk.k.a4":"If you are treated, the record is kept as health legislation requires.","hk.k.a5":"Your photograph is never published anywhere without written consent.","hk.k.s5.b":"Your rights: article 11","hk.k.s5.a":"The law gives you six things you can demand.","hk.k.r1":"Learn whether your data is processed.","hk.k.r2":"Request information about it if it is.","hk.k.r3":"Learn whether it serves its stated purpose.","hk.k.r4":"Ask for correction if it is incomplete or wrong.","hk.k.r5":"Ask for it to be erased or destroyed.","hk.k.r6":"Claim compensation if you have suffered loss.","hk.k.s6.b":"How to apply","hk.k.s6.m":"Send your request in writing to the clinic registered address, or to its registered e-mail address. The clinic replies within thirty days.","hk.k.s6.n":"Application channels are defined in the admin panel; this demo carries no sample value.","hk.c.h1":"Cookie policy","hk.c.alt":"This demo leaves one record in your browser, only what it needs to work. No tracking or advertising cookies.","hk.c.s1.b":"What a cookie is","hk.c.s1.a":"One sentence, without the legal vocabulary.","hk.c.s1.m":"A cookie is a small record a site leaves in your browser. Its job is remembering your preference next visit.","hk.c.s2.b":"What this site uses","hk.c.s2.a":"Of the three cookie families, only the first one is used.","hk.c.tur":"Type","hk.c.ne":"What it does","hk.c.durum":"Status","hk.c.var":"In use","hk.c.yok":"Not used","hk.c.t1.a":"Strictly necessary","hk.c.t1.m":"Your language choice: tr, en or ar. Kept so the site opens in the language you last picked.","hk.c.t2.a":"Measurement","hk.c.t2.m":"Cookies that count visitors and time spent on a page.","hk.c.t3.a":"Advertising","hk.c.t3.m":"Tracking pixels that pass data to advertising networks.","hk.c.s3.b":"How to switch it off","hk.c.s3.a":"Switching it off needs no permission from us.","hk.c.k1":"Clear site data from your browser settings.","hk.c.k2":"Open the page privately and nothing is stored.","hk.c.k3":"After clearing, the site opens in Turkish again, nothing else changes.","hk.c.not":"If measurement is added when the clinic goes live, this page is updated and your consent asked separately.","hk.m.h1":"Regulatory compliance","hk.m.alt":"This site is built for two publishing regimes: the Turkish edition and the foreign-language edition follow different rules.","hk.m.s1.b":"Two regimes, one site","hk.m.s1.a":"Change the language and the rulebook the page follows changes too.","hk.m.r1.a":"Turkish edition","hk.m.r1.d":"Advertising Regulation, 12/11/2025","hk.m.r1.m":"Health institutions may not publish fees, campaigns or patient reviews in Turkish promotion. Those sections close while the site is Turkish.","hk.m.r2.a":"Foreign-language edition","hk.m.r2.d":"International Health Tourism Regulation, 26/4/2025, article 13/2","hk.m.r2.m":"An authorised institution website must exist in at least one foreign language. That is why English and Arabic editions exist.","hk.m.s2.b":"How the site applies it","hk.m.s2.a":"The rule did not stay on paper; eight clauses are built into the interface.","hk.m.u1":"In Turkish the price page gives no figure; it shows what sets the price instead.","hk.m.u2":"Patient reviews are hidden in the Turkish edition and visible in Eng
